# gitleaks configuration — EDU CMS / VenueOS
#
# 2026-07-13 (world-class audit W0-01.12): the default gitleaks ruleset did
# NOT catch the production feed-signing secret that shipped in a public repo
# (a bare 64-hex literal assigned as a secret fallback in
# apps/api/scripts/cts-live-integration-test.ts — removed in 58363762). Default
# rules treat a lone 64-hex string as an innocent hash. This config extends the
# defaults with a rule that catches exactly that shape: a hard-coded 256-bit
# hex secret sitting in source/scripts.
#
# Verified regression-free before commit:
#   gitleaks detect --no-git --config .gitleaks.toml   → 0 findings on the tree
#   gitleaks detect against the canary fixture          → rule fires
# (see apps/api/scripts/__fixtures__/gitleaks-canary.txt)

[extend]
useDefault = true

[[rules]]
id = "venueos-hardcoded-256bit-hex-secret"
description = "Hard-coded 256-bit (64-hex) secret literal — device/feed/JWT signing material must come from env, never a source literal"
# A quoted 64-hex literal (exactly 256 bits — the width of every signing key in
# this app: DEVICE_SECRET_KEY, SPORTS_FEED_SECRET, JWT_SECRET, SESSION_SECRET).
# Word boundaries stop it matching the tail of a 128-hex string.
regex = '''['"`]\b[0-9a-f]{64}\b['"`]'''
keywords = []
entropy = 3.5

[rules.allowlist]
regexTarget = "match"
# Obvious non-secret 256-bit hex constants that legitimately appear as test
# vectors — never real keys:
regexes = [
  # Sequential placeholder "0123456789abcdef" × 4 (MFA/Clever cipher specs).
  '''(?:0123456789abcdef){4}''',
  # SHA-256 of the empty string — a well-known constant used in sync tests.
  '''e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855''',
]
# 2026-08-03 — APK provenance digests are 64-hex and therefore INDISTINGUISHABLE
# from a 256-bit signing key by regex or entropy (this rule fired on the real
# v1.1.0 pin at release-policy.ts:220 and turned CI red).
#
# `release-policy.ts` is the OTA release gate: its only 64-hex literals are
# SHA-256 digests of published APKs, deliberately committed so a build's
# provenance is recorded INDEPENDENTLY of the artifact and reviewed like code
# (finding OTA-03). Publishing them is the point — they are public facts about
# public artifacts, not credentials.
#
# Scope is one file, not a pattern: this exempts nothing else, and any signing
# material that ever appeared in this security-critical file would still be
# caught by review. Do NOT widen this to a directory or a `*-policy.ts` glob.
#
# 2026-08-25 — SAME CLASS, second file. `designer-safe-srcdoc.ts` pins the
# SHA-256 of every trusted runtime body it will inject into an AI-designed
# board (INJ-004: trust is structural, not substring — a block is trusted only
# if its body hashes to a pinned digest, so a hostile block that merely carries
# the marker comment is rejected). Multiple digests per marker are pinned
# deliberately, because boards persisted under an older body must keep
# rendering. These are digests OF CODE WE SHIP TO BROWSERS — public facts about
# public artifacts, and the pin is worthless if it isn't committed.
#
# This fired on the runtime tap-dispatch re-pin and turned CI red. Scope stays
# one file for the same reason as above: any real signing material appearing in
# it would still be caught by review. Do NOT widen this to a directory or glob.
paths = [
  '''apps/api/src/player-ota/release-policy\.ts$''',
  '''apps/web/src/lib/designer-safe-srcdoc\.ts$''',
]

[allowlist]
description = "Global path allowlist — test/spec/fixture files carry deliberate fake keys"
paths = [
  '''.*\.spec\.(ts|tsx|js)$''',
  '''.*\.test\.(ts|tsx|js)$''',
  '''.*/__tests__/.*''',
  '''.*/__fixtures__/.*''',
  '''.*\.env\.example$''',
]
