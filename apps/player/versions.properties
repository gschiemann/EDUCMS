# ONE RELEASE UNIT (2026-11-08) — the only place an APK version is typed.
#
# Both Gradle modules read this file (apps/player/app and apps/player/manager
# build.gradle.kts); scripts/check-apk-versions.cjs, scripts/release-apk.sh,
# scripts/check-hardware-qual.cjs and the Android Player APK workflow read it too.
# versionCode is always derived: major*10000 + minor*100 + patch (1.1.29 -> 10129).
#
#   unit.version     The release unit: the Player APK, the `player-v<unit>` tag,
#                    the `## Release: player <unit>` hardware-qualification section.
#                    The Manager APK ships INSIDE this APK (assets/bundled) and is
#                    installed by the Player only when its versionCode is newer than
#                    the one on the device (ManagerBootstrap / ManagerUpgradeMath).
#
#   manager.version  The Manager APK's own version. It moves ONLY in a release that
#                    changes apps/player/manager — set it equal to unit.version in
#                    that release; otherwise leave it, so an unchanged companion is
#                    never reinstalled and a screen never takes a second Install tap
#                    for bytes it already runs. Must be <= unit.version and > 1.0.24
#                    (the last hand-typed Manager; 1.0.25 was never released).
#
# A field candidate (-PplayerFieldCandidate=x.y.z-field.N, manual CI dispatch only)
# renames the Player to x.y.z-field.N; the Manager takes the same field name and
# code only when manager.version == unit.version (it changed in this line) and
# otherwise keeps its stable version, exactly as on a stable build.
unit.version=1.1.29
manager.version=1.1.29
