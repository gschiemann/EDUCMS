<!doctype html>
<!-- HS EASTER/SPRING v2 — "SPRING BREAK · DAWN HORIZON" CLEAN flagship. ONE dominant headline +
     a giant countdown, three simple event chips, generous negative space. Light dawn-gradient sky
     with a low sun glow, rolling-hill band, drifting blossom petals + soft bokeh. Every text =
     data-field, crest = data-imgslot, ALL color via canonical brand tokens (school brand re-skins
     it). Auto-fit, portrait+landscape, bridge preserved.
     Deliberately low-text: NO body paragraphs, NO dense schedule, NO ticker. -->
<html lang="en"><head><meta charset="utf-8"/><title>Spring Break · HS Lobby</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --stage-w:3840px;--stage-h:2160px;--stage-scale:1;--scale:1;
  --brand:#e0607a;--brand2:#7a2e44;--accent:#f2a83a;--accent2:#4fae6b;
  --ink:#3a2336;--bg:#fdeede;--pos:#4fae6b;--neg:#e0607a;
  --f-display:'Bebas Neue';--f-body:'Fraunces';--f-mono:'JetBrains Mono';
  --cream:#fff7ec;--mute:#9a7d86;
  /* clean flagship: few elements, big type. everything >=60px on the 3840 stage. */
  --t-school:calc(96px*var(--scale));--t-date:calc(64px*var(--scale));
  --t-eyebrow:calc(72px*var(--scale));--t-hero:calc(560px*var(--scale));--t-sub:calc(84px*var(--scale));
  --t-cdnum:calc(600px*var(--scale));--t-cdlabel:calc(66px*var(--scale));
  --t-chipt:calc(104px*var(--scale));--t-chipm:calc(62px*var(--scale));--t-chipi:calc(132px*var(--scale));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;background:#1a1016;color:var(--ink);font-family:var(--f-body),serif}
.viewport{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;overflow:hidden}
.stage-outer{width:calc(var(--stage-w)*var(--stage-scale));height:calc(var(--stage-h)*var(--stage-scale))}
.stage{width:var(--stage-w);height:var(--stage-h);transform:scale(var(--stage-scale));transform-origin:0 0;position:relative;overflow:hidden;
  background:radial-gradient(1400px 1000px at 78% 8%,color-mix(in srgb,var(--accent) 60%,#fff) 0%,transparent 58%),linear-gradient(178deg,color-mix(in srgb,var(--accent) 24%,var(--cream)) 0%,var(--cream) 30%,color-mix(in srgb,var(--brand) 22%,var(--cream)) 78%,color-mix(in srgb,var(--accent2) 30%,var(--cream)) 100%)}

.decor{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:-160px;right:240px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 85%,#fff),color-mix(in srgb,var(--accent) 55%,transparent) 55%,transparent 72%);filter:blur(2px)}
.hills{position:absolute;left:-4%;right:-4%;bottom:0;height:560px;z-index:1}
.hills i{position:absolute;bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.hills .h1{left:-6%;width:64%;height:440px;background:color-mix(in srgb,var(--accent2) 60%,#2a6e44);opacity:.9}
.hills .h2{right:-8%;width:70%;height:350px;background:color-mix(in srgb,var(--accent2) 78%,#3a8a55);opacity:.92}
.hills .h3{left:24%;width:56%;height:270px;background:color-mix(in srgb,var(--accent2) 90%,#56b06e)}
.petal{position:absolute;width:30px;height:23px;background:color-mix(in srgb,var(--brand) 72%,#fff);border-radius:60% 0 60% 0;opacity:.85;animation:drift 9s linear infinite;z-index:2}
@keyframes drift{0%{transform:translate(0,-120px) rotate(0)}100%{transform:translate(160px,2400px) rotate(360deg)}}
.bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,transparent 70%);opacity:.5;animation:pulse 6s ease-in-out infinite;z-index:1}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.25)}}

.wrap{position:relative;z-index:7;width:100%;height:100%;display:flex;flex-direction:column;padding:150px 200px 160px}

/* slim masthead */
.mast{flex:none;display:flex;align-items:center;justify-content:space-between;gap:40px}
.mast .school{display:flex;align-items:center;gap:30px;min-width:0}
.mast .crest{width:120px;height:120px;border-radius:50%;border:3px solid var(--brand);background:linear-gradient(135deg,var(--brand),var(--accent2));background-size:cover;background-position:center;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:calc(66px*var(--scale));color:#fff;overflow:hidden}
.mast .crest .ph{line-height:1}
.mast .crest.has-img{border-color:var(--accent)}.mast .crest.has-img .ph{display:none}
.mast .school .nm{font-family:var(--f-display);font-size:var(--t-school);color:var(--ink);letter-spacing:.04em;line-height:1;white-space:nowrap}
.mast .school .nm em{color:var(--brand);font-style:normal}
.mast .date{font-family:var(--f-mono);font-weight:800;font-size:var(--t-date);letter-spacing:.2em;color:var(--brand2);text-transform:uppercase;white-space:nowrap}

/* hero takes the big middle: headline + one line, with the countdown beside it */
.hero{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:130px}
.hero .l{min-width:0}
.hero .eyebrow{font-family:var(--f-mono);font-weight:800;font-size:var(--t-eyebrow);letter-spacing:.3em;color:var(--brand2);text-transform:uppercase;white-space:nowrap}
.hero h1{font-family:var(--f-display);font-size:var(--t-hero);line-height:.8;color:var(--brand);margin:24px 0 0;letter-spacing:.01em;text-shadow:14px 14px 0 color-mix(in srgb,var(--brand) 26%,transparent),28px 28px 0 color-mix(in srgb,var(--accent2) 30%,transparent)}
.hero h1 em{color:var(--accent2);font-style:italic;text-shadow:14px 14px 0 color-mix(in srgb,var(--accent) 34%,transparent)}
.hero .sub{font-family:var(--f-body);font-weight:500;font-style:italic;font-size:var(--t-sub);color:var(--brand2);margin-top:34px;line-height:1.14;max-width:1850px;opacity:.95}
.cd{flex:none;text-align:center}
.cd .v{font-family:var(--f-display);font-size:var(--t-cdnum);line-height:.74;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:14px 14px 0 color-mix(in srgb,var(--accent) 60%,transparent)}
.cd .k{font-family:var(--f-mono);font-weight:800;font-size:var(--t-cdlabel);letter-spacing:.18em;text-transform:uppercase;color:var(--brand);margin-top:14px;white-space:nowrap}

/* three simple event chips, one row along the bottom */
.chips{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:52px;margin-top:30px}
.chip{background:rgba(255,255,255,.7);border:2px solid color-mix(in srgb,var(--brand) 55%,transparent);border-radius:30px;padding:46px 50px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:0 18px 44px rgba(120,60,80,.12)}
.chip.b2{border-color:color-mix(in srgb,var(--accent2) 55%,transparent)}
.chip.b3{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.chip .icon{font-size:var(--t-chipi);line-height:.9}
.chip .t{font-family:var(--f-display);font-size:var(--t-chipt);color:var(--brand);line-height:.88;letter-spacing:.01em}
.chip.b2 .t{color:var(--accent2)}.chip.b3 .t{color:var(--ink)}
.chip .m{font-family:var(--f-mono);font-weight:700;font-size:var(--t-chipm);letter-spacing:.08em;text-transform:uppercase;color:var(--brand2)}

@media (orientation:portrait){
  .stage[data-orient="port"] .wrap{padding:190px 130px 170px}
  .stage[data-orient="port"]{--t-hero:calc(380px*var(--scale));--t-cdnum:calc(440px*var(--scale))}
  .stage[data-orient="port"] .mast{flex-direction:column;align-items:center;text-align:center;gap:22px}
  .stage[data-orient="port"] .mast .school{justify-content:center}
  .stage[data-orient="port"] .hero{grid-template-columns:1fr;gap:70px;text-align:center}
  .stage[data-orient="port"] .hero .sub{margin-left:auto;margin-right:auto}
  .stage[data-orient="port"] .chips{grid-template-columns:1fr;gap:40px}
}
</style></head><body>
<script>const __TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{"schema":"edu-cms-hs-easter-v1"}/*EDITMODE-END*/;</script>
<div class="viewport"><div class="stage-outer"><div class="stage" id="stage" data-orient="land">


<div class="decor">
  <div class="sun"></div>
  <div class="hills"><i class="h1"></i><i class="h2"></i><i class="h3"></i></div>

  <div id="petals"></div>
</div>

<div class="wrap">

    <div class="chip b2" data-widget="c1"><div class="icon" data-field="c1.icon">📚</div><div class="t" data-field="c1.t" data-fit="single" data-fit-max="116">AP Review</div><div class="m" data-field="c1.m" data-fit="single" data-fit-max="70">Schoology · Fri 4PM</div></div>

  </div>
</div>

<div data-widget="theme" hidden>
  <span data-field="theme.bg">#fdeede</span><span data-field="theme.ink">#3a2336</span>
  <span data-field="theme.brand">#e0607a</span><span data-field="theme.brand2">#7a2e44</span>
  <span data-field="theme.accent">#f2a83a</span><span data-field="theme.accent2">#4fae6b</span>
  <span data-field="theme.pos">#4fae6b</span><span data-field="theme.neg">#e0607a</span>
  <span data-field="theme.fDisplay">Bebas Neue</span><span data-field="theme.fBody">Fraunces</span><span data-field="theme.fMono">JetBrains Mono</span><span data-field="theme.scale">1</span>
</div>
</div></div></div>
