<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Hours</title><style>
:root{--bg:#f0f4f8;--fg:#0a2540;--mute:#6c7989;--paper:#fff;--rule:rgba(10,37,64,.12);--primary:#0f7c92;--accent:#138a36;--gold:#d97706;--danger:#b91c1c;--font-display:Georgia,serif;--font-grotesk:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-condensed:"Arial Narrow","Helvetica Neue",Impact,sans-serif}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:var(--font-grotesk)}
.stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;background:var(--bg);color:var(--fg);transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden}
.frame{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;padding:80px;row-gap:40px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--rule);padding-bottom:24px}
.logo{font:700 88px/.95 var(--font-display);letter-spacing:-.02em;color:var(--primary)}
.tag{font:500 36px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin-left:32px}
.live{display:inline-flex;align-items:center;gap:16px;font:700 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-left:24px}
.live::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(19,138,54,.7)}70%{box-shadow:0 0 0 18px rgba(19,138,54,0)}100%{box-shadow:0 0 0 0 rgba(19,138,54,0)}}
.clock{font:600 88px/1 var(--font-grotesk);font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;border-top:2px solid var(--rule);padding-top:24px}
.fc{border:3px solid var(--rule);border-radius:32px;padding:24px 44px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.fc.accent{background:var(--primary);border:none}
.fc.accent .l{color:rgba(255,255,255,.85)}.fc.accent .v{color:#fff}
.fc .l{font:600 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fc .v{font:700 72px/.92 var(--font-condensed);letter-spacing:-.02em}
</style><script>/*EDUCMS-BRAND-SHIM*/(function(){try{
var p=new URLSearchParams(location.search).get('brand');if(!p)return;
var json=decodeURIComponent(Array.prototype.map.call(atob(p.replace(/-/g,'+').replace(/_/g,'/')),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));
var b=JSON.parse(json),r=document.documentElement.style;
var MAP={background:['--bg','--brand-canvas','--brand-bg'],surface:['--paper','--brand-paper'],
text:['--ink','--fg','--brand-ink','--brand-fg'],muted:['--mute','--brand-mute'],
primary:['--primary','--brand-primary'],accent:['--accent','--brand-accent','--brand-gold','--gold'],
fontDisplay:['--font-display'],fontBody:['--font-grotesk'],fontCondensed:['--font-condensed']};
Object.keys(MAP).forEach(function(k){if(b[k])MAP[k].forEach(function(v){r.setProperty(v,b[k]);});});
}catch(e){}})();</script>
</head><body><div class="stage" id="stage"><div class="frame" style="async function readFile(path) {
    return rpc({ op: 'readFile', path: String(path) });
  }"><header class="top"><div><span class="logo" data-field="brand.name">NORTHSIDE HEALTH</span><span class="tag" data-field="brand.tag">Hours · this week</span></div><div class="clock" data-source="local-time"><span data-field="clock.hhmm">9:42 AM</span></div></header>
<div style="background:var(--accent);color:#fff;padding:36px 56px;border-radius:32px;font:700 56px/1 var(--font-display);letter-spacing:-.02em;text-align:center">Open now · until 6 PM</div>
<main style="display:grid;grid-template-rows:repeat(7,1fr);gap:14px;min-height:0">

<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.0.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Mon</div>
<div data-field="hr.0.h" style="font:500 52px/1 var(--font-display)">7 AM — 6 PM</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.1.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Tue</div>
<div data-field="hr.1.h" style="font:500 52px/1 var(--font-display)">7 AM — 6 PM</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--primary);color:#fff;border-radius:20px;border:none">
<div data-field="hr.2.d" style="font:700 76px/1 var(--font-condensed);color:#fff">Wed · TODAY</div>
<div data-field="hr.2.h" style="font:500 52px/1 var(--font-display)">7 AM — 6 PM</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.3.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Thu</div>
<div data-field="hr.3.h" style="font:500 52px/1 var(--font-display)">7 AM — 8 PM · extended</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.4.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Fri</div>
<div data-field="hr.4.h" style="font:500 52px/1 var(--font-display)">7 AM — 5 PM</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.5.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Sat</div>
<div data-field="hr.5.h" style="font:500 52px/1 var(--font-display)">9 AM — 1 PM · walk-in only</div>
</article>
<article style="display:grid;grid-template-columns:200px 1fr;align-items:center;gap:48px;padding:18px 56px;background:var(--paper);color:var(--fg);border-radius:20px;border:2px solid var(--rule)">
<div data-field="hr.6.d" style="font:700 76px/1 var(--font-condensed);color:var(--primary)">Sun</div>
<div data-field="hr.6.h" style="font:500 52px/1 var(--font-display)">Closed</div>
</article>
</main>
<footer class="foot"><div class="fc" style="background:var(--gold);border:none"><div class="l" style="color:rgba(255,255,255,.85)">Closed</div><div class="v" style="color:#fff" data-field="cl">Memorial Day · May 26</div></div><div class="fc"><div class="l">Urgent care</div><div class="v" data-field="urg" style="font-size:48px">Riverside · 24/7</div></div><div class="fc" style="background:var(--danger);border:none"><div class="l" style="color:rgba(255,255,255,.85)">ER</div><div class="v" style="color:#fff;font-size:48px">Northside Hospital · 911</div></div></footer>
</div></div><script>(function(){var s=document.getElementById('stage');function fit(){s.style.setProperty('--scale',Math.min(innerWidth/3840,innerHeight/2160));}addEventListener('resize',fit);fit();})();</script></body></html>
