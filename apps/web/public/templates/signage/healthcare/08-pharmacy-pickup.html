<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Pharmacy</title><style>
:root{--bg:#f0f4f8;--fg:#0a2540;--mute:#6c7989;--paper:#fff;--rule:rgba(10,37,64,.12);--primary:#0f7c92;--accent:#138a36;--gold:#d97706;--danger:#b91c1c;--font-display:Georgia,serif;--font-grotesk:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-condensed:"Arial Narrow","Helvetica Neue",Impact,sans-serif}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:var(--font-grotesk)}
.stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;background:var(--bg);color:var(--fg);transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden}
.frame{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;padding:80px;row-gap:40px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--rule);padding-bottom:24px}
.logo{font:700 88px/.95 var(--font-display);letter-spacing:-.02em;color:var(--primary)}
.tag{font:500 36px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin-left:32px}
.live{display:inline-flex;align-items:center;gap:16px;font:700 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-left:24px}
.live::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(19,138,54,.7)}70%{box-shadow:0 0 0 18px rgba(19,138,54,0)}100%{box-shadow:0 0 0 0 rgba(19,138,54,0)}}
.clock{font:600 88px/1 var(--font-grotesk);font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;border-top:2px solid var(--rule);padding-top:24px}
.fc{border:3px solid var(--rule);border-radius:32px;padding:24px 44px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.fc.accent{background:var(--primary);border:none}
.fc.accent .l{color:rgba(255,255,255,.85)}.fc.accent .v{color:#fff}
.fc .l{font:600 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fc .v{font:700 72px/.92 var(--font-condensed);letter-spacing:-.02em}
</style></head><body><div class="stage" id="stage"><div class="frame" style="async function readFile(path) {
    return rpc({ op: 'readFile', path: String(path) });
  }"><header class="top"><div><span class="logo" data-field="brand.name">NORTHSIDE PHARMACY</span><span class="tag" data-field="brand.tag">Pickup window</span><span class="live">Live</span></div><div class="clock" data-source="local-time"><span data-field="clock.hhmm">9:42 AM</span></div></header>
<main style="display:grid;grid-template-columns:1fr 1fr;gap:48px;min-height:0">
<section style="background:var(--paper);border:3px solid var(--accent);border-radius:48px;padding:64px 80px">
<div style="font:700 44px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready · window 2</div>
<div style="margin-top:32px;display:flex;flex-direction:column;gap:18px">
<article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.0.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Castellanos</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.1.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Reyes</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.2.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Liu</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.3.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Park</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.4.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Hartwell</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="r.5.name" style="font:600 64px/1 var(--font-display);letter-spacing:-.02em">Yamamoto</div><div style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">Ready</div></article>
</div></section>
<section style="background:var(--paper);border:3px solid var(--gold);border-radius:48px;padding:64px 80px">
<div style="font:700 44px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">In progress · ~15 min</div>
<div style="margin-top:32px;display:flex;flex-direction:column;gap:18px">
<article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="p.0.name" style="font:600 52px/1 var(--font-display);letter-spacing:-.02em">Singh</div><div data-field="p.0.eta" style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">~5 min</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="p.1.name" style="font:600 52px/1 var(--font-display);letter-spacing:-.02em">Patel</div><div data-field="p.1.eta" style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">~8 min</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="p.2.name" style="font:600 52px/1 var(--font-display);letter-spacing:-.02em">Davies</div><div data-field="p.2.eta" style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">~12 min</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="p.3.name" style="font:600 52px/1 var(--font-display);letter-spacing:-.02em">Smith</div><div data-field="p.3.eta" style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">~14 min</div></article><article style="display:grid;grid-template-columns:1fr auto;gap:32px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--rule)"><div data-field="p.4.name" style="font:600 52px/1 var(--font-display);letter-spacing:-.02em">Garcia</div><div data-field="p.4.eta" style="font:600 36px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">~18 min</div></article>
</div></section>
</main>
<footer class="foot"><div class="fc accent"><div class="l">Avg wait</div><div class="v">8 min</div></div><div class="fc"><div class="l">Drive-thru</div><div class="v" data-field="dt" style="font-size:48px">Lane 1 · open</div></div><div class="fc"><div class="l">Pharmacist</div><div class="v" data-field="ph" style="font-size:48px">Dr. Anand</div></div></footer>
</div></div><script>(function(){var s=document.getElementById('stage');function fit(){s.style.setProperty('--scale',Math.min(innerWidth/3840,innerHeight/2160));}addEventListener('resize',fit);fit();})();</script></body></html>
