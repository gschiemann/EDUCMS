*,*::before,*::after{box-sizing:border-box}

.art{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center}

.scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(8,9,15,.95) 0%,rgba(8,9,15,.78) 40%,transparent 66%),linear-gradient(0deg,rgba(8,9,15,.92),transparent 36%)}
/* thin gilt arch outline */
.arch{position:absolute;top:64px;right:64px;bottom:64px;left:64px;border:2px solid rgba(217,180,106,.5);border-radius:340px 340px 0 0;pointer-events:none}
.arch::before{content:"";position:absolute;top:14px;right:14px;bottom:14px;left:14px;border:1px solid rgba(217,180,106,.28);border-radius:330px 330px 0 0}
.frame{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;grid-template-rows:auto 1fr auto;padding:104px 130px 100px}

.bar{display:flex;align-items:center;gap:26px}
.crest{width:88px;height:88px;flex:none;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.crest svg{width:44px;height:44px}
.bar .nm{font:600 48px/.92 var(--font-display)}
.bar .nm small{display:block;font:600 24px/1 var(--font-grotesk);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.bar .wk{margin-left:auto;display:inline-flex;align-items:center;gap:16px;border:1px solid var(--gold2);color:var(--gold);font:500 34px/1 var(--font-grotesk);letter-spacing:.16em;text-transform:uppercase;padding:18px 38px;border-radius:999px}

.b{align-self:center;max-width:64%}
.b .pre{display:inline-flex;align-items:center;gap:24px;font:500 38px/1 var(--font-grotesk);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.b .pre::before{content:"";width:90px;height:1px;background:var(--gold)}
.b h1{font:600 360px/.78 var(--font-display);font-style:italic;letter-spacing:-.02em;margin:26px 0 0;color:#fff;text-shadow:0 0 90px rgba(217,180,106,.3)}
.b .scripture{font:500 66px/1.32 var(--font-display);font-style:italic;color:rgba(244,234,210,.9);margin-top:38px;max-width:24ch}
.b .ref{font:600 32px/1 var(--font-grotesk);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:24px}

.foot{display:flex;align-items:stretch;gap:0;border-top:1px solid var(--gold2);padding-top:40px}
.fc{flex:1;padding:0 56px;border-left:1px solid rgba(217,180,106,.26);display:flex;flex-direction:column;justify-content:center;gap:12px}
.fc:first-child{padding-left:0;border-left:0;flex:1.6}
.fc .l{font:600 28px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fc .v{font:600 58px/1.04 var(--font-display);color:var(--cream)}
.fc .v em{font-style:italic;color:var(--gold)}

.stage[data-orient="portrait"] .b{max-width:100%}
.stage[data-orient="portrait"] .b h1{font-size:230px}
.stage[data-orient="portrait"] .scrim{background:linear-gradient(0deg,rgba(8,9,15,.96) 0%,rgba(8,9,15,.6) 50%,transparent 80%)}
.stage[data-orient="portrait"] .foot{flex-direction:column;gap:32px}
.stage[data-orient="portrait"] .fc{border-left:0;padding:0}
.stage[data-orient="portrait"] .arch{border-radius:260px 260px 0 0}

<div class="stage" id="stage">
  <div class="art placeholder" data-imgslot="series.art" aria-hidden="true"></div>
  <div class="scrim"></div>

  <div class="frame">
