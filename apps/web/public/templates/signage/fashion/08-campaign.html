<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Campaign</title><style>
:root{--bg:#f5f1ec;--fg:#1a1714;--mute:#7a7368;--paper:#fff;--rule:rgba(26,23,20,.12);--primary:#1a1714;--accent:#a07a4a;--gold:#c79335;--blush:#d4a8a0;--font-display:Georgia,serif;--font-grotesk:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--font-condensed:"Arial Narrow","Helvetica Neue",Impact,sans-serif}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:var(--font-grotesk);letter-spacing:.02em}
.stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;background:var(--bg);color:var(--fg);transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden}
.frame{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;padding:80px;row-gap:40px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--fg);padding-bottom:24px}
.logo{font:400 88px/.95 var(--font-display);font-style:italic;letter-spacing:0}
.tag{font:500 32px/1 var(--font-grotesk);letter-spacing:.4em;text-transform:uppercase;color:var(--mute);margin-left:32px}
.clock{font:400 72px/1 var(--font-display);font-style:italic;font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;border-top:1px solid var(--fg);padding-top:24px}
.fc{padding:24px 44px;display:flex;flex-direction:column;gap:10px}
.fc+.fc{border-left:1px solid var(--rule)}
.fc .l{font:600 28px/1 var(--font-grotesk);letter-spacing:.4em;text-transform:uppercase;color:var(--mute)}
.fc .v{font:400 56px/1 var(--font-display);font-style:italic}
.fc.dark{background:var(--fg);color:#fff;border-radius:24px;border:none}
.fc.dark .l{color:rgba(255,255,255,.7)}
.ph{position:relative;background:#e6e0d6;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(26,23,20,.22)}
.ph-i{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mute)}
.ph-i svg{width:120px;height:120px;opacity:.5}
.ph-i .l{font:600 32px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase}
.ph-i .d{font:500 26px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase;color:rgba(26,23,20,.4)}
</style><script>/*EDUCMS-SHIM-V2*/(function(){try{
function dec(p){if(!p)return null;try{var j=decodeURIComponent(Array.prototype.map.call(atob(p.replace(/-/g,'+').replace(/_/g,'/')),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));return JSON.parse(j);}catch(e){return null;}}
function readParams(){var q=new URLSearchParams(location.search);return{brand:dec(q.get('brand'))||{},text:dec(q.get('text'))||{},styles:dec(q.get('textStyles'))||{}};}
var BRAND_MAP={background:['--bg','--brand-canvas','--brand-bg','--surface-canvas'],surface:['--paper','--brand-paper','--surface'],
text:['--ink','--fg','--brand-ink','--brand-fg','--text'],muted:['--mute','--brand-mute','--text-muted'],
primary:['--primary','--brand-primary','--color-primary'],accent:['--accent','--brand-accent','--brand-gold','--gold','--color-accent'],
fontDisplay:['--font-display','--font-headline'],fontBody:['--font-grotesk','--font-body','--font-sans'],fontCondensed:['--font-condensed','--font-numeric']};
function applyBrand(b){var r=document.documentElement.style;Object.keys(BRAND_MAP).forEach(function(k){if(b[k])BRAND_MAP[k].forEach(function(v){r.setProperty(v,b[k]);});});}
function applyTextAndStyles(text,styles){var keys={};Object.keys(text||{}).forEach(function(k){keys[k]=1;});Object.keys(styles||{}).forEach(function(k){keys[k]=1;});Object.keys(keys).forEach(function(k){var nodes=document.querySelectorAll('[data-field="'+k.replace(/"/g,'\\"')+'"]');for(var i=0;i<nodes.length;i++){var el=nodes[i];if(text&&typeof text[k]==='string'){if(el.children.length===0){el.textContent=text[k];}else{var tn=null;for(var j=0;j<el.childNodes.length;j++){if(el.childNodes[j].nodeType===3){tn=el.childNodes[j];break;}}if(tn){tn.textContent=text[k];}else{el.insertBefore(document.createTextNode(text[k]),el.firstChild);}}}var s=styles&&styles[k];if(s){if(s.color)el.style.color=s.color;if(s.fontSize!=null)el.style.fontSize=(typeof s.fontSize==='number'?s.fontSize+'px':s.fontSize);if(s.fontWeight!=null)el.style.fontWeight=String(s.fontWeight);if(s.fontStyle)el.style.fontStyle=s.fontStyle;if(s.fontFamily)el.style.fontFamily=s.fontFamily;if(s.textDecoration)el.style.textDecoration=s.textDecoration;if(s.textAlign)el.style.textAlign=s.textAlign;if(s.backgroundColor)el.style.backgroundColor=s.backgroundColor;if(s.lineHeight!=null)el.style.lineHeight=String(s.lineHeight);}}});}
function applyAll(){var p=readParams();applyBrand(p.brand);applyTextAndStyles(p.text,p.styles);}
applyBrand(readParams().brand);
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',applyAll);}else{applyAll();}
addEventListener('message',function(e){try{var d=e.data;if(d&&d.type==='educms-overrides'){if(d.brand)applyBrand(d.brand);applyTextAndStyles(d.text||{},d.textStyles||{});}}catch(_){}});
}catch(e){}})();</script>
</head><body><div class="stage" id="stage"><div class="frame" style="async function readFile(path) {
    return rpc({ op: 'readFile', path: String(path) });
  }">
<div style="position:relative;height:100%">
<div class="ph" style="position:absolute;top:0;right:0;bottom:0;left:0;border:none;border-radius:0" data-widget="image-slot" data-slot="cam" data-aspect="3840x2160" data-field="cam.photo_url"><div class="ph-i"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><rect x="6" y="12" width="52" height="40" rx="4"/><circle cx="22" cy="26" r="4"/><path d="M6 46 L22 32 L34 42 L44 34 L58 46"/></svg><div class="l">Full-bleed campaign</div><div class="d">3840 × 2160</div></div></div>
<div style="position:absolute;left:120px;top:120px;color:#fff;text-shadow:0 4px 32px rgba(0,0,0,.5);max-width:2200px">
<div style="font:500 36px/1 var(--font-grotesk);letter-spacing:.4em;text-transform:uppercase;color:#fff;opacity:.85" data-field="cam.eye">Spring · summer 2026</div>
<h1 style="margin:48px 0 0;font:400 360px/.85 var(--font-display);font-style:italic;letter-spacing:-.03em;color:#fff" data-field="cam.t">After dark.</h1>
</div>
<div style="position:absolute;left:120px;bottom:120px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5)"><div style="font:500 28px/1 var(--font-grotesk);letter-spacing:.4em;text-transform:uppercase;color:#fff;opacity:.85" data-field="cam.cap">A film by Léa Pérez · Marrakech · 2026</div></div>
<div style="position:absolute;right:120px;bottom:120px;color:#fff;text-align:right"><div style="font:400 88px/1 var(--font-display);font-style:italic" data-field="cam.brand">Maison Éternel</div></div>
</div>
</div></div><script>(function(){var s=document.getElementById('stage');function fit(){s.style.setProperty('--scale',Math.min(innerWidth/3840,innerHeight/2160));}addEventListener('resize',fit);fit();})();</script></body></html>
