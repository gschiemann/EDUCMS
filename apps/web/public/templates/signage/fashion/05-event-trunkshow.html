.meta .k{font:600 var(--t-tertiary)/1 var(--font-grotesk);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

.right{position:relative;overflow:hidden;background:#ded5c7}
.right .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.right .photo.placeholder{background:linear-gradient(150deg,#cfd6cb,#8a9c8c 52%,#324a40)}
.right .drop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:20px;color:rgba(255,255,255,.85);text-align:center}
.right .photo.has-img .drop{display:none}
.right .drop svg{width:140px;height:140px;opacity:.82}
.right .drop b{font:600 var(--t-tertiary)/1.1 var(--font-grotesk);letter-spacing:.14em;text-transform:uppercase}
.right .rsvp{position:absolute;left:64px;right:64px;bottom:72px;background:var(--ink);color:var(--paper);padding:44px 56px;display:flex;align-items:center;justify-content:space-between;gap:36px}
.right .rsvp .l{font:600 var(--t-tertiary)/1 var(--font-grotesk);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,253,249,.65)}
.right .rsvp .v{font:500 var(--t-secondary)/1.02 var(--font-display);font-style:italic;margin-top:12px}
.right .rsvp .code{font:600 var(--t-tertiary)/1 var(--font-grotesk);letter-spacing:.14em;text-transform:uppercase;border:3px solid rgba(255,253,249,.4);padding:24px 40px;border-radius:999px;white-space:nowrap;flex:none}
.stage[data-orient="portrait"] .frame{grid-template-columns:1fr;grid-template-rows:1.1fr 1fr}
.stage[data-orient="portrait"] .hero h1{font-size:150px}
