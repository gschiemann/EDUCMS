.room.busy{background:#e7ebf1}
.room .rn{font:500 200px/.82 var(--font-display);font-style:italic;letter-spacing:-.03em}
.room .st{font:600 var(--t-secondary)/1 var(--font-grotesk);letter-spacing:.04em}
.room.free .st{color:var(--free)}.room.busy .st{color:var(--busy)}.room.appt .st{color:var(--appt)}
.room .st small{display:block;font:500 var(--t-tertiary)/1.1 var(--font-grotesk);color:var(--mute);letter-spacing:0;text-transform:none;margin-top:14px}
.foot{display:flex;align-items:center;gap:44px;border-top:3px solid var(--ink);padding-top:36px}
.foot .cord{flex:1;background:var(--ink);color:var(--paper);border-radius:26px;padding:38px 52px}
.foot .cord .l{font:600 var(--t-tertiary)/1 var(--font-grotesk);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,253,249,.65)}
.foot .cord .v{font:500 var(--t-secondary)/1.04 var(--font-display);font-style:italic;margin-top:12px}
.foot .fc{flex:none;text-align:right}
.foot .fc .l{font:600 var(--t-tertiary)/1 var(--font-grotesk);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.foot .fc .v{font:500 var(--t-secondary)/1 var(--font-display);font-style:italic;margin-top:12px}
.stage[data-orient="portrait"] .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
.stage[data-orient="portrait"] .foot{flex-direction:column;align-items:stretch}
