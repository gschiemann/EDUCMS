<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Outlook</title><style>

.fcrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:32px;align-items:center;padding:24px 28px;background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.fcrow .d{font:600 40px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);width:160px}
.fcrow.today .d{color:var(--primary)}
.fcrow .ic{font:600 60px/1 var(--font-display);color:var(--accent)}
.fcrow .hi{font:700 64px/1 var(--font-display);font-variant-numeric:tabular-nums}
.fcrow .lo{font:500 44px/1 var(--font-display);color:var(--mute);font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;border-top:2px solid var(--rule);padding-top:24px}
.ft{padding:0 16px}
.ft+.ft{border-left:1px solid var(--rule)}
.ft .k{font:600 24px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
.ft .v{margin-top:14px;font:500 52px/1 var(--font-display);letter-spacing:-.02em}
</style><script>/*EDUCMS-SHIM-V5*/(function(){try{

</head><body><div class="stage" id="stage"><div class="frame">
