* { box-sizing: border-box; }
html, body {

  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #080908;
  -webkit-font-smoothing: antialiased;
}
body { font-family: 'Manrope', sans-serif; }
#scene-wrap {
  --scene-scale: 1;
  position: absolute;
  left: 50%;
  top: 50%;
  overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--scene-scale));
  transform-origin: center center;
}
.scene {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}
.scene::after {
  content: "";
  position: absolute;
  top:0;right:0;bottom:0;left:0;

.bounded { overflow: hidden; }
.mono { font-family: 'DM Mono', monospace; }
.serif { font-family: 'Instrument Serif', serif; }
.is-editing [data-field], .is-editing [data-imgslot] { cursor: pointer; }
.is-editing [data-field]:hover,
.is-editing [data-imgslot]:hover {

.is-frozen *,
.is-frozen *::before,
.is-frozen *::after {

  width: 1080px;
  height: 1920px;

var v=N[i].getAttribute&&N[i].getAttribute(A[j]);if(!v)continue;var pre=group+'.'+from+'.';if(v.indexOf(pre)===0)N[i].setAttribute(A[j],group+'.'+to+'.'+v.slice(pre.length));}}}
var _rpStyled=false;
function _rpStyle(){if(_rpStyled)return;_rpStyled=true;var st=document.createElement('style');
st.textContent='[data-educms-repeat]{display:flex;flex-direction:column;gap:var(--educms-repeat-gap,18px);height:100%;align-content:stretch}'+
'[data-educms-repeat]>[data-educms-repeat-item]{flex:1 1 0;min-height:0;margin-bottom:0;overflow:hidden}';
document.head.appendChild(st);}
function applyRepeat(counts){if(!counts||typeof counts!=='object')return;var G=_rpGroups();
for(var i=0;i<G.length;i++){var g=G[i],want=counts[g.group];if(typeof want!=='number'||!isFinite(want))continue;
var mx=parseInt(g.parent.getAttribute('data-repeat-max')||'',10);if(!isFinite(mx))mx=12;
want=Math.max(1,Math.min(mx,Math.round(want)));var have=g.items.length;
if(want===have){g.parent.removeAttribute('data-educms-repeat');for(var z=0;z<g.items.length;z++)g.items[z].removeAttribute('data-educms-repeat-item');continue;}
if(want<have){for(var d=have-1;d>=want;d--)if(g.items[d].parentNode)g.items[d].parentNode.removeChild(g.items[d]);}
else{var tpl=g.items[have-1];for(var a=have;a<want;a++){var cl=tpl.cloneNode(true);_rpRenumber(cl,g.group,g.base+have-1,g.base+a);g.parent.appendChild(cl);}}
_rpStyle();g.parent.setAttribute('data-educms-repeat','');
var kids=g.parent.children;for(var y=0;y<kids.length;y++)kids[y].setAttribute('data-educms-repeat-item','');}}

var TIME_KEYS={"clock.time":1,"meta.time":1,"header.time":1,"now.time":1,"time.now":1};
var DATE_KEYS={"clock.date":1,"meta.day":1,"meta.date":1,"header.date":1,"header.day":1};
function _ckCfg(k,fb){var el=document.querySelector('[data-field="'+k+'"]');var v=el?(el.textContent||'').trim():'';return v||fb;}
/* Match the shape the board AUTHORED — "SUNDAY · JUL 26" and "SUN · OCT 18"
 * are different designs, and a clock that reformats them has redesigned the
 * board. Infer weekday length, separator and case from the sample. */
function _ckDate(sample,d,tz,locale){
  var longDay=/^[A-Za-z]{4,}/.test(sample.replace(/^\s+/,''));
  /* Capture the separator WITH its surrounding whitespace — trimming it
   * turns the authored "SUNDAY · JUL 26" into "TUESDAY· AUG 25", which is
   * a (small, ugly) redesign of the board. */
  var sep=(sample.match(/[A-Za-z]([^A-Za-z0-9]+)[A-Za-z]/)||[,' '])[1]||' ';
  var o={weekday:longDay?'long':'short',month:'short',day:'numeric'};
  if(tz)o.timeZone=tz;
  var parts;
  try{parts=new Intl.DateTimeFormat(locale||'en-US',o).formatToParts(d);}catch(e){return sample;}
  var g=function(t){var f=null;for(var i=0;i<parts.length;i++)if(parts[i].type===t)f=parts[i].value;return f||'';};
  var out=g('weekday')+sep+g('month')+' '+g('day');
  return sample===sample.toUpperCase()?out.toUpperCase():out;
}
function _ckTime(sample,d,tz,locale,hour12){
  var o={hour:'numeric',minute:'2-digit',hour12:hour12};
  if(tz)o.timeZone=tz;
  var out;
  try{out=new Intl.DateTimeFormat(locale||'en-US',o).format(d);}catch(e){return sample;}
  return sample===sample.toUpperCase()?out.toUpperCase():out;
}
var _ckSamples=null,_ckTimer=null;
/* A board that ships the K-12 clock config span already drives its own
 * clock; two engines writing the same node would fight. */
function _ckOwnEngine(){return !!document.querySelector('[data-field="clock.mode"]');}
function startClock(text){
  if(_ckOwnEngine())return;
  var nodes=[];
  var all=document.querySelectorAll('[data-field]');
  for(var i=0;i<all.length;i++){
    var k=all[i].getAttribute('data-field');
    if(!TIME_KEYS[k]&&!DATE_KEYS[k])continue;
    /* The operator typed something here — their words win over the wall
     * clock, exactly as for any other editable field. */
    if(text&&typeof text[k]==='string')continue;
    nodes.push({el:all[i],key:k,isTime:!!TIME_KEYS[k]});
  }
  if(!nodes.length)return;
  if(!_ckSamples){_ckSamples={};for(var j=0;j<nodes.length;j++)_ckSamples[nodes[j].key]=(nodes[j].el.textContent||'').trim();}
  var tz=_ckCfg('clock.timeZone','');
  var locale=_ckCfg('clock.locale','en-US');
  var h12raw=_ckCfg('clock.hour12','yes');
  var hour12=!/^(no|off|false|0|24)/i.test(h12raw);
  function tick(){
    var d=new Date();
    for(var n=0;n<nodes.length;n++){
      var s=_ckSamples[nodes[n].key]||'';
      nodes[n].el.textContent=nodes[n].isTime?_ckTime(s,d,tz,locale,hour12):_ckDate(s,d,tz,locale);
    }
  }
  tick();
  if(_ckTimer)clearInterval(_ckTimer);
  _ckTimer=setInterval(tick,15000);
}
function applyAll(){var p=readParams();applyBrand(p.brand);applyRepeat(p.repeat);applyTextAndStyles(p.text,p.styles);applyImages(p.img);applyPosters(p.img);applyVideos(p.video);startClock(p.text);if(editMode){armEdit();armMediaEdit();}}
applyBrand(readParams().brand);
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',applyAll);}else{applyAll();}
try{parent.postMessage({type:'educms-ready'},'*');}catch(_){}
addEventListener('message',function(e){try{var d=e.data;if(!d||typeof d!=='object')return;if(d.type==='educms-overrides'){if(d.brand)applyBrand(d.brand);if(d.repeat)applyRepeat(d.repeat);applyTextAndStyles(d.text||{},d.textStyles||{});applyImages(d.img||{});applyPosters(d.img||{});applyVideos(d.video||{});startClock(d.text||{});}else if(d.type==='educms-edit-mode'){editMode=!!d.on;if(editMode){_unfreeze();armEdit();armMediaEdit();}}}catch(_){}});
}catch(e){}})();</script>
</head>
<body>
  <div id="scene-wrap">
    <main class="scene">
      <div class="art" data-imgslot="series.art" aria-label="Replaceable kinetic sermon series artwork"></div>
      <header class="top">
        <div class="progress" data-field="series.progress">WEEK 03 / 06</div>
        <div class="identity">
          <div class="logo" data-imgslot="brand.logo" aria-label="Replaceable church logo"></div>
          <div class="brand" data-field="brand.name">HAVEN CHURCH</div>
        </div>
      </header>
      <section class="hero">
        <div class="eyebrow" data-field="series.eyebrow">CURRENT SERIES</div>
        <div class="series-title" data-field="series.title" data-fit data-fit-min="100" data-fit-max="168">ROOTED</div>
        <div class="series-subtitle" data-field="series.subtitle" data-fit data-fit-min="52" data-fit-max="70">Formation in the Psalms</div>
        <div class="series-thesis" data-field="series.thesis" data-fit data-fit-min="52" data-fit-max="64">Many strands. One life.</div>
      </section>
      <section class="message">
        <div class="message-label" data-field="message.eyebrow">THIS SUNDAY</div>
        <div class="message-title" data-field="message.title" data-fit data-fit-min="52" data-fit-max="78">Planted by streams.</div>
      </section>
      <footer class="meta-rail">
        <section class="meta">
          <div class="meta-label" data-field="scripture.label">READING</div>
          <div class="meta-value" data-field="scripture.reference" data-fit data-fit-min="52" data-fit-max="56">Psalm 1:1–6</div>
        </section>
        <section class="meta">
          <div class="meta-label" data-field="speaker.label">TEACHING</div>
          <div class="meta-value" data-field="speaker.name" data-fit data-fit-min="52" data-fit-max="56">Mara Lin</div>
        </section>
        <section class="meta">
          <div class="meta-label" data-field="service.label">GATHERING</div>
          <div class="meta-value service-line" data-field="service.time" data-fit data-fit-min="52" data-fit-max="56">Sunday · 10:30 AM</div>
          <div class="meta-value service-line" data-field="service.location" data-fit data-fit-min="52" data-fit-max="56">Main Auditorium</div>
        </section>
      </footer>
    </main>
  </div>
  <script>
(function () {
  'use strict';
  var wrap = document.getElementById('scene-wrap');
  var scene = wrap && wrap.querySelector('.scene');

  function orient() {
    var forced = new URLSearchParams(location.search).get('orientation');
    var portrait = forced === 'portrait' || (forced !== 'landscape' && innerHeight > innerWidth);
    var width = portrait ? 1080 : 1920;
    var height = portrait ? 1920 : 1080;
    document.documentElement.classList.toggle('is-portrait', portrait);
    wrap.style.width = width + 'px';
    wrap.style.height = height + 'px';
    scene.style.width = width + 'px';
    scene.style.height = height + 'px';
    wrap.style.setProperty('--scene-scale', Math.min(innerWidth / width, innerHeight / height));
    setTimeout(fitAll, 0);
  }

  function queryJson(name) {
    var value = new URLSearchParams(location.search).get(name);
    if (!value) return {};
    try {
      var base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      var binary = atob(base64);
      var encoded = '';
      for (var i = 0; i < binary.length; i++) {
        encoded += '%' + ('00' + binary.charCodeAt(i).toString(16)).slice(-2);
      }
      return JSON.parse(decodeURIComponent(encoded));
    } catch (_) {}
    try { return JSON.parse(value); } catch (_) {}
    try { return JSON.parse(decodeURIComponent(value)); } catch (_) {}
    return {};
  }

  function nodes(key, attribute) {
    var all = document.querySelectorAll('[' + attribute + ']');
    var found = [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute(attribute) === key) found.push(all[i]);
    }
    return found;
  }

  function setText(element, value) {
    if (value.indexOf('&') !== -1) {
      var decoder = document.createElement('textarea');
      decoder.innerHTML = value;
      value = decoder.value;
    }
    if (!element.children.length) {
      element.textContent = value;
      return;
    }
    var textNode = null;
    for (var i = 0; i < element.childNodes.length; i++) {
      if (element.childNodes[i].nodeType === 3) {
        textNode = element.childNodes[i];
        break;
      }
    }
    if (textNode) textNode.textContent = value;
    else element.insertBefore(document.createTextNode(value), element.firstChild);
  }

  function fitAll() {
    var all = document.querySelectorAll('[data-fit]');
    for (var i = 0; i < all.length; i++) {
      var element = all[i];
      var minimum = Math.max(52, Number(element.getAttribute('data-fit-min') || 52));
      var configuredMaximum = Number(element.getAttribute('data-fit-max') || 190);
      var customMaximum = Number(element.dataset.fitCeiling || 0);
      var heightTolerance = Math.max(
        0,
        Number(element.getAttribute('data-fit-height-tolerance') || 10)
      );
      if (typeof element.__educmsOriginalFontSize === 'undefined') {
        element.__educmsOriginalFontSize = element.style.fontSize || '';
      }
      if (!customMaximum) element.style.fontSize = element.__educmsOriginalFontSize;
      var cssMaximum = parseFloat(getComputedStyle(element).fontSize) || configuredMaximum;
      var maximum = Math.max(minimum, customMaximum || Math.min(configuredMaximum, cssMaximum));
      var low = Math.ceil(minimum);
      var high = Math.floor(maximum);
      var best = low;

      element.style.fontSize = maximum + 'px';
      if (
        element.scrollWidth <= element.clientWidth + 1 &&
        element.scrollHeight <= element.clientHeight + heightTolerance
      ) {
        best = maximum;
      } else {
        while (low <= high) {
          var middle = Math.floor((low + high) / 2);
          element.style.fontSize = middle + 'px';
          if (
            element.scrollWidth > element.clientWidth + 1 ||
            element.scrollHeight > element.clientHeight + heightTolerance
          ) {
            high = middle - 1;
          } else {
            best = middle;
            low = middle + 1;
          }
        }
        element.style.fontSize = best + 'px';
      }

      element.setAttribute('data-fit-size', String(Math.round(best)));
      if (
        element.scrollWidth > element.clientWidth + 1 ||
        element.scrollHeight > element.clientHeight + heightTolerance
      ) {
        element.setAttribute('data-fit-overflow', 'true');
      } else {
        element.removeAttribute('data-fit-overflow');
      }
    }
  }

  function apply(payload) {
    payload = payload || {};
    var root = document.documentElement.style;
    var brand = payload.brand || {};
    var text = payload.text || {};
    var styles = payload.textStyles || {};
    var images = payload.img || {};
    if (brand.background) root.setProperty('--paper', brand.background);
    if (brand.surface) root.setProperty('--paper', brand.surface);
    if (brand.text) root.setProperty('--ink', brand.text);
    if (brand.muted) root.setProperty('--muted', brand.muted);
    if (brand.primary) root.setProperty('--primary', brand.primary);
    if (brand.accent) root.setProperty('--accent', brand.accent);
    if (brand.fontDisplay) root.setProperty('--font-display', brand.fontDisplay);
    if (brand.fontBody) root.setProperty('--font-body', brand.fontBody);
    if (brand.fontCondensed) root.setProperty('--font-mono', brand.fontCondensed);

    var keys = {};
    Object.keys(text).forEach(function (key) { keys[key] = true; });
    Object.keys(styles).forEach(function (key) { keys[key] = true; });
    Object.keys(keys).forEach(function (key) {
      var list = nodes(key, 'data-field');
      for (var i = 0; i < list.length; i++) {
        if (typeof text[key] === 'string') setText(list[i], text[key]);
        var style = styles[key] || {};
        if (style.color) list[i].style.color = style.color;
        if (style.fontSize != null) {
          list[i].style.fontSize = typeof style.fontSize === 'number' ? style.fontSize + 'px' : style.fontSize;
          if (list[i].hasAttribute('data-fit')) {
            list[i].dataset.fitCeiling = String(parseFloat(String(style.fontSize)) || 0);
          }
        }
        if (style.fontWeight != null) list[i].style.fontWeight = String(style.fontWeight);
        if (style.fontStyle) list[i].style.fontStyle = style.fontStyle;
        if (style.fontFamily) list[i].style.fontFamily = style.fontFamily;
        if (style.textDecoration) list[i].style.textDecoration = style.textDecoration;
        if (style.textAlign) list[i].style.textAlign = style.textAlign;
        if (style.lineHeight != null) list[i].style.lineHeight = String(style.lineHeight);
        if (style.backgroundColor) list[i].style.backgroundColor = style.backgroundColor;
        if (Object.prototype.hasOwnProperty.call(style, 'hidden')) {
          list[i].style.display = style.hidden ? 'none' : '';
        }
      }
    });

    Object.keys(images).forEach(function (key) {
      var list = nodes(key, 'data-imgslot');
      for (var i = 0; i < list.length; i++) {
        if (typeof images[key] !== 'string') continue;
        var safe = images[key].replace(/["'()\s]/g, '');
        list[i].setAttribute('data-img', safe);
        if (safe) {
          list[i].style.backgroundImage = 'url("' + safe + '")';
          list[i].style.backgroundSize = 'cover';
          list[i].style.backgroundPosition = 'center';
          list[i].classList.add('has-img');
          list[i].setAttribute('data-has-image', 'true');
        } else {
          list[i].style.backgroundImage = '';
          list[i].classList.remove('has-img');
          list[i].removeAttribute('data-has-image');
        }
      }
    });
    setTimeout(fitAll, 0);
  }

  function armEdit() {
    document.documentElement.classList.add('is-editing');
    document.documentElement.classList.remove('is-frozen');
    /* Click reporting removed 2026-08-25: the baked-in loop here bound a CAPTURE listener to every [data-field] AND to [data-imgslot], so on a board whose whole scene is the image slot the OUTERMOST element won every click — clicking the clock, the headline or the church name all jumped the panel to Hero - Image. It also fired alongside the shim's own reporter, so correctly-targeted boards posted twice. EDUCMS-SHIM-V11+ reports clicks for every board and resolves the innermost editable element, so this is now duplicate-and-wrong. The is-editing class handling above is kept. */
  }

  addEventListener('resize', orient);
  apply({
    brand: queryJson('brand'),
    text: queryJson('text'),
    textStyles: queryJson('textStyles'),
    img: queryJson('img')
  });
  orient();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fitAll(); });
  }
  if (new URLSearchParams(location.search).get('freeze') === '1') {
    document.documentElement.classList.add('is-frozen');
  }
  addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'educms-overrides') apply(data);
    if (data.type === 'educms-edit-mode' && data.on) armEdit();
    if (data.type === 'educms-freeze') document.documentElement.classList.add('is-frozen');
    if (data.type === 'educms-unfreeze') document.documentElement.classList.remove('is-frozen');
  });
  try { parent.postMessage({ type: 'educms-ready' }, '*'); } catch (_) {}
}());

</script>
