* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #080908;
  -webkit-font-smoothing: antialiased;
}
body { font-family: 'Manrope', sans-serif; }
#scene-wrap {
  --scene-scale: 1;
  position: absolute;
  left: 50%;
  top: 50%;
  overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--scene-scale));
  transform-origin: center center;
}
.scene {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}
.scene::after {
  content: "";
  position: absolute;
  top:0;right:0;bottom:0;left:0;
  z-index: 90;
  pointer-events: none;
  opacity: .055;
  mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}
[data-field], [data-imgslot] { max-width: 100%; }
[data-fit], .clip { overflow: visible; }
.bounded { overflow: hidden; }
.mono { font-family: 'DM Mono', monospace; }
.serif { font-family: 'Instrument Serif', serif; }
.is-editing [data-field], .is-editing [data-imgslot] { cursor: pointer; }
.is-editing [data-field]:hover,
.is-editing [data-imgslot]:hover {
  outline: 4px solid rgba(255,255,255,.9);
  outline-offset: -4px;
}
.is-frozen *,
.is-frozen *::before,
.is-frozen *::after {
  animation-play-state: paused !important;
  transition: none !important;
}
.is-portrait .scene {
  width: 1080px;
  height: 1920px;
}

    }

      content:""; position:absolute; top:0;right:0;bottom:0;left:0;

      letter-spacing:-2px;

    .eyebrow {

      color:var(--accent); text-transform:uppercase;
    }
    .title {
      width:740px; height:310px; margin-top:12px;
      font:600 178px/.82 var(--font-display); letter-spacing:-7px;
      text-transform:uppercase;
    }
    .thesis {
      width:680px; min-height:140px; margin-top:18px;
      font:500 58px/1.15 var(--font-body); color:#d5c7b2;
    }
    .board {
      position:absolute; left:938px; top:118px; width:900px; height:846px; z-index:8;
      display:flex; flex-direction:column; gap:4px;
    }

      position:relative; height:166px; flex:0 0 166px;

      padding:16px 30px 24px;
      background:

      box-shadow:0 16px 28px rgba(0,0,0,.24);
      transform-origin:center;
      overflow:hidden;

    .hymn:nth-child(2) { transform:rotate(-.35deg); }

      content:""; position:absolute; left:0; right:0; bottom:0; height:14px;
      background:linear-gradient(#c6a76b,#8e6c35 45%,#5d411e 50%,#a37c3e 62%,#d0b375);
      box-shadow:0 -2px 0 rgba(59,39,18,.52);

    if (!element.children.length) {
      element.textContent = value;
      return;
    }
    var textNode = null;
    for (var i = 0; i < element.childNodes.length; i++) {
      if (element.childNodes[i].nodeType === 3) {
        textNode = element.childNodes[i];
        break;
      }
    }
    if (textNode) textNode.textContent = value;
    else element.insertBefore(document.createTextNode(value), element.firstChild);
  }

  function fitAll() {
    var all = document.querySelectorAll('[data-fit]');
    for (var i = 0; i < all.length; i++) {
      var element = all[i];
      var minimum = Math.max(52, Number(element.getAttribute('data-fit-min') || 52));
      var configuredMaximum = Number(element.getAttribute('data-fit-max') || 190);
      var customMaximum = Number(element.dataset.fitCeiling || 0);
      var heightTolerance = Math.max(
        0,
        Number(element.getAttribute('data-fit-height-tolerance') || 10)
      );
      if (typeof element.__educmsOriginalFontSize === 'undefined') {
        element.__educmsOriginalFontSize = element.style.fontSize || '';
      }
      if (!customMaximum) element.style.fontSize = element.__educmsOriginalFontSize;
      var cssMaximum = parseFloat(getComputedStyle(element).fontSize) || configuredMaximum;
      var maximum = Math.max(minimum, customMaximum || Math.min(configuredMaximum, cssMaximum));
      var low = Math.ceil(minimum);
      var high = Math.floor(maximum);
      var best = low;

      element.style.fontSize = maximum + 'px';
      if (
        element.scrollWidth <= element.clientWidth + 1 &&
        element.scrollHeight <= element.clientHeight + heightTolerance
      ) {
        best = maximum;
      } else {
        while (low <= high) {
          var middle = Math.floor((low + high) / 2);
          element.style.fontSize = middle + 'px';
          if (
            element.scrollWidth > element.clientWidth + 1 ||
            element.scrollHeight > element.clientHeight + heightTolerance
          ) {
            high = middle - 1;
          } else {
            best = middle;
            low = middle + 1;
          }
        }
        element.style.fontSize = best + 'px';
      }

      element.setAttribute('data-fit-size', String(Math.round(best)));
      if (
        element.scrollWidth > element.clientWidth + 1 ||
        element.scrollHeight > element.clientHeight + heightTolerance
      ) {
        element.setAttribute('data-fit-overflow', 'true');
      } else {
        element.removeAttribute('data-fit-overflow');
      }
    }
  }

  function apply(payload) {
    payload = payload || {};
    var root = document.documentElement.style;
    var brand = payload.brand || {};
    var text = payload.text || {};
    var styles = payload.textStyles || {};
    var images = payload.img || {};
    if (brand.background) root.setProperty('--paper', brand.background);
    if (brand.surface) root.setProperty('--paper', brand.surface);
    if (brand.text) root.setProperty('--ink', brand.text);
    if (brand.muted) root.setProperty('--muted', brand.muted);
    if (brand.primary) root.setProperty('--primary', brand.primary);
    if (brand.accent) root.setProperty('--accent', brand.accent);
    if (brand.fontDisplay) root.setProperty('--font-display', brand.fontDisplay);
    if (brand.fontBody) root.setProperty('--font-body', brand.fontBody);
    if (brand.fontCondensed) root.setProperty('--font-mono', brand.fontCondensed);

    var keys = {};
    Object.keys(text).forEach(function (key) { keys[key] = true; });
    Object.keys(styles).forEach(function (key) { keys[key] = true; });
    Object.keys(keys).forEach(function (key) {
      var list = nodes(key, 'data-field');
      for (var i = 0; i < list.length; i++) {
        if (typeof text[key] === 'string') setText(list[i], text[key]);
        var style = styles[key] || {};
        if (style.color) list[i].style.color = style.color;
        if (style.fontSize != null) {
          list[i].style.fontSize = typeof style.fontSize === 'number' ? style.fontSize + 'px' : style.fontSize;
          if (list[i].hasAttribute('data-fit')) {
            list[i].dataset.fitCeiling = String(parseFloat(String(style.fontSize)) || 0);
          }
        }
        if (style.fontWeight != null) list[i].style.fontWeight = String(style.fontWeight);
        if (style.fontStyle) list[i].style.fontStyle = style.fontStyle;
        if (style.fontFamily) list[i].style.fontFamily = style.fontFamily;
        if (style.textDecoration) list[i].style.textDecoration = style.textDecoration;
        if (style.textAlign) list[i].style.textAlign = style.textAlign;
        if (style.lineHeight != null) list[i].style.lineHeight = String(style.lineHeight);
        if (style.backgroundColor) list[i].style.backgroundColor = style.backgroundColor;
        if (Object.prototype.hasOwnProperty.call(style, 'hidden')) {
          list[i].style.display = style.hidden ? 'none' : '';
        }
      }
    });

    Object.keys(images).forEach(function (key) {
      var list = nodes(key, 'data-imgslot');
      for (var i = 0; i < list.length; i++) {
        if (typeof images[key] !== 'string') continue;
        var safe = images[key].replace(/["'()\s]/g, '');
        list[i].setAttribute('data-img', safe);
        if (safe) {
          list[i].style.backgroundImage = 'url("' + safe + '")';
          list[i].style.backgroundSize = 'cover';
          list[i].style.backgroundPosition = 'center';
          list[i].classList.add('has-img');
          list[i].setAttribute('data-has-image', 'true');
        } else {
          list[i].style.backgroundImage = '';
          list[i].classList.remove('has-img');
          list[i].removeAttribute('data-has-image');
        }
      }
    });
    setTimeout(fitAll, 0);
  }

  function armEdit() {
    document.documentElement.classList.add('is-editing');
    document.documentElement.classList.remove('is-frozen');
    var all = document.querySelectorAll('[data-field],[data-imgslot]');
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset.armed) continue;
      all[i].dataset.armed = '1';
      all[i].addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        parent.postMessage({
          type: 'educms-field-click',
          key: this.getAttribute('data-field') || this.getAttribute('data-imgslot'),
          kind: this.hasAttribute('data-field') ? 'text' : 'img'
        }, '*');
      }, true);
    }
  }

  addEventListener('resize', orient);
  apply({
    brand: queryJson('brand'),
    text: queryJson('text'),
    textStyles: queryJson('textStyles'),
    img: queryJson('img')
  });
  orient();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fitAll(); });
  }
  if (new URLSearchParams(location.search).get('freeze') === '1') {
    document.documentElement.classList.add('is-frozen');
  }
  addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'educms-overrides') apply(data);
    if (data.type === 'educms-edit-mode' && data.on) armEdit();
    if (data.type === 'educms-freeze') document.documentElement.classList.add('is-frozen');
    if (data.type === 'educms-unfreeze') document.documentElement.classList.remove('is-frozen');
  });
  try { parent.postMessage({ type: 'educms-ready' }, '*'); } catch (_) {}
}());

</script>
</body>
</html>
