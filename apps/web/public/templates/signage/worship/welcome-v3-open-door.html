<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Church Arrival 04 — Open Door</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo+Black&display=swap');

* { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: #090a09; -webkit-font-smoothing: antialiased;
}
body { font-family: 'Instrument Sans', sans-serif; }
#scene-wrap {
  --scene-scale: 1;
  position: absolute; left: 50%; top: 50%; overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--scene-scale));
  transform-origin: center center;
}
.scene { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.scene::after {
  content: ""; position: absolute; top:0;right:0;bottom:0;left:0; z-index: 50; pointer-events: none;
  opacity: .08; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
}
[data-field], [data-imgslot] { max-width: 100%; }
/*
 * Text is never its own clipping mask. The previous shared rule hid glyphs
 * whenever a fixed line box was a few pixels too short. Structural panels
 * still contain their contents; editable text remains visible and is sized
 * against deliberately generous boxes in each concept.
 */
.clip, [data-fit] { overflow: visible; }
.route, .service-card { overflow: hidden; }
.mono { font-family: 'DM Mono', monospace; }
.serif { font-family: 'Newsreader', serif; }
.is-editing [data-field], .is-editing [data-imgslot] { cursor: pointer; }
.is-editing [data-field]:hover, .is-editing [data-imgslot]:hover {
  outline: 4px solid rgba(255,255,255,.88); outline-offset: -4px;
}
.is-frozen *, .is-frozen *::before, .is-frozen *::after {
  animation-play-state: paused !important; transition: none !important;
}
.is-portrait .scene { width: 1080px; height: 1920px; }

</style>
  <style>
    :root {
      --paper:#f2eee6;
      --ink:#111813;
      --blue:#23463a;
      --orange:#c66b4e;
      --gold:#d3b574;
      --muted:#78827b;
      --white:#fcfaf6;
      --font-display:'Instrument Sans',sans-serif;
      --font-body:'Instrument Sans',sans-serif;
      --font-mono:'DM Mono',monospace;
    }

    .scene { background:var(--paper); color:var(--ink); }

    .photo {
      position:absolute; left:0; top:132px; width:1180px; height:678px; z-index:1;
      background-image:url('assets/church-arrival-open-door-v1.png');
      background-size:cover; background-position:48% center;
    }
    .photo::after {
      content:""; position:absolute; top:0;right:0;bottom:0;left:0;
      background:
        linear-gradient(90deg,transparent 0 72%,var(--paper) 100%),
        linear-gradient(0deg,rgba(17,24,19,.18),transparent 30%);
      pointer-events:none;
    }

    .hero-field {
      position:absolute; right:0; top:132px; width:840px; height:678px; z-index:2;
      background:var(--paper);
    }
    .hero-field::before {
      content:""; position:absolute; left:-100px; top:0; width:100px; height:100%;
      background:linear-gradient(90deg,transparent,var(--paper));
    }

    .top {
      position:absolute; left:0; top:0; width:1920px; height:132px; z-index:20;
      display:flex; align-items:center; padding:24px 66px;
      background:var(--paper); border-bottom:3px solid var(--ink);
    }
    .identity { display:flex; align-items:center; min-width:900px; }
    .logo-slot {
      position:relative; width:78px; height:78px; flex:0 0 78px;
      border-radius:39px 39px 6px 6px; background:var(--blue);
      background-position:center; background-repeat:no-repeat;
    }
    .logo-slot::after {
      content:"H"; position:absolute; top:0;right:0;bottom:0;left:0; display:grid; place-items:center;
      color:var(--white); font:700 52px/1 var(--font-display);
    }
    .logo-slot.has-img {
      background-color:transparent;
      background-size:contain !important;
    }
    .logo-slot.has-img::after { display:none; }
    .brand { margin-left:24px; min-height:64px; font:700 52px/1.12 var(--font-display); letter-spacing:-2px; }
    .location { margin-left:28px; min-height:64px; font:500 52px/1.12 var(--font-mono); color:var(--muted); }
    .meta { margin-left:auto; display:flex; align-items:center; gap:34px; }
    .meta span { min-height:64px; font:500 52px/1.12 var(--font-mono); white-space:nowrap; }

    .hero {
      position:absolute; left:1160px; top:186px; width:690px; height:346px; z-index:8;
    }
    .kicker {
      min-height:64px; font:500 52px/1.12 var(--font-mono);
      color:var(--orange); text-transform:uppercase; letter-spacing:1px;
    }
    h1 {
      width:680px; height:252px; margin:20px 0 0;
      color:var(--ink); letter-spacing:-6px;
    }
    h1 span { display:block; white-space:nowrap; }
    h1 span:first-child { min-height:112px; font:700 112px/1 var(--font-display); }
    h1 span:last-child { min-height:132px; font:500 italic 138px/.94 'Newsreader',serif; color:var(--orange); }

    .service {
      position:absolute; left:1280px; top:530px; width:540px; height:280px; z-index:12;
      padding:38px 48px 16px; text-align:center; color:var(--white);
      background:var(--blue); border-radius:270px 270px 0 0;
    }
    .service-label {
      min-height:58px; font:500 52px/1.08 var(--font-mono);
      text-transform:uppercase; color:var(--gold); white-space:nowrap;
    }
    .service-time {
      min-height:104px; margin-top:4px; font:700 104px/1 var(--font-display);
      letter-spacing:-5px; white-space:nowrap;
    }
    .service-detail {
      min-height:58px; font:600 52px/1.08 var(--font-body);
      color:var(--white); opacity:.74; white-space:nowrap;
    }

    .rail {
      position:absolute; left:0; top:810px; width:1920px; height:270px; z-index:15;
      display:grid; grid-template-columns:repeat(4,480px);
      background:var(--ink); color:var(--white); border-top:3px solid var(--ink);
    }
    .route {
      position:relative; padding:28px 26px; border-right:1px solid var(--muted);
    }
    .route:last-child { border-right:0; }
    .route-arrow {
      position:absolute; left:22px; top:50px; width:112px; min-height:100px;
      font:400 96px/1 Arial,'Segoe UI Symbol',sans-serif; color:var(--orange); text-align:center;
    }
    .route-copy { position:absolute; left:140px; top:16px; width:312px; }
    .route-label {
      height:70px; font:700 58px/1.06 var(--font-display);
      letter-spacing:-2px;
    }
    .route-detail {
      height:166px; margin-top:6px; overflow:hidden;
      font:500 52px/1.06 var(--font-body); letter-spacing:-1px;
      color:var(--white); opacity:.62;
    }

    .is-portrait .top {
      left:0; top:0; width:1080px; height:130px; padding:22px 54px;
    }
    .is-portrait .identity { min-width:0; }
    .is-portrait .logo-slot { width:76px; height:76px; flex-basis:76px; }
    .is-portrait .location { display:none; }
    .is-portrait .meta span:first-child { display:none; }

    .is-portrait .hero-field {
      left:0; right:auto; top:130px; width:1080px; height:460px;
    }
    .is-portrait .hero-field::before { display:none; }
    .is-portrait .hero { left:54px; top:180px; width:972px; height:360px; }
    .is-portrait h1 { width:950px; height:270px; margin-top:18px; }
    .is-portrait h1 span:first-child { min-height:116px; font-size:116px; }
    .is-portrait h1 span:last-child { min-height:142px; font-size:146px; }

    .is-portrait .photo {
      left:0; top:590px; width:1080px; height:540px;
      background-position:45% center;
    }
    .is-portrait .photo::after {
      background:linear-gradient(0deg,rgba(17,24,19,.28),transparent 40%);
    }

    .is-portrait .service {
      left:120px; top:1010px; width:840px; height:330px;
      padding:52px 64px 24px; border-radius:420px 420px 0 0;
    }
    .is-portrait .service-label { min-height:62px; }
    .is-portrait .service-time { min-height:118px; margin-top:8px; font-size:112px; }
    .is-portrait .service-detail { min-height:62px; margin-top:4px; }

    .is-portrait .rail {
      top:1340px; width:1080px; height:580px;
      grid-template-columns:540px 540px; grid-template-rows:290px 290px;
    }
    .is-portrait .route { padding:28px; border-bottom:1px solid var(--muted); }
    .is-portrait .route:nth-child(2) { border-right:0; }
    .is-portrait .route:nth-child(3),
    .is-portrait .route:nth-child(4) { border-bottom:0; }
    .is-portrait .route-arrow { left:20px; top:70px; width:120px; font-size:100px; }
    .is-portrait .route-copy { left:140px; top:30px; width:366px; }
    .is-portrait .route-label { height:116px; font-size:56px; }
    .is-portrait .route-detail { height:112px; margin-top:8px; }
  </style>
</head>
<body>
  <div id="scene-wrap">
    <main class="scene">
      <div class="photo" data-imgslot="hero.image" aria-label="Replaceable community arrival photograph"></div>
      <div class="hero-field"></div>

      <header class="top">
        <div class="identity">
          <div class="logo-slot" data-imgslot="brand.logo" aria-label="Replaceable church logo"></div>
          <div class="brand clip" data-field="brand.name">HAVEN CHURCH</div>
          <div class="location clip" data-field="brand.location">RIVER CAMPUS</div>
        </div>
        <div class="meta">
          <span data-field="meta.day">SUNDAY · JUL 26</span>
          <span data-field="meta.time">9:42 AM</span>
        </div>
      </header>

      <section class="hero">
        <div class="kicker clip" data-field="hero.kicker">Sunday at Haven</div>
        <h1>
          <span data-field="hero.line1" data-fit data-fit-min="104" data-fit-max="116">We’re glad</span>
          <span data-field="hero.line2" data-fit data-fit-min="116" data-fit-max="146">you’re here.</span>
        </h1>
      </section>

      <section class="service">
        <div class="service-label clip" data-field="service.label">Next gathering</div>
        <div class="service-time clip" data-field="service.time" data-fit data-fit-min="96" data-fit-max="112">10:30 AM</div>
        <div class="service-detail clip" data-field="service.detail">Doors are open</div>
      </section>

      <footer class="rail">
        <section class="route">
          <div class="route-arrow" data-field="way.worship.arrow">↑</div>
          <div class="route-copy">
            <div class="route-label" data-field="way.worship.label" data-fit data-fit-min="52" data-fit-max="58">Worship</div>
            <div class="route-detail" data-field="way.worship.detail">Main auditorium</div>
          </div>
        </section>
        <section class="route">
          <div class="route-arrow" data-field="way.kids.arrow">→</div>
          <div class="route-copy">
            <div class="route-label" data-field="way.kids.label" data-fit data-fit-min="52" data-fit-max="58">Kids check-in</div>
            <div class="route-detail" data-field="way.kids.detail">East lobby</div>
          </div>
        </section>
        <section class="route">
          <div class="route-arrow" data-field="way.guest.arrow">←</div>
          <div class="route-copy">
            <div class="route-label" data-field="way.guest.label" data-fit data-fit-min="52" data-fit-max="58">New here?</div>
            <div class="route-detail" data-field="way.guest.detail">Welcome desk</div>
          </div>
        </section>
        <section class="route">
          <div class="route-arrow" data-field="way.access.arrow">↗</div>
          <div class="route-copy">
            <div class="route-label" data-field="way.access.label" data-fit data-fit-min="52" data-fit-max="58">Accessible</div>
            <div class="route-detail" data-field="way.access.detail">North entrance</div>
          </div>
        </section>
      </footer>
    </main>
  </div>
  <script>
(function () {
  'use strict';
  var wrap = document.getElementById('scene-wrap');
  var scene = wrap && wrap.querySelector('.scene');

  function orient() {
    var forcedOrientation = new URLSearchParams(location.search).get('orientation');
    var portrait = forcedOrientation === 'portrait' ||
      (forcedOrientation !== 'landscape' && innerHeight > innerWidth);
    var width = portrait ? 1080 : 1920;
    var height = portrait ? 1920 : 1080;
    document.documentElement.classList.toggle('is-portrait', portrait);
    wrap.style.width = width + 'px';
    wrap.style.height = height + 'px';
    scene.style.width = width + 'px';
    scene.style.height = height + 'px';
    wrap.style.setProperty('--scene-scale', Math.min(innerWidth / width, innerHeight / height));
    setTimeout(fitAll, 0);
  }

  function queryJson(name) {
    var value = new URLSearchParams(location.search).get(name);
    if (!value) return {};
    try {
      var base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      var binary = atob(base64);
      var encoded = '';
      for (var i = 0; i < binary.length; i++) {
        encoded += '%' + ('00' + binary.charCodeAt(i).toString(16)).slice(-2);
      }
      return JSON.parse(decodeURIComponent(encoded));
    } catch (_) {}
    try { return JSON.parse(value); } catch (_) {}
    try { return JSON.parse(decodeURIComponent(value)); } catch (_) {}
    return {};
  }

  function nodes(key, attribute) {
    var all = document.querySelectorAll('[' + attribute + ']');
    var found = [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute(attribute) === key) found.push(all[i]);
    }
    return found;
  }

  function setText(element, value) {
    if (value.indexOf('&') !== -1) {
      var decoder = document.createElement('textarea');
      decoder.innerHTML = value;
      value = decoder.value;
    }
    if (!element.children.length) {
      element.textContent = value;
      return;
    }
    var textNode = null;
    for (var i = 0; i < element.childNodes.length; i++) {
      if (element.childNodes[i].nodeType === 3) {
        textNode = element.childNodes[i];
        break;
      }
    }
    if (textNode) textNode.textContent = value;
    else element.insertBefore(document.createTextNode(value), element.firstChild);
  }

  function fitAll() {
    var all = document.querySelectorAll('[data-fit]');
    for (var i = 0; i < all.length; i++) {
      var element = all[i];
      var customMaximum = Number(element.dataset.fitCeiling || 0);
      var minimum = Math.max(52, Number(element.getAttribute('data-fit-min') || 52));
      var configuredMaximum = Number(element.getAttribute('data-fit-max') || 190);
      if (!customMaximum) element.style.removeProperty('font-size');
      var cssMaximum = parseFloat(getComputedStyle(element).fontSize) || configuredMaximum;
      var maximum = Math.max(minimum, customMaximum || Math.min(configuredMaximum, cssMaximum));
      var size = maximum;
      element.style.fontSize = size + 'px';
      while (
        size > minimum &&
        (
          element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + Math.max(6, size * .22)
        )
      ) {
        size = Math.max(minimum, size - 4);
        element.style.fontSize = size + 'px';
      }
    }
  }

  function apply(payload) {
    payload = payload || {};
    var root = document.documentElement.style;
    var brand = payload.brand || {};
    var text = payload.text || {};
    var styles = payload.textStyles || {};
    var images = payload.img || {};
    if (brand.background) root.setProperty('--paper', brand.background);
    if (brand.surface) root.setProperty('--paper', brand.surface);
    if (brand.text) root.setProperty('--ink', brand.text);
    if (brand.muted) root.setProperty('--muted', brand.muted);
    if (brand.primary) root.setProperty('--blue', brand.primary);
    if (brand.accent) root.setProperty('--orange', brand.accent);
    if (brand.fontDisplay) root.setProperty('--font-display', brand.fontDisplay);
    if (brand.fontBody) root.setProperty('--font-body', brand.fontBody);
    if (brand.fontCondensed) root.setProperty('--font-mono', brand.fontCondensed);
    var keys = {};
    Object.keys(text).forEach(function (key) { keys[key] = true; });
    Object.keys(styles).forEach(function (key) { keys[key] = true; });
    Object.keys(keys).forEach(function (key) {
      var list = nodes(key, 'data-field');
      for (var i = 0; i < list.length; i++) {
        if (typeof text[key] === 'string') setText(list[i], text[key]);
        var style = styles[key] || {};
        if (style.color) list[i].style.color = style.color;
        if (style.fontSize != null) {
          list[i].style.fontSize = typeof style.fontSize === 'number' ? style.fontSize + 'px' : style.fontSize;
          if (list[i].hasAttribute('data-fit')) {
            list[i].dataset.fitCeiling = String(parseFloat(String(style.fontSize)) || 0);
          }
        }
        if (style.fontWeight != null) list[i].style.fontWeight = String(style.fontWeight);
        if (style.fontStyle) list[i].style.fontStyle = style.fontStyle;
        if (style.fontFamily) list[i].style.fontFamily = style.fontFamily;
        if (style.textDecoration) list[i].style.textDecoration = style.textDecoration;
        if (style.textAlign) list[i].style.textAlign = style.textAlign;
        if (style.lineHeight != null) list[i].style.lineHeight = String(style.lineHeight);
        if (style.backgroundColor) list[i].style.backgroundColor = style.backgroundColor;
        if (Object.prototype.hasOwnProperty.call(style, 'hidden')) {
          list[i].style.display = style.hidden ? 'none' : '';
        }
      }
    });
    Object.keys(images).forEach(function (key) {
      var list = nodes(key, 'data-imgslot');
      for (var i = 0; i < list.length; i++) {
        if (typeof images[key] !== 'string') continue;
        var safe = images[key].replace(/["'()\s]/g, '');
        list[i].setAttribute('data-img', safe);
        if (safe) {
          list[i].style.backgroundImage = 'url("' + safe + '")';
          list[i].style.backgroundSize = 'cover';
          list[i].style.backgroundPosition = 'center';
          list[i].classList.add('has-img');
          list[i].setAttribute('data-has-image', 'true');
        } else {
          list[i].style.backgroundImage = '';
          list[i].classList.remove('has-img');
          list[i].removeAttribute('data-has-image');
        }
      }
    });
    setTimeout(fitAll, 0);
  }

  function armEdit() {
    document.documentElement.classList.add('is-editing');
    document.documentElement.classList.remove('is-frozen');
    var all = document.querySelectorAll('[data-field],[data-imgslot]');
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset.armed) continue;
      all[i].dataset.armed = '1';
      all[i].addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        parent.postMessage({
          type: 'educms-field-click',
          key: this.getAttribute('data-field') || this.getAttribute('data-imgslot'),
          kind: this.hasAttribute('data-field') ? 'text' : 'img'
        }, '*');
      }, true);
    }
  }

  addEventListener('resize', orient);
  apply({
    brand: queryJson('brand'),
    text: queryJson('text'),
    textStyles: queryJson('textStyles'),
    img: queryJson('img')
  });
  orient();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      fitAll();
    });
  }
  if (new URLSearchParams(location.search).get('freeze') === '1') {
    document.documentElement.classList.add('is-frozen');
  }
  addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'educms-overrides') apply(data);
    if (data.type === 'educms-edit-mode' && data.on) armEdit();
    if (data.type === 'educms-freeze') document.documentElement.classList.add('is-frozen');
    if (data.type === 'educms-unfreeze') document.documentElement.classList.remove('is-frozen');
  });
  try { parent.postMessage({ type: 'educms-ready' }, '*'); } catch (_) {}
}());

</script>
</body>
</html>
