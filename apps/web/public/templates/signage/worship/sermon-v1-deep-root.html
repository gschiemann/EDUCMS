<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Church Sermon Series 01 — Deep Root</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap');

* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #080908;
  -webkit-font-smoothing: antialiased;
}
body { font-family: 'Manrope', sans-serif; }
#scene-wrap {
  --scene-scale: 1;
  position: absolute;
  left: 50%;
  top: 50%;
  overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--scene-scale));
  transform-origin: center center;
}
.scene {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}
.scene::after {
  content: "";
  position: absolute;
  top:0;right:0;bottom:0;left:0;
  z-index: 90;
  pointer-events: none;
  opacity: .055;
  mix-blend-mode: soft-light;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
}
[data-field], [data-imgslot] { max-width: 100%; }
[data-fit], .clip { overflow: visible; }
.bounded { overflow: hidden; }
.mono { font-family: 'DM Mono', monospace; }
.serif { font-family: 'Instrument Serif', serif; }
.is-editing [data-field], .is-editing [data-imgslot] { cursor: pointer; }
.is-editing [data-field]:hover,
.is-editing [data-imgslot]:hover {
  outline: 4px solid rgba(255,255,255,.9);
  outline-offset: -4px;
}
.is-frozen *,
.is-frozen *::before,
.is-frozen *::after {
  animation-play-state: paused !important;
  transition: none !important;
}
.is-portrait .scene {
  width: 1080px;
  height: 1920px;
}

</style>
  <style>
    :root {
      --paper:#ece5d7;
      --ink:#101612;
      --primary:#263d31;
      --accent:#ce7b4a;
      --muted:#9caa9d;
      --font-display:'Manrope',sans-serif;
      --font-body:'Manrope',sans-serif;
      --font-mono:'DM Mono',monospace;
    }
    .scene { background:#0c110e; color:var(--paper); }
    .art {
      position:absolute; top:0;right:0;bottom:0;left:0; z-index:1;
      background:url('assets/church-sermon-deep-root-v1.png') center/cover no-repeat;
    }
    .art::after {
      content:""; position:absolute; top:0;right:0;bottom:0;left:0; pointer-events:none;
      background:
        linear-gradient(90deg,rgba(7,12,9,.97) 0%,rgba(7,12,9,.87) 32%,rgba(7,12,9,.28) 61%,rgba(7,12,9,.06) 100%),
        linear-gradient(0deg,rgba(7,12,9,.9) 0%,transparent 36%);
    }
    .top {
      position:absolute; left:68px; right:68px; top:42px; height:88px; z-index:10;
      display:flex; align-items:center;
    }
    .identity { display:flex; align-items:center; min-width:760px; }
    .logo {
      position:relative; width:76px; height:76px; flex:0 0 76px;
      background:var(--accent); border-radius:50%; background-position:center; background-repeat:no-repeat;
    }
    .logo::after {
      content:"H"; position:absolute; top:0;right:0;bottom:0;left:0; display:grid; place-items:center;
      color:#111713; font:800 52px/1 var(--font-display);
    }
    .logo.has-img { background-color:transparent; background-size:contain !important; }
    .logo.has-img::after { display:none; }
    .brand {
      margin-left:22px; min-height:62px;
      font:800 52px/1.12 var(--font-display); letter-spacing:-2px;
    }
    .series-progress {
      margin-left:auto; min-height:62px;
      font:500 52px/1.12 var(--font-mono); color:var(--paper); text-transform:uppercase;
    }
    .hero {
      position:absolute; left:80px; top:174px; width:1040px; height:570px; z-index:8;
    }
    .eyebrow {
      width:920px; min-height:64px;
      font:500 52px/1.16 var(--font-mono); color:var(--accent); text-transform:uppercase;
    }
    .series-title {
      width:1040px; height:236px; margin-top:12px;
      font:800 246px/.94 var(--font-display); letter-spacing:-15px; text-transform:uppercase;
    }
    .series-subtitle {
      width:920px; min-height:82px; margin-top:14px;
      font:600 68px/1.12 'Source Serif 4',serif; color:var(--paper);
    }
    .series-thesis {
      width:900px; min-height:76px; margin-top:8px;
      font:500 italic 62px/1.14 'Instrument Serif',serif; color:var(--muted);
    }
    .deck {
      position:absolute; left:0; top:760px; width:1920px; height:320px; z-index:12;
      display:grid; grid-template-columns:720px 330px 380px 490px;
      background:rgba(7,12,9,.94); border-top:3px solid rgba(236,229,215,.45);
    }
    .module {
      position:relative; min-width:0; padding:24px 28px;
      border-right:1px solid rgba(236,229,215,.22); overflow:hidden;
    }
    .module:last-child { border-right:0; }
    .module-label {
      height:60px; font:500 52px/1.1 var(--font-mono);
      color:var(--accent); text-transform:uppercase;
    }
    .module-value {
      margin-top:10px; color:var(--paper); font:700 58px/1.08 var(--font-display);
    }
    .message .module-value {
      width:640px; height:164px; font-size:76px; letter-spacing:-3px;
    }
    .meta .module-value {
      width:100%; min-height:132px; font-size:58px; color:var(--paper);
      letter-spacing:-1.5px;
    }
    .service-line { min-height:64px !important; margin-top:4px; line-height:1.08; }

    .is-portrait .art {
      top:0;right:0;bottom:auto;left:0; width:1080px; height:1120px; background-position:66% center;
    }
    .is-portrait .art::after {
      background:
        linear-gradient(180deg,rgba(7,12,9,.7) 0%,rgba(7,12,9,.08) 35%,rgba(7,12,9,.55) 72%,rgba(7,12,9,.98) 100%),
        linear-gradient(90deg,rgba(7,12,9,.66),transparent 68%);
    }
    .is-portrait .top { left:54px; right:54px; top:42px; height:84px; }
    .is-portrait .identity { min-width:0; }
    .is-portrait .brand { max-width:540px; }
    .is-portrait .series-progress { font-size:52px; }
    .is-portrait .hero {
      left:54px; top:182px; width:972px; height:760px;
    }
    .is-portrait .eyebrow { width:900px; }
    .is-portrait .series-title {
      width:972px; height:230px; margin-top:22px;
      font-size:190px; letter-spacing:-12px;
    }
    .is-portrait .series-subtitle {
      width:920px; min-height:150px; margin-top:20px; font-size:72px;
    }
    .is-portrait .series-thesis {
      width:900px; min-height:148px; margin-top:16px; font-size:68px;
    }
    .is-portrait .deck {
      top:1060px; width:1080px; height:860px;
      grid-template-columns:360px 360px 360px;
      grid-template-rows:330px 530px;
      border-top-color:rgba(236,229,215,.72);
    }
    .is-portrait .module { padding:34px 24px; }
    .is-portrait .message {
      grid-column:1/4; border-right:0; border-bottom:1px solid rgba(236,229,215,.22);
      padding:38px 54px;
    }
    .is-portrait .message .module-value {
      width:972px; height:170px; font-size:92px;
    }
    .is-portrait .meta .module-label { height:124px; line-height:1.08; }
    .is-portrait .meta .module-value {
      min-height:270px; margin-top:18px; font-size:58px; line-height:1.14;
    }
    .is-portrait .service-line {
      min-height:64px !important; margin-top:8px; font-size:58px; line-height:1.08;
    }
  </style>
</head>
<body>
  <div id="scene-wrap">
    <main class="scene">
      <div class="art" data-imgslot="series.art" aria-label="Replaceable sermon series artwork"></div>
      <header class="top">
        <div class="identity">
          <div class="logo" data-imgslot="brand.logo" aria-label="Replaceable church logo"></div>
          <div class="brand" data-field="brand.name">HAVEN CHURCH</div>
        </div>
        <div class="series-progress" data-field="series.progress">WEEK 03 / 06</div>
      </header>
      <section class="hero">
        <div class="eyebrow" data-field="series.eyebrow">CURRENT SERIES</div>
        <div class="series-title" data-field="series.title" data-fit data-fit-min="148" data-fit-max="246">ROOTED</div>
        <div class="series-subtitle" data-field="series.subtitle" data-fit data-fit-min="60" data-fit-max="72">Formation in the Psalms</div>
        <div class="series-thesis" data-field="series.thesis">A life that holds.</div>
      </section>
      <footer class="deck">
        <section class="module message">
          <div class="module-label" data-field="message.eyebrow">THIS SUNDAY</div>
          <div class="module-value" data-field="message.title" data-fit data-fit-min="64" data-fit-max="92">Planted by streams.</div>
        </section>
        <section class="module meta">
          <div class="module-label" data-field="scripture.label">TEXT</div>
          <div class="module-value" data-field="scripture.reference" data-fit data-fit-min="52" data-fit-max="58">Psalm 1:1–6</div>
        </section>
        <section class="module meta">
          <div class="module-label" data-field="speaker.label">TEACHING</div>
          <div class="module-value" data-field="speaker.name" data-fit data-fit-min="52" data-fit-max="58">Mara Lin</div>
        </section>
        <section class="module meta">
          <div class="module-label" data-field="service.label">GATHERING</div>
          <div class="module-value service-line" data-field="service.time" data-fit data-fit-min="52" data-fit-max="58">10:30 AM</div>
          <div class="module-value service-line" data-field="service.location" data-fit data-fit-min="52" data-fit-max="58">Main Auditorium</div>
        </section>
      </footer>
    </main>
  </div>
  <script>
(function () {
  'use strict';
  var wrap = document.getElementById('scene-wrap');
  var scene = wrap && wrap.querySelector('.scene');

  function orient() {
    var forced = new URLSearchParams(location.search).get('orientation');
    var portrait = forced === 'portrait' || (forced !== 'landscape' && innerHeight > innerWidth);
    var width = portrait ? 1080 : 1920;
    var height = portrait ? 1920 : 1080;
    document.documentElement.classList.toggle('is-portrait', portrait);
    wrap.style.width = width + 'px';
    wrap.style.height = height + 'px';
    scene.style.width = width + 'px';
    scene.style.height = height + 'px';
    wrap.style.setProperty('--scene-scale', Math.min(innerWidth / width, innerHeight / height));
    setTimeout(fitAll, 0);
  }

  function queryJson(name) {
    var value = new URLSearchParams(location.search).get(name);
    if (!value) return {};
    try {
      var base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      var binary = atob(base64);
      var encoded = '';
      for (var i = 0; i < binary.length; i++) {
        encoded += '%' + ('00' + binary.charCodeAt(i).toString(16)).slice(-2);
      }
      return JSON.parse(decodeURIComponent(encoded));
    } catch (_) {}
    try { return JSON.parse(value); } catch (_) {}
    try { return JSON.parse(decodeURIComponent(value)); } catch (_) {}
    return {};
  }

  function nodes(key, attribute) {
    var all = document.querySelectorAll('[' + attribute + ']');
    var found = [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute(attribute) === key) found.push(all[i]);
    }
    return found;
  }

  function setText(element, value) {
    if (value.indexOf('&') !== -1) {
      var decoder = document.createElement('textarea');
      decoder.innerHTML = value;
      value = decoder.value;
    }
    if (!element.children.length) {
      element.textContent = value;
      return;
    }
    var textNode = null;
    for (var i = 0; i < element.childNodes.length; i++) {
      if (element.childNodes[i].nodeType === 3) {
        textNode = element.childNodes[i];
        break;
      }
    }
    if (textNode) textNode.textContent = value;
    else element.insertBefore(document.createTextNode(value), element.firstChild);
  }

  function fitAll() {
    var all = document.querySelectorAll('[data-fit]');
    for (var i = 0; i < all.length; i++) {
      var element = all[i];
      var minimum = Math.max(52, Number(element.getAttribute('data-fit-min') || 52));
      var configuredMaximum = Number(element.getAttribute('data-fit-max') || 190);
      var customMaximum = Number(element.dataset.fitCeiling || 0);
      var heightTolerance = Math.max(
        0,
        Number(element.getAttribute('data-fit-height-tolerance') || 10)
      );
      if (typeof element.__educmsOriginalFontSize === 'undefined') {
        element.__educmsOriginalFontSize = element.style.fontSize || '';
      }
      if (!customMaximum) element.style.fontSize = element.__educmsOriginalFontSize;
      var cssMaximum = parseFloat(getComputedStyle(element).fontSize) || configuredMaximum;
      var maximum = Math.max(minimum, customMaximum || Math.min(configuredMaximum, cssMaximum));
      var low = Math.ceil(minimum);
      var high = Math.floor(maximum);
      var best = low;

      element.style.fontSize = maximum + 'px';
      if (
        element.scrollWidth <= element.clientWidth + 1 &&
        element.scrollHeight <= element.clientHeight + heightTolerance
      ) {
        best = maximum;
      } else {
        while (low <= high) {
          var middle = Math.floor((low + high) / 2);
          element.style.fontSize = middle + 'px';
          if (
            element.scrollWidth > element.clientWidth + 1 ||
            element.scrollHeight > element.clientHeight + heightTolerance
          ) {
            high = middle - 1;
          } else {
            best = middle;
            low = middle + 1;
          }
        }
        element.style.fontSize = best + 'px';
      }

      element.setAttribute('data-fit-size', String(Math.round(best)));
      if (
        element.scrollWidth > element.clientWidth + 1 ||
        element.scrollHeight > element.clientHeight + heightTolerance
      ) {
        element.setAttribute('data-fit-overflow', 'true');
      } else {
        element.removeAttribute('data-fit-overflow');
      }
    }
  }

  function apply(payload) {
    payload = payload || {};
    var root = document.documentElement.style;
    var brand = payload.brand || {};
    var text = payload.text || {};
    var styles = payload.textStyles || {};
    var images = payload.img || {};
    if (brand.background) root.setProperty('--paper', brand.background);
    if (brand.surface) root.setProperty('--paper', brand.surface);
    if (brand.text) root.setProperty('--ink', brand.text);
    if (brand.muted) root.setProperty('--muted', brand.muted);
    if (brand.primary) root.setProperty('--primary', brand.primary);
    if (brand.accent) root.setProperty('--accent', brand.accent);
    if (brand.fontDisplay) root.setProperty('--font-display', brand.fontDisplay);
    if (brand.fontBody) root.setProperty('--font-body', brand.fontBody);
    if (brand.fontCondensed) root.setProperty('--font-mono', brand.fontCondensed);

    var keys = {};
    Object.keys(text).forEach(function (key) { keys[key] = true; });
    Object.keys(styles).forEach(function (key) { keys[key] = true; });
    Object.keys(keys).forEach(function (key) {
      var list = nodes(key, 'data-field');
      for (var i = 0; i < list.length; i++) {
        if (typeof text[key] === 'string') setText(list[i], text[key]);
        var style = styles[key] || {};
        if (style.color) list[i].style.color = style.color;
        if (style.fontSize != null) {
          list[i].style.fontSize = typeof style.fontSize === 'number' ? style.fontSize + 'px' : style.fontSize;
          if (list[i].hasAttribute('data-fit')) {
            list[i].dataset.fitCeiling = String(parseFloat(String(style.fontSize)) || 0);
          }
        }
        if (style.fontWeight != null) list[i].style.fontWeight = String(style.fontWeight);
        if (style.fontStyle) list[i].style.fontStyle = style.fontStyle;
        if (style.fontFamily) list[i].style.fontFamily = style.fontFamily;
        if (style.textDecoration) list[i].style.textDecoration = style.textDecoration;
        if (style.textAlign) list[i].style.textAlign = style.textAlign;
        if (style.lineHeight != null) list[i].style.lineHeight = String(style.lineHeight);
        if (style.backgroundColor) list[i].style.backgroundColor = style.backgroundColor;
        if (Object.prototype.hasOwnProperty.call(style, 'hidden')) {
          list[i].style.display = style.hidden ? 'none' : '';
        }
      }
    });

    Object.keys(images).forEach(function (key) {
      var list = nodes(key, 'data-imgslot');
      for (var i = 0; i < list.length; i++) {
        if (typeof images[key] !== 'string') continue;
        var safe = images[key].replace(/["'()\s]/g, '');
        list[i].setAttribute('data-img', safe);
        if (safe) {
          list[i].style.backgroundImage = 'url("' + safe + '")';
          list[i].style.backgroundSize = 'cover';
          list[i].style.backgroundPosition = 'center';
          list[i].classList.add('has-img');
          list[i].setAttribute('data-has-image', 'true');
        } else {
          list[i].style.backgroundImage = '';
          list[i].classList.remove('has-img');
          list[i].removeAttribute('data-has-image');
        }
      }
    });
    setTimeout(fitAll, 0);
  }

  function armEdit() {
    document.documentElement.classList.add('is-editing');
    document.documentElement.classList.remove('is-frozen');
    var all = document.querySelectorAll('[data-field],[data-imgslot]');
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset.armed) continue;
      all[i].dataset.armed = '1';
      all[i].addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        parent.postMessage({
          type: 'educms-field-click',
          key: this.getAttribute('data-field') || this.getAttribute('data-imgslot'),
          kind: this.hasAttribute('data-field') ? 'text' : 'img'
        }, '*');
      }, true);
    }
  }

  addEventListener('resize', orient);
  apply({
    brand: queryJson('brand'),
    text: queryJson('text'),
    textStyles: queryJson('textStyles'),
    img: queryJson('img')
  });
  orient();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fitAll(); });
  }
  if (new URLSearchParams(location.search).get('freeze') === '1') {
    document.documentElement.classList.add('is-frozen');
  }
  addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'educms-overrides') apply(data);
    if (data.type === 'educms-edit-mode' && data.on) armEdit();
    if (data.type === 'educms-freeze') document.documentElement.classList.add('is-frozen');
    if (data.type === 'educms-unfreeze') document.documentElement.classList.remove('is-frozen');
  });
  try { parent.postMessage({ type: 'educms-ready' }, '*'); } catch (_) {}
}());

</script>
