var TIME_KEYS={'clock.time':1,'meta.time':1,'header.time':1,'now.time':1,'time.now':1};
var DATE_KEYS={'clock.date':1,'meta.day':1,'meta.date':1,'header.date':1,'header.day':1};
function _ckCfg(k,fb){var el=document.querySelector('[data-field="'+k+'"]');var v=el?(el.textContent||'').trim():'';return v||fb;}
/* Match the shape the board AUTHORED — "SUNDAY · JUL 26" and "SUN · OCT 18"
 * are different designs, and a clock that reformats them has redesigned the
 * board. Infer weekday length, separator and case from the sample. */
function _ckDate(sample,d,tz,locale){
  var longDay=/^[A-Za-z]{4,}/.test(sample.replace(/^\s+/,''));
  /* Capture the separator WITH its surrounding whitespace — trimming it
   * turns the authored "SUNDAY · JUL 26" into "TUESDAY· AUG 25", which is
   * a (small, ugly) redesign of the board. */
  var sep=(sample.match(/[A-Za-z]([^A-Za-z0-9]+)[A-Za-z]/)||[,' '])[1]||' ';
  var o={weekday:longDay?'long':'short',month:'short',day:'numeric'};
  if(tz)o.timeZone=tz;
  var parts;
  try{parts=new Intl.DateTimeFormat(locale||'en-US',o).formatToParts(d);}catch(e){return sample;}
  var g=function(t){var f=null;for(var i=0;i<parts.length;i++)if(parts[i].type===t)f=parts[i].value;return f||'';};
  var out=g('weekday')+sep+g('month')+' '+g('day');
  return sample===sample.toUpperCase()?out.toUpperCase():out;
}
function _ckTime(sample,d,tz,locale,hour12){
  var o={hour:'numeric',minute:'2-digit',hour12:hour12};
  if(tz)o.timeZone=tz;
  var out;
  try{out=new Intl.DateTimeFormat(locale||'en-US',o).format(d);}catch(e){return sample;}
  return sample===sample.toUpperCase()?out.toUpperCase():out;
}
var _ckSamples=null,_ckTimer=null;
/* A board that ships the K-12 clock config span already drives its own
 * clock; two engines writing the same node would fight. */
function _ckOwnEngine(){return !!document.querySelector('[data-field="clock.mode"]');}
function startClock(text){
  if(_ckOwnEngine())return;
  var nodes=[];
  var all=document.querySelectorAll('[data-field]');
  for(var i=0;i<all.length;i++){
    var k=all[i].getAttribute('data-field');
    if(!TIME_KEYS[k]&&!DATE_KEYS[k])continue;
    /* The operator typed something here — their words win over the wall
     * clock, exactly as for any other editable field. */
    if(text&&typeof text[k]==='string')continue;
    nodes.push({el:all[i],key:k,isTime:!!TIME_KEYS[k]});

  if(!nodes.length)return;
  if(!_ckSamples){_ckSamples={};for(var j=0;j<nodes.length;j++)_ckSamples[nodes[j].key]=(nodes[j].el.textContent||'').trim();}
  var tz=_ckCfg('clock.timeZone','');
  var locale=_ckCfg('clock.locale','en-US');
  var h12raw=_ckCfg('clock.hour12','yes');
  var hour12=!/^(no|off|false|0|24)/i.test(h12raw);
  function tick(){
    var d=new Date();
    for(var n=0;n<nodes.length;n++){
      var s=_ckSamples[nodes[n].key]||'';
      nodes[n].el.textContent=nodes[n].isTime?_ckTime(s,d,tz,locale,hour12):_ckDate(s,d,tz,locale);
    }
  }
  tick();
  if(_ckTimer)clearInterval(_ckTimer);
  _ckTimer=setInterval(tick,15000);
}
function applyAll(){var p=readParams();applyBrand(p.brand);applyRepeat(p.repeat);applyTextAndStyles(p.text,p.styles);applyImages(p.img);applyPosters(p.img);applyVideos(p.video);startClock(p.text);if(editMode){armEdit();armMediaEdit();}}

}catch(e){}})();</script>

<script>(function(){var wrap=document.getElementById('scene-wrap'),scene=wrap.querySelector('.scene');function fit(){var p=innerHeight>innerWidth,w=p?1080:1920,h=p?1920:1080;document.documentElement.classList.toggle('is-portrait',p);wrap.style.width=w+'px';wrap.style.height=h+'px';scene.style.width=w+'px';scene.style.height=h+'px';wrap.style.setProperty('--scene-scale',Math.min(innerWidth/w,innerHeight/h));}addEventListener('resize',fit);fit();function json(n){try{var v=new URLSearchParams(location.search).get(n);return v?JSON.parse(v):{};}catch(_){return {};}}function nodes(k,a){var q=document.querySelectorAll('['+a+']'),o=[];for(var i=0;i<q.length;i++)if(q[i].getAttribute(a)===k)o.push(q[i]);return o;}function txt(e,v){if(!e.children.length){e.textContent=v;return;}var n=null;for(var i=0;i<e.childNodes.length;i++)if(e.childNodes[i].nodeType===3){n=e.childNodes[i];break;}if(n)n.textContent=v;else e.insertBefore(document.createTextNode(v),e.firstChild);}function apply(p){p=p||{};var r=document.documentElement.style,b=p.brand||{},t=p.text||{},s=p.textStyles||{},im=p.img||{};if(b.background)r.setProperty('--brand-canvas',b.background);if(b.text)r.setProperty('--brand-ink',b.text);if(b.primary)r.setProperty('--brand-primary',b.primary);if(b.accent)r.setProperty('--brand-accent',b.accent);if(b.fontDisplay)r.setProperty('--font-display',b.fontDisplay);if(b.fontBody)r.setProperty('--font-body',b.fontBody);var ks={};Object.keys(t).forEach(function(k){ks[k]=1});Object.keys(s).forEach(function(k){ks[k]=1});Object.keys(ks).forEach(function(k){var l=nodes(k,'data-field');for(var i=0;i<l.length;i++){if(typeof t[k]==='string')txt(l[i],t[k]);var x=s[k]||{};if(x.color)l[i].style.color=x.color;if(x.fontSize!=null)l[i].style.fontSize=typeof x.fontSize==='number'?x.fontSize+'px':x.fontSize;if(x.fontWeight!=null)l[i].style.fontWeight=String(x.fontWeight);if(x.fontFamily)l[i].style.fontFamily=x.fontFamily;if(x.textAlign)l[i].style.textAlign=x.textAlign;if(x.lineHeight!=null)l[i].style.lineHeight=String(x.lineHeight);if(x.hidden)l[i].style.display='none';}});Object.keys(im).forEach(function(k){var l=nodes(k,'data-imgslot');for(var i=0;i<l.length;i++){if(typeof im[k]!=='string')continue;var safe=im[k].replace(/["'()\s]/g,'');l[i].style.backgroundImage=safe?'url("'+safe+'")':'';l[i].style.backgroundSize='cover';l[i].style.backgroundPosition='center';}});}function arm(){document.documentElement.classList.add('is-editing');/* Click reporting removed 2026-08-25 — see EDUCMS-SHIM-V11+. The loop here bound a CAPTURE listener to every [data-field] AND [data-imgslot], so on a board whose whole scene is the image slot the OUTERMOST element won every click, and where targeting was right it fired twice alongside the shim. */}apply({brand:json('brand'),text:json('text'),textStyles:json('textStyles'),img:json('img')});if(new URLSearchParams(location.search).get('freeze')==='1')document.documentElement.classList.add('is-frozen');addEventListener('message',function(e){var d=e.data;if(!d||typeof d!=='object')return;if(d.type==='educms-overrides')apply(d);if(d.type==='educms-edit-mode'&&d.on)arm();if(d.type==='educms-freeze')document.documentElement.classList.add('is-frozen');if(d.type==='educms-unfreeze')document.documentElement.classList.remove('is-frozen')});try{parent.postMessage({type:'educms-ready'},'*')}catch(_){}}());</script></body></html>
