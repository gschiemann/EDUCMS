<body><div id="scene-wrap"><main class="scene"><div class="campaign" data-imgslot="campaign.image" aria-label="Replaceable campaign hero"></div><div class="grain"></div>
  <header class="topline"><div class="mark" data-imgslot="brand.logo" aria-label="Replaceable brand mark"></div><div class="brand" data-field="brand.name">NORTH / FORM</div><div class="site" data-field="brand.location">MARKET ST. · 01</div><div class="open"><span class="open-dot"></span><span data-field="store.status">OPEN · 8</span></div></header>

</main></div>
<script>(function(){var wrap=document.getElementById('scene-wrap'),scene=wrap.querySelector('.scene');function fit(){var p=innerHeight>innerWidth,w=p?1080:1920,h=p?1920:1080;document.documentElement.classList.toggle('is-portrait',p);wrap.style.width=w+'px';wrap.style.height=h+'px';scene.style.width=w+'px';scene.style.height=h+'px';wrap.style.setProperty('--scene-scale',Math.min(innerWidth/w,innerHeight/h));}addEventListener('resize',fit);fit();function json(n){try{var v=new URLSearchParams(location.search).get(n);return v?JSON.parse(v):{};}catch(_){return {};}}function nodes(k,a){var q=document.querySelectorAll('['+a+']'),o=[];for(var i=0;i<q.length;i++)if(q[i].getAttribute(a)===k)o.push(q[i]);return o;}function txt(e,v){if(!e.children.length){e.textContent=v;return;}var n=null;for(var i=0;i<e.childNodes.length;i++)if(e.childNodes[i].nodeType===3){n=e.childNodes[i];break;}if(n)n.textContent=v;else e.insertBefore(document.createTextNode(v),e.firstChild);}function apply(p){p=p||{};var r=document.documentElement.style,b=p.brand||{},t=p.text||{},s=p.textStyles||{},im=p.img||{};if(b.background)r.setProperty('--brand-canvas',b.background);if(b.text)r.setProperty('--brand-ink',b.text);if(b.primary)r.setProperty('--brand-primary',b.primary);if(b.accent)r.setProperty('--brand-accent',b.accent);if(b.fontDisplay)r.setProperty('--font-display',b.fontDisplay);if(b.fontBody)r.setProperty('--font-body',b.fontBody);var ks={};Object.keys(t).forEach(function(k){ks[k]=1});Object.keys(s).forEach(function(k){ks[k]=1});Object.keys(ks).forEach(function(k){var l=nodes(k,'data-field');for(var i=0;i<l.length;i++){if(typeof t[k]==='string')txt(l[i],t[k]);var x=s[k]||{};if(x.color)l[i].style.color=x.color;if(x.fontSize!=null)l[i].style.fontSize=typeof x.fontSize==='number'?x.fontSize+'px':x.fontSize;if(x.fontWeight!=null)l[i].style.fontWeight=String(x.fontWeight);if(x.fontFamily)l[i].style.fontFamily=x.fontFamily;if(x.textAlign)l[i].style.textAlign=x.textAlign;if(x.lineHeight!=null)l[i].style.lineHeight=String(x.lineHeight);if(x.hidden)l[i].style.display='none';}});Object.keys(im).forEach(function(k){var l=nodes(k,'data-imgslot');for(var i=0;i<l.length;i++){if(typeof im[k]!=='string')continue;var safe=im[k].replace(/["'()\s]/g,'');l[i].style.backgroundImage=safe?'url("'+safe+'")':'';l[i].style.backgroundSize='cover';l[i].style.backgroundPosition='center';}});}function arm(){document.documentElement.classList.add('is-editing');var q=document.querySelectorAll('[data-field],[data-imgslot]');for(var i=0;i<q.length;i++){if(q[i].dataset.armed)continue;q[i].dataset.armed='1';q[i].addEventListener('click',function(e){e.preventDefault();e.stopPropagation();parent.postMessage({type:'educms-field-click',key:this.getAttribute('data-field')||this.getAttribute('data-imgslot'),kind:this.hasAttribute('data-field')?'text':'img'},'*')},true);}}apply({brand:json('brand'),text:json('text'),textStyles:json('textStyles'),img:json('img')});if(new URLSearchParams(location.search).get('freeze')==='1')document.documentElement.classList.add('is-frozen');addEventListener('message',function(e){var d=e.data;if(!d||typeof d!=='object')return;if(d.type==='educms-overrides')apply(d);if(d.type==='educms-edit-mode'&&d.on)arm();if(d.type==='educms-freeze')document.documentElement.classList.add('is-frozen');if(d.type==='educms-unfreeze')document.documentElement.classList.remove('is-frozen')});try{parent.postMessage({type:'educms-ready'},'*')}catch(_){}}());</script></body></html>
