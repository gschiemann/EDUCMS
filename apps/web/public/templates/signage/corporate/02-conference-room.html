<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Conference</title><style>
:root{--bg:#0c0e12;--fg:#eef2f8;--mute:#7a8595;--paper:#141823;--rule:rgba(238,242,248,.12);--primary:#3b82f6;--accent:#10b981;--gold:#f59e0b;--danger:#ef4444;--font-display:Georgia,serif;--font-grotesk:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-condensed:"Arial Narrow","Helvetica Neue",Impact,sans-serif;--font-mono:"SF Mono",Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:var(--font-grotesk)}
.stage{position:absolute;left:50%;top:50%;width:3840px;height:2160px;background:var(--bg);color:var(--fg);transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden}
.frame{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;padding:80px;row-gap:40px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--rule);padding-bottom:24px}
.logo{font:700 88px/.95 var(--font-display);letter-spacing:-.02em}
.tag{font:500 36px/1 var(--font-grotesk);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin-left:32px}
.live{display:inline-flex;align-items:center;gap:16px;font:700 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-left:24px}
.live::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent);animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 18px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.clock{font:600 88px/1 var(--font-grotesk);font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;border-top:2px solid var(--rule);padding-top:24px}
.fc{border:3px solid var(--rule);border-radius:32px;padding:24px 44px;display:flex;flex-direction:column;gap:8px}
.fc.accent{background:linear-gradient(135deg,var(--primary) 0%,#1d4ed8 100%);border:none}
.fc.accent .l{color:rgba(255,255,255,.85)}.fc.accent .v{color:#fff}
.fc .l{font:600 32px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fc .v{font:700 72px/.92 var(--font-condensed);letter-spacing:-.02em}
</style><script>/*EDUCMS-SHIM-V3*/(function(){try{
function dec(p){if(!p)return null;try{var j=decodeURIComponent(Array.prototype.map.call(atob(p.replace(/-/g,'+').replace(/_/g,'/')),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));return JSON.parse(j);}catch(e){return null;}}
function readParams(){var q=new URLSearchParams(location.search);return{brand:dec(q.get('brand'))||{},text:dec(q.get('text'))||{},styles:dec(q.get('textStyles'))||{},img:dec(q.get('img'))||{}};}
var BRAND_MAP={background:['--bg','--brand-canvas','--brand-bg','--surface-canvas'],surface:['--paper','--brand-paper','--surface'],
text:['--ink','--fg','--brand-ink','--brand-fg','--text'],muted:['--mute','--brand-mute','--text-muted'],
primary:['--primary','--brand-primary','--color-primary'],accent:['--accent','--brand-accent','--brand-gold','--gold','--color-accent'],
fontDisplay:['--font-display','--font-headline'],fontBody:['--font-grotesk','--font-body','--font-sans'],fontCondensed:['--font-condensed','--font-numeric']};
function applyBrand(b){var r=document.documentElement.style;Object.keys(BRAND_MAP).forEach(function(k){if(b[k])BRAND_MAP[k].forEach(function(v){r.setProperty(v,b[k]);});});}
function applyTextAndStyles(text,styles){var keys={};Object.keys(text||{}).forEach(function(k){keys[k]=1;});Object.keys(styles||{}).forEach(function(k){keys[k]=1;});Object.keys(keys).forEach(function(k){var nodes=document.querySelectorAll('[data-field="'+k.replace(/"/g,'\\"')+'"]');for(var i=0;i<nodes.length;i++){var el=nodes[i];if(text&&typeof text[k]==='string'){if(el.children.length===0){el.textContent=text[k];}else{var tn=null;for(var j=0;j<el.childNodes.length;j++){if(el.childNodes[j].nodeType===3){tn=el.childNodes[j];break;}}if(tn){tn.textContent=text[k];}else{el.insertBefore(document.createTextNode(text[k]),el.firstChild);}}}var s=styles&&styles[k];if(s){if(s.color)el.style.color=s.color;if(s.fontSize!=null)el.style.fontSize=(typeof s.fontSize==='number'?s.fontSize+'px':s.fontSize);if(s.fontWeight!=null)el.style.fontWeight=String(s.fontWeight);if(s.fontStyle)el.style.fontStyle=s.fontStyle;if(s.fontFamily)el.style.fontFamily=s.fontFamily;if(s.textDecoration)el.style.textDecoration=s.textDecoration;if(s.textAlign)el.style.textAlign=s.textAlign;if(s.backgroundColor)el.style.backgroundColor=s.backgroundColor;if(s.lineHeight!=null)el.style.lineHeight=String(s.lineHeight);}}});}
function applyImages(img){if(!img)return;Object.keys(img).forEach(function(k){var v=img[k];if(typeof v!=='string'||!v)return;var esc=k.replace(/"/g,'\\"');var el=document.querySelector('[data-img="'+esc+'"]')||document.querySelector('[data-slot="'+esc+'"]');if(!el)return;var safe=v.replace(/["'()\s]/g,'');if(!safe)return;if(el.tagName==='IMG'){el.setAttribute('src',safe);}else{el.style.backgroundImage="url('"+safe+"')";el.style.backgroundSize='cover';el.style.backgroundPosition='center';}el.setAttribute('data-has-image','true');});}
function applyAll(){var p=readParams();applyBrand(p.brand);applyTextAndStyles(p.text,p.styles);applyImages(p.img);}
applyBrand(readParams().brand);
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',applyAll);}else{applyAll();}
addEventListener('message',function(e){try{var d=e.data;if(d&&d.type==='educms-overrides'){if(d.brand)applyBrand(d.brand);applyTextAndStyles(d.text||{},d.textStyles||{});applyImages(d.img||{});}}catch(_){}});
}catch(e){}})();</script>
</head><body><div class="stage" id="stage"><div class="frame" style="async function readFile(path) {
    return rpc({ op: 'readFile', path: String(path) });
  }"><header class="top"><div><span class="logo" data-field="brand.name">BOARDROOM 4</span><span class="tag" data-field="brand.tag">Floor 3 · West</span></div><div class="clock" data-source="local-time"><span data-field="clock.hhmm">9:42 AM</span></div></header>
<main style="display:grid;grid-template-rows:1fr auto;gap:40px;min-height:0">
<section style="background:var(--paper);border:3px solid var(--accent);border-radius:48px;padding:96px 120px;display:flex;flex-direction:column;justify-content:center;text-align:center">
<div style="font:700 56px/1 var(--font-grotesk);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)" data-field="room.status">Available now</div>
<h1 style="margin:48px 0 0;font:700 320px/.85 var(--font-condensed);letter-spacing:-.04em" data-field="room.until">Until 2 PM</h1>
<p style="margin:48px 0 0;font:400 52px/1.3 var(--font-grotesk);color:var(--mute)" data-field="room.next">Next: Acme Corp · platform sync · 2:00 PM · Marcus Liu</p>
</section>
<section style="display:grid;grid-template-columns:repeat(4,1fr);gap:32px">
<div class="fc"><div class="l">Capacity</div><div class="v" data-field="room.cap">12 seats</div></div>
<div class="fc"><div class="l">AV</div><div class="v" data-field="room.av">Zoom Rooms</div></div>
<div class="fc"><div class="l">Floor</div><div class="v">3 · West</div></div>
<div class="fc accent"><div class="l">Book</div><div class="v" style="font-size:52px">Slack #book-rooms</div></div>
</section>
</main>
<footer class="foot"><div class="fc"><div class="l">Now</div><div class="v" data-field="now.text" style="color:var(--accent)">Available</div></div><div class="fc"><div class="l">Next</div><div class="v" style="font-size:52px" data-field="next.text">Acme · 2 PM</div></div><div class="fc"><div class="l">After</div><div class="v" style="font-size:52px" data-field="after.text">Standup · 3 PM</div></div></footer>
</div></div><script>(function(){var s=document.getElementById('stage');function fit(){s.style.setProperty('--scale',Math.min(innerWidth/3840,innerHeight/2160));}addEventListener('resize',fit);fit();})();</script></body></html>
