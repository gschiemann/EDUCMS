<!doctype html>
<html lang="en" data-theme="bar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ember · Bar Kiosk</title>
<!-- VenueOS intake 2026-06-04 — self-contained kiosk (engine + bar) inlined for the EXTERNAL_HTML host. Source: Claude design kiosk batch-16 (kiosk-new-3). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== kiosk-core.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE  —  shared design system for all touch templates
   ───────────────────────────────────────────────────────────────────────────
   • Every measurement scales from a single unit, --u (= 1vmin), so the same
     markup is pixel-balanced on a 1920×1080 wall panel AND a 1080×1920 totem.
   • Color + type are fully tokenized. A vertical theme only overrides the
     variables in the ":root[data-theme=...]" blocks at the bottom — never the
     component rules. This is what makes the three verticals one product.
   • Components here are vertical-agnostic. Vertical-specific styling lives in
     each vertical's styles.css.
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* — scale unit: the one knob that makes layouts orientation-proof — */
  --u: 1vmin;

  /* — spacing scale (multiples of --u) — */
  --s-1: calc(var(--u) * 0.5);
  --s-2: calc(var(--u) * 1);
  --s-3: calc(var(--u) * 1.6);
  --s-4: calc(var(--u) * 2.4);
  --s-5: calc(var(--u) * 3.4);
  --s-6: calc(var(--u) * 4.8);
  --s-7: calc(var(--u) * 6.6);
  --s-8: calc(var(--u) * 9);

  /* — type scale — */
  --t-mega:   calc(var(--u) * 11);
  --t-xl:     calc(var(--u) * 7.2);
  --t-h1:     calc(var(--u) * 5.2);
  --t-h2:     calc(var(--u) * 3.7);
  --t-h3:     calc(var(--u) * 2.9);
  --t-lg:     calc(var(--u) * 2.4);
  --t-body:   calc(var(--u) * 2.0);
  --t-sm:     calc(var(--u) * 1.7);
  --t-xs:     calc(var(--u) * 1.42);

  /* — radii — */
  --r-sm: calc(var(--u) * 1.2);
  --r-md: calc(var(--u) * 2);
  --r-lg: calc(var(--u) * 3);
  --r-xl: calc(var(--u) * 4.4);
  --r-pill: 999px;

  /* — motion — */
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-in: cubic-bezier(.4,0,1,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --dur: 460ms;
  --dur-fast: 240ms;

  /* — elevation (soft, layered, never harsh) — */
  --sh-1: 0 calc(var(--u)*0.4) calc(var(--u)*1.4) rgba(8,12,22,.10);
  --sh-2: 0 calc(var(--u)*1.2) calc(var(--u)*3.2) rgba(8,12,22,.16);
  --sh-3: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(8,12,22,.26);
  --sh-pop: 0 calc(var(--u)*3.4) calc(var(--u)*10) rgba(8,12,22,.40);

  /* — fallback theme (overridden per vertical) — */
  --bg: #0e1116;
  --bg-2: #161a22;
  --surface: #1c212b;
  --surface-2: #232a36;
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);
  --text: #f4f6fb;
  --text-dim: #9aa6b8;
  --text-mute: #6b7689;
  --accent: #4f7cff;
  --accent-2: #8a6bff;
  --on-accent: #ffffff;
  --good: #2fc77e;
  --warn: #f5a623;
  --bad: #ef4d6b;

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--t-body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* ═══ STAGE & SCREEN SYSTEM ════════════════════════════════════════════════ */
.kiosk {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* a screen fills the stage; the router stacks them and animates between.
   Visibility is driven by the .is-active class (NOT by animations) so the
   final state is always correct even when the tab is backgrounded and
   rAF/keyframes are throttled. Motion is a transition enhancement only. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(2.5vmin);
  pointer-events: none;
  will-change: transform;
  transition: transform var(--dur) var(--ease-out);
}
.screen.is-active { opacity: 1; transform: none; pointer-events: auto; }
.screen.is-leaving { opacity: 0; }

/* a scroll region inside a screen */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.scroll::-webkit-scrollbar { width: calc(var(--u)*1.2); }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

/* ═══ TYPOGRAPHY ═══════════════════════════════════════════════════════════ */
.display { font-family: var(--font-display); font-weight: 800; line-height: .98; letter-spacing: -.02em; }
.t-mega { font-family: var(--font-display); font-weight: 800; font-size: var(--t-mega); line-height: .92; letter-spacing: -.03em; }
.t-xl   { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: .98; letter-spacing: -.025em; }
.t-h1   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h1); line-height: 1.02; letter-spacing: -.02em; }
.t-h2   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h2); line-height: 1.05; letter-spacing: -.01em; }
.t-h3   { font-family: var(--font-display); font-weight: 600; font-size: var(--t-h3); line-height: 1.1; }
.t-lg   { font-size: var(--t-lg); line-height: 1.45; }
.t-body { font-size: var(--t-body); }
.t-sm   { font-size: var(--t-sm); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--accent);
}
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ═══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn {
  --pad-y: var(--s-3);
  --pad-x: var(--s-5);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--pad-y) var(--pad-x);
  border: none;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), box-shadow var(--dur-fast);
  white-space: nowrap;
}
.btn:active { transform: scale(.955); }
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 calc(var(--u)*1) calc(var(--u)*3) color-mix(in srgb, var(--accent) 45%, transparent); }
.btn--primary:active { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn--ghost { background: transparent; box-shadow: inset 0 0 0 calc(var(--u)*.28) var(--line-strong); }
.btn--lg { --pad-y: var(--s-4); --pad-x: var(--s-6); font-size: calc(var(--t-lg)*1.12); }
.btn--block { display: flex; width: 100%; }
.btn .ic { width: 1.2em; height: 1.2em; }

/* circular icon button (back, close, etc.) */
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  border: none; border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  box-shadow: var(--sh-1); cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.iconbtn:active { transform: scale(.9); background: var(--surface-2); }
.iconbtn svg { width: 45%; height: 45%; }

/* ═══ CHIPS / FILTERS ══════════════════════════════════════════════════════ */
.chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-dim);
  font-size: var(--t-sm); font-weight: 600;
  box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--line);
  cursor: pointer; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"], .chip.is-on {
  background: var(--accent); color: var(--on-accent);
  box-shadow: none;
}
.chip .dot { width: .8em; height: .8em; border-radius: 50%; background: currentColor; }

/* ═══ BADGES ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.8) var(--s-3);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); color: var(--text-dim);
}
.badge .dot { width: .7em; height: .7em; border-radius: 50%; background: currentColor; }
.badge--good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.badge--warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge--bad  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.badge--accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

/* ═══ CARDS ════════════════════════════════════════════════════════════════ */
.card {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast);
  outline: 1px solid var(--line);
  outline-offset: -1px;
}
.card:active { transform: scale(.975); box-shadow: var(--sh-2); }
.card--static { cursor: default; }
.card--static:active { transform: none; }

/* ═══ IMAGE PLACEHOLDER ════════════════════════════════════════════════════
   A refined, intentional placeholder. The dev swaps the background-image (or
   drops an <img>/<video>) and removes [data-img]. The label chip self-hides
   once a real asset is set via .has-media.                                    */
.media {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 20% 10%, color-mix(in srgb,var(--accent) 32%, var(--surface-2)) 0%, transparent 55%),
    radial-gradient(120% 90% at 90% 90%, color-mix(in srgb,var(--accent-2) 30%, var(--surface)) 0%, transparent 55%),
    var(--surface-2);
  background-size: cover; background-position: center;
}
.media::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: calc(var(--u)*4) calc(var(--u)*4);
  mask-image: linear-gradient(135deg, #000, transparent 70%);
  opacity: .5;
}
.media.has-media { background-image: var(--src); }
.media.has-media::after, .media.has-media .media__tag { display: none; }
.media__tag {
  position: absolute; left: var(--s-3); bottom: var(--s-3);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.7) var(--s-3);
  border-radius: var(--r-sm);
  background: rgba(8,10,16,.55);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: .08em; text-transform: uppercase; color: #fff;
  z-index: 2;
}
.media__tag svg { width: 1.3em; height: 1.3em; opacity: .85; }
.media__scrim {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(6,8,14,.78) 0%, rgba(6,8,14,.05) 45%, transparent 70%);
  z-index: 1;
}

/* ═══ HEADER BAR ═══════════════════════════════════════════════════════════ */
.bar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  z-index: 5;
}
.bar__brand { display: flex; align-items: center; gap: var(--s-3); }
.bar__logo {
  width: calc(var(--u)*5.4); height: calc(var(--u)*5.4);
  border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3);
  box-shadow: var(--sh-1);
}
.bar__spacer { flex: 1; }
.bar__clock { font-family: var(--font-mono); font-size: var(--t-lg); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* breadcrumb */
.crumbs { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-size: var(--t-sm); }
.crumbs button { background: none; border: none; color: var(--text-dim); font: inherit; cursor: pointer; padding: var(--s-1) 0; }
.crumbs .sep { color: var(--text-mute); }
.crumbs .now { color: var(--text); font-weight: 700; }

/* ═══ BOTTOM ACTION BAR ════════════════════════════════════════════════════ */
.actionbar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(calc(var(--u)*2));
  box-shadow: 0 calc(var(--u)*-1.2) calc(var(--u)*4) rgba(0,0,0,.25);
  border-top: 1px solid var(--line);
  z-index: 6;
}

/* ═══ SPEC LIST ════════════════════════════════════════════════════════════ */
.specs { display: grid; gap: var(--s-3); }
.spec {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4);
  padding-bottom: var(--s-3);
  border-bottom: 1px solid var(--line);
}
.spec__k { color: var(--text-dim); font-size: var(--t-body); }
.spec__v { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); text-align: right; white-space: nowrap; line-height: 1.05; }
.spec__v small { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--t-xs); color: var(--text-dim); letter-spacing: .02em; }

/* ═══ AMENITY / FEATURE TILE ═══════════════════════════════════════════════ */
.feat {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-md);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.feat__ic {
  flex: none;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.feat__ic svg { width: 55%; height: 55%; }
.feat__t { font-weight: 700; font-size: var(--t-body); }
.feat__d { color: var(--text-dim); font-size: var(--t-sm); }

/* ═══ SHEET / MODAL ════════════════════════════════════════════════════════ */
.scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(4,6,12,.62);
  backdrop-filter: blur(calc(var(--u)*1.2));
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  display: flex; align-items: flex-end; justify-content: center;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-height: 86%;
  background: var(--bg-2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--sh-pop);
  transform: translateY(8%);
  transition: transform var(--dur) var(--ease-out);
  display: flex; flex-direction: column; overflow: hidden;
}
.scrim.is-open .sheet { transform: none; }
.sheet__grip { width: calc(var(--u)*12); height: calc(var(--u)*.8); border-radius: 99px; background: var(--line-strong); margin: var(--s-3) auto 0; flex: none; }

/* ═══ QUANTITY STEPPER ═════════════════════════════════════════════════════ */
.stepper { display: inline-flex; align-items: center; gap: var(--s-3); background: var(--surface); border-radius: var(--r-pill); padding: calc(var(--u)*.7); }
.stepper button {
  width: calc(var(--u)*7); height: calc(var(--u)*7);
  border: none; border-radius: 50%; background: var(--surface-2);
  color: var(--text); font-size: var(--t-h3); font-weight: 700; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.stepper button:active { transform: scale(.88); }
.stepper button.is-accent { background: var(--accent); color: var(--on-accent); }
.stepper__n { min-width: calc(var(--u)*7); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); font-variant-numeric: tabular-nums; }

/* ═══ VIDEO REGION ═════════════════════════════════════════════════════════ */
.video { position: relative; overflow: hidden; background: #05070c; }
.video .media { position: absolute; inset: 0; }
.video__play {
  position: absolute; inset: 0; margin: auto;
  width: calc(var(--u)*14); height: calc(var(--u)*14);
  display: grid; place-items: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.16); backdrop-filter: blur(calc(var(--u)*1.4));
  box-shadow: 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.22), var(--sh-2);
  color: #fff; cursor: pointer; z-index: 3;
  transition: transform var(--dur-fast) var(--spring), opacity var(--dur);
}
.video__play:active { transform: scale(.9); }
.video__play svg { width: 42%; height: 42%; margin-left: 6%; }
.video.is-playing .video__play { opacity: 0; pointer-events: none; }
.video__bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u)*.8); background: rgba(255,255,255,.18); z-index: 4; }
.video__bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

/* ═══ AUDIO GUIDE PLAYER ═══════════════════════════════════════════════════ */
.audio {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-lg);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.audio__btn {
  flex: none; width: calc(var(--u)*9); height: calc(var(--u)*9);
  border: none; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.audio__btn:active { transform: scale(.9); }
.audio__btn svg { width: 40%; height: 40%; }
.wave { flex: 1; display: flex; align-items: center; gap: calc(var(--u)*.5); height: calc(var(--u)*8); }
.wave i {
  flex: 1; border-radius: 99px; background: var(--line-strong);
  height: 30%; transform-origin: center;
}
.audio.is-playing .wave i { animation: waveBeat 1s ease-in-out infinite; background: var(--accent); }
@keyframes waveBeat { 0%,100%{ transform: scaleY(.35) } 50%{ transform: scaleY(1) } }
.audio__time { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ═══ "YOU ARE HERE" WAYFINDING ════════════════════════════════════════════ */
.here {
  position: absolute; width: calc(var(--u)*4); height: calc(var(--u)*4);
  transform: translate(-50%, -50%); z-index: 5;
}
.here::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.5) #fff, var(--sh-2);
}
.here::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); animation: pingPulse 1.8s var(--ease-out) infinite;
}
@keyframes pingPulse { 0%{ transform: scale(1); opacity: .6 } 100%{ transform: scale(3.4); opacity: 0 } }
.here__label {
  position: absolute; left: 50%; bottom: calc(100% + var(--u)*1.4); transform: translateX(-50%);
  white-space: nowrap; padding: calc(var(--u)*.7) var(--s-3); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; box-shadow: var(--sh-2);
}
.here__label::after { content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:calc(var(--u)*.9) solid transparent; border-top-color: var(--accent); }

/* ═══ TAP RIPPLE ═══════════════════════════════════════════════════════════ */
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .26; transform: scale(0); pointer-events: none; animation: rippleGo .6s var(--ease-out) forwards; }
@keyframes rippleGo { to { transform: scale(1); opacity: 0; } }

/* ═══ TOAST ════════════════════════════════════════════════════════════════ */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--u)*6); transform: translate(-50%, 2vmin);
  z-index: 60;
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-pill);
  background: var(--text); color: var(--bg);
  font-size: var(--t-body); font-weight: 700;
  box-shadow: var(--sh-3);
  opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--spring);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 1.3em; height: 1.3em; }

/* ═══ ATTRACT / IDLE SCREEN ════════════════════════════════════════════════ */
.attract {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transition: opacity 600ms var(--ease);
}
.attract.is-on { opacity: 1; pointer-events: auto; }
.attract__bg { position: absolute; inset: 0; }
.attract__bg .media { position: absolute; inset: calc(var(--u)*-4); animation: kenburns 22s ease-in-out infinite alternate; }
@keyframes kenburns { from{ transform: scale(1) translate(0,0) } to{ transform: scale(1.12) translate(-2%, -2%) } }
.attract__body { position: relative; z-index: 2; padding: var(--s-8) var(--s-7); }
.attract__cta {
  display: inline-flex; align-items: center; gap: var(--s-3);
  margin-top: var(--s-5); font-size: var(--t-h3); font-weight: 700;
  animation: breathe 2.4s ease-in-out infinite;
}
.attract__cta .ring { width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: 50%; border: calc(var(--u)*.4) solid var(--accent); display: grid; place-items: center; }
.attract__cta .ring svg { width: 50%; height: 50%; color: var(--accent); }
@keyframes breathe { 0%,100%{ opacity:.7; transform: translateY(0) } 50%{ opacity:1; transform: translateY(calc(var(--u)*-.6)) } }

/* ═══ UTILITY ══════════════════════════════════════════════════════════════ */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.center { align-items: center; justify-content: center; }
.between { justify-content: space-between; }
.gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); } .gap-4 { gap: var(--s-4); } .gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }
.grow { flex: 1; }
.pad-6 { padding: var(--s-6); } .pad-7 { padding: var(--s-7); }
.hidden { display: none !important; }
.fade-up { animation: scrIn-up var(--dur) var(--ease-out) both; }
.stagger > * { animation: scrIn-up var(--dur) var(--ease-out) both; }
@keyframes scrIn-up { from { opacity: 0; transform: translateY(2.5vmin); } to { opacity: 1; transform: none; } }

/* ===== bar/styles.css ===== */
/* ═══ BAR · vertical layout (theme tokens in [data-theme="bar"]) ════════════ */
.ba-word{ font-family:var(--font-display); font-weight:400; letter-spacing:.01em }
.ba-hero,.media.ba-cocktail__img,.media.ba-cd__img{ background:
  radial-gradient(90% 90% at 75% 10%, color-mix(in srgb,var(--accent) 45%,transparent) 0%, transparent 55%),
  radial-gradient(90% 100% at 10% 100%, color-mix(in srgb,var(--accent-2) 40%,transparent) 0%, transparent 55%),
  linear-gradient(150deg,#2a1d16,#0c0807); }
.ba-bar{ background:var(--bg-2); border-bottom:1px solid var(--line) }
.ba-bar .bar__logo{ background:var(--accent); color:var(--on-accent); font-family:var(--font-display) }
.ba-hh{ display:inline-flex;align-items:center;gap:var(--s-2);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:var(--s-2) var(--s-4);border-radius:var(--r-pill);font-weight:700;font-size:var(--t-sm) }
.ba-hh svg{ width:1.2em;height:1.2em }

/* age gate */
.ba-gate{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center }
.ba-gate__bg{ position:absolute; inset:0 }
.ba-gate__bg .media__scrim{ background:linear-gradient(0deg,rgba(8,6,5,.85),rgba(8,6,5,.5)) }
.ba-gate__b{ position:relative; z-index:2; padding:var(--s-7); display:flex; flex-direction:column; align-items:center; max-width:calc(var(--u)*80) }
.ba-gate__logo{ width:calc(var(--u)*9); height:calc(var(--u)*9); font-size:var(--t-h1); margin-bottom:var(--s-3) }
.ba-gate__btns{ display:flex; gap:var(--s-3); flex-wrap:wrap; justify-content:center }

.ba-home{ padding:0 var(--s-6) calc(var(--u)*16); display:grid; gap:var(--s-6) }
.ba-hhcard{ display:flex; align-items:center; gap:var(--s-4); margin-top:var(--s-4); padding:var(--s-5); border-radius:var(--r-lg); background:linear-gradient(120deg, color-mix(in srgb,var(--accent) 22%, var(--surface)), var(--surface)); outline:1px solid color-mix(in srgb,var(--accent) 30%,transparent); outline-offset:-1px }
.ba-hhcard__ic{ width:calc(var(--u)*8); height:calc(var(--u)*8); border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); font-size:var(--t-h2); flex:none }

.ba-split{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-6); align-items:start }
.ba-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s-5); flex-wrap:wrap; margin:var(--s-3) 0 var(--s-5) }
.ba-list{ padding:0 var(--s-6) calc(var(--u)*16) }

/* taps with keg level */
.ba-taps{ display:grid; gap:var(--s-3) } .ba-taps--full{ grid-template-columns:1fr 1fr; gap:var(--s-4) }
.ba-tap{ display:flex; gap:var(--s-4); align-items:center; padding:var(--s-4); background:var(--surface); border-radius:var(--r-md); outline:1px solid var(--line); outline-offset:-1px }
.ba-tap__keg{ width:calc(var(--u)*5); height:calc(var(--u)*10); border-radius:var(--r-sm); background:var(--bg-2); position:relative; overflow:hidden; flex:none; outline:1px solid var(--line-strong); outline-offset:-1px }
.ba-tap__fill{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff3)); transition:height var(--dur) }
.ba-tap__p{ font-family:var(--font-display); font-size:var(--t-h3); color:var(--accent); white-space:nowrap }
.ba-add{ border:none; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); font-weight:700; font-size:var(--t-sm); padding:var(--s-2) var(--s-4); border-radius:var(--r-pill); cursor:pointer; display:inline-flex; align-items:center; gap:var(--s-1) }
.ba-add svg{ width:1.1em;height:1.1em }

/* cocktails */
.ba-cocktails{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-4) }
.ba-cocktails--home{ grid-template-columns:1fr 1fr }
.ba-cocktail{ display:flex; flex-direction:column; border:none; cursor:pointer; background:var(--surface); border-radius:var(--r-lg); overflow:hidden; text-align:left; color:var(--text); outline:1px solid var(--line); outline-offset:-1px; transition:transform var(--dur-fast) var(--ease) }
.ba-cocktail:active{ transform:scale(.98) }
.ba-cocktail__img{ aspect-ratio:16/10; position:relative }
.ba-abv{ position:absolute; top:var(--s-2); right:var(--s-2); background:rgba(0,0,0,.5); color:var(--accent); font-family:var(--font-mono); font-weight:700; font-size:var(--t-xs); padding:3px 9px; border-radius:99px; backdrop-filter:blur(6px) }
.ba-abv--lg{ font-size:var(--t-sm); padding:var(--s-2) var(--s-3) }
.ba-cocktail__b{ padding:var(--s-4); display:flex; flex-direction:column; gap:var(--s-1) }
.ba-cocktail__p{ font-family:var(--font-display); font-size:var(--t-h2); color:var(--accent); margin-top:var(--s-1) }

.ba-cd{ padding:0 var(--s-6) calc(var(--u)*16) } .ba-cd .split{ margin-top:var(--s-4); align-items:start }
.ba-cd__img{ aspect-ratio:4/5; border-radius:var(--r-lg); position:relative }
.ba-cd__b{ display:flex; flex-direction:column }
.ba-build{ list-style:none; display:grid; gap:var(--s-2); margin-top:var(--s-3) }
.ba-build li{ display:flex; gap:var(--s-2); align-items:center; color:var(--text-dim); font-size:var(--t-lg) } .ba-build svg{ color:var(--accent); width:1.2em;height:1.2em;flex:none }
.ba-addbar{ background:var(--bg-2) }

.ba-tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-4) }
.ba-tile{ display:flex; align-items:center; gap:var(--s-4); padding:var(--s-5); border:none; cursor:pointer; background:var(--surface); border-radius:var(--r-lg); color:var(--text); outline:1px solid var(--line); outline-offset:-1px; text-align:left; transition:transform var(--dur-fast) var(--ease) }
.ba-tile:active{ transform:scale(.98) }
.ba-tile__ic{ width:calc(var(--u)*7); height:calc(var(--u)*7); border-radius:var(--r-md); display:grid; place-items:center; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); font-size:var(--t-h3); flex:none }
.ba-tile__go{ color:var(--accent) }

.ba-events{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-4) }
.ba-event{ display:flex; gap:var(--s-4); align-items:flex-start; padding:var(--s-5) }
.ba-event__ic{ flex:none; width:calc(var(--u)*8); height:calc(var(--u)*8); border-radius:var(--r-md); display:grid; place-items:center; background:color-mix(in srgb,var(--accent-2) 18%,transparent); color:var(--accent-2); font-size:var(--t-h2) }
.ba-event .row svg{ width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:.2em }

/* tab */
.ba-fabwrap{ position:absolute; left:0; right:0; bottom:0; padding:var(--s-4) var(--s-6); display:flex; justify-content:center; pointer-events:none }
.ba-fab{ pointer-events:auto; display:inline-flex; align-items:center; gap:var(--s-4); padding:var(--s-3) var(--s-3) var(--s-3) var(--s-5); border:none; cursor:pointer; background:var(--accent); color:var(--on-accent); border-radius:var(--r-pill); box-shadow:var(--sh-3); font:700 var(--t-lg)/1 var(--font-body); min-width:calc(var(--u)*40) }
.ba-fab[disabled]{ opacity:.5; background:var(--surface-2); color:var(--text-mute); box-shadow:none }
.ba-fab__ic{ position:relative; font-size:var(--t-h3); display:grid; place-items:center }
.ba-fab__count{ position:absolute; top:-.6em; right:-.6em; min-width:1.5em; height:1.5em; padding:0 .35em; border-radius:99px; background:var(--accent-2); color:#fff; font-size:.55em; display:grid; place-items:center; font-weight:800 }
.ba-fab__total{ background:rgba(0,0,0,.18); padding:var(--s-2) var(--s-4); border-radius:99px; font-family:var(--font-display) }
.ba-tablines{ display:grid; gap:var(--s-3) }

.ba-tabline__ic{ width:calc(var(--u)*7); height:calc(var(--u)*7); border-radius:var(--r-md); display:grid; place-items:center; background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); font-size:var(--t-h3); flex:none }

     Kiosk.app({
       theme:   'realestate',          // sets <html data-theme>
       start:   'home',                // first screen
       idleMs:  60000,                 // ms of inactivity → attract loop
       screens: {                      // name → (params) => HTML string or Node

         space:  (p) => `...`,

     });

  // ═══ ENGINE ════════════════════════════════════════════════════════════
  var Kiosk = {
    cfg: null, stack: [], stage: null, attractEl: null, idleTimer: null,

    app: function (cfg) {
      this.cfg = cfg;
      if (cfg.theme) document.documentElement.setAttribute('data-theme', cfg.theme);

      // orientation: explicit override beats auto

      scr.dataset.screen = cur.name;
      if (typeof out === 'string') scr.appendChild(frag(out));

      // can never leave a stale screen showing behind the new one.

      setTimeout(function () { scr.classList.add('is-active'); }, 20);

        return '<button data-jump="' + i + '">' + label + '</button><span class="sep">' + icon('chevron-right', { sw: 2 }) + '</span>';
      }).join('');
      host.innerHTML = html;
    },
    _jump: function (i) {
      this.stack = this.stack.slice(0, i + 1);
      this._render('back');
      this._resetIdle();
    },

    // interaction wiring --------------------------------------------------
    _wire: function (root) {

      var scrim = document.createElement('div');
      scrim.className = 'scrim';
      scrim.innerHTML = '<div class="sheet" style="' + (opts.maxw ? 'max-width:' + opts.maxw + ';margin:0 auto;border-radius:var(--r-xl) var(--r-xl) 0 0' : '') + '"><div class="sheet__grip"></div>' + html + '</div>';
      $('.kiosk').appendChild(scrim);
      this._sheet = scrim;
      var self = this;
      scrim.addEventListener('click', function (e) {
        if (e.target === scrim || e.target.closest('[data-sheet-close]')) self.closeSheet();
      });
      requestAnimationFrame && setTimeout(function () { scrim.classList.add('is-open'); }, 20);
      this._resetIdle();
      return scrim;
    },
    closeSheet: function (instant) {
      var s = this._sheet; if (!s) return;
      this._sheet = null;
      if (instant) { if (s.parentNode) s.parentNode.removeChild(s); return; }
      s.classList.remove('is-open');
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 480);
    },

    // transient toast ------------------------------------------------------
    toast: function (msg, opts) {
      opts = opts || {};
      var t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = (opts.icon ? icon(opts.icon) + ' ' : '') + msg;
      $('.kiosk').appendChild(t);
      setTimeout(function () { t.classList.add('is-on'); }, 20);
      setTimeout(function () { t.classList.remove('is-on'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, opts.ms || 2200);
    },

    // expose helpers
    icon: icon, money: money, h: frag, $: $, $$: $$
  };

  // build a column of audio waveform bars
  Kiosk.waveBars = function (n) {
    n = n || 28; var s = '';
    for (var i = 0; i < n; i++) s += '<i style="height:' + (20 + Math.round(Math.random() * 70)) + '%"></i>';
    return s;
  };

  global.Kiosk = Kiosk;
})(window);

</script>

    { id: "paper", name: "Paper Lantern", priceCents: 1350, abv: 26, spirit: "Whiskey", tags: ["Balanced", "Citrus"], desc: "Rye, amaro, yellow chartreuse, lemon — our take on a Paper Plane.", build: ["0.75 oz rye", "0.75 oz amaro", "0.75 oz chartreuse", "0.75 oz lemon"] },

<script>
/* ===== bar/app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   BAR KIOSK · SCREENS  (reads window.BAR)
   Age gate → home (happy hour, taps, cocktails, events) → drink detail →
   running tab → send to bar. Moody candlelit aesthetic.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var D = window.BAR;
  var icon = Kiosk.icon, money = Kiosk.money;
  function cocktailById(id) { return D.cocktails.filter(function (c) { return c.id === id; })[0]; }
  function tapById(id) { return D.onTap.filter(function (t) { return t.id === id; })[0]; }

  var tab = [];        // {uid, name, priceCents, kind}
  var uidSeq = 1;
  var gated = false;   // age gate passed?

  function tabCount() { return tab.length; }
  function tabTotal() { return tab.reduce(function (s, l) { return s + l.priceCents; }, 0); }

  function bar(showBack) {
    return '<header class="bar ba-bar">' +
      (showBack ? '<button class="iconbtn" data-back aria-label="Back">' + icon('arrow-left', { sw: 2 }) + '</button>' : '') +
      '<div class="bar__brand"><div class="bar__logo">' + D.brandInitials + '</div>' +
      '<div class="col"><div class="t-h3 ba-word" style="line-height:1">' + D.name + '</div>' +
      '<div class="eyebrow" style="color:var(--text-mute);letter-spacing:.2em">' + D.tagline + '</div></div></div>' +
      '<div class="bar__spacer"></div><nav class="crumbs" data-crumbs></nav><div class="bar__spacer"></div>' +
      (D.happyHour.active ? '<div class="ba-hh">' + icon('flame') + ' Happy Hour till ' + D.happyHour.until + '</div>' : '') +
      '<button class="iconbtn" data-home aria-label="Home">' + icon('home', { sw: 2 }) + '</button>' +
    '</header>';
  }
  function tabFab() {
    var n = tabCount();
    return '<button class="ba-fab ' + (n ? 'is-active' : '') + '" data-go="tab" ' + (n ? '' : 'disabled') + '>' +
      '<span class="ba-fab__ic">' + icon('cocktail') + (n ? '<span class="ba-fab__count">' + n + '</span>' : '') + '</span>' +
      '<span>' + (n ? 'Your tab' : 'Tab empty') + '</span>' + (n ? '<span class="ba-fab__total">' + money(tabTotal()) + '</span>' : '') + '</button>';
  }
  function syncFab() { var f = Kiosk.$('.ba-fab'); if (f) f.parentNode.innerHTML = tabFab(); }

  // ── AGE GATE (start screen) ───────────────────────────────────────────────
  function gate() {
    return '<div class="ba-gate"><div class="ba-gate__bg media ba-hero"><div class="media__scrim"></div></div>' +
      '<div class="ba-gate__b">' +
        '<div class="bar__logo ba-gate__logo">' + D.brandInitials + '</div>' +
        '<div class="t-mega ba-word" style="color:#fff">' + D.name + '</div>' +
        '<div class="t-h2" style="color:rgba(255,255,255,.85);font-weight:400;font-style:italic">' + D.tagline + '</div>' +
        '<p class="t-h3" style="color:rgba(255,255,255,.8);font-weight:400;margin:var(--s-4) 0;max-width:30ch">You must be 21 or older to view the menu and order.</p>' +
        '<div class="ba-gate__btns"><button class="btn btn--primary btn--lg" data-act="enter">' + icon('check', { sw: 2.4 }) + " I\u2019m 21 or older</button>" +
          '<button class="btn btn--ghost btn--lg" style="color:#fff" data-act="under">Under 21</button></div>' +
        '<p class="t-sm" style="color:rgba(255,255,255,.55);margin-top:var(--s-4)">' + D.tabNote + '</p>' +
      '</div></div>';
  }

  function attract() {
    return '<div class="attract__bg"><div class="media ba-hero"><div class="media__scrim"></div>' +
        '<div class="media__tag">' + icon('image') + ' ' + D.hero.label + '</div></div></div>' +
      '<div class="attract__body">' +
        '<div class="eyebrow" style="color:var(--accent)">' + D.tagline + '</div>' +
        '<div class="t-mega ba-word" style="color:#fff;margin-top:var(--s-1)">' + D.name + '</div>' +
        '<div class="attract__cta" style="color:#fff"><span class="ring">' + icon('touch') + '</span> Touch to see tonight\u2019s menu</div>' +
      '</div>';
  }

  function levelTag(l) {
    if (l <= 20) return '<span class="badge badge--bad"><span class="dot"></span>Last pours</span>';
    if (l <= 45) return '<span class="badge badge--warn"><span class="dot"></span>Running low</span>';
    return '<span class="badge badge--good"><span class="dot"></span>On tap</span>';
  }

  // ── HOME ──────────────────────────────────────────────────────────────────
  function home() {
    var taps = D.onTap.slice(0, 3).map(tapRow).join('');
    var cocktails = D.cocktails.slice(0, 4).map(function (c) {
      return '<button class="ba-cocktail" data-go="cocktail:' + c.id + '"><div class="media ba-cocktail__img"><span class="media__tag">' + icon('image') + '</span></div>' +
        '<div class="ba-cocktail__b"><div class="t-h2">' + c.name + '</div><div class="t-sm dim">' + c.spirit + ' · ' + c.abv + '% ABV</div>' +
        '<div class="ba-cocktail__p">' + money(c.priceCents) + '</div></div></button>';
    }).join('');

    return bar(false) +
    '<div class="scroll"><div class="ba-home">' +
      (D.happyHour.active ? '<section class="ba-hhcard"><div class="ba-hhcard__ic">' + icon('flame') + '</div>' +
        '<div class="grow"><div class="eyebrow" style="color:var(--accent)">Happy Hour · until ' + D.happyHour.until + '</div>' +
        '<div class="t-h1">' + D.happyHour.deal + '</div></div>' +
        '<button class="chip" data-go="events">' + icon('calendar') + ' Tonight</button></section>' : '') +

      '<section class="ba-split">' +
        '<div><div class="row between" style="margin-bottom:var(--s-3)"><div class="eyebrow">On Tap Now</div>' +
          '<button class="chip" data-go="tap">All ' + D.onTap.length + ' taps ' + icon('arrow-right', { sw: 2 }) + '</button></div>' +
          '<div class="ba-taps">' + taps + '</div></div>' +
        '<div><div class="row between" style="margin-bottom:var(--s-3)"><div class="eyebrow">Signature Cocktails</div>' +
          '<button class="chip" data-go="cocktails">Full list ' + icon('arrow-right', { sw: 2 }) + '</button></div>' +
          '<div class="ba-cocktails ba-cocktails--home">' + cocktails + '</div></div>' +
      '</section>' +

      '<section class="ba-tiles">' +
        tile('cocktail', 'Cocktails', D.cocktails.length + ' signatures', 'cocktails') +
        tile('beer', 'On Tap', D.onTap.length + ' drafts & cider', 'tap') +
        tile('headphones', "Tonight", D.events.length + ' events', 'events') +
      '</section>' +
    '</div></div>' +
    '<div class="ba-fabwrap">' + tabFab() + '</div>';
  }
  function tile(ic, t, sub, go) {
    return '<button class="ba-tile" data-go="' + go + '"><span class="ba-tile__ic">' + icon(ic) + '</span><span class="col" style="align-items:flex-start;gap:0;flex:1"><span class="t-h3">' + t + '</span><span class="t-sm dim">' + sub + '</span></span><span class="ba-tile__go">' + icon('arrow-right', { sw: 2 }) + '</span></button>';
  }
  function tapRow(t) {
    return '<div class="ba-tap"><div class="ba-tap__keg"><div class="ba-tap__fill" style="height:' + t.level + '%"></div></div>' +
      '<div class="grow"><div class="row between"><div class="t-h3">' + t.name + '</div><div class="ba-tap__p">' + money(t.priceCents) + '</div></div>' +
      '<div class="t-sm dim">' + t.brewery + ' · ' + t.style + ' · ' + t.abv + '%</div>' +
      '<div class="row between" style="margin-top:var(--s-2)">' + levelTag(t.level) + '<button class="ba-add" data-act="addtap" data-id="' + t.id + '">' + icon('plus', { sw: 2.6 }) + ' Add to tab</button></div></div></div>';
  }

  // ── COCKTAILS ─────────────────────────────────────────────────────────────
  function cocktails() {
    return bar(true) + '<div class="scroll"><div class="ba-list">' +
      '<div class="ba-head"><div><div class="eyebrow">The List</div><h1 class="t-xl">Signature Cocktails</h1></div></div>' +
      '<div class="ba-cocktails">' + D.cocktails.map(function (c) {
        return '<button class="ba-cocktail" data-go="cocktail:' + c.id + '"><div class="media ba-cocktail__img"><span class="media__tag">' + icon('image') + '</span><span class="ba-abv">' + c.abv + '%</span></div>' +
          '<div class="ba-cocktail__b"><div class="t-h2">' + c.name + '</div><div class="t-sm dim pretty">' + c.desc + '</div>' +
          '<div class="row between" style="margin-top:var(--s-2)"><div class="chiprow">' + c.tags.map(function (t) { return '<span class="badge">' + t + '</span>'; }).join('') + '</div><div class="ba-cocktail__p">' + money(c.priceCents) + '</div></div></div></button>';
      }).join('') + '</div></div></div>' + '<div class="ba-fabwrap">' + tabFab() + '</div>';
  }
  function cocktail(id) {
    var c = cocktailById(id); if (!c) return '<div class="pad-7">Not found</div>';
    return bar(true) + '<div class="scroll"><div class="ba-cd">' +
      '<div class="split split--4060">' +
        '<div class="media ba-cd__img"><span class="ba-abv ba-abv--lg">' + c.abv + '% ABV</span><div class="media__tag">' + icon('image') + ' ' + c.name.toUpperCase() + '</div></div>' +
        '<div class="ba-cd__b"><div class="chiprow">' + c.tags.map(function (t) { return '<span class="badge badge--accent">' + t + '</span>'; }).join('') + '</div>' +
          '<h1 class="t-xl" style="margin:var(--s-2) 0 0">' + c.name + '</h1>' +
          '<div class="t-h3 dim" style="font-weight:500">' + c.spirit + ' · ' + c.abv + '% ABV</div>' +
          '<p class="t-lg pretty" style="margin:var(--s-3) 0">' + c.desc + '</p>' +
          '<div class="eyebrow">How it\u2019s built</div><ul class="ba-build">' + c.build.map(function (b) { return '<li>' + icon('check', { sw: 2.4 }) + ' ' + b + '</li>'; }).join('') + '</ul>' +
        '</div>' +
      '</div>' +
    '</div></div>' +
    '<div class="actionbar ba-addbar"><div class="col" style="gap:0"><div class="t-sm dim">' + c.name + '</div><div class="t-h3">' + money(c.priceCents) + (D.happyHour.active ? ' · <span style="color:var(--accent)">HH $2 off at the bar</span>' : '') + '</div></div>' +
      '<div class="bar__spacer"></div><button class="btn btn--primary btn--lg" data-act="addcocktail" data-id="' + c.id + '">' + icon('plus', { sw: 2.4 }) + ' Add to tab</button></div>';
  }

  // ── TAP LIST ────────────────────────────────────────────────────────────
  function tap() {
    return bar(true) + '<div class="scroll"><div class="ba-list">' +
      '<div class="ba-head"><div><div class="eyebrow">Draft · live keg levels</div><h1 class="t-xl">On Tap</h1></div></div>' +
      '<div class="ba-taps ba-taps--full">' + D.onTap.map(tapRow).join('') + '</div></div></div>' + '<div class="ba-fabwrap">' + tabFab() + '</div>';
  }

  // ── EVENTS ────────────────────────────────────────────────────────────────
  function events() {
    return bar(true) + '<div class="scroll"><div class="ba-list">' +
      '<div class="ba-head"><div><div class="eyebrow">What\u2019s on</div><h1 class="t-xl">Tonight &amp; This Week</h1></div></div>' +
      '<div class="ba-events">' + D.events.map(function (e) {
        return '<div class="card card--static ba-event"><div class="ba-event__ic">' + icon(e.icon) + '</div>' +
          '<div class="grow"><div class="badge badge--accent">' + e.tag + '</div><div class="t-h2" style="margin:var(--s-1) 0">' + e.title + '</div>' +
          '<div class="row gap-3 dim t-body"><span>' + icon('clock') + ' ' + e.when + '</span><span>' + icon('pin') + ' ' + e.where + '</span></div></div></div>';
      }).join('') + '</div></div></div>';
  }

  // ── TAB ─────────────────────────────────────────────────────────────────
  function tabScreen() {
    if (!tab.length) return bar(true) + '<div class="ba-empty"><div class="ba-empty__ic">' + icon('cocktail') + '</div><h1 class="t-h1">Your tab is empty</h1><button class="btn btn--primary btn--lg" data-home>' + icon('cocktail') + ' Browse the menu</button></div>';
    var lines = tab.map(function (l) {
      return '<div class="ba-tabline"><div class="ba-tabline__ic">' + icon(l.kind === 'tap' ? 'beer' : 'cocktail') + '</div>' +
        '<div class="grow"><div class="t-h3">' + l.name + '</div><div class="t-sm dim">' + (l.kind === 'tap' ? 'Draft pour' : 'Cocktail') + '</div></div>' +
        '<div class="t-h3 ba-tabline__p">' + money(l.priceCents) + '</div>' +
        '<button class="ba-remove" data-act="remove" data-uid="' + l.uid + '">' + icon('x', { sw: 2.2 }) + '</button></div>';
    }).join('');
    return bar(true) + '<div class="scroll"><div class="ba-list">' +
      '<div class="ba-head"><div><div class="eyebrow">Running tab</div><h1 class="t-xl">Your Tab</h1></div><div class="t-body dim">' + tabCount() + ' drink' + (tabCount() > 1 ? 's' : '') + '</div></div>' +
      '<div class="ba-tablines">' + lines + '</div></div></div>' +
      '<div class="actionbar ba-checkoutbar"><div class="col" style="gap:0"><div class="t-sm dim">Estimated total</div><div class="t-h2">' + money(tabTotal()) + '<span class="t-sm dim"> + tax & tip</span></div></div>' +
      '<div class="bar__spacer"></div><button class="btn btn--primary btn--lg" data-act="opentab">' + icon('send') + ' Send to the bar</button></div>';
  }
  function tabConfirmed() {
    return '<div class="ba-done"><div class="ba-done__ic">' + icon('check', { sw: 2.6 }) + '</div>' +
      '<h1 class="t-mega ba-word">Tab opened</h1>' +
      '<p class="t-h3 dim" style="font-weight:400;max-width:34ch">A server is pouring your order now. Find a seat — we\u2019ll bring it over and keep the tab open under your table.</p>' +
      '<div class="feat" style="max-width:calc(var(--u)*64);margin:var(--s-4) auto"><span class="feat__ic">' + icon('clock') + '</span><div><div class="feat__t">' + tabCount() + ' drinks · ' + money(tabTotal()) + ' so far</div><div class="feat__d">Settle anytime at the bar or kiosk</div></div></div>' +
      '<button class="btn btn--primary btn--lg" data-act="reset">' + icon('cocktail') + ' Order more</button></div>';
  }

  Kiosk.app({
    theme: 'bar', start: 'gate', idleMs: 60000,
    crumbs: { home: 'Menu', cocktails: 'Cocktails', cocktail: 'Cocktail', tap: 'On Tap', events: 'Tonight', tab: 'Tab' },
    screens: { gate: gate, home: home, cocktails: cocktails, cocktail: cocktail, tap: tap, events: events, tab: tabScreen },
    attract: attract,
    onAction: function (name, el, data) {
      if (name === 'enter') { gated = true; Kiosk.stack = [{ name: 'home', params: null }]; Kiosk.refresh(); }
      else if (name === 'under') { Kiosk.toast('Must be 21+ to view the menu', { icon: 'info', ms: 2600 }); }
      else if (name === 'addtap') { var t = tapById(data.id); tab.push({ uid: uidSeq++, name: t.name, priceCents: t.priceCents, kind: 'tap' }); Kiosk.toast(t.name + ' added to tab', { icon: 'check' }); syncFab(); }
      else if (name === 'addcocktail') { var c = cocktailById(data.id); tab.push({ uid: uidSeq++, name: c.name, priceCents: c.priceCents, kind: 'cocktail' }); Kiosk.toast(c.name + ' added to tab', { icon: 'check' }); Kiosk.back(); setTimeout(syncFab, 60); }
      else if (name === 'remove') { tab = tab.filter(function (x) { return x.uid != data.uid; }); Kiosk.refresh(); }
      else if (name === 'opentab') { Kiosk.stack.push({ name: '_done', params: null }); Kiosk.cfg.screens._done = tabConfirmed; Kiosk.refresh(); }
      else if (name === 'reset') { Kiosk.stack = [{ name: 'home', params: null }]; Kiosk.refresh(); }
    }
  });

  // returning from attract should re-gate
  var _wake = Kiosk._wake.bind(Kiosk);
  Kiosk._wake = function () { if (!this._attractOn) return; this.attractEl.classList.remove('is-on'); this._attractOn = false; tab = []; this.stack = [{ name: 'gate', params: null }]; this.refresh(); };
})();

</script>
