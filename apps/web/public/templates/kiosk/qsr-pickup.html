<!doctype html>
<html lang="en" data-theme="qsr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STACK · Pickup & Curbside</title>
<!-- VenueOS intake 2026-06-05 — self-contained kiosk (engine + qsr/pickup) inlined for the EXTERNAL_HTML host. Source: Claude design kiosk batch-17 (kiosk-new-9). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== kiosk-core.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE  —  shared design system for all touch templates
   ───────────────────────────────────────────────────────────────────────────
   • Every measurement scales from a single unit, --u (= 1vmin), so the same
     markup is pixel-balanced on a 1920×1080 wall panel AND a 1080×1920 totem.
   • Color + type are fully tokenized. A vertical theme only overrides the
     variables in the ":root[data-theme=...]" blocks at the bottom — never the
     component rules. This is what makes the three verticals one product.
   • Components here are vertical-agnostic. Vertical-specific styling lives in
     each vertical's styles.css.
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* — scale unit: the one knob that makes layouts orientation-proof — */
  --u: 1vmin;

  /* — spacing scale (multiples of --u) — */
  --s-1: calc(var(--u) * 0.5);
  --s-2: calc(var(--u) * 1);
  --s-3: calc(var(--u) * 1.6);
  --s-4: calc(var(--u) * 2.4);
  --s-5: calc(var(--u) * 3.4);
  --s-6: calc(var(--u) * 4.8);
  --s-7: calc(var(--u) * 6.6);
  --s-8: calc(var(--u) * 9);

  /* — type scale — */
  --t-mega:   calc(var(--u) * 11);
  --t-xl:     calc(var(--u) * 7.2);
  --t-h1:     calc(var(--u) * 5.2);
  --t-h2:     calc(var(--u) * 3.7);
  --t-h3:     calc(var(--u) * 2.9);
  --t-lg:     calc(var(--u) * 2.4);
  --t-body:   calc(var(--u) * 2.0);
  --t-sm:     calc(var(--u) * 1.7);
  --t-xs:     calc(var(--u) * 1.42);

  /* — radii — */
  --r-sm: calc(var(--u) * 1.2);
  --r-md: calc(var(--u) * 2);
  --r-lg: calc(var(--u) * 3);
  --r-xl: calc(var(--u) * 4.4);
  --r-pill: 999px;

  /* — motion — */
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-in: cubic-bezier(.4,0,1,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --dur: 460ms;
  --dur-fast: 240ms;

  /* — elevation (soft, layered, never harsh) — */
  --sh-1: 0 calc(var(--u)*0.4) calc(var(--u)*1.4) rgba(8,12,22,.10);
  --sh-2: 0 calc(var(--u)*1.2) calc(var(--u)*3.2) rgba(8,12,22,.16);
  --sh-3: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(8,12,22,.26);
  --sh-pop: 0 calc(var(--u)*3.4) calc(var(--u)*10) rgba(8,12,22,.40);

  /* — fallback theme (overridden per vertical) — */
  --bg: #0e1116;
  --bg-2: #161a22;
  --surface: #1c212b;
  --surface-2: #232a36;
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);
  --text: #f4f6fb;
  --text-dim: #9aa6b8;
  --text-mute: #6b7689;
  --accent: #4f7cff;
  --accent-2: #8a6bff;
  --on-accent: #ffffff;
  --good: #2fc77e;
  --warn: #f5a623;
  --bad: #ef4d6b;

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--t-body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* ═══ STAGE & SCREEN SYSTEM ════════════════════════════════════════════════ */
.kiosk {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* a screen fills the stage; the router stacks them and animates between.
   Visibility is driven by the .is-active class (NOT by animations) so the
   final state is always correct even when the tab is backgrounded and
   rAF/keyframes are throttled. Motion is a transition enhancement only. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(2.5vmin);
  pointer-events: none;
  will-change: transform;
  transition: transform var(--dur) var(--ease-out);
}
.screen.is-active { opacity: 1; transform: none; pointer-events: auto; }
.screen.is-leaving { opacity: 0; }

/* a scroll region inside a screen */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.scroll::-webkit-scrollbar { width: calc(var(--u)*1.2); }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

/* ═══ TYPOGRAPHY ═══════════════════════════════════════════════════════════ */
.display { font-family: var(--font-display); font-weight: 800; line-height: .98; letter-spacing: -.02em; }
.t-mega { font-family: var(--font-display); font-weight: 800; font-size: var(--t-mega); line-height: .92; letter-spacing: -.03em; }
.t-xl   { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: .98; letter-spacing: -.025em; }
.t-h1   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h1); line-height: 1.02; letter-spacing: -.02em; }
.t-h2   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h2); line-height: 1.05; letter-spacing: -.01em; }
.t-h3   { font-family: var(--font-display); font-weight: 600; font-size: var(--t-h3); line-height: 1.1; }
.t-lg   { font-size: var(--t-lg); line-height: 1.45; }
.t-body { font-size: var(--t-body); }
.t-sm   { font-size: var(--t-sm); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--accent);
}
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ═══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn {
  --pad-y: var(--s-3);
  --pad-x: var(--s-5);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--pad-y) var(--pad-x);
  border: none;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), box-shadow var(--dur-fast);
  white-space: nowrap;
}
.btn:active { transform: scale(.955); }
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 calc(var(--u)*1) calc(var(--u)*3) color-mix(in srgb, var(--accent) 45%, transparent); }
.btn--primary:active { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn--ghost { background: transparent; box-shadow: inset 0 0 0 calc(var(--u)*.28) var(--line-strong); }
.btn--lg { --pad-y: var(--s-4); --pad-x: var(--s-6); font-size: calc(var(--t-lg)*1.12); }
.btn--block { display: flex; width: 100%; }
.btn .ic { width: 1.2em; height: 1.2em; }

/* circular icon button (back, close, etc.) */
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  border: none; border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  box-shadow: var(--sh-1); cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.iconbtn:active { transform: scale(.9); background: var(--surface-2); }
.iconbtn svg { width: 45%; height: 45%; }

/* ═══ CHIPS / FILTERS ══════════════════════════════════════════════════════ */
.chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-dim);
  font-size: var(--t-sm); font-weight: 600;
  box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--line);
  cursor: pointer; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"], .chip.is-on {
  background: var(--accent); color: var(--on-accent);
  box-shadow: none;
}
.chip .dot { width: .8em; height: .8em; border-radius: 50%; background: currentColor; }

/* ═══ BADGES ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.8) var(--s-3);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); color: var(--text-dim);
}
.badge .dot { width: .7em; height: .7em; border-radius: 50%; background: currentColor; }
.badge--good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.badge--warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge--bad  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.badge--accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

/* ═══ CARDS ════════════════════════════════════════════════════════════════ */
.card {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast);
  outline: 1px solid var(--line);
  outline-offset: -1px;
}
.card:active { transform: scale(.975); box-shadow: var(--sh-2); }
.card--static { cursor: default; }
.card--static:active { transform: none; }

/* ═══ IMAGE PLACEHOLDER ════════════════════════════════════════════════════
   A refined, intentional placeholder. The dev swaps the background-image (or
   drops an <img>/<video>) and removes [data-img]. The label chip self-hides
   once a real asset is set via .has-media.                                    */
.media {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 20% 10%, color-mix(in srgb,var(--accent) 32%, var(--surface-2)) 0%, transparent 55%),
    radial-gradient(120% 90% at 90% 90%, color-mix(in srgb,var(--accent-2) 30%, var(--surface)) 0%, transparent 55%),
    var(--surface-2);
  background-size: cover; background-position: center;
}
.media::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: calc(var(--u)*4) calc(var(--u)*4);
  mask-image: linear-gradient(135deg, #000, transparent 70%);
  opacity: .5;
}
.media.has-media { background-image: var(--src); }
.media.has-media::after, .media.has-media .media__tag { display: none; }
.media__tag {
  position: absolute; left: var(--s-3); bottom: var(--s-3);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.7) var(--s-3);
  border-radius: var(--r-sm);
  background: rgba(8,10,16,.55);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: .08em; text-transform: uppercase; color: #fff;
  z-index: 2;
}
.media__tag svg { width: 1.3em; height: 1.3em; opacity: .85; }
.media__scrim {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(6,8,14,.78) 0%, rgba(6,8,14,.05) 45%, transparent 70%);
  z-index: 1;
}

/* ═══ HEADER BAR ═══════════════════════════════════════════════════════════ */
.bar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  z-index: 5;
}
.bar__brand { display: flex; align-items: center; gap: var(--s-3); }
.bar__logo {
  width: calc(var(--u)*5.4); height: calc(var(--u)*5.4);
  border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3);
  box-shadow: var(--sh-1);
}
.bar__spacer { flex: 1; }
.bar__clock { font-family: var(--font-mono); font-size: var(--t-lg); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* breadcrumb */
.crumbs { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-size: var(--t-sm); }
.crumbs button { background: none; border: none; color: var(--text-dim); font: inherit; cursor: pointer; padding: var(--s-1) 0; }
.crumbs .sep { color: var(--text-mute); }
.crumbs .now { color: var(--text); font-weight: 700; }

/* ═══ BOTTOM ACTION BAR ════════════════════════════════════════════════════ */
.actionbar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(calc(var(--u)*2));
  box-shadow: 0 calc(var(--u)*-1.2) calc(var(--u)*4) rgba(0,0,0,.25);
  border-top: 1px solid var(--line);
  z-index: 6;
}

/* ═══ SPEC LIST ════════════════════════════════════════════════════════════ */
.specs { display: grid; gap: var(--s-3); }
.spec {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4);
  padding-bottom: var(--s-3);
  border-bottom: 1px solid var(--line);
}
.spec__k { color: var(--text-dim); font-size: var(--t-body); }
.spec__v { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); text-align: right; white-space: nowrap; line-height: 1.05; }
.spec__v small { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--t-xs); color: var(--text-dim); letter-spacing: .02em; }

/* ═══ AMENITY / FEATURE TILE ═══════════════════════════════════════════════ */
.feat {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-md);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.feat__ic {
  flex: none;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.feat__ic svg { width: 55%; height: 55%; }
.feat__t { font-weight: 700; font-size: var(--t-body); }
.feat__d { color: var(--text-dim); font-size: var(--t-sm); }

/* ═══ SHEET / MODAL ════════════════════════════════════════════════════════ */
.scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(4,6,12,.62);
  backdrop-filter: blur(calc(var(--u)*1.2));
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  display: flex; align-items: flex-end; justify-content: center;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-height: 86%;
  background: var(--bg-2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--sh-pop);
  transform: translateY(8%);
  transition: transform var(--dur) var(--ease-out);
  display: flex; flex-direction: column; overflow: hidden;
}
.scrim.is-open .sheet { transform: none; }
.sheet__grip { width: calc(var(--u)*12); height: calc(var(--u)*.8); border-radius: 99px; background: var(--line-strong); margin: var(--s-3) auto 0; flex: none; }

/* ═══ QUANTITY STEPPER ═════════════════════════════════════════════════════ */
.stepper { display: inline-flex; align-items: center; gap: var(--s-3); background: var(--surface); border-radius: var(--r-pill); padding: calc(var(--u)*.7); }
.stepper button {
  width: calc(var(--u)*7); height: calc(var(--u)*7);
  border: none; border-radius: 50%; background: var(--surface-2);
  color: var(--text); font-size: var(--t-h3); font-weight: 700; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.stepper button:active { transform: scale(.88); }
.stepper button.is-accent { background: var(--accent); color: var(--on-accent); }
.stepper__n { min-width: calc(var(--u)*7); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); font-variant-numeric: tabular-nums; }

/* ═══ VIDEO REGION ═════════════════════════════════════════════════════════ */
.video { position: relative; overflow: hidden; background: #05070c; }
.video .media { position: absolute; inset: 0; }
.video__play {
  position: absolute; inset: 0; margin: auto;
  width: calc(var(--u)*14); height: calc(var(--u)*14);
  display: grid; place-items: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.16); backdrop-filter: blur(calc(var(--u)*1.4));
  box-shadow: 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.22), var(--sh-2);
  color: #fff; cursor: pointer; z-index: 3;
  transition: transform var(--dur-fast) var(--spring), opacity var(--dur);
}
.video__play:active { transform: scale(.9); }
.video__play svg { width: 42%; height: 42%; margin-left: 6%; }
.video.is-playing .video__play { opacity: 0; pointer-events: none; }
.video__bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u)*.8); background: rgba(255,255,255,.18); z-index: 4; }
.video__bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

/* ═══ AUDIO GUIDE PLAYER ═══════════════════════════════════════════════════ */
.audio {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-lg);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.audio__btn {
  flex: none; width: calc(var(--u)*9); height: calc(var(--u)*9);
  border: none; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.audio__btn:active { transform: scale(.9); }
.audio__btn svg { width: 40%; height: 40%; }
.wave { flex: 1; display: flex; align-items: center; gap: calc(var(--u)*.5); height: calc(var(--u)*8); }
.wave i {
  flex: 1; border-radius: 99px; background: var(--line-strong);
  height: 30%; transform-origin: center;
}
.audio.is-playing .wave i { animation: waveBeat 1s ease-in-out infinite; background: var(--accent); }
@keyframes waveBeat { 0%,100%{ transform: scaleY(.35) } 50%{ transform: scaleY(1) } }
.audio__time { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ═══ "YOU ARE HERE" WAYFINDING ════════════════════════════════════════════ */
.here {
  position: absolute; width: calc(var(--u)*4); height: calc(var(--u)*4);
  transform: translate(-50%, -50%); z-index: 5;
}
.here::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.5) #fff, var(--sh-2);
}
.here::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); animation: pingPulse 1.8s var(--ease-out) infinite;
}
@keyframes pingPulse { 0%{ transform: scale(1); opacity: .6 } 100%{ transform: scale(3.4); opacity: 0 } }
.here__label {
  position: absolute; left: 50%; bottom: calc(100% + var(--u)*1.4); transform: translateX(-50%);
  white-space: nowrap; padding: calc(var(--u)*.7) var(--s-3); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; box-shadow: var(--sh-2);
}
.here__label::after { content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:calc(var(--u)*.9) solid transparent; border-top-color: var(--accent); }

/* ═══ TAP RIPPLE ═══════════════════════════════════════════════════════════ */
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .26; transform: scale(0); pointer-events: none; animation: rippleGo .6s var(--ease-out) forwards; }
@keyframes rippleGo { to { transform: scale(1); opacity: 0; } }

/* ═══ TOAST ════════════════════════════════════════════════════════════════ */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--u)*6); transform: translate(-50%, 2vmin);
  z-index: 60;
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-pill);
  background: var(--text); color: var(--bg);
  font-size: var(--t-body); font-weight: 700;
  box-shadow: var(--sh-3);
  opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--spring);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 1.3em; height: 1.3em; }

/* ═══ ATTRACT / IDLE SCREEN ════════════════════════════════════════════════ */
.attract {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transition: opacity 600ms var(--ease);
}
.attract.is-on { opacity: 1; pointer-events: auto; }
.attract__bg { position: absolute; inset: 0; }
.attract__bg .media { position: absolute; inset: calc(var(--u)*-4); animation: kenburns 22s ease-in-out infinite alternate; }
@keyframes kenburns { from{ transform: scale(1) translate(0,0) } to{ transform: scale(1.12) translate(-2%, -2%) } }
.attract__body { position: relative; z-index: 2; padding: var(--s-8) var(--s-7); }
.attract__cta {
  display: inline-flex; align-items: center; gap: var(--s-3);
  margin-top: var(--s-5); font-size: var(--t-h3); font-weight: 700;
  animation: breathe 2.4s ease-in-out infinite;
}
.attract__cta .ring { width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: 50%; border: calc(var(--u)*.4) solid var(--accent); display: grid; place-items: center; }
.attract__cta .ring svg { width: 50%; height: 50%; color: var(--accent); }
@keyframes breathe { 0%,100%{ opacity:.7; transform: translateY(0) } 50%{ opacity:1; transform: translateY(calc(var(--u)*-.6)) } }

/* ═══ UTILITY ══════════════════════════════════════════════════════════════ */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.center { align-items: center; justify-content: center; }
.between { justify-content: space-between; }
.gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); } .gap-4 { gap: var(--s-4); } .gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }
.grow { flex: 1; }
.pad-6 { padding: var(--s-6); } .pad-7 { padding: var(--s-7); }
.hidden { display: none !important; }
.fade-up { animation: scrIn-up var(--dur) var(--ease-out) both; }
.stagger > * { animation: scrIn-up var(--dur) var(--ease-out) both; }
@keyframes scrIn-up { from { opacity: 0; transform: translateY(2.5vmin); } to { opacity: 1; transform: none; } }

/* ═══ QSR #2 · ORDER PICKUP & CURBSIDE (theme [data-theme="qsr"]) ═══════════ */
.pk-word{ font-family:var(--font-display); font-weight:800; font-stretch:115%; letter-spacing:.01em }
.pk-hero,.media.pk-hero{ background:
  radial-gradient(90% 90% at 30% 15%, #ffb15a 0%, transparent 55%),

  linear-gradient(150deg,#e07a2c,#9c2f17); }
.pk-bar{ background:var(--bg-2); border-bottom:1px solid var(--line) }

.pk-home{ padding:0 var(--s-6) var(--s-7); display:grid; grid-template-columns:1.1fr 1fr; gap:var(--s-6); align-items:start }
@media (orientation:portrait){ .pk-home{ grid-template-columns:1fr } }

/* keypad entry */
.pk-enter{ margin-top:var(--s-4) }
.pk-display{ font-family:var(--font-display); font-weight:800; font-size:calc(var(--u)*11); letter-spacing:.1em; text-align:center; padding:var(--s-4); background:var(--surface); border-radius:var(--r-lg); outline:1px solid var(--line); outline-offset:-1px; margin-bottom:var(--s-4); min-height:calc(var(--u)*16); display:flex; align-items:center; justify-content:center }
.pk-keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-3) }
.pk-key{ padding:var(--s-5); border:none; border-radius:var(--r-lg); background:var(--surface); color:var(--text); font-family:var(--font-display); font-weight:800; font-size:var(--t-h1); cursor:pointer; outline:1px solid var(--line); outline-offset:-1px; transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) }
.pk-key:active{ transform:scale(.95); background:var(--surface-2) }
.pk-key--fn{ background:var(--surface-2); color:var(--text-dim) }

.pk-note{ display:flex; align-items:center; gap:var(--s-2); margin-top:var(--s-4); color:var(--text-mute); font-size:var(--t-sm) } .pk-note svg{ color:var(--accent-2);flex:none;width:1.3em;height:1.3em }

/* mini board */
.pk-miniboard{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-4); margin-top:var(--s-4) }
.pk-col{ background:var(--surface); border-radius:var(--r-lg); padding:var(--s-4); outline:1px solid var(--line); outline-offset:-1px; display:grid; gap:var(--s-2); align-content:start }
.pk-col__h{ display:flex; align-items:center; gap:var(--s-2); font-family:var(--font-display); font-weight:800; font-size:var(--t-h3); padding-bottom:var(--s-3); border-bottom:2px solid var(--line); margin-bottom:var(--s-1) }
.pk-col__h--prep{ color:var(--accent) } .pk-col__h--ready{ color:var(--good) } .pk-col__h svg{ width:1.1em;height:1.1em }
.pk-chip{ display:flex; align-items:center; justify-content:space-between; padding:var(--s-3) var(--s-4); background:var(--bg-2); border-radius:var(--r-md); font-family:var(--font-display); font-weight:800; font-size:var(--t-h3) } .pk-chip small{ font-family:var(--font-body); font-weight:600; font-size:var(--t-sm); color:var(--text-dim) }
.pk-chip--ready{ background:color-mix(in srgb,var(--good) 12%,var(--surface)); color:var(--good) } .pk-chip--ready small{ color:var(--good) }

/* track */
.pk-track{ padding:0 var(--s-6) var(--s-7) }
.pk-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s-5); flex-wrap:wrap; margin:var(--s-3) 0 var(--s-5) }

.pk-trackhead--prep{ background:linear-gradient(150deg,var(--accent),#9c2f17) }
.pk-trackhead--ready{ background:linear-gradient(150deg,var(--good),#0f7a4d) }
.pk-no{ font-size:calc(var(--u)*10); line-height:1 }

.pk-stepline{ flex:1; height:3px; background:var(--surface-2); margin-bottom:calc(var(--u)*5); border-radius:99px }
.pk-track__mid{ align-items:start }
.pk-items{ display:grid; gap:var(--s-2) }
.pk-item{ padding:var(--s-3) var(--s-4); background:var(--surface); border-radius:var(--r-md); font-size:var(--t-lg); outline:1px solid var(--line); outline-offset:-1px } .pk-item__q{ color:var(--accent-2); font-weight:800 }
.pk-item--total{ display:flex; justify-content:space-between; background:transparent; outline:none; font-family:var(--font-display); font-weight:800; font-size:var(--t-h3); padding-top:var(--s-3) }
.pk-curbcta{ padding:var(--s-6); background:var(--surface); border-radius:var(--r-lg); outline:1px solid var(--line); outline-offset:-1px; display:flex; flex-direction:column; gap:var(--s-2); align-items:flex-start }
.pk-curbcta__ic{ width:calc(var(--u)*10); height:calc(var(--u)*10); border-radius:var(--r-lg); display:grid; place-items:center; background:color-mix(in srgb,var(--accent-2) 18%,transparent); color:var(--accent-2); font-size:var(--t-h1); margin-bottom:var(--s-1) }

/* curbside */
.pk-curb{ padding:0 var(--s-6) calc(var(--u)*16) }
.pk-stalls{ display:grid; grid-template-columns:repeat(8,1fr); gap:var(--s-3) }

.pk-stall:active{ transform:scale(.94) } .pk-stall.is-on{ border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent) }
.pk-curbbar{ position:absolute; left:0; right:0; bottom:0; background:var(--bg-2); display:flex; align-items:center; gap:var(--s-4); padding:var(--s-4) var(--s-6); border-top:1px solid var(--line) }

/* board */
.pk-boardpg{ padding:0 var(--s-6) var(--s-7) }
.pk-board{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s-5) }
.pk-bcol{ background:var(--surface); border-radius:var(--r-lg); padding:var(--s-5); outline:1px solid var(--line); outline-offset:-1px; display:grid; gap:var(--s-3); align-content:start }
.pk-bcol__h{ display:flex; align-items:center; gap:var(--s-2); font-family:var(--font-display); font-weight:800; font-size:var(--t-h2); padding-bottom:var(--s-3); border-bottom:2px solid var(--line) }
.pk-bchip{ display:flex; align-items:center; gap:var(--s-3); padding:var(--s-4); background:var(--bg-2); border-radius:var(--r-md) }
.pk-bchip--ready{ background:color-mix(in srgb,var(--good) 10%,var(--surface)) }
.pk-bchip__no{ font-family:var(--font-display); font-weight:800; font-size:var(--t-h2); color:var(--accent) } .pk-bchip--ready .pk-bchip__no{ color:var(--good) }

/* empty / done */
.pk-empty,.pk-done{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:var(--s-3); padding:var(--s-7) }
.pk-empty__ic{ width:calc(var(--u)*16); height:calc(var(--u)*16); border-radius:50%; background:var(--surface); color:var(--text-mute); display:grid; place-items:center; font-size:calc(var(--u)*8) }
.pk-done__ic{ width:calc(var(--u)*18); height:calc(var(--u)*18); border-radius:50%; background:var(--accent-2); color:var(--on-accent); display:grid; place-items:center; font-size:calc(var(--u)*10) } .pk-done__ic svg{ width:1em;height:1em }

@media (orientation: portrait){
  .pk-miniboard{ grid-template-columns:1fr } .pk-track__mid{ grid-template-columns:1fr } .pk-board{ grid-template-columns:1fr }

}

      sp.style.width = sp.style.height = size + 'px';
      sp.style.left = (e.clientX - r.left - size / 2) + 'px';
      sp.style.top = (e.clientY - r.top - size / 2) + 'px';
      var cs = getComputedStyle(host);
      if (cs.position === 'static') host.style.position = 'relative';
      host.appendChild(sp);
      setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 650);
    },

    // idle / attract ------------------------------------------------------
    _resetIdle: function () {
      var self = this;
      clearTimeout(this.idleTimer);
      var ms = this.cfg.idleMs || 60000;
      this.idleTimer = setTimeout(function () { self._sleep(); }, ms);
    },
    _sleep: function () {
      if (!this.attractEl || this._attractOn) return;
      var fn = this.cfg.attract;
      this.attractEl.innerHTML = '';
      var out = typeof fn === 'function' ? fn.call(this) : fn;
      if (typeof out === 'string') this.attractEl.appendChild(frag(out));
      this.attractEl.classList.add('is-on');
      this._attractOn = true;
    },
    _wake: function () {
      if (!this._attractOn) return;
      this.attractEl.classList.remove('is-on');
      this._attractOn = false;
      // returning from attract sends the user home — kiosks always start fresh
      this.home();
    },

    // live clock ----------------------------------------------------------
    _clock: function () {
      function tick() {
        var els = $$('[data-clock]');
        if (els.length) {
          var t = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          els.forEach(function (el) { el.textContent = t; });
        }
      }
      tick(); setInterval(tick, 15000);
    },

    // media helper: set a real image on a .media element ------------------
    setMedia: function (el, url) {
      if (!el) return;
      el.style.setProperty('--src', 'url("' + url + '")');
      el.classList.add('has-media');
    },

    // simulated video play (placeholder until real <video> wired) ---------
    playVideo: function (el) {
      el.classList.add('is-playing');
      var bar = el.querySelector('.video__bar i'); if (!bar) return;
      var p = 0; clearInterval(el._vt);
      el._vt = setInterval(function () {
        p += 0.4; bar.style.width = p + '%';
        if (p >= 100) { clearInterval(el._vt); el.classList.remove('is-playing'); bar.style.width = '0%'; }
      }, 120);
    },
    toggleAudio: function (el) {
      el.classList.toggle('is-playing');
      var b = el.querySelector('.audio__btn'); if (b) b.innerHTML = icon(el.classList.contains('is-playing') ? 'pause' : 'play');
    },

    // bottom sheet / modal -------------------------------------------------
    sheet: function (html, opts) {
      opts = opts || {};
      this.closeSheet(true);
      var scrim = document.createElement('div');
      scrim.className = 'scrim';
      scrim.innerHTML = '<div class="sheet" style="' + (opts.maxw ? 'max-width:' + opts.maxw + ';margin:0 auto;border-radius:var(--r-xl) var(--r-xl) 0 0' : '') + '"><div class="sheet__grip"></div>' + html + '</div>';
      $('.kiosk').appendChild(scrim);
      this._sheet = scrim;
      var self = this;
      scrim.addEventListener('click', function (e) {
        if (e.target === scrim || e.target.closest('[data-sheet-close]')) self.closeSheet();
      });
      requestAnimationFrame && setTimeout(function () { scrim.classList.add('is-open'); }, 20);
      this._resetIdle();
      return scrim;
    },
    closeSheet: function (instant) {
      var s = this._sheet; if (!s) return;
      this._sheet = null;
      if (instant) { if (s.parentNode) s.parentNode.removeChild(s); return; }
      s.classList.remove('is-open');
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 480);
    },

    // transient toast ------------------------------------------------------
    toast: function (msg, opts) {
      opts = opts || {};
      var t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = (opts.icon ? icon(opts.icon) + ' ' : '') + msg;
      $('.kiosk').appendChild(t);
      setTimeout(function () { t.classList.add('is-on'); }, 20);
      setTimeout(function () { t.classList.remove('is-on'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, opts.ms || 2200);
    },

    // expose helpers
    icon: icon, money: money, h: frag, $: $, $$: $$
  };

  // build a column of audio waveform bars
  Kiosk.waveBars = function (n) {
    n = n || 28; var s = '';
    for (var i = 0; i < n; i++) s += '<i style="height:' + (20 + Math.round(Math.random() * 70)) + '%"></i>';
    return s;
  };

  global.Kiosk = Kiosk;
})(window);

</script>
<script>
/* ===== qsr/pickup/data.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   QSR #2 · ORDER PICKUP & CURBSIDE · CONTENT MODEL  (window.PICKUP)
   Enter an order number to track its progress, check in for curbside, and watch
   the live pickup board (Preparing → Ready). Swap to re-skin any QSR brand.
   ═══════════════════════════════════════════════════════════════════════════ */
window.PICKUP = {
  brandInitials: "S",
  restaurant: "STACK",
  tagline: "Pickup & Curbside",
  hero: { label: "PICKUP COUNTER HERO" },

  stages: ["Order received", "In the kitchen", "Ready for pickup"],

  // live board
  board: {
    preparing: [
      { no: "318", name: "Jordan", etaMin: 4 },
      { no: "321", name: "Priya", etaMin: 6 },
      { no: "324", name: "Marcus", etaMin: 9 }
    ],
    ready: [
      { no: "309", name: "Dana" },
      { no: "312", name: "Sam" },
      { no: "315", name: "Alex" }
    ]
  },

  // sample orders the kiosk can look up (by number)
  orders: {
    "318": { no: "318", name: "Jordan", stage: 1, etaMin: 4, type: "Curbside",
      items: [{ q: 1, name: "The Double Stack — combo" }, { q: 1, name: "Stack Fries (L)" }, { q: 1, name: "Chocolate Shake" }], total: 1847 },
    "324": { no: "324", name: "Marcus", stage: 0, etaMin: 9, type: "Pickup",
      items: [{ q: 2, name: "Smokehouse BBQ" }, { q: 1, name: "Onion Rings" }], total: 2148 },
    "309": { no: "309", name: "Dana", stage: 2, etaMin: 0, type: "Curbside",
      items: [{ q: 1, name: "Crispy Tenders — combo" }, { q: 1, name: "Vanilla Shake" }], total: 1397 }
  },
  recent: ["318", "324", "309"],

  curbside: {
    stalls: ["1", "2", "3", "4", "5", "6", "7", "8"],
    colors: ["Black", "White", "Silver", "Red", "Blue", "Other"],
    types: ["Sedan", "SUV", "Truck", "Van", "Other"]
  },

  note: "Find your order number on your receipt or confirmation text."
};

</script>
<script>
/* ===== qsr/pickup/app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   QSR #2 · ORDER PICKUP & CURBSIDE · SCREENS  (reads window.PICKUP)
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var D = window.PICKUP;
  var icon = Kiosk.icon, money = Kiosk.money;
  function orderByNo(no) { return D.orders[no]; }

  var entry = "";
  var curb = { stall: null, color: null, type: null, order: null };

  function bar(showBack) {
    return '<header class="bar pk-bar">' +
      (showBack ? '<button class="iconbtn" data-back aria-label="Back">' + icon('arrow-left', { sw: 2 }) + '</button>' : '') +
      '<div class="bar__brand"><div class="bar__logo">' + D.brandInitials + '</div>' +
      '<div class="col"><div class="t-h3 pk-word" style="line-height:1">' + D.restaurant + '</div>' +
      '<div class="eyebrow" style="color:var(--text-mute);letter-spacing:.16em">' + D.tagline + '</div></div></div>' +
      '<div class="bar__spacer"></div><nav class="crumbs" data-crumbs></nav><div class="bar__spacer"></div>' +
      '<button class="chip" data-go="board">' + icon('grid') + ' Live board</button>' +
      '<button class="iconbtn" data-home aria-label="Home">' + icon('home', { sw: 2 }) + '</button>' +
    '</header>';
  }

  function attract() {
    return '<div class="attract__bg"><div class="media pk-hero"><div class="media__scrim"></div>' +
      '<div class="media__tag">' + icon('image') + ' ' + D.hero.label + '</div></div></div>' +
      '<div class="attract__body">' +
      '<div class="eyebrow" style="color:var(--accent-2)">' + D.restaurant + ' · ' + D.tagline + '</div>' +
      '<div class="t-mega pk-word" style="color:#fff;margin-top:var(--s-1)">Pick up<br>your order</div>' +
      '<div class="attract__cta" style="color:#fff"><span class="ring">' + icon('touch') + '</span> Touch to track or check in for curbside</div>' +
    '</div>';
  }

  // ── HOME: enter order # + mini board ──────────────────────────────────────
  function home() {
    return bar(false) +
    '<div class="scroll"><div class="pk-home">' +
      '<section class="pk-enter"><div class="eyebrow">Track your order</div>' +
        '<h1 class="t-xl pk-word" style="margin:var(--s-1) 0 var(--s-3)">Enter your order number</h1>' +
        '<div class="pk-display" data-entry>' + (entry || '<span class="dim">— — —</span>') + '</div>' +
        '<div class="pk-keypad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'go'].map(function (k) {
          if (k === 'clear') return '<button class="pk-key pk-key--fn" data-act="key" data-k="clear">' + icon('x', { sw: 2.4 }) + '</button>';
          if (k === 'go') return '<button class="pk-key pk-key--go" data-act="key" data-k="go">' + icon('arrow-right', { sw: 2.6 }) + '</button>';
          return '<button class="pk-key" data-act="key" data-k="' + k + '">' + k + '</button>';
        }).join('') + '</div>' +
        '<div class="pk-recent"><span class="t-sm dim">Recent:</span>' + D.recent.map(function (n) { return '<button class="chip" data-act="track" data-no="' + n + '">#' + n + '</button>'; }).join('') + '</div>' +
        '<p class="pk-note">' + icon('info') + ' ' + D.note + '</p>' +
      '</section>' +
      '<section class="pk-miniboard"><div class="pk-col"><div class="pk-col__h pk-col__h--prep">' + icon('flame') + ' Preparing</div>' +
        D.board.preparing.map(function (o) { return '<div class="pk-chip">#' + o.no + '<small>' + o.etaMin + ' min</small></div>'; }).join('') + '</div>' +
        '<div class="pk-col"><div class="pk-col__h pk-col__h--ready">' + icon('check', { sw: 2.6 }) + ' Ready</div>' +
        D.board.ready.map(function (o) { return '<div class="pk-chip pk-chip--ready">#' + o.no + '<small>' + o.name + '</small></div>'; }).join('') + '</div></section>' +
    '</div></div>';
  }

  // ── TRACK ORDER ───────────────────────────────────────────────────────────
  function track(no) {
    var o = orderByNo(no);
    if (!o) return bar(true) + '<div class="pk-empty"><div class="pk-empty__ic">' + icon('search') + '</div><h1 class="t-h1">Order #' + no + ' not found</h1>' +
      '<p class="t-lg dim">Double-check the number on your receipt.</p><button class="btn btn--primary btn--lg" data-home>' + icon('arrow-left', { sw: 2 }) + ' Try again</button></div>';

    var steps = D.stages.map(function (st, i) {
      var done = i < o.stage, cur = i === o.stage;
      return '<div class="pk-step ' + (done ? 'is-done' : '') + ' ' + (cur ? 'is-cur' : '') + '"><div class="pk-step__dot">' + (done ? icon('check', { sw: 3 }) : (i + 1)) + '</div>' +
        '<div class="pk-step__t">' + st + '</div></div>';
    }).join('<div class="pk-stepline"></div>');

    var ready = o.stage >= 2;
    return bar(true) + '<div class="scroll"><div class="pk-track">' +
      '<div class="pk-trackhead pk-trackhead--' + (ready ? 'ready' : 'prep') + '"><div><div class="eyebrow" style="color:inherit;opacity:.85">Order</div>' +
        '<div class="pk-no pk-word">#' + o.no + '</div><div class="t-h3">' + o.name + ' · ' + o.type + '</div></div>' +
        '<div class="pk-trackhead__status">' + (ready ? icon('check', { sw: 2.4 }) + ' Ready!' : icon('clock') + ' ~' + o.etaMin + ' min') + '</div></div>' +
      '<div class="pk-steps">' + steps + '</div>' +
      '<div class="split pk-track__mid">' +
        '<div><div class="eyebrow" style="margin-bottom:var(--s-3)">In your bag</div><div class="pk-items">' +
          o.items.map(function (it) { return '<div class="pk-item"><span class="pk-item__q">' + it.q + '×</span> ' + it.name + '</div>'; }).join('') +
          '<div class="pk-item pk-item--total"><span>Total</span><b>' + money(o.total) + '</b></div></div></div>' +
        '<div class="pk-curbcta"><div class="pk-curbcta__ic">' + icon('car') + '</div>' +
          '<div class="t-h2">' + (ready ? 'Pull up — we\u2019ll bring it out' : 'Doing curbside?') + '</div>' +
          '<p class="t-body dim pretty">Let us know your stall and car and we\u2019ll run it out the moment it\u2019s ready.</p>' +
          '<button class="btn btn--primary btn--lg btn--block" data-act="startCurb" data-no="' + o.no + '">' + icon('car') + ' I\u2019m here — curbside</button></div>' +
      '</div>' +
    '</div></div>';
  }

  // ── CURBSIDE CHECK-IN ─────────────────────────────────────────────────────
  function curbside() {
    return bar(true) + '<div class="scroll"><div class="pk-curb">' +
      '<div class="pk-head"><div><div class="eyebrow">Curbside check-in</div><h1 class="t-xl pk-word">Where are you parked?</h1></div>' +
        (curb.order ? '<div class="badge badge--accent">Order #' + curb.order + '</div>' : '') + '</div>' +
      '<div class="eyebrow" style="margin-bottom:var(--s-3)">Stall number</div>' +
      '<div class="pk-stalls">' + D.curbside.stalls.map(function (s) {
        return '<button class="pk-stall ' + (curb.stall === s ? 'is-on' : '') + '" data-act="curbStall" data-s="' + s + '">' + s + '</button>';
      }).join('') + '</div>' +
      '<div class="eyebrow" style="margin:var(--s-5) 0 var(--s-3)">Car color</div>' +
      '<div class="chiprow" data-curb="color">' + D.curbside.colors.map(function (c) { return '<button class="chip ' + (curb.color === c ? 'is-on' : '') + '" data-act="curbColor" data-c="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
      '<div class="eyebrow" style="margin:var(--s-5) 0 var(--s-3)">Car type</div>' +
      '<div class="chiprow" data-curb="type">' + D.curbside.types.map(function (t) { return '<button class="chip ' + (curb.type === t ? 'is-on' : '') + '" data-act="curbType" data-t="' + t + '">' + t + '</button>'; }).join('') + '</div>' +
    '</div></div>' +
    '<div class="actionbar pk-curbbar"><div class="t-body dim">' + (curb.stall ? 'Stall ' + curb.stall : 'Pick a stall') + (curb.color ? ' · ' + curb.color : '') + (curb.type ? ' ' + curb.type : '') + '</div>' +
      '<div class="bar__spacer"></div><button class="btn btn--primary btn--lg" data-act="curbConfirm">' + icon('check', { sw: 2.4 }) + ' We\u2019re on our way</button></div>';
  }
  function curbDone() {
    return '<div class="pk-done"><div class="pk-done__ic">' + icon('car', { sw: 2 }) + '</div>' +
      '<div class="eyebrow" style="color:var(--accent-2)">Curbside confirmed</div>' +
      '<h1 class="t-mega pk-word" style="margin:var(--s-2) 0">On our way!</h1>' +
      '<p class="t-h3 dim" style="font-weight:400;max-width:36ch">We\u2019ll bring order #' + (curb.order || '') + ' to ' + (curb.color || '') + ' ' + (curb.type || 'car') + ' in stall ' + (curb.stall || '') + '. Hang tight!</p>' +
      '<button class="btn btn--primary btn--lg" data-act="reset">' + icon('check', { sw: 2.4 }) + ' Done</button></div>';
  }

  // ── LIVE BOARD ────────────────────────────────────────────────────────────
  function board() {
    return bar(true) + '<div class="scroll"><div class="pk-boardpg">' +
      '<div class="pk-head"><div><div class="eyebrow">Live · updates automatically</div><h1 class="t-xl pk-word">Pickup Board</h1></div></div>' +
      '<div class="pk-board">' +
        '<div class="pk-bcol"><div class="pk-bcol__h pk-col__h--prep">' + icon('flame') + ' Preparing</div>' +
          D.board.preparing.map(function (o) { return '<div class="pk-bchip"><span class="pk-bchip__no">#' + o.no + '</span><span class="grow">' + o.name + '</span><span class="badge">' + o.etaMin + ' min</span></div>'; }).join('') + '</div>' +
        '<div class="pk-bcol"><div class="pk-bcol__h pk-col__h--ready">' + icon('check', { sw: 2.6 }) + ' Ready for pickup</div>' +
          D.board.ready.map(function (o) { return '<div class="pk-bchip pk-bchip--ready"><span class="pk-bchip__no">#' + o.no + '</span><span class="grow">' + o.name + '</span><span class="badge badge--good"><span class="dot"></span>Ready</span></div>'; }).join('') + '</div>' +
      '</div>' +
    '</div></div>';
  }

  Kiosk.app({
    theme: 'qsr', start: 'home', idleMs: 50000,
    crumbs: { home: 'Pickup', track: 'Order', curbside: 'Curbside', board: 'Board' },
    screens: { home: home, track: track, curbside: curbside, board: board },
    attract: attract,
    onAction: function (name, el, data) {
      if (name === 'key') {
        if (data.k === 'clear') entry = entry.slice(0, -1);
        else if (data.k === 'go') { if (entry.length) { Kiosk.go('track', entry); } else { Kiosk.toast('Enter your order number', { icon: 'info' }); } return; }
        else if (entry.length < 4) entry += data.k;
        var d = Kiosk.$('[data-entry]'); if (d) d.innerHTML = entry || '<span class="dim">— — —</span>';
      }
      else if (name === 'track') { entry = data.no; Kiosk.go('track', data.no); }
      else if (name === 'startCurb') { curb = { stall: null, color: null, type: null, order: data.no }; Kiosk.go('curbside'); }
      else if (name === 'curbStall') { curb.stall = data.s; Kiosk.$$('.pk-stall').forEach(function (b) { b.classList.toggle('is-on', b.dataset.s === data.s); }); updCurbBar(); }
      else if (name === 'curbColor') { curb.color = data.c; Kiosk.$$('[data-curb="color"] .chip').forEach(function (b) { b.classList.toggle('is-on', b.dataset.c === data.c); }); updCurbBar(); }
      else if (name === 'curbType') { curb.type = data.t; Kiosk.$$('[data-curb="type"] .chip').forEach(function (b) { b.classList.toggle('is-on', b.dataset.t === data.t); }); updCurbBar(); }
      else if (name === 'curbConfirm') { if (!curb.stall) { Kiosk.toast('Pick your stall number', { icon: 'info' }); return; } Kiosk.stack.push({ name: '_curbdone', params: null }); Kiosk.cfg.screens._curbdone = curbDone; Kiosk.refresh(); }
      else if (name === 'reset') { entry = ''; curb = { stall: null, color: null, type: null, order: null }; Kiosk.home(); }
    }
  });

  function updCurbBar() {
    var b = Kiosk.$('.pk-curbbar .t-body');
    if (b) b.textContent = (curb.stall ? 'Stall ' + curb.stall : 'Pick a stall') + (curb.color ? ' · ' + curb.color : '') + (curb.type ? ' ' + curb.type : '');
  }
})();

</script>
<script src="/templates/kiosk/_edit-shim.js"></script>
</body>
