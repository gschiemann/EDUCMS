<!doctype html>
<html lang="en" data-theme="realestate">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== kiosk-core.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE  —  shared design system for all touch templates
   ───────────────────────────────────────────────────────────────────────────
   • Every measurement scales from a single unit, --u (= 1vmin), so the same
     markup is pixel-balanced on a 1920×1080 wall panel AND a 1080×1920 totem.
   • Color + type are fully tokenized. A vertical theme only overrides the
     variables in the ":root[data-theme=...]" blocks at the bottom — never the
     component rules. This is what makes the three verticals one product.
   • Components here are vertical-agnostic. Vertical-specific styling lives in
     each vertical's styles.css.
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* — scale unit: the one knob that makes layouts orientation-proof — */
  --u: 1vmin;

  /* — spacing scale (multiples of --u) — */
  --s-1: calc(var(--u) * 0.5);
  --s-2: calc(var(--u) * 1);
  --s-3: calc(var(--u) * 1.6);
  --s-4: calc(var(--u) * 2.4);
  --s-5: calc(var(--u) * 3.4);
  --s-6: calc(var(--u) * 4.8);
  --s-7: calc(var(--u) * 6.6);
  --s-8: calc(var(--u) * 9);

  /* — type scale — */
  --t-mega:   calc(var(--u) * 11);
  --t-xl:     calc(var(--u) * 7.2);
  --t-h1:     calc(var(--u) * 5.2);
  --t-h2:     calc(var(--u) * 3.7);
  --t-h3:     calc(var(--u) * 2.9);
  --t-lg:     calc(var(--u) * 2.4);
  --t-body:   calc(var(--u) * 2.0);
  --t-sm:     calc(var(--u) * 1.7);
  --t-xs:     calc(var(--u) * 1.42);

  /* — radii — */
  --r-sm: calc(var(--u) * 1.2);
  --r-md: calc(var(--u) * 2);
  --r-lg: calc(var(--u) * 3);
  --r-xl: calc(var(--u) * 4.4);
  --r-pill: 999px;

  /* — motion — */
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-in: cubic-bezier(.4,0,1,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --dur: 460ms;
  --dur-fast: 240ms;

  /* — elevation (soft, layered, never harsh) — */
  --sh-1: 0 calc(var(--u)*0.4) calc(var(--u)*1.4) rgba(8,12,22,.10);
  --sh-2: 0 calc(var(--u)*1.2) calc(var(--u)*3.2) rgba(8,12,22,.16);
  --sh-3: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(8,12,22,.26);
  --sh-pop: 0 calc(var(--u)*3.4) calc(var(--u)*10) rgba(8,12,22,.40);

  /* — fallback theme (overridden per vertical) — */
  --bg: #0e1116;
  --bg-2: #161a22;
  --surface: #1c212b;
  --surface-2: #232a36;
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);
  --text: #f4f6fb;
  --text-dim: #9aa6b8;
  --text-mute: #6b7689;
  --accent: #4f7cff;
  --accent-2: #8a6bff;
  --on-accent: #ffffff;
  --good: #2fc77e;
  --warn: #f5a623;
  --bad: #ef4d6b;

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--t-body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* ═══ STAGE & SCREEN SYSTEM ════════════════════════════════════════════════ */
.kiosk {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* a screen fills the stage; the router stacks them and animates between.
   Visibility is driven by the .is-active class (NOT by animations) so the
   final state is always correct even when the tab is backgrounded and
   rAF/keyframes are throttled. Motion is a transition enhancement only. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(2.5vmin);
  pointer-events: none;
  will-change: transform;
  transition: transform var(--dur) var(--ease-out);
}
.screen.is-active { opacity: 1; transform: none; pointer-events: auto; }
.screen.is-leaving { opacity: 0; }

/* a scroll region inside a screen */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.scroll::-webkit-scrollbar { width: calc(var(--u)*1.2); }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

/* ═══ TYPOGRAPHY ═══════════════════════════════════════════════════════════ */
.display { font-family: var(--font-display); font-weight: 800; line-height: .98; letter-spacing: -.02em; }
.t-mega { font-family: var(--font-display); font-weight: 800; font-size: var(--t-mega); line-height: .92; letter-spacing: -.03em; }
.t-xl   { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: .98; letter-spacing: -.025em; }
.t-h1   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h1); line-height: 1.02; letter-spacing: -.02em; }
.t-h2   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h2); line-height: 1.05; letter-spacing: -.01em; }
.t-h3   { font-family: var(--font-display); font-weight: 600; font-size: var(--t-h3); line-height: 1.1; }
.t-lg   { font-size: var(--t-lg); line-height: 1.45; }
.t-body { font-size: var(--t-body); }
.t-sm   { font-size: var(--t-sm); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--accent);
}
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ═══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn {
  --pad-y: var(--s-3);
  --pad-x: var(--s-5);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--pad-y) var(--pad-x);
  border: none;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), box-shadow var(--dur-fast);
  white-space: nowrap;
}
.btn:active { transform: scale(.955); }
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 calc(var(--u)*1) calc(var(--u)*3) color-mix(in srgb, var(--accent) 45%, transparent); }
.btn--primary:active { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn--ghost { background: transparent; box-shadow: inset 0 0 0 calc(var(--u)*.28) var(--line-strong); }
.btn--lg { --pad-y: var(--s-4); --pad-x: var(--s-6); font-size: calc(var(--t-lg)*1.12); }
.btn--block { display: flex; width: 100%; }
.btn .ic { width: 1.2em; height: 1.2em; }

/* circular icon button (back, close, etc.) */
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  border: none; border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  box-shadow: var(--sh-1); cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.iconbtn:active { transform: scale(.9); background: var(--surface-2); }
.iconbtn svg { width: 45%; height: 45%; }

/* ═══ CHIPS / FILTERS ══════════════════════════════════════════════════════ */
.chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-dim);
  font-size: var(--t-sm); font-weight: 600;
  box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--line);
  cursor: pointer; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"], .chip.is-on {
  background: var(--accent); color: var(--on-accent);
  box-shadow: none;
}
.chip .dot { width: .8em; height: .8em; border-radius: 50%; background: currentColor; }

/* ═══ BADGES ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.8) var(--s-3);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); color: var(--text-dim);
}
.badge .dot { width: .7em; height: .7em; border-radius: 50%; background: currentColor; }
.badge--good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.badge--warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge--bad  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.badge--accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

/* ═══ CARDS ════════════════════════════════════════════════════════════════ */
.card {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast);
  outline: 1px solid var(--line);
  outline-offset: -1px;
}
.card:active { transform: scale(.975); box-shadow: var(--sh-2); }
.card--static { cursor: default; }
.card--static:active { transform: none; }

/* ═══ IMAGE PLACEHOLDER ════════════════════════════════════════════════════
   A refined, intentional placeholder. The dev swaps the background-image (or
   drops an <img>/<video>) and removes [data-img]. The label chip self-hides
   once a real asset is set via .has-media.                                    */
.media {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 20% 10%, color-mix(in srgb,var(--accent) 32%, var(--surface-2)) 0%, transparent 55%),
    radial-gradient(120% 90% at 90% 90%, color-mix(in srgb,var(--accent-2) 30%, var(--surface)) 0%, transparent 55%),
    var(--surface-2);
  background-size: cover; background-position: center;
}
.media::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: calc(var(--u)*4) calc(var(--u)*4);
  mask-image: linear-gradient(135deg, #000, transparent 70%);
  opacity: .5;
}
.media.has-media { background-image: var(--src); }
.media.has-media::after, .media.has-media .media__tag { display: none; }
.media__tag {
  position: absolute; left: var(--s-3); bottom: var(--s-3);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.7) var(--s-3);
  border-radius: var(--r-sm);
  background: rgba(8,10,16,.55);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: .08em; text-transform: uppercase; color: #fff;
  z-index: 2;
}
.media__tag svg { width: 1.3em; height: 1.3em; opacity: .85; }
.media__scrim {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(6,8,14,.78) 0%, rgba(6,8,14,.05) 45%, transparent 70%);
  z-index: 1;
}

/* ═══ HEADER BAR ═══════════════════════════════════════════════════════════ */
.bar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  z-index: 5;
}
.bar__brand { display: flex; align-items: center; gap: var(--s-3); }
.bar__logo {
  width: calc(var(--u)*5.4); height: calc(var(--u)*5.4);
  border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3);
  box-shadow: var(--sh-1);
}
.bar__spacer { flex: 1; }
.bar__clock { font-family: var(--font-mono); font-size: var(--t-lg); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* breadcrumb */
.crumbs { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-size: var(--t-sm); }
.crumbs button { background: none; border: none; color: var(--text-dim); font: inherit; cursor: pointer; padding: var(--s-1) 0; }
.crumbs .sep { color: var(--text-mute); }
.crumbs .now { color: var(--text); font-weight: 700; }

/* ═══ BOTTOM ACTION BAR ════════════════════════════════════════════════════ */
.actionbar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(calc(var(--u)*2));
  box-shadow: 0 calc(var(--u)*-1.2) calc(var(--u)*4) rgba(0,0,0,.25);
  border-top: 1px solid var(--line);
  z-index: 6;
}

/* ═══ SPEC LIST ════════════════════════════════════════════════════════════ */
.specs { display: grid; gap: var(--s-3); }
.spec {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4);
  padding-bottom: var(--s-3);
  border-bottom: 1px solid var(--line);
}
.spec__k { color: var(--text-dim); font-size: var(--t-body); }
.spec__v { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); text-align: right; white-space: nowrap; line-height: 1.05; }
.spec__v small { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--t-xs); color: var(--text-dim); letter-spacing: .02em; }

/* ═══ AMENITY / FEATURE TILE ═══════════════════════════════════════════════ */
.feat {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-md);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.feat__ic {
  flex: none;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.feat__ic svg { width: 55%; height: 55%; }
.feat__t { font-weight: 700; font-size: var(--t-body); }
.feat__d { color: var(--text-dim); font-size: var(--t-sm); }

/* ═══ SHEET / MODAL ════════════════════════════════════════════════════════ */
.scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(4,6,12,.62);
  backdrop-filter: blur(calc(var(--u)*1.2));
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  display: flex; align-items: flex-end; justify-content: center;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-height: 86%;
  background: var(--bg-2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--sh-pop);
  transform: translateY(8%);
  transition: transform var(--dur) var(--ease-out);
  display: flex; flex-direction: column; overflow: hidden;
}
.scrim.is-open .sheet { transform: none; }
.sheet__grip { width: calc(var(--u)*12); height: calc(var(--u)*.8); border-radius: 99px; background: var(--line-strong); margin: var(--s-3) auto 0; flex: none; }

/* ═══ QUANTITY STEPPER ═════════════════════════════════════════════════════ */
.stepper { display: inline-flex; align-items: center; gap: var(--s-3); background: var(--surface); border-radius: var(--r-pill); padding: calc(var(--u)*.7); }
.stepper button {
  width: calc(var(--u)*7); height: calc(var(--u)*7);
  border: none; border-radius: 50%; background: var(--surface-2);
  color: var(--text); font-size: var(--t-h3); font-weight: 700; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.stepper button:active { transform: scale(.88); }
.stepper button.is-accent { background: var(--accent); color: var(--on-accent); }
.stepper__n { min-width: calc(var(--u)*7); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); font-variant-numeric: tabular-nums; }

/* ═══ VIDEO REGION ═════════════════════════════════════════════════════════ */
.video { position: relative; overflow: hidden; background: #05070c; }
.video .media { position: absolute; inset: 0; }
.video__play {
  position: absolute; inset: 0; margin: auto;
  width: calc(var(--u)*14); height: calc(var(--u)*14);
  display: grid; place-items: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.16); backdrop-filter: blur(calc(var(--u)*1.4));
  box-shadow: 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.22), var(--sh-2);
  color: #fff; cursor: pointer; z-index: 3;
  transition: transform var(--dur-fast) var(--spring), opacity var(--dur);
}
.video__play:active { transform: scale(.9); }
.video__play svg { width: 42%; height: 42%; margin-left: 6%; }
.video.is-playing .video__play { opacity: 0; pointer-events: none; }
.video__bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u)*.8); background: rgba(255,255,255,.18); z-index: 4; }
.video__bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

/* ═══ AUDIO GUIDE PLAYER ═══════════════════════════════════════════════════ */
.audio {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-lg);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.audio__btn {
  flex: none; width: calc(var(--u)*9); height: calc(var(--u)*9);
  border: none; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.audio__btn:active { transform: scale(.9); }
.audio__btn svg { width: 40%; height: 40%; }
.wave { flex: 1; display: flex; align-items: center; gap: calc(var(--u)*.5); height: calc(var(--u)*8); }
.wave i {
  flex: 1; border-radius: 99px; background: var(--line-strong);
  height: 30%; transform-origin: center;
}
.audio.is-playing .wave i { animation: waveBeat 1s ease-in-out infinite; background: var(--accent); }
@keyframes waveBeat { 0%,100%{ transform: scaleY(.35) } 50%{ transform: scaleY(1) } }
.audio__time { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ═══ "YOU ARE HERE" WAYFINDING ════════════════════════════════════════════ */
.here {
  position: absolute; width: calc(var(--u)*4); height: calc(var(--u)*4);
  transform: translate(-50%, -50%); z-index: 5;
}
.here::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.5) #fff, var(--sh-2);
}
.here::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); animation: pingPulse 1.8s var(--ease-out) infinite;
}
@keyframes pingPulse { 0%{ transform: scale(1); opacity: .6 } 100%{ transform: scale(3.4); opacity: 0 } }
.here__label {
  position: absolute; left: 50%; bottom: calc(100% + var(--u)*1.4); transform: translateX(-50%);
  white-space: nowrap; padding: calc(var(--u)*.7) var(--s-3); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; box-shadow: var(--sh-2);
}
.here__label::after { content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:calc(var(--u)*.9) solid transparent; border-top-color: var(--accent); }

/* ═══ TAP RIPPLE ═══════════════════════════════════════════════════════════ */
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .26; transform: scale(0); pointer-events: none; animation: rippleGo .6s var(--ease-out) forwards; }
@keyframes rippleGo { to { transform: scale(1); opacity: 0; } }

/* ═══ TOAST ════════════════════════════════════════════════════════════════ */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--u)*6); transform: translate(-50%, 2vmin);
  z-index: 60;
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-pill);
  background: var(--text); color: var(--bg);
  font-size: var(--t-body); font-weight: 700;
  box-shadow: var(--sh-3);
  opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--spring);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 1.3em; height: 1.3em; }

/* ═══ ATTRACT / IDLE SCREEN ════════════════════════════════════════════════ */
.attract {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transition: opacity 600ms var(--ease);
}
.attract.is-on { opacity: 1; pointer-events: auto; }
.attract__bg { position: absolute; inset: 0; }
.attract__bg .media { position: absolute; inset: calc(var(--u)*-4); animation: kenburns 22s ease-in-out infinite alternate; }
@keyframes kenburns { from{ transform: scale(1) translate(0,0) } to{ transform: scale(1.12) translate(-2%, -2%) } }
.attract__body { position: relative; z-index: 2; padding: var(--s-8) var(--s-7); }
.attract__cta {
  display: inline-flex; align-items: center; gap: var(--s-3);
  margin-top: var(--s-5); font-size: var(--t-h3); font-weight: 700;
  animation: breathe 2.4s ease-in-out infinite;
}
.attract__cta .ring { width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: 50%; border: calc(var(--u)*.4) solid var(--accent); display: grid; place-items: center; }
.attract__cta .ring svg { width: 50%; height: 50%; color: var(--accent); }
@keyframes breathe { 0%,100%{ opacity:.7; transform: translateY(0) } 50%{ opacity:1; transform: translateY(calc(var(--u)*-.6)) } }

/* ═══ UTILITY ══════════════════════════════════════════════════════════════ */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.center { align-items: center; justify-content: center; }
.between { justify-content: space-between; }
.gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); } .gap-4 { gap: var(--s-4); } .gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }
.grow { flex: 1; }
.pad-6 { padding: var(--s-6); } .pad-7 { padding: var(--s-7); }
.hidden { display: none !important; }
.fade-up { animation: scrIn-up var(--dur) var(--ease-out) both; }
.stagger > * { animation: scrIn-up var(--dur) var(--ease-out) both; }

/* ═══ THEME: REAL ESTATE — architectural, premium, ink + brass ════════════ */
:root[data-theme="realestate"] {
  --bg: #11151c;
  --bg-2: #161b24;
  --surface: #1b2230;
  --surface-2: #232c3d;
  --line: rgba(214,225,245,.10);
  --line-strong: rgba(214,225,245,.20);
  --text: #f1f5fc;
  --text-dim: #9fb0c9;
  --text-mute: #6a7a93;
  --accent: #c8a25c;       /* brass */
  --accent-2: #6f93c9;     /* steel blue */
  --on-accent: #14181f;
  --good: #4bbf87;
  --warn: #e0a13d;
  --bad: #e06a72;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
}

/* ═══ THEME: MUSEUM — editorial, curatorial, charcoal + amber ═════════════ */
:root[data-theme="museum"] {
  --bg: #0c0b0a;
  --bg-2: #131110;
  --surface: #1a1715;
  --surface-2: #221e1b;
  --line: rgba(245,235,220,.10);
  --line-strong: rgba(245,235,220,.20);
  --text: #f6efe4;
  --text-dim: #b6a994;
  --text-mute: #837664;
  --accent: #d98a3c;       /* ochre/amber */
  --accent-2: #b5483a;     /* terracotta */
  --on-accent: #1a120a;
  --good: #7fae6a;
  --warn: #d9a13c;
  --bad: #c0584b;
  --font-display: "Newsreader", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
}

/* ═══ THEME: FOOD — fresh, appetizing, cream + paprika ════════════════════ */
:root[data-theme="food"] {
  --bg: #fbf6ee;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4ece0;
  --line: rgba(40,30,20,.10);
  --line-strong: rgba(40,30,20,.18);
  --text: #241a12;
  --text-dim: #6c5d4e;
  --text-mute: #9a8a78;
  --accent: #e3502a;       /* paprika/tomato */
  --accent-2: #f0a92a;     /* turmeric */
  --on-accent: #ffffff;
  --good: #2fa463;
  --warn: #e08b2a;
  --bad: #d23b3b;
  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --sh-1: 0 calc(var(--u)*0.5) calc(var(--u)*1.6) rgba(80,50,20,.08);
  --sh-2: 0 calc(var(--u)*1.4) calc(var(--u)*3.6) rgba(80,50,20,.12);
  --sh-3: 0 calc(var(--u)*2.6) calc(var(--u)*7) rgba(80,50,20,.18);
}

/* ═══ ORIENTATION REFLOW HOOKS ═════════════════════════════════════════════
   Layout columns collapse to stacks in portrait. Verticals add their own
   orientation rules in styles.css; these are the shared defaults.            */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-6); }
.split--6040 { grid-template-columns: 6fr 4fr; }
.split--4060 { grid-template-columns: 4fr 6fr; }
@media (orientation: portrait) {
  .split, .split--6040, .split--4060 { grid-template-columns: 1fr; }
  .portrait-hide { display: none !important; }
}
@media (orientation: landscape) {
  .landscape-hide { display: none !important; }
}

/* ===== real-estate/styles.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   REAL ESTATE · vertical layout & bespoke components
   (theme tokens live in kiosk-core.css under [data-theme="realestate"])
   ═══════════════════════════════════════════════════════════════════════════ */

/* refined brass top-rule on the brand logo */
.bar__logo { font-family: var(--font-display); }

/* hero media gets an architectural cool duotone */
.re-hero {
  --src: none;
  background:
    radial-gradient(120% 120% at 75% 8%, color-mix(in srgb,var(--accent) 26%, transparent) 0%, transparent 50%),
    radial-gradient(100% 120% at 12% 95%, color-mix(in srgb,var(--accent-2) 40%, transparent) 0%, transparent 55%),
    linear-gradient(160deg, #1d2736 0%, #0d131c 100%);
}

/* ── HOME ─────────────────────────────────────────────────────────────────── */
.re-home { padding: 0 var(--s-6) var(--s-7); display: grid; gap: var(--s-6); }
.re-heropanel { display: grid; grid-template-columns: 1.15fr 1fr; min-height: calc(var(--u)*46); }
.re-heropanel .re-hero { min-height: calc(var(--u)*40); }
.re-heropanel__body { padding: var(--s-6) var(--s-6) var(--s-6) var(--s-7); display: flex; flex-direction: column; justify-content: center; }
.re-statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-4); margin-top: var(--s-5); }
.re-stat { display: flex; flex-direction: column; gap: var(--s-1); }
.re-stat__v { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h1); line-height: 1; color: var(--accent); }
.re-stat__k { font-size: var(--t-sm); color: var(--text-dim); line-height: 1.2; }

.re-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-4); }
.re-action {
  display: flex; align-items: center; gap: var(--s-4); text-align: left;
  padding: var(--s-5); border: none; cursor: pointer;
  background: var(--surface); border-radius: var(--r-lg);
  outline: 1px solid var(--line); outline-offset: -1px;
  color: var(--text);
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.re-action:active { transform: scale(.975); }
.re-action--primary { background: linear-gradient(150deg, color-mix(in srgb,var(--accent) 26%, var(--surface)), var(--surface)); outline-color: color-mix(in srgb,var(--accent) 40%, transparent); }
.re-action__ic { flex: none; width: calc(var(--u)*8); height: calc(var(--u)*8); border-radius: var(--r-md); display: grid; place-items: center; background: color-mix(in srgb,var(--accent) 18%, transparent); color: var(--accent); font-size: var(--t-h2); }
.re-action__go { margin-left: auto; color: var(--text-mute); font-size: var(--t-h3); }
.re-action--primary .re-action__go { color: var(--accent); }

.re-featured { display: block; }

/* ── SUITE CARD ───────────────────────────────────────────────────────────── */
.re-suite { display: flex; flex-direction: column; }

.re-suite__body { padding: var(--s-5); display: flex; flex-direction: column; gap: 0; }

/* ── LIST / GRID ──────────────────────────────────────────────────────────── */

.re-detail { padding: 0 var(--s-6) calc(var(--u)*22); display: grid; gap: var(--s-7); }
.re-detail__top { align-items: stretch; margin-top: var(--s-4); }

.re-gallery__thumbs { display: flex; gap: var(--s-3); }

.re-thumb.is-sel { outline-color: var(--accent); }
.re-thumb__n { position: absolute; left: var(--s-2); bottom: var(--s-2); font-family: var(--font-mono); font-size: var(--t-xs); color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 6px; }

.re-thumb__play svg { width: 50%; height: 50%; margin-left: 8%; }

.re-summary { display: flex; flex-direction: column; }
.re-specs { margin-top: var(--s-4); }
.re-detail__mid section { display: flex; flex-direction: column; gap: var(--s-4); }
.re-hilist { list-style: none; display: grid; gap: var(--s-3); margin-top: var(--s-1); }
.re-hi { display: flex; gap: var(--s-3); align-items: flex-start; font-size: var(--t-lg); }
.re-hi svg { flex: none; color: var(--accent); width: 1.3em; height: 1.3em; margin-top: .15em; }
.re-amengrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }

/* ── FLOOR PLAN SCHEMATIC ─────────────────────────────────────────────────── */
.re-planwrap { display: block; }
.re-plan { position: relative; aspect-ratio: 21/9; border-radius: var(--r-lg); min-height: calc(var(--u)*34); }
.re-plan--way { aspect-ratio: 4/3; }

.re-plan__core, .re-plan__suite, .re-plan__nb {

/* ── ACTION BAR ───────────────────────────────────────────────────────────── */
.re-actionbar { position: absolute; left: 0; right: 0; bottom: 0; }

.re-way { padding: 0 var(--s-6) var(--s-7); }
.re-way__split { align-items: start; }
.re-way__stack { display: flex; flex-direction: column; gap: calc(var(--u)*.8); background: var(--surface); border-radius: var(--r-lg); padding: var(--s-4); outline: 1px solid var(--line); outline-offset: -1px; }
.re-way__roof { text-align: center; font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: .2em; color: var(--text-mute); padding: var(--s-2); border-bottom: 2px solid var(--accent); margin-bottom: var(--s-2); }
.re-floor {
  display: flex; align-items: center; gap: var(--s-4);

  background: var(--bg-2); border-radius: var(--r-md); color: var(--text);

.re-floor:active { transform: scale(.99); }
.re-floor[disabled] { opacity: .5; cursor: default; }

.re-floor--avail:active { background: color-mix(in srgb,var(--accent) 20%, var(--surface)); }
.re-floor--amenity { background: color-mix(in srgb,var(--accent-2) 10%, var(--surface)); }
.re-floor--here { outline: 2px solid var(--accent); }
.re-floor__lvl { flex: none; width: calc(var(--u)*7); font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); color: var(--accent); text-align: center; }
.re-floor__name { font-weight: 600; font-size: var(--t-body); flex: 1; }
.re-floor__here { display: inline-flex; align-items: center; gap: var(--s-1); color: var(--accent); font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: .08em; text-transform: uppercase; }
.re-floor__here svg { width: 1.2em; height: 1.2em; }
.re-floor__go { color: var(--accent); }

.re-way__floor { background: var(--surface); border-radius: var(--r-lg); padding: var(--s-6); outline: 1px solid var(--line); outline-offset: -1px; }
.re-way__hereblock { display: flex; gap: var(--s-4); align-items: flex-start; }
.re-way__hereblock svg { flex: none; width: calc(var(--u)*7); height: calc(var(--u)*7); color: var(--accent); }
.re-way__legend { display: flex; gap: var(--s-6); flex-wrap: wrap; margin-top: var(--s-6); color: var(--text-dim); font-size: var(--t-sm); }
.re-key { width: calc(var(--u)*2.2); height: calc(var(--u)*2.2); border-radius: 6px; display: inline-block; }
.re-key--avail { background: var(--accent); }
.re-key--amenity { background: var(--accent-2); }
.re-key--leased { background: var(--line-strong); }

/* ── SHEETS ───────────────────────────────────────────────────────────────── */
.re-sheet { padding: var(--s-6) var(--s-7) var(--s-7); display: flex; flex-direction: column; gap: var(--s-5); }
.re-sheet__body { display: grid; gap: var(--s-5); }

.re-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.re-input { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-md); background: var(--surface); color: var(--text-dim); outline: 1px solid var(--line); outline-offset: -1px; font-size: var(--t-body); }

.re-done__ic { width: calc(var(--u)*16); height: calc(var(--u)*16); border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb,var(--good) 20%, transparent); color: var(--good); font-size: calc(var(--u)*9); margin-bottom: var(--s-3); }
.re-sheet--done svg { width: 1em; height: 1em; }

/* ═══ PORTRAIT REFLOW ══════════════════════════════════════════════════════ */
@media (orientation: portrait) {
  .re-heropanel { grid-template-columns: 1fr; }
  .re-heropanel .re-hero { min-height: calc(var(--u)*34); }
  .re-statrow { grid-template-columns: repeat(2, 1fr); }
  .re-actions { grid-template-columns: 1fr; }

  .re-suite--wide .re-suite__img { min-height: calc(var(--u)*28); }
  .re-grid { grid-template-columns: 1fr; }
  .re-amenwrap { grid-template-columns: 1fr 1fr; }
  .re-amengrid { grid-template-columns: 1fr; }
  .re-gallery__main { min-height: calc(var(--u)*40); }
  .re-plan { aspect-ratio: 4/3; }
  .bar .crumbs { display: none; }
}

/* tighten the very wide ribbon-style header on small heights */
@media (max-height: 560px) { .re-statrow { gap: var(--s-2); } }

<script>
/* ===== kiosk-core.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE ENGINE
   ───────────────────────────────────────────────────────────────────────────
   A tiny, dependency-free engine for touch kiosks. It gives every template:
     • a screen ROUTER with a navigation stack + animated transitions
     • declarative navigation via data-attributes (no per-element wiring)
     • an IDLE/ATTRACT manager that resets the kiosk after inactivity
     • orientation control (auto from viewport, or ?o=portrait|landscape)
     • a tap RIPPLE for physical touch feedback
     • a line-ICON set, a live clock, money formatting, and small DOM helpers

   ── How a vertical uses it ──────────────────────────────────────────────────
     Kiosk.app({
       theme:   'realestate',          // sets <html data-theme>
       start:   'home',                // first screen
       idleMs:  60000,                 // ms of inactivity → attract loop
       screens: {                      // name → (params) => HTML string or Node
         home:   (p) => `...`,
         space:  (p) => `...`,
       },
       attract: (p) => `...`,          // the idle/attract screen
       crumbs:  { home:'Overview', space:'Suite' },   // optional breadcrumb labels
       onAction(name, el, data){ ... } // handle [data-act="name"] taps
     });

   ── Declarative navigation (put on any tappable element) ────────────────────

<script>
/* ===== real-estate/app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   REAL ESTATE KIOSK · SCREENS
   Reads everything from window.PROPERTY. Screens are pure render functions;
   all interaction flows through Kiosk's data-attribute delegation + onAction.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var D = window.PROPERTY;
  var icon = Kiosk.icon;
  var shortlist = new Set();

  // ── formatting helpers ──────────────────────────────────────────────────
  function sf(n) { return n.toLocaleString('en-US'); }
  function rateLine(s) { return "$" + s.ratePerSfYear + " /SF/yr"; }
  function monthly(s) { return "$" + Math.round(s.sqft * s.ratePerSfYear / 12).toLocaleString('en-US') + "/mo est."; }
  function statusBadge(st) {
    if (st === "available") return '<span class="badge badge--good"><span class="dot"></span>Available now</span>';
    if (st === "pending") return '<span class="badge badge--warn"><span class="dot"></span>Pending · waitlist</span>';
    return '<span class="badge"><span class="dot"></span>Leased</span>';
  }
  function suiteById(id) { return D.spaces.filter(function (s) { return s.id === id; })[0]; }

  // ── reusable header bar ───────────────────────────────────────────────────
  function bar(showBack) {
    return '<header class="bar">' +
      (showBack ? '<button class="iconbtn" data-back aria-label="Back">' + icon('arrow-left', { sw: 2 }) + '</button>' : '') +
      '<div class="bar__brand"><div class="bar__logo">' + D.brandInitials + '</div>' +
      '<div class="col"><div class="t-h3" style="line-height:1">' + D.name + '</div>' +
      '<div class="eyebrow" style="color:var(--text-mute);letter-spacing:.16em">' + D.address + '</div></div></div>' +
      '<div class="bar__spacer"></div>' +
      '<nav class="crumbs" data-crumbs></nav>' +
      '<div class="bar__spacer"></div>' +
      '<button class="chip" data-go="wayfinding">' + icon('pin') + ' Wayfinding</button>' +
      '<div class="bar__clock" data-clock></div>' +
      '<button class="iconbtn" data-home aria-label="Home">' + icon('home', { sw: 2 }) + '</button>' +
    '</header>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // ATTRACT
  // ════════════════════════════════════════════════════════════════════════
  function attract() {
    return '' +
      '<div class="attract__bg"><div class="media re-hero"><div class="media__scrim"></div>' +
        '<div class="media__tag">' + icon('image') + ' ' + D.hero.label + '</div></div></div>' +
      '<div class="attract__body">' +
        '<div class="eyebrow" style="color:#fff;opacity:.8">Now Leasing · ' + D.address + '</div>' +
        '<div class="t-mega" style="color:#fff;margin-top:var(--s-3);max-width:18ch">' + D.name + '</div>' +
        '<div class="t-h3 dim" style="color:rgba(255,255,255,.82);font-family:var(--font-body);font-weight:500;max-width:30ch;margin-top:var(--s-3)">' + D.tagline + '</div>' +
        '<div class="attract__cta" style="color:#fff"><span class="ring">' + icon('touch') + '</span> Touch anywhere to explore the building</div>' +
      '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // HOME · property overview
  // ════════════════════════════════════════════════════════════════════════
  function home() {
    var stats = D.stats.map(function (s) {
      return '<div class="re-stat"><div class="re-stat__v">' + s.v + '</div><div class="re-stat__k">' + s.k + '<br><span class="mute">' + s.sub + '</span></div></div>';
    }).join('');

    var feature = D.spaces.filter(function (s) { return s.status === 'available'; })[0];

    return bar(false) +
    '<div class="scroll"><div class="re-home">' +

      // HERO PANEL
      '<section class="re-heropanel card card--static">' +
        '<div class="media re-hero"><div class="media__scrim"></div>' +
          '<div class="media__tag">' + icon('image') + ' ' + D.hero.label + '</div></div>' +
        '<div class="re-heropanel__body">' +
          '<div class="eyebrow">The Property</div>' +
          '<h1 class="t-xl" style="margin:var(--s-2) 0">' + D.name + '</h1>' +
          '<p class="t-lg dim pretty" style="max-width:46ch">' + D.about + '</p>' +
          '<div class="re-statrow">' + stats + '</div>' +
        '</div>' +
      '</section>' +

      // PRIMARY ACTIONS
      '<section class="re-actions">' +
        action('layers', 'Explore Available Suites', D.spaces.filter(function (s) { return s.status !== 'leased'; }).length + ' spaces · 3,260–12,480 SF', 'spaces', true) +
        action('star', 'Building Amenities', D.amenities.length + ' tenant amenities', 'amenities', false) +
        action('pin', 'Wayfinding & You-Are-Here', 'Find any floor, suite, or amenity', 'wayfinding', false) +
      '</section>' +

      // FEATURED SUITE
      '<section class="re-featured">' +
        '<div class="row between" style="margin-bottom:var(--s-3)"><div class="eyebrow">Featured Availability</div>' +
        '<button class="chip" data-go="spaces">View all ' + icon('arrow-right', { sw: 2 }) + '</button></div>' +
        suiteCard(feature, true) +
      '</section>' +

    '</div></div>';
  }

  function action(ic, title, sub, go, primary) {
    return '<button class="re-action ' + (primary ? 're-action--primary' : '') + '" data-go="' + go + '">' +
      '<span class="re-action__ic">' + icon(ic) + '</span>' +
      '<span class="col" style="align-items:flex-start;text-align:left"><span class="t-h3">' + title + '</span>' +
      '<span class="t-sm dim">' + sub + '</span></span>' +
      '<span class="re-action__go">' + icon('arrow-right', { sw: 2 }) + '</span>' +
    '</button>';
  }

  // ── suite card ────────────────────────────────────────────────────────────
  function suiteCard(s, wide) {
    return '<div class="card re-suite ' + (wide ? 're-suite--wide' : '') + '" data-go="space:' + s.id + '">' +
      '<div class="media re-suite__img"><div class="media__scrim"></div>' +
        '<div class="media__tag">' + icon('image') + ' ' + s.images[0] + '</div>' +
        '<div class="re-suite__status">' + statusBadge(s.status) + '</div>' +
      '</div>' +
      '<div class="re-suite__body">' +
        '<div class="row between"><div><div class="t-h2">' + s.name + '</div>' +
          '<div class="t-sm dim">Floor ' + s.floor + ' · ' + s.type + '</div></div>' +
          '<div class="re-suite__rate"><div class="t-h3">' + sf(s.sqft) + ' <small class="dim">SF</small></div>' +
          '<div class="t-sm dim">' + rateLine(s) + '</div></div>' +
        '</div>' +
        (wide ? '<p class="t-body dim pretty" style="margin-top:var(--s-3)">' + s.blurb + '</p>' : '') +
        '<div class="row between" style="margin-top:var(--s-3)">' +
          '<div class="chiprow">' + s.amenities.slice(0, 3).map(function (a) {
            var m = D.amenityLabels[a]; return m ? '<span class="chip" style="pointer-events:none">' + icon(m.icon) + m.t + '</span>' : '';
          }).join('') + '</div>' +
          '<span class="re-suite__cta">View suite ' + icon('arrow-right', { sw: 2 }) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // SPACES · available suites list with filters
  // ════════════════════════════════════════════════════════════════════════
  var filters = { size: 'all', status: 'all' };
  function spaces() {
    return bar(true) +
    '<div class="scroll"><div class="re-list">' +
      '<div class="re-list__head">' +
        '<div><div class="eyebrow">Leasing Inventory</div><h1 class="t-xl">Available Suites</h1></div>' +
        '<div class="re-filters">' +
          filterGroup('status', [['all', 'All'], ['available', 'Available now'], ['pending', 'Pending']]) +
          filterGroup('size', [['all', 'Any size'], ['s', '< 5k SF'], ['m', '5–9k SF'], ['l', '9k+ SF']]) +
        '</div>' +
      '</div>' +
      '<div class="re-grid" id="re-grid">' + grid() + '</div>' +
    '</div></div>';
  }
  function filterGroup(key, opts) {
    return '<div class="chiprow">' + opts.map(function (o) {
      return '<button class="chip ' + (filters[key] === o[0] ? 'is-on' : '') + '" data-act="filter" data-key="' + key + '" data-val="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  function grid() {
    var list = D.spaces.filter(function (s) {
      if (filters.status !== 'all' && s.status !== filters.status) return false;
      if (filters.size === 's' && s.sqft >= 5000) return false;
      if (filters.size === 'm' && (s.sqft < 5000 || s.sqft >= 9000)) return false;
      if (filters.size === 'l' && s.sqft < 9000) return false;
      return true;
    });
    if (!list.length) return '<div class="re-empty t-h3 dim">No suites match these filters.</div>';
    return list.map(function (s) { return suiteCard(s, false); }).join('');
  }

  // ════════════════════════════════════════════════════════════════════════
  // SPACE · suite detail with gallery
  // ════════════════════════════════════════════════════════════════════════
  function space(id) {
    var s = suiteById(id);
    if (!s) return '<div class="pad-7 t-h2">Suite not found</div>';
    var inShort = shortlist.has(s.id);

    var amen = s.amenities.map(function (a) {
      var m = D.amenityLabels[a]; if (!m) return '';
      return '<div class="feat"><span class="feat__ic">' + icon(m.icon) + '</span><div><div class="feat__t">' + m.t + '</div></div></div>';
    }).join('');

    var hi = s.highlights.map(function (h) {
      return '<li class="re-hi">' + icon('check', { sw: 2.4 }) + '<span>' + h + '</span></li>';
    }).join('');

    return bar(true) +
    '<div class="scroll"><div class="re-detail">' +

      '<div class="split split--6040 re-detail__top">' +
        // GALLERY
        '<div class="re-gallery" data-gallery>' +
          '<div class="media re-gallery__main" data-gallery-main>' +
            '<div class="media__scrim"></div>' +
            '<button class="iconbtn re-gallery__zoom" data-act="zoom" data-suite="' + s.id + '">' + icon('expand', { sw: 2 }) + '</button>' +
            '<div class="media__tag">' + icon('image') + ' <span data-gallery-label>' + s.images[0] + '</span></div>' +
          '</div>' +
          '<div class="re-gallery__thumbs">' + s.images.map(function (im, i) {
            return '<button class="media re-thumb ' + (i === 0 ? 'is-sel' : '') + '" data-act="gallery" data-i="' + i + '" data-label="' + im + '"><div class="re-thumb__n">' + (i + 1) + '</div></button>';
          }).join('') +
          '<button class="media re-thumb re-thumb--video" data-act="video"><span class="re-thumb__play">' + icon('play') + '</span><div class="re-thumb__n">Tour</div></button>' +
          '</div>' +
        '</div>' +
        // SUMMARY
        '<div class="re-summary">' +
          statusBadge(s.status) +
          '<h1 class="t-xl" style="margin:var(--s-2) 0 0">' + s.name + '</h1>' +
          '<div class="t-h3 dim" style="font-family:var(--font-body);font-weight:500">Floor ' + s.floor + ' · ' + s.type + '</div>' +
          '<p class="t-lg dim pretty" style="margin:var(--s-3) 0">' + s.blurb + '</p>' +
          '<div class="specs re-specs">' +
            spec('ruler', 'Size', sf(s.sqft) + ' <small>SF</small>') +
            spec('tag', 'Asking rate', '$' + s.ratePerSfYear + ' <small>/SF/yr</small>') +
            spec('building', 'Est. monthly', monthly(s).replace(' est.', '') + ' <small>est.</small>') +
            spec('layers', 'Ceiling', s.ceiling) +
            spec('clock', 'Available', s.available) +
            spec('calendar', 'Term', s.term) +
          '</div>' +
        '</div>' +
      '</div>' +

      // HIGHLIGHTS + AMENITIES
      '<div class="split re-detail__mid">' +
        '<section><div class="eyebrow">Why lease ' + s.name + '</div>' +
          '<ul class="re-hilist">' + hi + '</ul></section>' +
        '<section><div class="eyebrow">In-suite features</div>' +
          '<div class="re-amengrid">' + amen + '</div></section>' +
      '</div>' +

      // FLOOR PLAN
      '<section class="re-planwrap">' +
        '<div class="row between" style="margin-bottom:var(--s-3)"><div class="eyebrow">Floor Plan</div>' +
          '<button class="chip" data-go="wayfinding:' + s.floor + '">' + icon('pin') + ' See it on the floor</button></div>' +
        '<div class="media re-plan"><div class="media__tag">' + icon('grid') + ' ' + s.plan + '</div>' + planSchematic(s) + '</div>' +
      '</section>' +

    '</div></div>' +

    // STICKY ACTION BAR
    '<div class="actionbar re-actionbar">' +
      '<div class="col" style="gap:0"><div class="t-sm dim">' + s.name + ' · ' + sf(s.sqft) + ' SF</div>' +
        '<div class="t-h3">' + rateLine(s) + ' <span class="dim t-sm">· ' + monthly(s) + '</span></div></div>' +
      '<div class="bar__spacer"></div>' +
      '<button class="btn ' + (inShort ? 'is-saved' : '') + '" data-act="shortlist" data-suite="' + s.id + '" id="shortBtn">' +
        icon(inShort ? 'check' : 'heart') + ' <span>' + (inShort ? 'Shortlisted' : 'Shortlist') + '</span></button>' +
      '<button class="btn btn--primary btn--lg" data-act="tour" data-suite="' + s.id + '">' + icon('calendar') + ' Schedule a Tour</button>' +
    '</div>';
  }
  function spec(ic, k, v) {
    return '<div class="spec"><div class="spec__k">' + k + '</div><div class="spec__v">' + v + '</div></div>';
  }

  // schematic top-down plan: core + corridor + suite footprint + neighbors
  function planSchematic(s) {
    return '<div class="re-plan__grid">' +
      '<div class="re-plan__core">CORE</div>' +
      '<div class="re-plan__suite"><span>' + s.name + '</span><small>' + sf(s.sqft) + ' SF</small></div>' +
      '<div class="re-plan__nb re-plan__nb--a">LEASED</div>' +
      '<div class="re-plan__nb re-plan__nb--b">LEASED</div>' +
      '<div class="here" style="left:50%;top:78%"><div class="here__label">Elevator lobby</div></div>' +
    '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // AMENITIES
  // ════════════════════════════════════════════════════════════════════════
  function amenities() {
    var cards = D.amenities.map(function (a) {
      return '<div class="card card--static re-amen">' +
        '<div class="media re-amen__img"><div class="media__scrim"></div><div class="media__tag">' + icon('image') + ' ' + a.title.toUpperCase() + '</div></div>' +
        '<div class="re-amen__body"><span class="re-amen__ic">' + icon(a.icon) + '</span>' +
          '<div class="t-h3">' + a.title + '</div>' +
          '<p class="t-body dim pretty">' + a.desc + '</p></div>' +
      '</div>';
    }).join('');
    return bar(true) +
    '<div class="scroll"><div class="re-list">' +
      '<div class="re-list__head"><div><div class="eyebrow">Tenant Experience</div>' +
        '<h1 class="t-xl">Building Amenities</h1></div></div>' +
      '<div class="re-amenwrap">' + cards + '</div>' +
    '</div></div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // WAYFINDING · building cross-section + floor plan
  // ════════════════════════════════════════════════════════════════════════
  function wayfinding(floorParam) {
    var rows = D.floors.map(function (f) {
      var hereLobby = f.kind === 'lobby';
      var av = f.available > 0;
      var cls = 're-floor' + (av ? ' re-floor--avail' : '') + (f.kind === 'amenity' ? ' re-floor--amenity' : '') + (hereLobby ? ' re-floor--here' : '');
      var go = av ? ' data-go="wayfinding:' + f.level + '"' : '';
      var suite = av ? D.spaces.filter(function (s) { return String(s.floor) === f.level.replace(/^0/, ''); })[0] : null;
      return '<button class="' + cls + '"' + go + (av ? '' : ' disabled') + '>' +
        '<span class="re-floor__lvl">' + f.level + '</span>' +
        '<span class="re-floor__name">' + f.name + '</span>' +
        (hereLobby ? '<span class="re-floor__here">' + icon('pin') + ' You are here</span>' : '') +
        (av ? '<span class="badge badge--good"><span class="dot"></span>' + f.available + ' available</span>' : (f.kind === 'amenity' ? '<span class="badge badge--accent">Amenity</span>' : '<span class="badge">Leased</span>')) +
        (av ? '<span class="re-floor__go">' + icon('arrow-right', { sw: 2 }) + '</span>' : '') +
      '</button>';
    }).join('');

    var detail;
    var pf = floorParam ? String(floorParam).replace(/^0/, '') : null;
    var suite = pf ? D.spaces.filter(function (s) { return String(s.floor) === pf; })[0] : null;
    if (suite) {
      detail = '<div class="re-way__floor fade-up">' +
        '<div class="eyebrow">Floor ' + suite.floor + '</div>' +
        '<h2 class="t-h1" style="margin:var(--s-1) 0 var(--s-3)">Suite locator</h2>' +
        '<div class="media re-plan re-plan--way">' + planSchematic(suite) +
          '<div class="media__tag">' + icon('grid') + ' ' + suite.plan + '</div></div>' +
        '<button class="btn btn--primary btn--block btn--lg" style="margin-top:var(--s-4)" data-go="space:' + suite.id + '">' +
          'Open ' + suite.name + ' · ' + sf(suite.sqft) + ' SF ' + icon('arrow-right', { sw: 2 }) + '</button>' +
      '</div>';
    } else {
      detail = '<div class="re-way__floor re-way__floor--empty">' +
        '<div class="re-way__hereblock">' + icon('pin') + '<div><div class="t-h2">' + D.here.label + '</div>' +
        '<p class="t-body dim pretty">Tap any highlighted floor on the left to see available suites and walking directions from the lobby.</p></div></div>' +
        '<div class="re-way__legend">' +
          '<span class="row gap-2"><i class="re-key re-key--avail"></i> Available</span>' +
          '<span class="row gap-2"><i class="re-key re-key--amenity"></i> Amenity floor</span>' +
          '<span class="row gap-2"><i class="re-key re-key--leased"></i> Fully leased</span>' +
        '</div>' +
      '</div>';
    }

    return bar(true) +
    '<div class="scroll"><div class="re-way">' +
      '<div class="re-list__head"><div><div class="eyebrow">Wayfinding</div>' +
        '<h1 class="t-xl">Find your floor</h1></div></div>' +
      '<div class="split split--4060 re-way__split">' +
        '<div class="re-way__stack"><div class="re-way__roof">ROOF · SKY LOUNGE</div>' + rows + '</div>' +
        detail +
      '</div>' +
    '</div></div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // TOUR SHEET
  // ════════════════════════════════════════════════════════════════════════
  function tourSheet(s) {
    var days = ['Tue 11', 'Wed 12', 'Thu 13', 'Fri 14', 'Mon 17'];
    var times = ['9:30', '11:00', '1:00', '2:30', '4:00'];
    return '<div class="re-sheet">' +
      '<div class="row between"><div><div class="eyebrow">Schedule a Tour</div>' +
        '<h2 class="t-h1">' + s.name + '</h2><div class="t-body dim">Floor ' + s.floor + ' · ' + sf(s.sqft) + ' SF · ' + rateLine(s) + '</div></div>' +
        '<button class="iconbtn" data-sheet-close>' + icon('x', { sw: 2 }) + '</button></div>' +
      '<div class="re-sheet__body">' +
        '<div class="re-field"><div class="t-sm dim">Pick a day</div><div class="chiprow" data-pick="day">' +
          days.map(function (d, i) { return '<button class="chip ' + (i === 0 ? 'is-on' : '') + '" data-act="pick" data-grp="day">' + d + '</button>'; }).join('') + '</div></div>' +
        '<div class="re-field"><div class="t-sm dim">Pick a time</div><div class="chiprow" data-pick="time">' +
          times.map(function (t, i) { return '<button class="chip ' + (i === 0 ? 'is-on' : '') + '" data-act="pick" data-grp="time">' + t + '</button>'; }).join('') + '</div></div>' +
        '<div class="re-field"><div class="t-sm dim">Your details</div>' +
          '<div class="re-inputs"><div class="re-input">' + icon('star') + ' Name & company</div>' +
          '<div class="re-input">' + icon('phone') + ' Mobile number</div></div>' +
          '<p class="t-xs mute">Tour requests route to ' + D.contact.agent + ' · ' + D.contact.leasing + ' · ' + D.contact.phone + '</p></div>' +
      '</div>' +
      '<div class="re-sheet__foot">' +
        '<button class="btn" data-sheet-close>Cancel</button>' +
        '<button class="btn btn--primary btn--lg grow" data-act="confirmTour" data-suite="' + s.id + '">' + icon('check', { sw: 2.4 }) + ' Confirm tour request</button>' +
      '</div>' +
    '</div>';
  }

  function tourConfirmed(s) {
    return '<div class="re-sheet re-sheet--done">' +
      '<div class="re-done__ic">' + icon('check', { sw: 2.6 }) + '</div>' +
      '<h2 class="t-h1">Tour requested</h2>' +
      '<p class="t-lg dim pretty">' + D.contact.agent + ' will confirm your ' + s.name + ' tour by text shortly. A copy has been sent to the leasing office.</p>' +
      '<button class="btn btn--primary btn--lg" data-sheet-close>Done</button>' +
    '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // APP
  // ════════════════════════════════════════════════════════════════════════
  Kiosk.app({
    theme: 'realestate',
    start: 'home',
    idleMs: 75000,
    crumbs: { home: 'Overview', spaces: 'Available Suites', space: 'Suite', amenities: 'Amenities', wayfinding: 'Wayfinding' },
    screens: { home: home, spaces: spaces, space: space, amenities: amenities, wayfinding: wayfinding },
    attract: attract,
    onAction: function (name, el, data) {
      if (name === 'filter') {
        filters[data.key] = data.val;
        var host = Kiosk.$('#re-grid'); if (host) host.innerHTML = grid();
        // re-render chip states
        Kiosk.$$('.re-filters .chip').forEach(function (c) {
          c.classList.toggle('is-on', filters[c.dataset.key] === c.dataset.val);
        });
      }
      else if (name === 'gallery') {
        var main = Kiosk.$('[data-gallery-main]');
        var lbl = Kiosk.$('[data-gallery-label]');
        if (lbl) lbl.textContent = data.label;
        if (main) { main.style.filter = 'hue-rotate(' + (data.i * 42) + 'deg)'; }
        Kiosk.$$('.re-thumb').forEach(function (t) { t.classList.remove('is-sel'); });
        el.classList.add('is-sel');
      }
      else if (name === 'video') { Kiosk.toast('Playing suite video tour…', { icon: 'play' }); }
      else if (name === 'zoom') { Kiosk.toast('Pinch-zoom enabled on the live kiosk', { icon: 'expand' }); }
      else if (name === 'shortlist') {
        var id = data.suite;
        if (shortlist.has(id)) shortlist.delete(id); else shortlist.add(id);
        var saved = shortlist.has(id);
        el.classList.toggle('is-saved', saved);
        el.innerHTML = icon(saved ? 'check' : 'heart') + ' <span>' + (saved ? 'Shortlisted' : 'Shortlist') + '</span>';
        Kiosk.toast(saved ? 'Added to your shortlist' : 'Removed from shortlist', { icon: saved ? 'check' : 'heart' });
      }
      else if (name === 'tour') { Kiosk.sheet(tourSheet(suiteById(data.suite)), { maxw: '120vmin' }); }
      else if (name === 'pick') {
        var grp = el.closest('[data-pick]');
        if (grp) grp.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-on'); });
        el.classList.add('is-on');
      }
      else if (name === 'confirmTour') {
        var s = suiteById(data.suite);
        Kiosk.sheet(tourConfirmed(s), { maxw: '100vmin' });
      }
    }
  });
})();

</script>
</body>
</html>
