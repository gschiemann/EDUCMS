<!doctype html>
<html lang="en" data-theme="food">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== kiosk-core.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE  —  shared design system for all touch templates
   ───────────────────────────────────────────────────────────────────────────
   • Every measurement scales from a single unit, --u (= 1vmin), so the same
     markup is pixel-balanced on a 1920×1080 wall panel AND a 1080×1920 totem.
   • Color + type are fully tokenized. A vertical theme only overrides the
     variables in the ":root[data-theme=...]" blocks at the bottom — never the
     component rules. This is what makes the three verticals one product.
   • Components here are vertical-agnostic. Vertical-specific styling lives in
     each vertical's styles.css.
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* — scale unit: the one knob that makes layouts orientation-proof — */
  --u: 1vmin;

  /* — spacing scale (multiples of --u) — */
  --s-1: calc(var(--u) * 0.5);
  --s-2: calc(var(--u) * 1);
  --s-3: calc(var(--u) * 1.6);
  --s-4: calc(var(--u) * 2.4);
  --s-5: calc(var(--u) * 3.4);
  --s-6: calc(var(--u) * 4.8);
  --s-7: calc(var(--u) * 6.6);
  --s-8: calc(var(--u) * 9);

  /* — type scale — */
  --t-mega:   calc(var(--u) * 11);
  --t-xl:     calc(var(--u) * 7.2);
  --t-h1:     calc(var(--u) * 5.2);
  --t-h2:     calc(var(--u) * 3.7);
  --t-h3:     calc(var(--u) * 2.9);
  --t-lg:     calc(var(--u) * 2.4);
  --t-body:   calc(var(--u) * 2.0);
  --t-sm:     calc(var(--u) * 1.7);
  --t-xs:     calc(var(--u) * 1.42);

  /* — radii — */
  --r-sm: calc(var(--u) * 1.2);
  --r-md: calc(var(--u) * 2);
  --r-lg: calc(var(--u) * 3);
  --r-xl: calc(var(--u) * 4.4);
  --r-pill: 999px;

  /* — motion — */
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-in: cubic-bezier(.4,0,1,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --dur: 460ms;
  --dur-fast: 240ms;

  /* — elevation (soft, layered, never harsh) — */
  --sh-1: 0 calc(var(--u)*0.4) calc(var(--u)*1.4) rgba(8,12,22,.10);
  --sh-2: 0 calc(var(--u)*1.2) calc(var(--u)*3.2) rgba(8,12,22,.16);
  --sh-3: 0 calc(var(--u)*2.4) calc(var(--u)*7) rgba(8,12,22,.26);
  --sh-pop: 0 calc(var(--u)*3.4) calc(var(--u)*10) rgba(8,12,22,.40);

  /* — fallback theme (overridden per vertical) — */
  --bg: #0e1116;
  --bg-2: #161a22;
  --surface: #1c212b;
  --surface-2: #232a36;
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);
  --text: #f4f6fb;
  --text-dim: #9aa6b8;
  --text-mute: #6b7689;
  --accent: #4f7cff;
  --accent-2: #8a6bff;
  --on-accent: #ffffff;
  --good: #2fc77e;
  --warn: #f5a623;
  --bad: #ef4d6b;

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--t-body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* ═══ STAGE & SCREEN SYSTEM ════════════════════════════════════════════════ */
.kiosk {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* a screen fills the stage; the router stacks them and animates between.
   Visibility is driven by the .is-active class (NOT by animations) so the
   final state is always correct even when the tab is backgrounded and
   rAF/keyframes are throttled. Motion is a transition enhancement only. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  opacity: 0;
  transform: translateY(2.5vmin);
  pointer-events: none;
  will-change: transform;
  transition: transform var(--dur) var(--ease-out);
}
.screen.is-active { opacity: 1; transform: none; pointer-events: auto; }
.screen.is-leaving { opacity: 0; }

/* a scroll region inside a screen */
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.scroll::-webkit-scrollbar { width: calc(var(--u)*1.2); }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; }

/* ═══ TYPOGRAPHY ═══════════════════════════════════════════════════════════ */
.display { font-family: var(--font-display); font-weight: 800; line-height: .98; letter-spacing: -.02em; }
.t-mega { font-family: var(--font-display); font-weight: 800; font-size: var(--t-mega); line-height: .92; letter-spacing: -.03em; }
.t-xl   { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: .98; letter-spacing: -.025em; }
.t-h1   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h1); line-height: 1.02; letter-spacing: -.02em; }
.t-h2   { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h2); line-height: 1.05; letter-spacing: -.01em; }
.t-h3   { font-family: var(--font-display); font-weight: 600; font-size: var(--t-h3); line-height: 1.1; }
.t-lg   { font-size: var(--t-lg); line-height: 1.45; }
.t-body { font-size: var(--t-body); }
.t-sm   { font-size: var(--t-sm); }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--accent);
}
.dim { color: var(--text-dim); }
.mute { color: var(--text-mute); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ═══ BUTTONS ══════════════════════════════════════════════════════════════ */
.btn {
  --pad-y: var(--s-3);
  --pad-x: var(--s-5);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  padding: var(--pad-y) var(--pad-x);
  border: none;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), box-shadow var(--dur-fast);
  white-space: nowrap;
}
.btn:active { transform: scale(.955); }
.btn--primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 calc(var(--u)*1) calc(var(--u)*3) color-mix(in srgb, var(--accent) 45%, transparent); }
.btn--primary:active { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn--ghost { background: transparent; box-shadow: inset 0 0 0 calc(var(--u)*.28) var(--line-strong); }
.btn--lg { --pad-y: var(--s-4); --pad-x: var(--s-6); font-size: calc(var(--t-lg)*1.12); }
.btn--block { display: flex; width: 100%; }
.btn .ic { width: 1.2em; height: 1.2em; }

/* circular icon button (back, close, etc.) */
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  border: none; border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  box-shadow: var(--sh-1); cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.iconbtn:active { transform: scale(.9); background: var(--surface-2); }
.iconbtn svg { width: 45%; height: 45%; }

/* ═══ CHIPS / FILTERS ══════════════════════════════════════════════════════ */
.chiprow { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-dim);
  font-size: var(--t-sm); font-weight: 600;
  box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--line);
  cursor: pointer; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"], .chip.is-on {
  background: var(--accent); color: var(--on-accent);
  box-shadow: none;
}
.chip .dot { width: .8em; height: .8em; border-radius: 50%; background: currentColor; }

/* ═══ BADGES ═══════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.8) var(--s-3);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface-2); color: var(--text-dim);
}
.badge .dot { width: .7em; height: .7em; border-radius: 50%; background: currentColor; }
.badge--good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.badge--warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge--bad  { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.badge--accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }

/* ═══ CARDS ════════════════════════════════════════════════════════════════ */
.card {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  overflow: hidden;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast);
  outline: 1px solid var(--line);
  outline-offset: -1px;
}
.card:active { transform: scale(.975); box-shadow: var(--sh-2); }
.card--static { cursor: default; }
.card--static:active { transform: none; }

/* ═══ IMAGE PLACEHOLDER ════════════════════════════════════════════════════
   A refined, intentional placeholder. The dev swaps the background-image (or
   drops an <img>/<video>) and removes [data-img]. The label chip self-hides
   once a real asset is set via .has-media.                                    */
.media {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 20% 10%, color-mix(in srgb,var(--accent) 32%, var(--surface-2)) 0%, transparent 55%),
    radial-gradient(120% 90% at 90% 90%, color-mix(in srgb,var(--accent-2) 30%, var(--surface)) 0%, transparent 55%),
    var(--surface-2);
  background-size: cover; background-position: center;
}
.media::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: calc(var(--u)*4) calc(var(--u)*4);
  mask-image: linear-gradient(135deg, #000, transparent 70%);
  opacity: .5;
}
.media.has-media { background-image: var(--src); }
.media.has-media::after, .media.has-media .media__tag { display: none; }
.media__tag {
  position: absolute; left: var(--s-3); bottom: var(--s-3);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: calc(var(--u)*.7) var(--s-3);
  border-radius: var(--r-sm);
  background: rgba(8,10,16,.55);
  backdrop-filter: blur(8px);
  font-family: var(--font-mono); font-size: var(--t-xs);
  letter-spacing: .08em; text-transform: uppercase; color: #fff;
  z-index: 2;
}
.media__tag svg { width: 1.3em; height: 1.3em; opacity: .85; }
.media__scrim {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(6,8,14,.78) 0%, rgba(6,8,14,.05) 45%, transparent 70%);
  z-index: 1;
}

/* ═══ HEADER BAR ═══════════════════════════════════════════════════════════ */
.bar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  z-index: 5;
}
.bar__brand { display: flex; align-items: center; gap: var(--s-3); }
.bar__logo {
  width: calc(var(--u)*5.4); height: calc(var(--u)*5.4);
  border-radius: var(--r-md);
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3);
  box-shadow: var(--sh-1);
}
.bar__spacer { flex: 1; }
.bar__clock { font-family: var(--font-mono); font-size: var(--t-lg); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* breadcrumb */
.crumbs { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-size: var(--t-sm); }
.crumbs button { background: none; border: none; color: var(--text-dim); font: inherit; cursor: pointer; padding: var(--s-1) 0; }
.crumbs .sep { color: var(--text-mute); }
.crumbs .now { color: var(--text); font-weight: 700; }

/* ═══ BOTTOM ACTION BAR ════════════════════════════════════════════════════ */
.actionbar {
  flex: none;
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-6);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(calc(var(--u)*2));
  box-shadow: 0 calc(var(--u)*-1.2) calc(var(--u)*4) rgba(0,0,0,.25);
  border-top: 1px solid var(--line);
  z-index: 6;
}

/* ═══ SPEC LIST ════════════════════════════════════════════════════════════ */
.specs { display: grid; gap: var(--s-3); }
.spec {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4);
  padding-bottom: var(--s-3);
  border-bottom: 1px solid var(--line);
}
.spec__k { color: var(--text-dim); font-size: var(--t-body); }
.spec__v { font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); text-align: right; white-space: nowrap; line-height: 1.05; }
.spec__v small { display: block; font-family: var(--font-body); font-weight: 600; font-size: var(--t-xs); color: var(--text-dim); letter-spacing: .02em; }

/* ═══ AMENITY / FEATURE TILE ═══════════════════════════════════════════════ */
.feat {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-md);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.feat__ic {
  flex: none;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.feat__ic svg { width: 55%; height: 55%; }
.feat__t { font-weight: 700; font-size: var(--t-body); }
.feat__d { color: var(--text-dim); font-size: var(--t-sm); }

/* ═══ SHEET / MODAL ════════════════════════════════════════════════════════ */
.scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(4,6,12,.62);
  backdrop-filter: blur(calc(var(--u)*1.2));
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  display: flex; align-items: flex-end; justify-content: center;
}
.scrim.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-height: 86%;
  background: var(--bg-2);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--sh-pop);
  transform: translateY(8%);
  transition: transform var(--dur) var(--ease-out);
  display: flex; flex-direction: column; overflow: hidden;
}
.scrim.is-open .sheet { transform: none; }
.sheet__grip { width: calc(var(--u)*12); height: calc(var(--u)*.8); border-radius: 99px; background: var(--line-strong); margin: var(--s-3) auto 0; flex: none; }

/* ═══ QUANTITY STEPPER ═════════════════════════════════════════════════════ */
.stepper { display: inline-flex; align-items: center; gap: var(--s-3); background: var(--surface); border-radius: var(--r-pill); padding: calc(var(--u)*.7); }
.stepper button {
  width: calc(var(--u)*7); height: calc(var(--u)*7);
  border: none; border-radius: 50%; background: var(--surface-2);
  color: var(--text); font-size: var(--t-h3); font-weight: 700; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast);
}
.stepper button:active { transform: scale(.88); }
.stepper button.is-accent { background: var(--accent); color: var(--on-accent); }
.stepper__n { min-width: calc(var(--u)*7); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--t-h3); font-variant-numeric: tabular-nums; }

/* ═══ VIDEO REGION ═════════════════════════════════════════════════════════ */
.video { position: relative; overflow: hidden; background: #05070c; }
.video .media { position: absolute; inset: 0; }
.video__play {
  position: absolute; inset: 0; margin: auto;
  width: calc(var(--u)*14); height: calc(var(--u)*14);
  display: grid; place-items: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.16); backdrop-filter: blur(calc(var(--u)*1.4));
  box-shadow: 0 0 0 calc(var(--u)*.6) rgba(255,255,255,.22), var(--sh-2);
  color: #fff; cursor: pointer; z-index: 3;
  transition: transform var(--dur-fast) var(--spring), opacity var(--dur);
}
.video__play:active { transform: scale(.9); }
.video__play svg { width: 42%; height: 42%; margin-left: 6%; }
.video.is-playing .video__play { opacity: 0; pointer-events: none; }
.video__bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--u)*.8); background: rgba(255,255,255,.18); z-index: 4; }
.video__bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

/* ═══ AUDIO GUIDE PLAYER ═══════════════════════════════════════════════════ */
.audio {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4);
  background: var(--surface); border-radius: var(--r-lg);
  outline: 1px solid var(--line); outline-offset: -1px;
}
.audio__btn {
  flex: none; width: calc(var(--u)*9); height: calc(var(--u)*9);
  border: none; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.audio__btn:active { transform: scale(.9); }
.audio__btn svg { width: 40%; height: 40%; }
.wave { flex: 1; display: flex; align-items: center; gap: calc(var(--u)*.5); height: calc(var(--u)*8); }
.wave i {
  flex: 1; border-radius: 99px; background: var(--line-strong);
  height: 30%; transform-origin: center;
}
.audio.is-playing .wave i { animation: waveBeat 1s ease-in-out infinite; background: var(--accent); }
@keyframes waveBeat { 0%,100%{ transform: scaleY(.35) } 50%{ transform: scaleY(1) } }
.audio__time { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }

/* ═══ "YOU ARE HERE" WAYFINDING ════════════════════════════════════════════ */
.here {
  position: absolute; width: calc(var(--u)*4); height: calc(var(--u)*4);
  transform: translate(-50%, -50%); z-index: 5;
}
.here::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.5) #fff, var(--sh-2);
}
.here::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--accent); animation: pingPulse 1.8s var(--ease-out) infinite;
}
@keyframes pingPulse { 0%{ transform: scale(1); opacity: .6 } 100%{ transform: scale(3.4); opacity: 0 } }
.here__label {
  position: absolute; left: 50%; bottom: calc(100% + var(--u)*1.4); transform: translateX(-50%);
  white-space: nowrap; padding: calc(var(--u)*.7) var(--s-3); border-radius: var(--r-sm);
  background: var(--accent); color: var(--on-accent);
  font-family: var(--font-mono); font-size: var(--t-xs); font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; box-shadow: var(--sh-2);
}
.here__label::after { content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:calc(var(--u)*.9) solid transparent; border-top-color: var(--accent); }

/* ═══ TAP RIPPLE ═══════════════════════════════════════════════════════════ */
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .26; transform: scale(0); pointer-events: none; animation: rippleGo .6s var(--ease-out) forwards; }
@keyframes rippleGo { to { transform: scale(1); opacity: 0; } }

/* ═══ TOAST ════════════════════════════════════════════════════════════════ */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--u)*6); transform: translate(-50%, 2vmin);
  z-index: 60;
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-pill);
  background: var(--text); color: var(--bg);
  font-size: var(--t-body); font-weight: 700;
  box-shadow: var(--sh-3);
  opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--spring);
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast .ic { width: 1.3em; height: 1.3em; }

/* ═══ ATTRACT / IDLE SCREEN ════════════════════════════════════════════════ */
.attract {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--bg);
  opacity: 0; pointer-events: none;
  transition: opacity 600ms var(--ease);
}
.attract.is-on { opacity: 1; pointer-events: auto; }
.attract__bg { position: absolute; inset: 0; }
.attract__bg .media { position: absolute; inset: calc(var(--u)*-4); animation: kenburns 22s ease-in-out infinite alternate; }
@keyframes kenburns { from{ transform: scale(1) translate(0,0) } to{ transform: scale(1.12) translate(-2%, -2%) } }
.attract__body { position: relative; z-index: 2; padding: var(--s-8) var(--s-7); }
.attract__cta {
  display: inline-flex; align-items: center; gap: var(--s-3);
  margin-top: var(--s-5); font-size: var(--t-h3); font-weight: 700;
  animation: breathe 2.4s ease-in-out infinite;
}
.attract__cta .ring { width: calc(var(--u)*7); height: calc(var(--u)*7); border-radius: 50%; border: calc(var(--u)*.4) solid var(--accent); display: grid; place-items: center; }
.attract__cta .ring svg { width: 50%; height: 50%; color: var(--accent); }
@keyframes breathe { 0%,100%{ opacity:.7; transform: translateY(0) } 50%{ opacity:1; transform: translateY(calc(var(--u)*-.6)) } }

/* ═══ UTILITY ══════════════════════════════════════════════════════════════ */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.center { align-items: center; justify-content: center; }
.between { justify-content: space-between; }
.gap-2 { gap: var(--s-2); } .gap-3 { gap: var(--s-3); } .gap-4 { gap: var(--s-4); } .gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }
.grow { flex: 1; }
.pad-6 { padding: var(--s-6); } .pad-7 { padding: var(--s-7); }
.hidden { display: none !important; }
.fade-up { animation: scrIn-up var(--dur) var(--ease-out) both; }
.stagger > * { animation: scrIn-up var(--dur) var(--ease-out) both; }

/* ═══ THEME: REAL ESTATE — architectural, premium, ink + brass ════════════ */
:root[data-theme="realestate"] {
  --bg: #11151c;
  --bg-2: #161b24;
  --surface: #1b2230;
  --surface-2: #232c3d;
  --line: rgba(214,225,245,.10);
  --line-strong: rgba(214,225,245,.20);
  --text: #f1f5fc;
  --text-dim: #9fb0c9;

  --good: #4bbf87;
  --warn: #e0a13d;
  --bad: #e06a72;

/* ═══ THEME: MUSEUM — editorial, curatorial, charcoal + amber ═════════════ */
:root[data-theme="museum"] {

  --line-strong: rgba(245,235,220,.20);
  --text: #f6efe4;
  --text-dim: #b6a994;
  --text-mute: #837664;
  --accent: #d98a3c;       /* ochre/amber */
  --accent-2: #b5483a;     /* terracotta */
  --on-accent: #1a120a;
  --good: #7fae6a;
  --warn: #d9a13c;

  --font-display: "Newsreader", Georgia, serif;

}

/* ═══ THEME: FOOD — fresh, appetizing, cream + paprika ════════════════════ */
:root[data-theme="food"] {
  --bg: #fbf6ee;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f4ece0;
  --line: rgba(40,30,20,.10);
  --line-strong: rgba(40,30,20,.18);
  --text: #241a12;
  --text-dim: #6c5d4e;
  --text-mute: #9a8a78;
  --accent: #e3502a;       /* paprika/tomato */
  --accent-2: #f0a92a;     /* turmeric */
  --on-accent: #ffffff;
  --good: #2fa463;
  --warn: #e08b2a;

  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --sh-1: 0 calc(var(--u)*0.5) calc(var(--u)*1.6) rgba(80,50,20,.08);
  --sh-2: 0 calc(var(--u)*1.4) calc(var(--u)*3.6) rgba(80,50,20,.12);
  --sh-3: 0 calc(var(--u)*2.6) calc(var(--u)*7) rgba(80,50,20,.18);
}

/* ═══ ORIENTATION REFLOW HOOKS ═════════════════════════════════════════════
   Layout columns collapse to stacks in portrait. Verticals add their own
   orientation rules in styles.css; these are the shared defaults.            */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-6); }
.split--6040 { grid-template-columns: 6fr 4fr; }
.split--4060 { grid-template-columns: 4fr 6fr; }
@media (orientation: portrait) {
  .split, .split--6040, .split--4060 { grid-template-columns: 1fr; }
  .portrait-hide { display: none !important; }
}
@media (orientation: landscape) {
  .landscape-hide { display: none !important; }
}

/* ===== food/styles.css ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   FOOD / QSR · vertical layout & components (theme tokens in [data-theme=food])
   Light, appetizing UI. Big touch targets, confident pricing, fast flow.
   ═══════════════════════════════════════════════════════════════════════════ */

.fd-hero {
  --src: none;
  background:
    radial-gradient(110% 120% at 75% 5%, color-mix(in srgb,var(--accent-2) 60%, transparent) 0%, transparent 50%),
    radial-gradient(120% 120% at 10% 100%, color-mix(in srgb,var(--accent) 70%, transparent) 0%, transparent 55%),
    linear-gradient(150deg, #c9461f 0%, #7d2a12 100%);
}
.fd-bar { background: var(--bg-2); box-shadow: var(--sh-1); }
.fd-ordertype { display: inline-flex; align-items: center; gap: var(--s-2); font-weight: 700; font-size: var(--t-body); color: var(--accent); background: color-mix(in srgb,var(--accent) 12%, transparent); padding: var(--s-2) var(--s-4); border-radius: var(--r-pill); }
.fd-ordertype .dot { width: .7em; height: .7em; border-radius: 50%; background: var(--good); }

/* item media — warm, food-like placeholder */
.fd-card__img, .fd-item__img, .fd-line__img, .fd-ups__img, .fd-hero {
  background:
    radial-gradient(90% 90% at 30% 20%, #f6c98a 0%, transparent 55%),
    radial-gradient(90% 100% at 80% 90%, #d2622f 0%, transparent 55%),
    linear-gradient(150deg, #e8a35a, #b65327);
}
.fd-card__img::after, .fd-item__img::after, .fd-line__img::after { opacity: .25; }

/* ── MENU LAYOUT ──────────────────────────────────────────────────────────── */
.fd-menu { flex: 1; display: grid; grid-template-columns: calc(var(--u)*26) 1fr; overflow: hidden; }
.fd-cats { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-4); overflow-y: auto; background: var(--bg-2); box-shadow: inset calc(var(--u)*-1) 0 calc(var(--u)*2) rgba(0,0,0,.03); }
.fd-cat { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border: none; cursor: pointer; text-align: left; background: transparent; color: var(--text-dim); border-radius: var(--r-md); font-size: var(--t-lg); font-weight: 700; transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.fd-cat:active { transform: scale(.97); }
.fd-cat__ic { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: var(--r-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--text-dim); font-size: var(--t-h3); flex: none; transition: background var(--dur-fast), color var(--dur-fast); }
.fd-cat.is-on { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-2); }
.fd-cat.is-on .fd-cat__ic { background: rgba(255,255,255,.22); color: #fff; }

.fd-menu__scroll { background: var(--bg); }
.fd-items { padding: var(--s-6) var(--s-6) calc(var(--u)*18); }
.fd-cathead { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: var(--s-5); }
.fd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-5); }

.fd-card { display: flex; flex-direction: column; background: var(--surface); text-align: left; border: none; }
.fd-card__img { aspect-ratio: 16/11; position: relative; }
.fd-pop { position: absolute; top: var(--s-3); left: var(--s-3); display: inline-flex; align-items: center; gap: var(--s-1); background: var(--text); color: var(--bg); font-size: var(--t-xs); font-weight: 800; padding: 4px var(--s-2); border-radius: var(--r-pill); }
.fd-pop svg { width: 1.1em; height: 1.1em; color: var(--accent-2); }
.fd-pop--lg { top: var(--s-4); left: var(--s-4); font-size: var(--t-sm); padding: var(--s-2) var(--s-3); }
.fd-card__body { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); flex: 1; }
.fd-card__name { line-height: 1.05; }
.fd-card__price { font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3); color: var(--accent); white-space: nowrap; }
.fd-card__desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fd-card__add { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: var(--t-h3); flex: none; }

.fd-tag svg { width: 1.05em; height: 1.05em; }
.fd-tag--veg { background: color-mix(in srgb,var(--good) 16%, transparent); color: var(--good); }
.fd-tag--spicy { background: color-mix(in srgb,var(--accent) 16%, transparent); color: var(--accent); }

/* floating cart */
.fd-fabwrap { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--s-4) var(--s-6); display: flex; justify-content: center; pointer-events: none; }
.fd-fab {
  pointer-events: auto; display: inline-flex; align-items: center; gap: var(--s-4);
  padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4); border: none; cursor: pointer;
  background: var(--text); color: var(--bg); border-radius: var(--r-pill); box-shadow: var(--sh-3);
  font-size: var(--t-lg); font-weight: 700; min-width: calc(var(--u)*44);
  transition: transform var(--dur-fast) var(--ease), opacity var(--dur-fast);
}
.fd-fab[disabled] { opacity: .55; background: var(--surface-2); color: var(--text-mute); box-shadow: var(--sh-1); }
.fd-fab:not([disabled]):active { transform: scale(.97); }
.fd-fab__ic { position: relative; display: grid; place-items: center; font-size: var(--t-h3); }
.fd-fab__count { position: absolute; top: -0.6em; right: -0.6em; min-width: 1.5em; height: 1.5em; padding: 0 .35em; border-radius: 99px; background: var(--accent); color: #fff; font-size: .55em; display: grid; place-items: center; font-weight: 800; }
.fd-fab__txt { flex: 1; text-align: left; }
.fd-fab__total { background: var(--accent); color: #fff; padding: var(--s-2) var(--s-4); border-radius: var(--r-pill); font-family: var(--font-display); font-weight: 800; }

/* ── ITEM CUSTOMIZE ───────────────────────────────────────────────────────── */
.fd-item { padding: 0 var(--s-6) calc(var(--u)*18); }
.fd-item__top { margin-top: var(--s-4); align-items: start; }
.fd-item__img { aspect-ratio: 4/3; border-radius: var(--r-lg); position: relative; min-height: calc(var(--u)*42); }
.fd-item__info { display: flex; flex-direction: column; }
.fd-baseprice { font-family: var(--font-display); font-weight: 800; font-size: var(--t-h1); color: var(--accent); margin: var(--s-2) 0 var(--s-4); }
.fd-options { display: grid; gap: var(--s-5); }
.fd-optgrp { display: grid; gap: var(--s-3); }
.fd-choices { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.fd-choice {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); color: var(--text);
  font-size: var(--t-lg); font-weight: 600; text-align: left;
  transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease);
}
.fd-choice:active { transform: scale(.98); }
.fd-choice.is-on { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 8%, var(--surface)); }
.fd-choice__mark { width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; color: #fff; font-size: var(--t-sm); }
.fd-choice.is-on .fd-choice__mark { background: var(--accent); border-color: var(--accent); }
.fd-optgrp[data-type="single"] .fd-choice__mark { border-radius: 50%; }
.fd-choice__name { flex: 1; }
.fd-choice__price { font-weight: 700; color: var(--accent); white-space: nowrap; }

.fd-addbar { background: var(--bg-2); }
.fd-stepper { background: var(--surface-2); }
.fd-add { display: flex; justify-content: space-between; }

/* ── CART ─────────────────────────────────────────────────────────────────── */
.fd-cart { padding: 0 var(--s-6) calc(var(--u)*24); }
.fd-lines { display: grid; gap: var(--s-4); }
.fd-line { display: grid; grid-template-columns: calc(var(--u)*18) 1fr; gap: var(--s-4); background: var(--surface); border-radius: var(--r-lg); padding: var(--s-4); box-shadow: var(--sh-1); }
.fd-line__img { aspect-ratio: 1; border-radius: var(--r-md); position: relative; }
.fd-line__img .media__tag { display: none; }
.fd-line__body { display: flex; flex-direction: column; }
.fd-line__price { color: var(--accent); white-space: nowrap; }
.fd-remove { border: none; background: none; color: var(--text-mute); font-weight: 700; font-size: var(--t-sm); display: inline-flex; align-items: center; gap: var(--s-1); cursor: pointer; }
.fd-remove svg { width: 1.1em; height: 1.1em; }

.fd-upsell { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.fd-ups { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); background: var(--surface); border: none; border-radius: var(--r-md); cursor: pointer; box-shadow: var(--sh-1); text-align: left; }
.fd-ups__img { width: calc(var(--u)*9); aspect-ratio: 1; border-radius: var(--r-sm); flex: none; position: relative; }
.fd-ups__img .media__tag { display: none; }
.fd-ups__t { flex: 1; font-weight: 700; font-size: var(--t-body); }
.fd-ups__p { font-family: var(--font-display); font-weight: 800; color: var(--accent); }
.fd-ups__add { width: calc(var(--u)*5.5); height: calc(var(--u)*5.5); border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }

.fd-checkoutbar { background: var(--bg-2); gap: var(--s-5); }
.fd-totals { display: grid; gap: 2px; min-width: calc(var(--u)*30); font-size: var(--t-body); }
.fd-totals__grand { font-family: var(--font-display); font-weight: 800; font-size: var(--t-h3); margin-top: var(--s-1); }
.fd-checkout { display: flex; justify-content: center; }

/* ── CHECKOUT ─────────────────────────────────────────────────────────────── */
.fd-checkoutpg { padding: 0 var(--s-6) calc(var(--u)*18); }
.fd-segs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); }
.fd-seg { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-5); cursor: pointer; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); color: var(--text); text-align: left; transition: border-color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.fd-seg:active { transform: scale(.985); }
.fd-seg.is-on { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 7%, var(--surface)); }
.fd-seg__ic { width: calc(var(--u)*8); height: calc(var(--u)*8); border-radius: var(--r-md); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; font-size: var(--t-h2); flex: none; }
.fd-seg.is-on .fd-seg__ic { background: var(--accent); color: #fff; }
.fd-seg__check { margin-left: auto; width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; color: #fff; opacity: 0; transition: opacity var(--dur-fast); }
.fd-seg.is-on .fd-seg__check { opacity: 1; background: var(--accent); border-color: var(--accent); }
.fd-input { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-md); background: var(--surface); color: var(--text-dim); border: 2px dashed var(--line-strong); font-size: var(--t-lg); }
.fd-input svg { color: var(--accent); }
.fd-review { margin-top: var(--s-6); padding: var(--s-5); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1); display: grid; gap: var(--s-2); }
.fd-review__l { font-size: var(--t-body); }
.fd-send { white-space: nowrap; }

/* ── EMPTY / CONFIRM ──────────────────────────────────────────────────────── */
.fd-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-4); text-align: center; padding: var(--s-8); }
.fd-empty__ic { width: calc(var(--u)*16); height: calc(var(--u)*16); border-radius: 50%; background: var(--surface); color: var(--text-mute); display: grid; place-items: center; font-size: calc(var(--u)*8); }
.fd-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-3); text-align: center; padding: var(--s-7); }
.fd-done__ic { width: calc(var(--u)*18); height: calc(var(--u)*18); border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: calc(var(--u)*10); box-shadow: 0 calc(var(--u)*2) calc(var(--u)*5) color-mix(in srgb,var(--good) 40%, transparent); }
.fd-done__ic svg { width: 1em; height: 1em; }
.fd-done__eta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); margin: var(--s-5) 0; width: min(100%, calc(var(--u)*80)); }
.fd-done__eta .feat { background: var(--surface); }

/* ═══ PORTRAIT REFLOW ══════════════════════════════════════════════════════ */
@media (orientation: portrait) {
  .fd-menu { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .fd-cats { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: var(--s-3) var(--s-4); gap: var(--s-3); }
  .fd-cat { flex-direction: column; gap: var(--s-1); padding: var(--s-3) var(--s-4); font-size: var(--t-sm); white-space: nowrap; }
  .fd-grid { grid-template-columns: 1fr 1fr; }
  .fd-choices { grid-template-columns: 1fr; }
  .fd-item__top { grid-template-columns: 1fr; }
  .fd-item__img { min-height: calc(var(--u)*40); }
  .fd-segs { grid-template-columns: 1fr; }
  .fd-upsell { grid-template-columns: 1fr; }

  .bar .crumbs { display: none; }
  .fd-send { font-size: var(--t-body); }
}

<script>
/* ===== kiosk-core.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   VenueOS · KIOSK CORE ENGINE
   ───────────────────────────────────────────────────────────────────────────
   A tiny, dependency-free engine for touch kiosks. It gives every template:
     • a screen ROUTER with a navigation stack + animated transitions
     • declarative navigation via data-attributes (no per-element wiring)
     • an IDLE/ATTRACT manager that resets the kiosk after inactivity
     • orientation control (auto from viewport, or ?o=portrait|landscape)

    },

    // interaction wiring --------------------------------------------------
    _wire: function (root) {

<script>
/* ===== food/app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   FOOD / QSR KIOSK · SCREENS  (reads window.MENU)
   Full ordering flow: browse → customize → cart → checkout → send to POS.
   Cart + draft item live in module state; the POS hand-off is stubbed in
   sendToPOS() — wire it to your real endpoint there.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var D = window.MENU;
  var icon = Kiosk.icon, money = Kiosk.money;
  function itemById(id) { return D.items.filter(function (i) { return i.id === id; })[0]; }

  // ── ORDER STATE ───────────────────────────────────────────────────────────
  var cart = [];                 // [{uid, itemId, qty, sel, name, unit}]
  var draft = null;              // item being customized
  var orderType = "dinein";
  var uidSeq = 1;

  function cartCount() { return cart.reduce(function (n, l) { return n + l.qty; }, 0); }
  function cartSubtotal() { return cart.reduce(function (s, l) { return s + l.unit * l.qty; }, 0); }
  function cartTax() { return Math.round(cartSubtotal() * D.taxRate); }
  function cartTotal() { return cartSubtotal() + cartTax(); }

  function unitPrice(item, sel) {
    var p = item.priceCents;
    (item.options || []).forEach(function (g) {
      var v = sel[g.id];
      if (!v) return;
      var ids = Array.isArray(v) ? v : [v];
      g.choices.forEach(function (c) { if (ids.indexOf(c.id) > -1) p += c.priceCents; });
    });
    return p;
  }
  function defaultSel(item) {
    var sel = {};
    (item.options || []).forEach(function (g) {
      if (g.type === 'single') sel[g.id] = g.choices[0].id;   // first = default
      else sel[g.id] = [];
    });
    return sel;
  }
  function selSummary(item, sel) {
    var parts = [];
    (item.options || []).forEach(function (g) {
      var v = sel[g.id]; if (!v) return;
      var ids = Array.isArray(v) ? v : [v];
      g.choices.forEach(function (c) {
        if (ids.indexOf(c.id) > -1 && !(c.id === 'none') && !(c.priceCents === 0 && g.type === 'single' && g.choices[0].id === c.id && g.id === 'size'))
          parts.push(c.name);
      });
    });
    return parts.join(' · ');
  }

  function tagBadges(item) {
    return (item.tags || []).map(function (t) {
      var m = D.tagLabels[t]; if (!m) return '';
      return '<span class="badge fd-tag fd-tag--' + t + '">' + icon(m.ic) + ' ' + m.t + '</span>';
    }).join('');
  }

  // ── header ────────────────────────────────────────────────────────────────
  function bar(showBack) {
    return '<header class="bar fd-bar">' +
      (showBack ? '<button class="iconbtn" data-back aria-label="Back">' + icon('arrow-left', { sw: 2 }) + '</button>' : '') +
      '<div class="bar__brand"><div class="bar__logo">' + D.brandInitials + '</div>' +
      '<div class="col"><div class="t-h3" style="line-height:1">' + D.restaurant + '</div>' +
      '<div class="eyebrow" style="color:var(--text-mute);letter-spacing:.14em">' + D.tagline + '</div></div></div>' +
      '<div class="bar__spacer"></div>' +
      '<div class="fd-ordertype"><span class="dot"></span>' + (orderType === 'dinein' ? 'Dine in' : 'Take out') + '</div>' +
      '<button class="iconbtn" data-home aria-label="Start over">' + icon('home', { sw: 2 }) + '</button>' +
    '</header>';
  }

  // floating cart button (menu + item screens)
  function cartFab() {
    var n = cartCount();
    return '<button class="fd-fab ' + (n ? 'is-active' : '') + '" data-go="cart" ' + (n ? '' : 'disabled') + '>' +
      '<span class="fd-fab__ic">' + icon('bag') + (n ? '<span class="fd-fab__count">' + n + '</span>' : '') + '</span>' +
      '<span class="fd-fab__txt">' + (n ? 'View order' : 'Your order is empty') + '</span>' +
      (n ? '<span class="fd-fab__total">' + money(cartTotal()) + '</span>' : '') +
    '</button>';
  }
  function syncFab() {
    var f = Kiosk.$('.fd-fab'); if (!f) return;
    var wrap = f.parentNode; wrap.innerHTML = cartFab();
  }

  // ════════════════════════════════════════════════════════════════════════
  // ATTRACT
  // ════════════════════════════════════════════════════════════════════════
  function attract() {
    return '<div class="attract__bg"><div class="media fd-hero"><div class="media__scrim"></div>' +
        '<div class="media__tag">' + icon('image') + ' ' + D.hero.label + '</div></div></div>' +
      '<div class="attract__body">' +
        '<div class="eyebrow" style="color:#fff;opacity:.85">' + D.restaurant + ' · ' + D.tagline + '</div>' +
        '<div class="t-mega" style="color:#fff;margin-top:var(--s-2)">Order<br>here.</div>' +
        '<div class="attract__cta" style="color:#fff"><span class="ring">' + icon('touch') + '</span> Touch to start your order</div>' +
      '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // MENU
  // ════════════════════════════════════════════════════════════════════════
  var activeCat = D.categories[0].id;
  function menu() {
    return bar(false) +
    '<div class="fd-menu">' +
      // category rail
      '<nav class="fd-cats">' + D.categories.map(function (c) {
        return '<button class="fd-cat ' + (c.id === activeCat ? 'is-on' : '') + '" data-act="cat" data-cat="' + c.id + '">' +
          '<span class="fd-cat__ic">' + icon(c.icon) + '</span><span>' + c.name + '</span></button>';
      }).join('') + '</nav>' +
      // items
      '<div class="scroll fd-menu__scroll"><div class="fd-items" id="fd-items">' + itemsFor(activeCat) + '</div></div>' +
    '</div>' +
    '<div class="fd-fabwrap">' + cartFab() + '</div>';
  }
  function itemsFor(cat) {
    var cobj = D.categories.filter(function (c) { return c.id === cat; })[0];
    var list = D.items.filter(function (i) { return i.cat === cat; });
    return '<div class="fd-cathead"><h1 class="t-xl">' + cobj.name + '</h1><div class="t-body dim">' + list.length + ' options</div></div>' +
      '<div class="fd-grid">' + list.map(itemCard).join('') + '</div>';
  }
  function itemCard(i) {
    return '<button class="card fd-card" data-go="item:' + i.id + '">' +
      '<span class="media fd-card__img"><span class="media__tag">' + icon('image') + ' ' + i.image + '</span>' +
        (i.popular ? '<span class="fd-pop">' + icon('star') + ' Popular</span>' : '') + '</span>' +
      '<span class="fd-card__body">' +
        '<span class="row between gap-2"><span class="t-h3 fd-card__name">' + i.name + '</span><span class="fd-card__price">' + money(i.priceCents) + '</span></span>' +
        '<span class="t-sm dim pretty fd-card__desc">' + i.desc + '</span>' +
        '<span class="row between" style="margin-top:auto;padding-top:var(--s-3)"><span class="row gap-2">' + tagBadges(i) + '<span class="badge">' + i.kcal + ' cal</span></span>' +
        '<span class="fd-card__add">' + icon('plus', { sw: 2.4 }) + '</span></span>' +
      '</span>' +
    '</button>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // ITEM · customize
  // ════════════════════════════════════════════════════════════════════════
  function item(id) {
    var it = itemById(id);
    if (!draft || draft.itemId !== id) draft = { itemId: id, qty: 1, sel: defaultSel(it) };
    var groups = (it.options || []).map(function (g) { return optionGroup(g); }).join('');

    return bar(true) +
    '<div class="scroll"><div class="fd-item">' +
      '<div class="split fd-item__top">' +
        '<div class="media fd-item__img"><div class="media__scrim"></div>' +
          '<div class="media__tag">' + icon('image') + ' ' + it.image + '</div>' +
          (it.popular ? '<div class="fd-pop fd-pop--lg">' + icon('star') + ' Popular</div>' : '') + '</div>' +
        '<div class="fd-item__info">' +
          '<div class="row gap-2 wrap">' + tagBadges(it) + '<span class="badge">' + it.kcal + ' cal</span></div>' +
          '<h1 class="t-xl" style="margin:var(--s-2) 0">' + it.name + '</h1>' +
          '<p class="t-lg dim pretty">' + it.desc + '</p>' +
          '<div class="fd-baseprice">' + money(it.priceCents) + '</div>' +
          (groups ? '<div class="fd-options">' + groups + '</div>' : '<div class="t-body dim" style="margin-top:var(--s-4)">No customization needed — just add it to your order.</div>') +
        '</div>' +
      '</div>' +
    '</div></div>' +

    // sticky add bar
    '<div class="actionbar fd-addbar">' +
      '<div class="stepper fd-stepper"><button data-act="qty" data-d="-1">' + icon('minus', { sw: 2.6 }) + '</button>' +
        '<span class="stepper__n" data-qty>' + draft.qty + '</span>' +
        '<button class="is-accent" data-act="qty" data-d="1">' + icon('plus', { sw: 2.6 }) + '</button></div>' +
      '<button class="btn btn--primary btn--lg grow fd-add" data-act="add" data-item="' + id + '">' +
        '<span>' + icon('bag') + ' Add to order</span><span data-addtotal>' + money(unitPrice(it, draft.sel) * draft.qty) + '</span></button>' +
    '</div>';
  }

  function optionGroup(g) {
    return '<div class="fd-optgrp" data-grp="' + g.id + '" data-type="' + g.type + '">' +
      '<div class="row between"><div class="t-h3">' + g.name + '</div>' +
        '<div class="badge ' + (g.required ? 'badge--accent' : '') + '">' + (g.required ? 'Required' : (g.type === 'multi' ? 'Optional · any' : 'Optional')) + '</div></div>' +
      '<div class="fd-choices">' + g.choices.map(function (c) {
        var on = draft.sel[g.id] && (Array.isArray(draft.sel[g.id]) ? draft.sel[g.id].indexOf(c.id) > -1 : draft.sel[g.id] === c.id);
        return '<button class="fd-choice ' + (on ? 'is-on' : '') + '" data-act="opt" data-grp="' + g.id + '" data-choice="' + c.id + '" data-gtype="' + g.type + '">' +
          '<span class="fd-choice__mark">' + (g.type === 'multi' ? icon('check', { sw: 3 }) : '') + '</span>' +
          '<span class="fd-choice__name">' + c.name + '</span>' +
          (c.priceCents ? '<span class="fd-choice__price">+' + money(c.priceCents) + '</span>' : '<span class="fd-choice__price dim">—</span>') +
        '</button>';
      }).join('') + '</div>' +
    '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // CART
  // ════════════════════════════════════════════════════════════════════════
  function cartScreen() {
    if (!cart.length) {
      return bar(true) + '<div class="fd-empty"><div class="fd-empty__ic">' + icon('bag') + '</div>' +
        '<h1 class="t-h1">Your order is empty</h1><p class="t-lg dim">Add something delicious to get started.</p>' +
        '<button class="btn btn--primary btn--lg" data-home>' + icon('utensils') + ' Browse the menu</button></div>';
    }
    var lines = cart.map(function (l) {
      var it = itemById(l.itemId);
      var sum = selSummary(it, l.sel);
      return '<div class="fd-line">' +
        '<div class="media fd-line__img"><div class="media__tag">' + icon('image') + ' ' + it.image + '</div></div>' +
        '<div class="fd-line__body"><div class="row between"><div class="t-h3">' + it.name + '</div>' +
          '<div class="t-h3 fd-line__price">' + money(l.unit * l.qty) + '</div></div>' +
          (sum ? '<div class="t-sm dim pretty">' + sum + '</div>' : '') +
          '<div class="row between" style="margin-top:var(--s-3)">' +
            '<div class="stepper"><button data-act="line" data-uid="' + l.uid + '" data-d="-1">' + icon('minus', { sw: 2.6 }) + '</button>' +
              '<span class="stepper__n">' + l.qty + '</span>' +
              '<button class="is-accent" data-act="line" data-uid="' + l.uid + '" data-d="1">' + icon('plus', { sw: 2.6 }) + '</button></div>' +
            '<button class="fd-remove" data-act="remove" data-uid="' + l.uid + '">' + icon('x', { sw: 2.2 }) + ' Remove</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var ups = D.upsell.map(function (id) {
      var it = itemById(id);
      return '<button class="fd-ups" data-go="item:' + id + '"><span class="media fd-ups__img"><span class="media__tag">' + icon('image') + '</span></span>' +
        '<span class="fd-ups__t">' + it.name + '</span><span class="fd-ups__p">' + money(it.priceCents) + '</span><span class="fd-ups__add">' + icon('plus', { sw: 2.6 }) + '</span></button>';
    }).join('');

    return bar(true) +
    '<div class="scroll"><div class="fd-cart">' +
      '<div class="fd-cathead"><h1 class="t-xl">Your order</h1><div class="t-body dim">' + cartCount() + ' item' + (cartCount() > 1 ? 's' : '') + ' · ' + (orderType === 'dinein' ? 'Dine in' : 'Take out') + '</div></div>' +
      '<div class="fd-lines">' + lines + '</div>' +
      '<div class="eyebrow" style="margin:var(--s-5) 0 var(--s-3)">Add a little extra</div>' +
      '<div class="fd-upsell">' + ups + '</div>' +
    '</div></div>' +

    '<div class="actionbar fd-checkoutbar">' +
      '<div class="fd-totals"><div class="row between"><span class="dim">Subtotal</span><span>' + money(cartSubtotal()) + '</span></div>' +
        '<div class="row between"><span class="dim">Tax</span><span>' + money(cartTax()) + '</span></div>' +
        '<div class="row between fd-totals__grand"><span>Total</span><span>' + money(cartTotal()) + '</span></div></div>' +
      '<button class="btn btn--primary btn--lg grow fd-checkout" data-go="checkout">' + icon('arrow-right', { sw: 2.4 }) + ' Checkout · ' + money(cartTotal()) + '</button>' +
    '</div>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // CHECKOUT
  // ════════════════════════════════════════════════════════════════════════
  function checkout() {
    return bar(true) +
    '<div class="scroll"><div class="fd-checkoutpg">' +
      '<div class="fd-cathead"><h1 class="t-xl">Almost there</h1><div class="t-body dim">Confirm a few details, then we\u2019ll send it to the kitchen.</div></div>' +
      '<div class="eyebrow" style="margin:var(--s-4) 0 var(--s-3)">How are you dining?</div>' +
      '<div class="fd-segs">' +
        seg('dinein', 'utensils', 'Dine in', 'We\u2019ll bring it to your table') +
        seg('takeout', 'bag', 'Take out', 'Grab it at the counter') +
      '</div>' +
      '<div class="eyebrow" style="margin:var(--s-5) 0 var(--s-3)">Name for the order</div>' +
      '<div class="fd-input">' + icon('star') + ' Tap to enter a name (optional)</div>' +
      '<div class="fd-review"><div class="eyebrow">Order summary</div>' +
        cart.map(function (l) { var it = itemById(l.itemId); return '<div class="row between fd-review__l"><span>' + l.qty + '× ' + it.name + '</span><span>' + money(l.unit * l.qty) + '</span></div>'; }).join('') +
        '<div class="row between fd-review__l dim"><span>Tax</span><span>' + money(cartTax()) + '</span></div>' +
        '<div class="row between fd-totals__grand"><span>Total</span><span>' + money(cartTotal()) + '</span></div>' +
      '</div>' +
    '</div></div>' +

    '<div class="actionbar fd-checkoutbar">' +
      '<div class="col" style="gap:0"><div class="t-sm dim">' + cartCount() + ' items · ' + (orderType === 'dinein' ? 'Dine in' : 'Take out') + '</div>' +
        '<div class="t-h3">' + money(cartTotal()) + '</div></div>' +
      '<div class="bar__spacer"></div>' +
      '<button class="btn btn--primary btn--lg fd-send" data-act="send">' + icon('send') + ' Send order to ' + D.pos.name + '</button>' +
    '</div>';
  }
  function seg(id, ic, t, sub) {
    return '<button class="fd-seg ' + (orderType === id ? 'is-on' : '') + '" data-act="ordertype" data-type="' + id + '">' +
      '<span class="fd-seg__ic">' + icon(ic) + '</span><span class="col" style="align-items:flex-start;text-align:left">' +
      '<span class="t-h3">' + t + '</span><span class="t-sm dim">' + sub + '</span></span>' +
      '<span class="fd-seg__check">' + icon('check', { sw: 3 }) + '</span></button>';
  }

  // ════════════════════════════════════════════════════════════════════════
  // CONFIRMATION
  // ════════════════════════════════════════════════════════════════════════
  var lastOrderNo = 0;
  function confirmed() {
    var no = lastOrderNo;
    return '<div class="fd-done">' +
      '<div class="fd-done__ic">' + icon('check', { sw: 2.6 }) + '</div>' +
      '<div class="eyebrow" style="color:var(--accent)">Sent to ' + D.pos.name + ' · ' + D.pos.lane + '</div>' +
      '<h1 class="t-mega" style="margin:var(--s-2) 0">Order #' + no + '</h1>' +
      '<p class="t-h3 dim" style="font-weight:400">Your order is in the kitchen queue. ' + (orderType === 'dinein' ? 'We\u2019ll bring it to your table.' : 'We\u2019ll call your name at the counter.') + '</p>' +
      '<div class="fd-done__eta"><div class="feat"><span class="feat__ic">' + icon('clock') + '</span><div><div class="feat__t">Estimated ' + D.pos.prepEta + '</div><div class="feat__d">Pushed to the POS in real time</div></div></div>' +
        '<div class="feat"><span class="feat__ic">' + icon('bag') + '</span><div><div class="feat__t">' + cartCount() + ' items · ' + money(cartTotal()) + '</div><div class="feat__d">Receipt printing now</div></div></div></div>' +
      '<button class="btn btn--primary btn--lg" data-act="reset">' + icon('plus', { sw: 2.4 }) + ' Start a new order</button>' +
    '</div>';
  }

  // POS hand-off stub — replace with a real fetch() to your POS/KDS endpoint
  function sendToPOS() {
    lastOrderNo = 1040 + Math.floor(Math.random() * 60);
    var payload = {
      orderNo: lastOrderNo, type: orderType, lane: D.pos.lane,
      lines: cart.map(function (l) { return { itemId: l.itemId, qty: l.qty, sel: l.sel, unit: l.unit }; }),
      subtotal: cartSubtotal(), tax: cartTax(), total: cartTotal()
    };
    // → e.g. fetch('/pos/orders', {method:'POST', body: JSON.stringify(payload)})
    console.log('[POS] order pushed:', payload);
    return payload;
  }

  // ════════════════════════════════════════════════════════════════════════
  // APP
  // ════════════════════════════════════════════════════════════════════════
  Kiosk.app({
    theme: 'food',
    start: 'menu',
    idleMs: 50000,
    crumbs: { menu: 'Menu', item: 'Customize', cart: 'Order', checkout: 'Checkout' },
    screens: { menu: menu, item: item, cart: cartScreen, checkout: checkout, confirmed: confirmed },
    attract: attract,
    onAction: function (name, el, data) {
      var it;
      if (name === 'cat') {
        activeCat = data.cat;
        Kiosk.$$('.fd-cat').forEach(function (c) { c.classList.toggle('is-on', c.dataset.cat === activeCat); });
        var host = Kiosk.$('#fd-items'); if (host) host.innerHTML = itemsFor(activeCat);
      }
      else if (name === 'opt') {
        it = itemById(draft.itemId);
        var grp = data.grp, choice = data.choice;
        if (data.gtype === 'single') {
          draft.sel[grp] = choice;
          var box = el.closest('.fd-choices');
          box.querySelectorAll('.fd-choice').forEach(function (c) { c.classList.remove('is-on'); });
          el.classList.add('is-on');
        } else {
          var arr = draft.sel[grp] || [];
          var i = arr.indexOf(choice);
          if (i > -1) { arr.splice(i, 1); el.classList.remove('is-on'); }
          else { arr.push(choice); el.classList.add('is-on'); }
          draft.sel[grp] = arr;
        }
        updateAddTotal(it);
      }
      else if (name === 'qty') {
        draft.qty = Math.max(1, draft.qty + (+data.d));
        var q = Kiosk.$('[data-qty]'); if (q) q.textContent = draft.qty;
        updateAddTotal(itemById(draft.itemId));
      }
      else if (name === 'add') {
        it = itemById(draft.itemId);
        cart.push({ uid: uidSeq++, itemId: it.id, qty: draft.qty, sel: JSON.parse(JSON.stringify(draft.sel)), unit: unitPrice(it, draft.sel) });
        Kiosk.toast(draft.qty + '× ' + it.name + ' added', { icon: 'check' });
        draft = null;
        Kiosk.back();
        setTimeout(syncFab, 60);
      }
      else if (name === 'line') {
        var line = cart.filter(function (l) { return l.uid == data.uid; })[0];
        if (line) { line.qty = Math.max(1, line.qty + (+data.d)); Kiosk.refresh(); }
      }
      else if (name === 'remove') {
        cart = cart.filter(function (l) { return l.uid != data.uid; });
        Kiosk.refresh();
      }
      else if (name === 'ordertype') {
        orderType = data.type;
        Kiosk.$$('.fd-seg').forEach(function (s) { s.classList.toggle('is-on', s.dataset.type === orderType); });
        var ot = Kiosk.$('.fd-ordertype'); // header (not on this screen) — refresh on next render
      }
      else if (name === 'send') {
        sendToPOS();
        Kiosk.go('confirmed', null, { anim: 'fade' });
        cart = [];
      }
      else if (name === 'reset') {
        orderType = 'dinein'; activeCat = D.categories[0].id; Kiosk.home();
      }
    }
  });

  function updateAddTotal(it) {
    var t = Kiosk.$('[data-addtotal]');
    if (t) t.textContent = money(unitPrice(it, draft.sel) * draft.qty);
  }
})();

</script>
</body>
</html>
