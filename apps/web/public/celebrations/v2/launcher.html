<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VenueOS · Celebration v2</title>
<!--
  Chromeless full-canvas launcher for the v2 celebration pack.
  Same engine + cue files as scratch/design/celebrations-v2/index.html,
  stripped of the picker UI so it embeds cleanly inside an <iframe> on
  the scoreboard and ribbon routes.

  URL params:
    cue     = required cue key (e.g. waterpolo-goal, waterpolo-save)
    format  = scoreboard | ribbon (default: scoreboard)
    team    = team accent hex without # (e.g. 21e6ff). Defaults to the
              cue's first registered swatch when omitted.

  Resizing strategy:
    The canvas is sized by the engine in CSS pixels via its own
    runScoreboard / runRibbon entry points (1920x1080 and 2400x256).
    We set canvas width:100% height:100% in CSS so the parent <iframe>
    can scale arbitrarily without re-rendering the engine. CSS scale
    keeps the cinematic crisp at any board resolution.
-->
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #04060b;
    overflow: hidden;
  }
  #cv {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<!--
  Engine first, then per-sport cue registrations. The cue file calls
  VENUE.register('waterpolo-goal', {…}) etc., so engine MUST load first.
-->
<script src="engine.js"></script>
<script src="cues-waterpolo.js"></script>
<script src="cues-basketball.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var cueKey = q.get('cue');
  var format = q.get('format') || 'scoreboard';
  var team = (q.get('team') || '').replace(/^#?/, '');
  var cv = document.getElementById('cv');

  // 2026-05-27 — when a team hex is provided, repaint the cue's team
  // color on every cue object up front. The cue files cache their
  // defaults at register-time, so an opt-in `team` override has to
  // patch the cached config before runScoreboard/runRibbon reads it.
  if (team && /^[0-9a-f]{3,8}$/i.test(team)) {
    var hex = '#' + team;
    if (window.VENUE && VENUE.list) {
      VENUE.list().forEach(function (k) {
        var c = VENUE.get(k);
        if (c && c.team !== undefined) c.team = hex;
      });
    }
  }

  // 2026-06-04 — LIVE DATA INJECTION. The board / ribbon pass a
  // base64url-encoded JSON `d` param carrying the REAL teams, score,
  // segment/clock, and the operator-attributed scorer. We patch each
  // cue's cached config BEFORE runScoreboard/runRibbon reads it, exactly
  // like the team-color patch above. This replaces the design-time
  // placeholder names (RIVERA / OKONKWO / Newport Harbor 9 — 8) baked
  // into the cue files with the live game's data. When `d` is absent
  // (e.g. the design gallery / a legacy caller), cues keep their built-in
  // demo data — no regression.
  var live = null;
  var draw = q.get('d');
  if (draw) {
    try {
      var b64 = draw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      // decodeURIComponent(escape(atob())) is the UTF-8-safe base64 decode
      // (player names + the "·" separator carry multi-byte chars).
      live = JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) { live = null; }
  }
  if (live && window.VENUE && VENUE.list) {
    var clean = function (v) { return v == null ? '' : String(v); };
    var hex2 = function (v, dflt) {
      v = clean(v).replace(/^#?/, '');
      return /^[0-9a-f]{3,8}$/i.test(v) ? '#' + v : dflt;
    };
    VENUE.list().forEach(function (k) {
      var c = VENUE.get(k);
      if (!c) return;
      // Scorer / featured player. An empty name HIDES the line entirely
      // (engine guards `if(opts.player)`), so when the operator fires
      // without picking a player NO placeholder name leaks to the screen.
      if ('player' in live) {
        var pl = live.player;
        c.player = pl && (clean(pl.name) || clean(pl.number))
          ? { number: clean(pl.number), name: clean(pl.name) }
          : null;
      }
      // Live scoreline — merge over the cue's existing score shape so any
      // field the caller omits keeps the cue's sensible default.
      if (live.home != null || live.away != null || live.hs != null || live.as != null) {
        var s0 = c.score || {}, h0 = s0.home || {}, a0 = s0.away || {};
        c.score = {
          home: {
            abbr: clean(live.ha) || h0.abbr || 'HOME',
            name: clean(live.home) || h0.name || 'HOME',
            color: hex2(live.hc, h0.color || '#21e6ff'),
            goals: live.hs != null ? live.hs : (h0.goals || 0)
          },
          away: {
            abbr: clean(live.aa) || a0.abbr || 'AWAY',
            name: clean(live.away) || a0.name || 'AWAY',
            color: hex2(live.ac, a0.color || '#ff2d55'),
            goals: live.as != null ? live.as : (a0.goals || 0)
          }
        };
      }
      // Live context line (segment · clock). Empty string clears it.
      if ('context' in live) c.context = clean(live.context);
    });
  }

  // No cue key — fail loud (parent iframe should always include one).
  if (!cueKey || !window.VENUE) return;

  if (format === 'ribbon') {
    cv.width = 2400;
    cv.height = 256;
    VENUE.runRibbon(cv, cueKey);
  } else {
    cv.width = 1920;
    cv.height = 1080;
    VENUE.runScoreboard(cv, cueKey);
  }
})();
</script>
</body>
</html>
