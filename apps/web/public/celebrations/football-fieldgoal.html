<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · FOOTBALL FIELD GOAL</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · FOOTBALL · FIELD GOAL — gooseneck uprights · brown ball · it's good</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  // ── live game data (2026-06-15) — real teams/score/scorer from ?d ──
  var LIVE=(function(){try{var d=_q.get('d');if(!d)return null;return JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return null;}})();
  function lvScore(fb){if(LIVE&&(LIVE.ha||LIVE.home||LIVE.aa||LIVE.away)){var ha=(LIVE.ha||LIVE.home||'').toString().toUpperCase(),aa=(LIVE.aa||LIVE.away||'').toString().toUpperCase(),hs=(LIVE.hs!=null?LIVE.hs:''),as=(LIVE.as!=null?LIVE.as:'');return ha+'  '+hs+(hs!==''||as!==''?'  —  '+as:'')+'  '+aa;}return fb;}
  function lvSub(fb){if(LIVE){var pl=(LIVE.player&&LIVE.player.name)?((LIVE.player.number?('#'+LIVE.player.number+'  '):'')+LIVE.player.name):'';var s=[pl,(LIVE.context||'')].filter(Boolean).join('  ·  ');return s||fb;}return fb;}
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5);
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:320,impact:1360,flightEnd:1700,typeIn:1430,hold:3300,end:4300};
  var GROUND=852;
  var POST={cbY:512,gapL:1360,gapR:1648,top:188,cx:1504};   // crossbar + uprights
  var THRU={x:1504,y:430};                                  // through the uprights
  var startMs=0,rafId=0,prevMs=0,fired=false;
  var embers=[],sparks=[],rainCols=[],ball={x:0,y:0},ballRot=0,ballTrail=[];

  function initRain(){rainCols=[];for(var i=0;i<52;i++)rainCols.push({x:(i+0.5)*(W/52),y:Math.random()*-H,sp:240+Math.random()*420});}
  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;fired=false;embers=[];sparks=[];ballTrail=[];ballRot=0;initRain();rafId=requestAnimationFrame(frame);}

  // ── brown football (prolate spheroid, laces + stripes) ────────
  function football(x,y,L,rot){
    var a=L/2,b=L*0.305;                                   // half-length, half-width (~1.64:1 like a real ball)
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    ctx.shadowColor='rgba(110,55,18,0.55)';ctx.shadowBlur=10;
    // fuller prolate-spheroid body with rounded-pointed ends
    ctx.beginPath();ctx.moveTo(-a,0);
    ctx.quadraticCurveTo(-a*0.5,-b,0,-b);ctx.quadraticCurveTo(a*0.5,-b,a,0);
    ctx.quadraticCurveTo(a*0.5,b,0,b);ctx.quadraticCurveTo(-a*0.5,b,-a,0);ctx.closePath();
    var g=ctx.createLinearGradient(0,-b,0,b);g.addColorStop(0,'#a8632e');g.addColorStop(0.5,'#7c4019');g.addColorStop(1,'#522810');ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
    // long centre seam
    ctx.strokeStyle='rgba(58,26,8,0.5)';ctx.lineWidth=Math.max(1.5,L*0.02);ctx.beginPath();ctx.moveTo(-a*0.8,0);ctx.lineTo(a*0.8,0);ctx.stroke();
    // white end stripes — curved bands wrapping near each tip
    ctx.strokeStyle='rgba(248,248,248,0.95)';ctx.lineWidth=L*0.06;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a*0.50,-b*0.62);ctx.quadraticCurveTo(a*0.66,0,a*0.50,b*0.62);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-a*0.50,-b*0.62);ctx.quadraticCurveTo(-a*0.66,0,-a*0.50,b*0.62);ctx.stroke();
    // laces — white seam + ticks on the top panel
    ctx.strokeStyle='#f6f6f6';ctx.lineWidth=L*0.028;
    ctx.beginPath();ctx.moveTo(-L*0.14,-b*0.12);ctx.lineTo(L*0.14,-b*0.12);ctx.stroke();
    for(var i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*L*0.065,-b*0.34);ctx.lineTo(i*L*0.065,b*0.10);ctx.stroke();}
    ctx.restore();
  }
  function drawBall(t){
    if(t>T.flightEnd+60)return;
    if(t>=T.flightStart){ctx.globalCompositeOperation='lighter';for(var i=0;i<ballTrail.length;i++){var p=ballTrail[i],a=i/ballTrail.length;ctx.fillStyle=rgba(TRGB,a*0.28);ctx.beginPath();ctx.arc(p.x,p.y,8*a+2,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}
    football(ball.x,ball.y,lerp(74,40,seg(t,T.flightStart,T.flightEnd)),ballRot);
  }
  function updateBall(t,dt){
    var bt=seg(t,T.flightStart,T.flightEnd);
    ball.x=lerp(210,1850,bt);
    ball.y=lerp(800,150,bt)-Math.sin(Math.PI*bt)*250;       // kick arc up through the posts
    ballRot+=dt*13;                                          // end-over-end tumble
    if(t>=T.flightStart){ballTrail.push({x:ball.x,y:ball.y});if(ballTrail.length>16)ballTrail.shift();}
  }

  // ── gooseneck goalposts (yellow) ──────────────────────────────
  function L2(ax,ay,bx,by){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
  function drawPosts(t){
    var rev=easeOutCubic(seg(t,150,1000));
    ctx.save();ctx.globalAlpha=rev;ctx.lineCap='round';
    var flash=(t>=T.impact&&t<T.impact+500)?(1-(t-T.impact)/500):0;
    ctx.strokeStyle= flash>0?'#ffffff':'#ffd21a';ctx.shadowColor='#ffd21a';ctx.shadowBlur=20+flash*30;ctx.lineWidth=14;
    L2(POST.gapL,POST.cbY,POST.gapR,POST.cbY);              // crossbar
    L2(POST.gapL,POST.cbY,POST.gapL,POST.top);              // left upright
    L2(POST.gapR,POST.cbY,POST.gapR,POST.top);              // right upright
    // gooseneck: center down a touch, curve back to an offset base post
    ctx.beginPath();ctx.moveTo(POST.cx,POST.cbY);ctx.quadraticCurveTo(POST.cx,POST.cbY+90,POST.cx+90,POST.cbY+120);ctx.stroke();
    L2(POST.cx+90,POST.cbY+120,POST.cx+90,GROUND);          // base post
    ctx.shadowBlur=0;ctx.restore();
  }

  // ── fire burst ────────────────────────────────────────────────
  function burst(x,y){var i;
    for(i=0;i<280;i++){var a=Math.random()*Math.PI*2,sp=6+Math.random()*26,fire=Math.random()<0.82;embers.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,life:0.7+Math.random()*0.7,r:3+Math.random()*7,fire:fire});}
    for(i=0;i<40;i++){var a2=(-Math.PI/2)+(Math.random()-0.5)*2.6,sp2=16+Math.random()*26;sparks.push({x:x,y:y,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,life:1});}
    for(i=0;i<32;i++){var a3=Math.random()*Math.PI*2,sp3=1+Math.random()*5;embers.push({x:x,y:y,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3-2,life:1+Math.random()*0.6,r:14+Math.random()*22,fire:true,puff:true});}}
  function stepParticles(dt){var g=0.35,i,p;
    for(i=embers.length-1;i>=0;i--){p=embers[i];if(p.puff){p.vy-=0.08;p.vx*=0.96;p.vy*=0.96;p.r+=18*dt;p.life-=dt*0.7;}else{p.vy+=g;p.vx*=0.99;p.life-=dt*0.95;}p.x+=p.vx;p.y+=p.vy;if(p.life<=0)embers.splice(i,1);}
    for(i=sparks.length-1;i>=0;i--){p=sparks[i];p.vy+=g*0.7;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;if(p.life<=0)sparks.splice(i,1);}}
  function drawParticles(){ctx.globalCompositeOperation='lighter';var i,p;
    for(i=0;i<embers.length;i++){p=embers[i];if(!p.puff)continue;var pa=clamp(p.life,0,1)*0.22;var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'rgba(255,210,120,'+pa+')');gr.addColorStop(0.5,'rgba(255,90,30,'+(pa*0.7)+')');gr.addColorStop(1,'rgba(255,40,20,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    for(i=0;i<embers.length;i++){p=embers[i];if(p.puff)continue;var col=p.fire?(p.life>0.6?'#fff3b0':(p.life>0.3?'#ff9d28':'#ff3b1f')):rgba(TLT,1);ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.globalAlpha=clamp(p.life,0,1);ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life+0.2,0,1.2),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    for(i=0;i<sparks.length;i++){p=sparks[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.strokeStyle='#fff7d6';ctx.shadowColor='#ffd27a';ctx.shadowBlur=12;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.8,p.y-p.vy*1.8);ctx.stroke();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}

  function drawBackground(t){
    var g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#05070e');g.addColorStop(1,'#0a1410');ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
    var intensity=0.14+0.4*easeOutCubic(seg(t,T.impact,T.impact+500));
    ctx.font='22px monospace';ctx.textAlign='center';ctx.globalCompositeOperation='lighter';
    for(var i=0;i<rainCols.length;i++){var c=rainCols[i];ctx.fillStyle=rgba(TRGB,intensity*0.5);ctx.fillText(Math.random()<0.5?'0':'1',c.x,c.y);}
    // friday-night light banks
    for(var k=0;k<4;k++){var lx=300+k*440,ly=70;var gg=ctx.createRadialGradient(lx,ly,0,lx,ly,150);gg.addColorStop(0,'rgba(235,245,255,0.12)');gg.addColorStop(1,'rgba(235,245,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(lx,ly,150,0,Math.PI*2);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
    // field
    var fg=ctx.createLinearGradient(0,GROUND,0,H);fg.addColorStop(0,'#1f7a3a');fg.addColorStop(1,'#0e4f25');ctx.fillStyle=fg;ctx.fillRect(0,GROUND,W,H-GROUND);
    // yard lines (perspective) + numbers
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=4;
    for(var yl=0;yl<=10;yl++){var fx=W*0.5+(yl-5)*230;ctx.beginPath();ctx.moveTo(fx,GROUND);ctx.lineTo(W*0.5+(yl-5)*150,GROUND+150);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(0,GROUND+150);ctx.lineTo(W,GROUND+150);ctx.lineWidth=2;ctx.stroke();
  }
  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+420),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*9:0;
    ctx.save();ctx.translate(W/2+glitch,300);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 210px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,80,0.85)';ctx.fillText("IT'S GOOD!",-8,0);
    ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText("IT'S GOOD!",8,0);
    ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=40;ctx.fillText("IT'S GOOD!",0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=824,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(5,12,8,0)');bg.addColorStop(0.32,'rgba(5,12,8,0.88)');bg.addColorStop(0.7,'rgba(5,12,8,0.88)');bg.addColorStop(1,'rgba(5,12,8,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 58px Arial';ctx.fillStyle='#eafff0';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText(lvScore('HOME  17  —  14  AWAY'),W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText(lvSub('4TH QTR  ·  38-YD FIELD GOAL  ·  #7'),W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  function drawFlash(t){var f=0;if(t>=T.impact&&t<T.impact+200)f=1-(t-T.impact)/200;if(f>0){ctx.fillStyle='rgba(255,240,210,'+(f*0.6)+')';ctx.fillRect(0,0,W,H);}}

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    var shake=(t>=T.impact&&t<T.impact+420)?(1-(t-T.impact)/420)*14:0;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    for(var i=0;i<rainCols.length;i++){var c=rainCols[i];c.y+=c.sp*dt;if(c.y>H+30)c.y=Math.random()*-200;}
    drawBackground(t);
    drawPosts(t);
    if(t>=T.impact&&!fired){fired=true;burst(THRU.x,THRU.y);}
    updateBall(t,dt);drawBall(t);
    stepParticles(dt);drawParticles();
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(5,10,8,'+(1-t/T.fadeIn)+')';ctx.fillRect(-50,-50,W+100,H+100);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(5,10,8,'+fo+')';ctx.fillRect(-50,-50,W+100,H+100);}
    drawFlash(t);
    ctx.restore();
    if(PAUSE!=null&&t>=PAUSE)return;
    if(t<T.end)rafId=requestAnimationFrame(frame);
  }
  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
