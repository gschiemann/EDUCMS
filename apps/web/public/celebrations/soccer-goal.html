<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · SOCCER GOAL</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · SOCCER · GOAL — night pitch · 3:1 goal · 3D net · B&W ball</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  // ── live game data (2026-06-15) — real teams/score/scorer from ?d ──
  var LIVE=(function(){try{var d=_q.get('d');if(!d)return null;return JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return null;}})();
  function lvScore(fb){if(LIVE&&(LIVE.ha||LIVE.home||LIVE.aa||LIVE.away)){var ha=(LIVE.ha||LIVE.home||'').toString().toUpperCase(),aa=(LIVE.aa||LIVE.away||'').toString().toUpperCase(),hs=(LIVE.hs!=null?LIVE.hs:''),as=(LIVE.as!=null?LIVE.as:'');return ha+'  '+hs+(hs!==''||as!==''?'  —  '+as:'')+'  '+aa;}return fb;}
  function lvSub(fb){if(LIVE){var pl=(LIVE.player&&LIVE.player.name)?((LIVE.player.number?('#'+LIVE.player.number+'  '):'')+LIVE.player.name):'';var s=[pl,(LIVE.context||'')].filter(Boolean).join('  ·  ');return s||fb;}return fb;}
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5);
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function easeOutQuad(t){return 1-(1-t)*(1-t);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:340,impact:1500,typeIn:1520,hold:3300,end:4300};
  var GRASS=560;                                          // far end-line / horizon
  var GOAL={x:1182,y:572,w:564,h:188};                   // 3:1 white goal standing on the pitch
  var IMPACT={x:GOAL.x+GOAL.w*0.5,y:GOAL.y+GOAL.h*0.42};   // back-centre of the net (straight-on)
  var startMs=0,rafId=0,prevMs=0,fired=false;
  var embers=[],sparks=[],stars=[],ball={x:0,y:0,r:30},ballSpin=0,ballTrail=[];

  function initStars(){stars=[];for(var i=0;i<58;i++)stars.push({x:Math.random()*W,y:Math.random()*430,r:Math.random()*1.5+0.3});}
  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;fired=false;embers=[];sparks=[];ballTrail=[];ballSpin=0;initStars();rafId=requestAnimationFrame(frame);}

  // ── B&W soccer ball ───────────────────────────────────────────
  function pent(cx,cy,rad,rot,fill){ctx.beginPath();for(var i=0;i<5;i++){var a=rot-Math.PI/2+i*2*Math.PI/5,px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
  function drawBall(t){
    if(t>T.impact+150)return;
    var x=ball.x,y=ball.y,r=ball.r,flying=t>=T.flightStart;
    if(flying){ctx.globalCompositeOperation='lighter';for(var i=0;i<ballTrail.length;i++){var p=ballTrail[i],a=i/ballTrail.length;ctx.fillStyle=rgba(TRGB,a*0.26);ctx.beginPath();ctx.arc(p.x,p.y,r*0.42*a+2,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}
    ctx.save();ctx.shadowColor=TEAM;ctx.shadowBlur=flying?10:6;
    var g=ctx.createRadialGradient(x-r*0.3,y-r*0.34,r*0.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(0.6,'#edf0f3');g.addColorStop(0.86,'#c8ccd2');g.addColorStop(1,'#9aa0a8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();var blk='#16181d';
    pent(x,y,r*0.30,ballSpin,blk);
    for(var k=0;k<5;k++){var a=ballSpin-Math.PI/2+k*2*Math.PI/5;pent(x+Math.cos(a)*r*0.66,y+Math.sin(a)*r*0.66,r*0.24,a,blk);}
    ctx.strokeStyle='rgba(120,128,138,0.45)';ctx.lineWidth=Math.max(1,r*0.028);
    for(var k2=0;k2<5;k2++){var a2=ballSpin-Math.PI/2+k2*2*Math.PI/5;ctx.beginPath();ctx.moveTo(x+Math.cos(a2)*r*0.30,y+Math.sin(a2)*r*0.30);ctx.lineTo(x+Math.cos(a2)*r*0.66,y+Math.sin(a2)*r*0.66);ctx.stroke();}
    ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';var hx=x-r*0.32,hy=y-r*0.36;var hg=ctx.createRadialGradient(hx,hy,1,hx,hy,r*0.4);hg.addColorStop(0,'rgba(255,255,255,0.6)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,r*0.4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function updateBall(t,dt){
    var bt=seg(t,T.flightStart,T.impact);
    ball.x=lerp(360,IMPACT.x,easeOutQuad(bt));
    ball.y=lerp(770,IMPACT.y,bt)-Math.sin(Math.PI*bt)*150;
    ball.r=lerp(40,26,bt);ballSpin+=dt*9;
    if(t>=T.flightStart){ballTrail.push({x:ball.x,y:ball.y});if(ballTrail.length>16)ballTrail.shift();}
  }

  // ── 3D net pocket (white) + white goal frame ──────────────────
  function L(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  function meshQuad(a,b,c,d,nu,nv){function P(u,v){var tx=a[0]+(b[0]-a[0])*u,ty=a[1]+(b[1]-a[1])*u,bx=d[0]+(c[0]-d[0])*u,by=d[1]+(c[1]-d[1])*u;return [tx+(bx-tx)*v,ty+(by-ty)*v];}var i,j,p;for(i=0;i<=nu;i++){ctx.beginPath();for(j=0;j<=nv;j++){p=P(i/nu,j/nv);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}for(j=0;j<=nv;j++){ctx.beginPath();for(i=0;i<=nu;i++){p=P(i/nu,j/nv);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}}
  function netBulge(t){if(t<T.impact)return 0;var e=t-T.impact;if(e>820)return 0;return Math.exp(-e/240)*Math.sin(e*0.028)*30;}
  // Front-facing goal: the net recedes STRAIGHT BACK (raised + slightly inset
  // for perspective), symmetric — no left/right skew. Billow pushes it back.
  function corners(t){var x=GOAL.x,y=GOAL.y,w=GOAL.w,h=GOAL.h,bz=netBulge(t);var dTop=34,dBot=106,ins=26;
    return {FTL:[x,y],FTR:[x+w,y],FBL:[x,y+h],FBR:[x+w,y+h],
      BTL:[x+ins,y-dTop-bz],BTR:[x+w-ins,y-dTop-bz],
      BBL:[x+ins,y+h-dBot-bz],BBR:[x+w-ins,y+h-dBot-bz]};}
  function drawGoal(t){
    var rev=easeOutCubic(seg(t,150,1050));ctx.save();ctx.globalAlpha=rev;ctx.lineCap='round';var C=corners(t);
    ctx.strokeStyle='rgba(236,246,255,0.40)';ctx.lineWidth=1.4;
    meshQuad(C.FTL,C.FTR,C.BTR,C.BTL,16,4);meshQuad(C.FBL,C.FBR,C.BBR,C.BBL,16,5);
    meshQuad(C.FTL,C.BTL,C.BBL,C.FBL,5,9);meshQuad(C.FTR,C.BTR,C.BBR,C.FBR,5,9);meshQuad(C.BTL,C.BTR,C.BBR,C.BBL,16,9);
    ctx.strokeStyle='rgba(205,222,236,0.55)';ctx.lineWidth=4;L(C.BTL,C.BTR);L(C.BTR,C.BBR);L(C.BBR,C.BBL);L(C.BBL,C.BTL);L(C.FTL,C.BTL);L(C.FTR,C.BTR);L(C.FBL,C.BBL);L(C.FBR,C.BBR);
    // white front frame (posts + crossbar; base open on the grass)
    ctx.strokeStyle='rgba(248,251,255,0.97)';ctx.lineWidth=12;ctx.shadowColor=TEAM;ctx.shadowBlur=22;
    L(C.FTL,C.FBL);L(C.FTR,C.FBR);L(C.FTL,C.FTR);ctx.shadowBlur=0;ctx.restore();
  }

  // ── fire burst ────────────────────────────────────────────────
  function burst(x,y){var i;
    for(i=0;i<300;i++){var a=Math.random()*Math.PI*2,sp=6+Math.random()*28,fire=Math.random()<0.8;embers.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,life:0.7+Math.random()*0.7,r:3+Math.random()*7,fire:fire});}
    for(i=0;i<44;i++){var a2=(-Math.PI/2)+(Math.random()-0.5)*2.6,sp2=16+Math.random()*28;sparks.push({x:x,y:y,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,life:1});}
    for(i=0;i<36;i++){var a3=Math.random()*Math.PI*2,sp3=1+Math.random()*5;embers.push({x:x,y:y,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3-2,life:1+Math.random()*0.6,r:14+Math.random()*22,fire:true,puff:true});}}
  function stepParticles(dt){var g=0.35,i,p;
    for(i=embers.length-1;i>=0;i--){p=embers[i];if(p.puff){p.vy-=0.08;p.vx*=0.96;p.vy*=0.96;p.r+=18*dt;p.life-=dt*0.7;}else{p.vy+=g;p.vx*=0.99;p.life-=dt*0.95;}p.x+=p.vx;p.y+=p.vy;if(p.life<=0)embers.splice(i,1);}
    for(i=sparks.length-1;i>=0;i--){p=sparks[i];p.vy+=g*0.7;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;if(p.life<=0)sparks.splice(i,1);}}
  function drawParticles(){ctx.globalCompositeOperation='lighter';var i,p;
    for(i=0;i<embers.length;i++){p=embers[i];if(!p.puff)continue;var pa=clamp(p.life,0,1)*0.22;var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'rgba(255,210,120,'+pa+')');gr.addColorStop(0.5,'rgba(255,90,30,'+(pa*0.7)+')');gr.addColorStop(1,'rgba(255,40,20,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    for(i=0;i<embers.length;i++){p=embers[i];if(p.puff)continue;var col=p.fire?(p.life>0.6?'#fff3b0':(p.life>0.3?'#ff9d28':'#ff3b1f')):rgba(TLT,1);ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.globalAlpha=clamp(p.life,0,1);ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life+0.2,0,1.2),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    for(i=0;i<sparks.length;i++){p=sparks[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.strokeStyle='#fff7d6';ctx.shadowColor='#ffd27a';ctx.shadowBlur=12;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.8,p.y-p.vy*1.8);ctx.stroke();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}

  function drawShockwave(t){if(t<T.impact||t>T.impact+760)return;var p=seg(t,T.impact,T.impact+760);ctx.globalCompositeOperation='lighter';var cp=seg(t,T.impact,T.impact+260),coreR=lerp(10,200,easeOutCubic(cp))*(1-cp*0.4);var cg=ctx.createRadialGradient(IMPACT.x,IMPACT.y,0,IMPACT.x,IMPACT.y,coreR);cg.addColorStop(0,'rgba(255,255,255,'+(1-cp)+')');cg.addColorStop(0.4,rgba(TLT,(1-cp)*0.8));cg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(IMPACT.x,IMPACT.y,coreR,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';var R=easeOutCubic(p)*640;ctx.strokeStyle=rgba(TLT,(1-p)*0.9);ctx.lineWidth=11*(1-p)+2;ctx.shadowColor=TEAM;ctx.shadowBlur=30;ctx.beginPath();ctx.arc(IMPACT.x,IMPACT.y,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}

  // ── night-pitch background ────────────────────────────────────
  function drawBackground(t){
    var g=ctx.createLinearGradient(0,0,0,GRASS);g.addColorStop(0,'#06101e');g.addColorStop(1,'#0a1c2c');ctx.fillStyle=g;ctx.fillRect(0,0,W,GRASS);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<stars.length;i++){var s=stars[i];if(s.y>410)continue;ctx.fillStyle='rgba(220,235,255,0.55)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
    for(var k=0;k<4;k++){var lx=300+k*440,ly=64;var gg=ctx.createRadialGradient(lx,ly,0,lx,ly,150);gg.addColorStop(0,'rgba(235,245,255,0.12)');gg.addColorStop(1,'rgba(235,245,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(lx,ly,150,0,Math.PI*2);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
    // stands fade out of the sky (no hard band) + crowd speckle
    var cb=ctx.createLinearGradient(0,408,0,GRASS);cb.addColorStop(0,'rgba(8,22,38,0)');cb.addColorStop(1,'rgba(6,16,28,0.82)');ctx.fillStyle=cb;ctx.fillRect(0,408,W,GRASS-408);
    for(var c=0;c<230;c++){ctx.fillStyle='rgba('+(120+(c*37%120))+','+(130+(c*53%110))+','+(150+(c*29%100))+',0.4)';ctx.fillRect((c*15)%W,452+((c*11)%(GRASS-460)),4,4);}
    // grass pitch + mow stripes
    var fg=ctx.createLinearGradient(0,GRASS,0,H);fg.addColorStop(0,'#1f7a3a');fg.addColorStop(1,'#0e4f25');ctx.fillStyle=fg;ctx.fillRect(0,GRASS,W,H-GRASS);
    ctx.globalCompositeOperation='lighter';for(var m=0;m<9;m++){if(m%2){ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(0,GRASS+m*((H-GRASS)/9),W,(H-GRASS)/9);}}ctx.globalCompositeOperation='source-over';
    // 6-yard goal box — symmetric trapezoid CENTRED on the goal mouth,
    // opening toward the camera (near edge wider = perspective).
    var gc=GOAL.x+GOAL.w/2, by=GOAL.y+GOAL.h, ny=by+196, bH=GOAL.w/2+78, nH=GOAL.w/2+196;
    ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=3;                  // faint end line (full width)
    ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(W,by);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(gc-bH,by);ctx.lineTo(gc+bH,by);          // back line (on the goal line)
    ctx.moveTo(gc-bH,by);ctx.lineTo(gc-nH,ny);          // left side
    ctx.moveTo(gc+bH,by);ctx.lineTo(gc+nH,ny);          // right side
    ctx.moveTo(gc-nH,ny);ctx.lineTo(gc+nH,ny);          // near 6-yard line
    ctx.stroke();
  }

  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+420),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*10:0;
    ctx.save();ctx.translate(W/2+glitch,290);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 260px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,80,0.85)';ctx.fillText('GOAL!',-8,0);ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText('GOAL!',8,0);ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=42;ctx.fillText('GOAL!',0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=824,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(4,12,8,0)');bg.addColorStop(0.32,'rgba(4,12,8,0.88)');bg.addColorStop(0.7,'rgba(4,12,8,0.88)');bg.addColorStop(1,'rgba(4,12,8,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 60px Arial';ctx.fillStyle='#eafff0';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText(lvScore('HOME  2  —  1  AWAY'),W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText(lvSub("GOAL"),W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  function drawFlash(t){var f=0;if(t>=T.impact&&t<T.impact+200)f=1-(t-T.impact)/200;if(f>0){ctx.fillStyle='rgba(255,250,235,'+(f*0.6)+')';ctx.fillRect(0,0,W,H);}}

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    var shake=(t>=T.impact&&t<T.impact+500)?(1-(t-T.impact)/500)*20:0;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    drawBackground(t);
    drawGoal(t);
    if(t>=T.impact&&!fired){fired=true;burst(IMPACT.x,IMPACT.y);}
    updateBall(t,dt);drawBall(t);
    drawShockwave(t);
    stepParticles(dt);drawParticles();
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(5,12,8,'+(1-t/T.fadeIn)+')';ctx.fillRect(-50,-50,W+100,H+100);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(5,12,8,'+fo+')';ctx.fillRect(-50,-50,W+100,H+100);}
    drawFlash(t);
    ctx.restore();
    if(PAUSE!=null&&t>=PAUSE)return;
    if(t<T.end)rafId=requestAnimationFrame(frame);
  }
  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
