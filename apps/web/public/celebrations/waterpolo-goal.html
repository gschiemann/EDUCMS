<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · WATER POLO GOAL</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" title="Cyan"   style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" title="Crimson" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" title="Green"  style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" title="Gold"   style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" title="Purple" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · WATER POLO · GOAL — FINA 3m×0.9m goal · yellow ball · splash</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  // ── live game data (2026-06-15) — real teams/score/scorer from ?d ──
  var LIVE=(function(){try{var d=_q.get('d');if(!d)return null;return JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return null;}})();
  function lvScore(fb){if(LIVE&&(LIVE.ha||LIVE.home||LIVE.aa||LIVE.away)){var ha=(LIVE.ha||LIVE.home||'').toString().toUpperCase(),aa=(LIVE.aa||LIVE.away||'').toString().toUpperCase(),hs=(LIVE.hs!=null?LIVE.hs:''),as=(LIVE.as!=null?LIVE.as:'');return ha+'  '+hs+(hs!==''||as!==''?'  —  '+as:'')+'  '+aa;}return fb;}
  function lvSub(fb){if(LIVE){var pl=(LIVE.player&&LIVE.player.name)?((LIVE.player.number?('#'+LIVE.player.number+'  '):'')+LIVE.player.name):'';var s=[pl,(LIVE.context||'')].filter(Boolean).join('  ·  ');return s||fb;}return fb;}
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';

  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5),FOAM=[223,246,255];
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function easeOutQuad(t){return 1-(1-t)*(1-t);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:340,impact:1520,typeIn:1540,hold:3300,end:4300};
  var WATER=612;                                         // water surface line
  // FINA goal: 3.0m wide x 0.9m above water = 3.33:1, FLOATING on the surface.
  var GOAL={x:1120,y:WATER-187,w:624,h:187};            // 624/187 ≈ 3.34:1
  var IMPACT={x:GOAL.x+GOAL.w*0.30,y:GOAL.y+GOAL.h*0.46};
  var SURF={x:IMPACT.x,y:WATER};                        // where the splash meets the surface

  var startMs=0,rafId=0,prevMs=0,firedBurst=false;
  var drops=[],spray=[],ballTrail=[],ballSpin=0,ball={x:0,y:0,r:42},ripples=[];

  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;firedBurst=false;drops=[];spray=[];ballTrail=[];ballSpin=0;ripples=[];rafId=requestAnimationFrame(frame);}

  // ── authentic YELLOW water-polo ball (curved seam panels, textured) ──
  function drawBall(t){
    if(t>T.impact+150)return;
    var flying=t>=T.flightStart,x=ball.x,y=ball.y,r=ball.r;
    if(flying){ctx.globalCompositeOperation='lighter';for(var i=0;i<ballTrail.length;i++){var p=ballTrail[i],a=i/ballTrail.length;ctx.fillStyle='rgba(255,210,40,'+(a*0.22)+')';ctx.beginPath();ctx.arc(p.x,p.y,r*0.4*a+2,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}
    // sphere — vivid yellow with soft highlight
    ctx.save();ctx.shadowColor='rgba(255,210,40,0.7)';ctx.shadowBlur=flying?16:10;
    var g=ctx.createRadialGradient(x-r*0.3,y-r*0.34,r*0.1,x,y,r);
    g.addColorStop(0,'#fff7cf');g.addColorStop(0.5,'#ffd21a');g.addColorStop(0.85,'#f0ab00');g.addColorStop(1,'#c98a00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    // curved seam panels (clip to ball) — the water-polo "wave" look
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
    ctx.strokeStyle='rgba(150,96,8,0.55)';ctx.lineWidth=Math.max(2,r*0.05);
    // 3 longitude ellipses (rotate with spin) + 1 equator
    for(var k=0;k<3;k++){var rx=r*(0.30+k*0.34);ctx.save();ctx.translate(x,y);ctx.rotate(ballSpin*0.4);ctx.beginPath();ctx.ellipse(0,0,rx,r*0.98,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
    ctx.save();ctx.translate(x,y);ctx.rotate(ballSpin*0.4);ctx.beginPath();ctx.ellipse(0,0,r*0.98,r*0.34,0,0,Math.PI*2);ctx.stroke();ctx.restore();
    ctx.restore();
    // specular highlight
    ctx.save();ctx.globalCompositeOperation='lighter';var hx=x-r*0.32,hy=y-r*0.36;var hg=ctx.createRadialGradient(hx,hy,1,hx,hy,r*0.4);hg.addColorStop(0,'rgba(255,255,255,0.7)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,r*0.4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function updateBall(t,dt){
    var bt=seg(t,T.flightStart,T.impact);
    var sx=-160,sy=WATER+70;                              // skims in low, just above the water
    ball.x=lerp(sx,IMPACT.x,easeOutQuad(bt));
    ball.y=lerp(sy,IMPACT.y,bt)-Math.sin(Math.PI*bt)*150;
    ball.r=lerp(52,30,bt);
    ballSpin+=dt*9;
    if(t>=T.flightStart&&t<=T.impact){ballTrail.push({x:ball.x,y:ball.y});if(ballTrail.length>16)ballTrail.shift();}
  }

  // ── floating goal + net (with ripple) ─────────────────────────
  function L(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  function meshQuad(a,b,c,d,nu,nv){
    function P(u,v){var tx=a[0]+(b[0]-a[0])*u,ty=a[1]+(b[1]-a[1])*u,bx=d[0]+(c[0]-d[0])*u,by=d[1]+(c[1]-d[1])*u;return [tx+(bx-tx)*v,ty+(by-ty)*v];}
    var i,j,p;
    for(i=0;i<=nu;i++){ctx.beginPath();for(j=0;j<=nv;j++){p=P(i/nu,j/nv);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(j=0;j<=nv;j++){ctx.beginPath();for(i=0;i<=nu;i++){p=P(i/nu,j/nv);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
  }
  function netBulge(t){if(t<T.impact)return 0;var e=t-T.impact;if(e>820)return 0;return Math.exp(-e/240)*Math.sin(e*0.028)*26;}
  function corners(t){
    var x=GOAL.x,y=GOAL.y,w=GOAL.w,h=GOAL.h,bz=netBulge(t);
    var dTopX=46,dTopY=-16,dBotX=60,dBotY=-6;             // shallow floating pocket
    return {FTL:[x,y],FTR:[x+w,y],FBL:[x,y+h],FBR:[x+w,y+h],
      BTL:[x+dTopX+bz,y+dTopY],BTR:[x+w+dTopX+bz,y+dTopY],
      BBL:[x+dBotX+bz,y+h+dBotY],BBR:[x+w+dBotX+bz,y+h+dBotY]};
  }
  function drawGoal(t){
    var reveal=easeOutCubic(seg(t,150,1100));
    ctx.save();ctx.globalAlpha=reveal;ctx.lineCap='round';
    var C=corners(t);
    // NET — one continuous white pocket across all five interior surfaces
    ctx.strokeStyle='rgba(236,246,255,0.42)';ctx.lineWidth=1.4;
    meshQuad(C.FTL,C.FTR,C.BTR,C.BTL,18,3);   // top
    meshQuad(C.FBL,C.FBR,C.BBR,C.BBL,18,3);   // floor
    meshQuad(C.FTL,C.BTL,C.BBL,C.FBL,3,7);    // left side
    meshQuad(C.FTR,C.BTR,C.BBR,C.FBR,3,7);    // right side
    meshQuad(C.BTL,C.BTR,C.BBR,C.BBL,18,7);   // back wall
    // faint back pipe + top side rails
    ctx.strokeStyle='rgba(205,222,236,0.6)';ctx.lineWidth=4;
    L(C.BTL,C.BTR);L(C.FTL,C.BTL);L(C.FTR,C.BTR);
    // white floating frame (posts + crossbar; base open to the water)
    ctx.strokeStyle='rgba(245,250,255,0.96)';ctx.lineWidth=11;ctx.shadowColor=TEAM;ctx.shadowBlur=26;
    L(C.FTL,C.FBL);L(C.FTR,C.FBR);L(C.FTL,C.FTR);ctx.shadowBlur=0;
    // floats at the base of each post (water-polo goals float)
    ctx.fillStyle='rgba(245,250,255,0.95)';ctx.shadowColor=TEAM;ctx.shadowBlur=16;
    ctx.beginPath();ctx.ellipse(C.FBL[0],C.FBL[1],20,9,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(C.FBR[0],C.FBR[1],20,9,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.restore();
  }

  // ── water SPLASH (replaces fire) ──────────────────────────────
  function burst(x,y){
    var i;
    // upward + outward droplets (white / foam / team-tint)
    for(i=0;i<320;i++){var a=(-Math.PI/2)+(Math.random()-0.5)*2.4,sp=8+Math.random()*30;var col=Math.random()<0.55?'#ffffff':(Math.random()<0.6?rgba(FOAM,1):rgba(TLT,1));drops.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-7,life:0.7+Math.random()*0.7,r:2+Math.random()*6,col:col});}
    // a tall central column of foam
    for(i=0;i<70;i++){var sp2=18+Math.random()*30;drops.push({x:x+(Math.random()-0.5)*40,y:y,vx:(Math.random()-0.5)*5,vy:-sp2,life:0.8+Math.random()*0.6,r:3+Math.random()*7,col:Math.random()<0.5?'#ffffff':rgba(FOAM,1)});}
    // soft spray mist (puffs)
    for(i=0;i<46;i++){var a3=Math.random()*Math.PI*2,sp3=1+Math.random()*5;spray.push({x:x,y:y,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3-3,life:1+Math.random()*0.6,r:16+Math.random()*26});}
    // surface ripple rings on the water
    ripples.push({x:SURF.x,y:SURF.y,t0:0});
    ripples.push({x:SURF.x,y:SURF.y,t0:-0.12});
  }
  function stepParticles(dt){var g=0.55,i,p;
    for(i=drops.length-1;i>=0;i--){p=drops[i];p.vy+=g;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.life-=dt*0.8;if(p.life<=0||p.y>H+20)drops.splice(i,1);}
    for(i=spray.length-1;i>=0;i--){p=spray[i];p.vy-=0.05;p.vx*=0.96;p.vy*=0.97;p.r+=20*dt;p.life-=dt*0.7;p.x+=p.vx;p.y+=p.vy;if(p.life<=0)spray.splice(i,1);}
    for(i=0;i<ripples.length;i++)ripples[i].t0+=dt;
  }
  function drawParticles(){
    ctx.globalCompositeOperation='lighter';var i,p;
    // mist
    for(i=0;i<spray.length;i++){p=spray[i];var pa=clamp(p.life,0,1)*0.16;var grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);grd.addColorStop(0,'rgba(235,250,255,'+pa+')');grd.addColorStop(1,'rgba(180,230,255,0)');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    // droplets
    for(i=0;i<drops.length;i++){p=drops[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.shadowColor=rgba(FOAM,1);ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life+0.2,0,1.2),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';
  }
  // expanding ripple rings flattened onto the water surface
  function drawRipples(){
    for(var i=0;i<ripples.length;i++){var rp=ripples[i];if(rp.t0<=0)continue;var p=clamp(rp.t0/0.8,0,1);if(p>=1)continue;var R=easeOutCubic(p)*620;
      ctx.strokeStyle=rgba(FOAM,(1-p)*0.5);ctx.lineWidth=6*(1-p)+1;ctx.beginPath();ctx.ellipse(rp.x,rp.y,R,R*0.22,0,0,Math.PI*2);ctx.stroke();}
  }

  // ── background: natatorium + pool water + caustics ────────────
  function drawBackground(t){
    // dark hall above the water
    var g=ctx.createLinearGradient(0,0,0,WATER);g.addColorStop(0,'#040d18');g.addColorStop(1,'#06182b');ctx.fillStyle=g;ctx.fillRect(0,0,W,WATER);
    // arena light glints + faint team glow up top
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<7;i++){var lx=(i+0.5)*(W/7),ly=70+((i*37)%120);var gg=ctx.createRadialGradient(lx,ly,0,lx,ly,120);gg.addColorStop(0,'rgba(180,225,255,0.10)');gg.addColorStop(1,'rgba(180,225,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(lx,ly,120,0,Math.PI*2);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
    // water body
    var wg=ctx.createLinearGradient(0,WATER,0,H);wg.addColorStop(0,'#0e5a86');wg.addColorStop(0.5,'#093f63');wg.addColorStop(1,'#04121f');ctx.fillStyle=wg;ctx.fillRect(0,WATER,W,H-WATER);
    // caustic shimmer
    ctx.globalCompositeOperation='lighter';
    for(var c=0;c<12;c++){var yy=WATER+18+c*((H-WATER)/12);var amp=7+c*1.3,ph=t*0.0012*(0.5+c*0.12)+c;ctx.strokeStyle='rgba(190,235,255,'+(0.05+0.035*Math.sin(ph*2))+')';ctx.lineWidth=2;ctx.beginPath();for(var x=0;x<=W;x+=26){var yo=Math.sin(x*0.012+ph*3)*amp;if(x===0)ctx.moveTo(x,yy+yo);else ctx.lineTo(x,yy+yo);}ctx.stroke();}
    ctx.globalCompositeOperation='source-over';
    // bright surface line
    ctx.strokeStyle=rgba(lighten(FOAM,0),0.5);ctx.lineWidth=2;ctx.shadowColor=TEAM;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(0,WATER);ctx.lineTo(W,WATER);ctx.stroke();ctx.shadowBlur=0;
    // goal reflection — faint team-glow streaks under the posts
    ctx.globalCompositeOperation='lighter';
    [GOAL.x,GOAL.x+GOAL.w].forEach(function(px){var rg=ctx.createLinearGradient(px,WATER,px,WATER+150);rg.addColorStop(0,rgba(TLT,0.25));rg.addColorStop(1,rgba(TLT,0));ctx.fillStyle=rg;ctx.fillRect(px-8,WATER,16,150);});
    ctx.globalCompositeOperation='source-over';
  }

  // ── celebration FX ────────────────────────────────────────────
  function drawShockwave(t){
    if(t<T.impact||t>T.impact+700)return;var p=seg(t,T.impact,T.impact+700);
    ctx.globalCompositeOperation='lighter';
    var cp=seg(t,T.impact,T.impact+240),coreR=lerp(10,180,easeOutCubic(cp))*(1-cp*0.4);
    var cg=ctx.createRadialGradient(IMPACT.x,IMPACT.y,0,IMPACT.x,IMPACT.y,coreR);cg.addColorStop(0,'rgba(255,255,255,'+(1-cp)+')');cg.addColorStop(0.4,rgba(FOAM,(1-cp)*0.8));cg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(IMPACT.x,IMPACT.y,coreR,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+420),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*10:0;
    ctx.save();ctx.translate(W/2+glitch,300);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 260px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,80,0.85)';ctx.fillText('GOAL!',-8,0);
    ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText('GOAL!',8,0);
    ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=42;ctx.fillText('GOAL!',0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=820,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(3,12,22,0)');bg.addColorStop(0.32,'rgba(3,12,22,0.86)');bg.addColorStop(0.7,'rgba(3,12,22,0.86)');bg.addColorStop(1,'rgba(3,12,22,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 60px Arial';ctx.fillStyle='#eaf6ff';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText(lvScore('HOME  9  —  8  AWAY'),W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText(lvSub('4TH  ·  GOAL'),W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  function drawFlash(t){var f=0;if(t>=T.impact&&t<T.impact+200)f=1-(t-T.impact)/200;if(f>0){ctx.fillStyle='rgba(220,245,255,'+(f*0.7)+')';ctx.fillRect(0,0,W,H);}}

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    var shake=(t>=T.impact&&t<T.impact+500)?(1-(t-T.impact)/500)*20:0;
    var ox=(Math.random()-0.5)*shake,oy=(Math.random()-0.5)*shake;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);

    drawBackground(t);
    drawGoal(t);
    if(t>=T.impact&&!firedBurst){firedBurst=true;burst(IMPACT.x,IMPACT.y);}
    updateBall(t,dt);drawBall(t);
    drawShockwave(t);
    drawRipples();
    stepParticles(dt);drawParticles();
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(4,8,16,'+(1-t/T.fadeIn)+')';ctx.fillRect(-50,-50,W+100,H+100);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(4,8,16,'+fo+')';ctx.fillRect(-50,-50,W+100,H+100);}
    drawFlash(t);
    ctx.restore();
    if(PAUSE!=null&&t>=PAUSE)return;
    if(t<T.end)rafId=requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
