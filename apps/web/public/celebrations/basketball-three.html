<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · BASKETBALL THREE</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · BASKETBALL · THREE — 18in rim · 72x42 board · orange ball</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';

  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5);
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function easeOutQuad(t){return 1-(1-t)*(1-t);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:300,impact:1500,typeIn:1520,hold:3300,end:4300};
  var GROUND=915;
  // Rim: 18in dia, 10ft up. Backboard 72x42 behind it (≈1.71:1), inner square 24x18.
  var BOARD={x:1556,y:236,w:300,h:176};                 // 300/176 ≈ 1.70
  // Rim is mounted at the CENTRE of the backboard (centred under the inner
  // square), protruding toward the court — not hanging off one side.
  var RIM={x:BOARD.x+BOARD.w/2,y:430,rx:58,ry:15};
  var IMPACT={x:RIM.x,y:RIM.y};

  var startMs=0,rafId=0,prevMs=0,firedBurst=false;
  var embers=[],sparks=[],rainCols=[],ballTrail=[],ballSpin=0,ball={x:0,y:0,r:40};

  function initRain(){rainCols=[];var n=58;for(var i=0;i<n;i++)rainCols.push({x:(i+0.5)*(W/n),y:Math.random()*-H,sp:240+Math.random()*420});}
  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;firedBurst=false;embers=[];sparks=[];ballTrail=[];ballSpin=0;initRain();rafId=requestAnimationFrame(frame);}

  // ── orange basketball with black ribs ─────────────────────────
  function drawBall(t){
    var dropping=t>T.impact;
    if(t>T.impact+220)return;                              // through the net, gone
    var x=ball.x,y=ball.y,r=ball.r;
    // FIRE trail ("on fire") while in flight
    if(t>=T.flightStart&&!dropping){
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<ballTrail.length;i++){var p=ballTrail[i],a=i/ballTrail.length;var col=a>0.6?'#fff0b0':(a>0.3?'#ff9d28':'#ff3b1f');ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.beginPath();ctx.arc(p.x,p.y,r*0.5*a+3,0,Math.PI*2);ctx.fill();}
      ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
    }
    // sphere — orange
    ctx.save();ctx.shadowColor='rgba(255,140,40,0.7)';ctx.shadowBlur=dropping?10:16;
    var g=ctx.createRadialGradient(x-r*0.3,y-r*0.34,r*0.1,x,y,r);
    g.addColorStop(0,'#ffd9a6');g.addColorStop(0.5,'#ff8c2e');g.addColorStop(0.86,'#df6614');g.addColorStop(1,'#a8480c');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    // black ribs (clip): vertical seam + equator + 2 curved seams, rotate w/ spin
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
    ctx.strokeStyle='rgba(20,12,6,0.8)';ctx.lineWidth=Math.max(2,r*0.06);
    ctx.save();ctx.translate(x,y);ctx.rotate(ballSpin*0.35);
    ctx.beginPath();ctx.ellipse(0,0,r*0.98,r*0.30,0,0,Math.PI*2);ctx.stroke();      // equator
    ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();                  // vertical seam
    ctx.beginPath();ctx.ellipse(r*0.5,0,r*0.5,r*0.99,0,0,Math.PI*2);ctx.stroke();   // curved seam R
    ctx.beginPath();ctx.ellipse(-r*0.5,0,r*0.5,r*0.99,0,0,Math.PI*2);ctx.stroke();  // curved seam L
    ctx.restore();ctx.restore();
    // specular
    ctx.save();ctx.globalCompositeOperation='lighter';var hx=x-r*0.32,hy=y-r*0.36;var hg=ctx.createRadialGradient(hx,hy,1,hx,hy,r*0.4);hg.addColorStop(0,'rgba(255,255,255,0.6)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,r*0.4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function updateBall(t,dt){
    if(t<=T.impact){
      var bt=seg(t,T.flightStart,T.impact);
      ball.x=lerp(1060,RIM.x,easeOutQuad(bt));              // release from the three-point line, not full court
      ball.y=lerp(715,RIM.y,bt)-Math.sin(Math.PI*bt)*320;   // jump-shot arc, descends into the rim
      ball.r=lerp(40,30,bt);
      ballSpin+=dt*7;
      if(t>=T.flightStart)ballTrail.push({x:ball.x,y:ball.y}),ballTrail.length>16&&ballTrail.shift();
    } else {
      // drop straight through the net
      var dp=seg(t,T.impact,T.impact+200);
      ball.x=RIM.x;ball.y=lerp(RIM.y,RIM.y+150,dp);ball.r=28;ballSpin+=dt*5;
    }
  }

  // ── hoop: backboard + rim + net (with flip) ───────────────────
  function netFlip(t){if(t<T.impact)return 0;var p=seg(t,T.impact,T.impact+420);return Math.sin(p*Math.PI)*(1-p);}
  function drawHoop(t){
    var reveal=easeOutCubic(seg(t,150,1000));
    ctx.save();ctx.globalAlpha=reveal;
    // backboard glass
    var b=BOARD;
    ctx.fillStyle='rgba(12,22,38,0.5)';ctx.strokeStyle=rgba(TLT,0.9);ctx.lineWidth=5;ctx.shadowColor=TEAM;ctx.shadowBlur=20;
    rrect(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.stroke();
    // inner square (24x18) near bottom-centre
    var iw=b.w*0.34,ih=b.h*0.42,ix=b.x+(b.w-iw)/2,iy=b.y+b.h-ih-14;
    ctx.lineWidth=4;rrect(ix,iy,iw,ih,4);ctx.stroke();ctx.shadowBlur=0;
    // net (white strands) with a flip kick on the make
    var fl=netFlip(t),N=12,topR=RIM.rx,botRX=RIM.rx*0.46*(1+fl*0.9),botY=RIM.y+128-fl*54;
    ctx.strokeStyle='rgba(238,246,255,0.5)';ctx.lineWidth=2;
    var tp=[],bp=[];
    for(var i=0;i<N;i++){var a=i/N*Math.PI*2;tp.push([RIM.x+Math.cos(a)*topR,RIM.y+Math.sin(a)*RIM.ry]);bp.push([RIM.x+Math.cos(a)*botRX,botY+Math.sin(a)*RIM.ry*0.5]);}
    for(i=0;i<N;i++){ctx.beginPath();ctx.moveTo(tp[i][0],tp[i][1]);ctx.lineTo(bp[i][0],bp[i][1]);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tp[i][0],tp[i][1]);ctx.lineTo(bp[(i+1)%N][0],bp[(i+1)%N][1]);ctx.stroke();}
    // bottom ring
    ctx.beginPath();ctx.ellipse(RIM.x,botY,botRX,RIM.ry*0.5,0,0,Math.PI*2);ctx.stroke();
    // rim (orange) — drawn in front
    ctx.strokeStyle='#ff7a18';ctx.shadowColor='#ff7a18';ctx.shadowBlur=18;ctx.lineWidth=8;
    ctx.beginPath();ctx.ellipse(RIM.x,RIM.y,RIM.rx,RIM.ry,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    ctx.restore();
  }
  function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  // ── fire burst (on-fire) ──────────────────────────────────────
  function burst(x,y){var i;
    for(i=0;i<300;i++){var a=Math.random()*Math.PI*2,sp=6+Math.random()*28,fire=Math.random()<0.82;embers.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,life:0.7+Math.random()*0.7,r:3+Math.random()*7,fire:fire});}
    for(i=0;i<44;i++){var a2=(-Math.PI/2)+(Math.random()-0.5)*2.6,sp2=16+Math.random()*28;sparks.push({x:x,y:y,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,life:1});}
    for(i=0;i<36;i++){var a3=Math.random()*Math.PI*2,sp3=1+Math.random()*5;embers.push({x:x,y:y,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3-2,life:1+Math.random()*0.6,r:14+Math.random()*22,fire:true,puff:true});}}
  function stepParticles(dt){var g=0.35,i,p;
    for(i=embers.length-1;i>=0;i--){p=embers[i];if(p.puff){p.vy-=0.08;p.vx*=0.96;p.vy*=0.96;p.r+=18*dt;p.life-=dt*0.7;}else{p.vy+=g;p.vx*=0.99;p.life-=dt*0.95;}p.x+=p.vx;p.y+=p.vy;if(p.life<=0)embers.splice(i,1);}
    for(i=sparks.length-1;i>=0;i--){p=sparks[i];p.vy+=g*0.7;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.5;if(p.life<=0)sparks.splice(i,1);}}
  function drawParticles(){ctx.globalCompositeOperation='lighter';var i,p;
    for(i=0;i<embers.length;i++){p=embers[i];if(!p.puff)continue;var pa=clamp(p.life,0,1)*0.22;var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'rgba(255,210,120,'+pa+')');gr.addColorStop(0.5,'rgba(255,90,30,'+(pa*0.7)+')');gr.addColorStop(1,'rgba(255,40,20,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    for(i=0;i<embers.length;i++){p=embers[i];if(p.puff)continue;var col=p.fire?(p.life>0.6?'#fff3b0':(p.life>0.3?'#ff9d28':'#ff3b1f')):rgba(TLT,1);ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=16;ctx.globalAlpha=clamp(p.life,0,1);ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life+0.2,0,1.2),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    for(i=0;i<sparks.length;i++){p=sparks[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.strokeStyle='#fff7d6';ctx.shadowColor='#ffd27a';ctx.shadowBlur=12;ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.8,p.y-p.vy*1.8);ctx.stroke();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}

  // ── arena court background ────────────────────────────────────
  function drawBackground(t){
    var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070e');g.addColorStop(0.62,'#0a0a14');g.addColorStop(1,'#06040a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    var intensity=0.16+0.4*easeOutQuad(seg(t,T.impact,T.impact+500));
    ctx.font='22px monospace';ctx.textAlign='center';ctx.globalCompositeOperation='lighter';
    for(var i=0;i<rainCols.length;i++){var col=rainCols[i];ctx.fillStyle=rgba(TRGB,intensity*0.6);ctx.fillText(Math.random()<0.5?'0':'1',col.x,col.y);}
    ctx.globalCompositeOperation='source-over';
    // hardwood-tone court band near the floor
    var wg=ctx.createLinearGradient(0,GROUND-40,0,H);wg.addColorStop(0,'rgba(120,70,28,0)');wg.addColorStop(1,'rgba(120,70,28,0.16)');ctx.fillStyle=wg;ctx.fillRect(0,GROUND-40,W,H-GROUND+40);
    // court lines — all referenced to the BASKET (centred under the rim) so
    // the key, free-throw line and three-point arc line up with the hoop.
    var bx=RIM.x;
    ctx.strokeStyle=rgba(TRGB,0.32);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();          // baseline
    // the key / lane — a trapezoid from the baseline (under the rim) toward the camera
    var lb=82,lf=118,ftY=GROUND+120;
    ctx.beginPath();
    ctx.moveTo(bx-lb,GROUND);ctx.lineTo(bx-lf,ftY);
    ctx.moveTo(bx+lb,GROUND);ctx.lineTo(bx+lf,ftY);
    ctx.moveTo(bx-lf,ftY);ctx.lineTo(bx+lf,ftY);
    ctx.stroke();
    ctx.beginPath();ctx.ellipse(bx,ftY,lf,32,0,0,Math.PI*2);ctx.stroke();             // free-throw circle
    ctx.beginPath();ctx.ellipse(bx,GROUND,600,150,0,0,Math.PI);ctx.stroke();          // 3-point arc (bulges toward viewer)
    ctx.shadowBlur=0;
  }

  function drawShockwave(t){
    if(t<T.impact||t>T.impact+700)return;var p=seg(t,T.impact,T.impact+700);
    ctx.globalCompositeOperation='lighter';
    var cp=seg(t,T.impact,T.impact+240),coreR=lerp(8,170,easeOutCubic(cp))*(1-cp*0.4);
    var cg=ctx.createRadialGradient(IMPACT.x,IMPACT.y,0,IMPACT.x,IMPACT.y,coreR);cg.addColorStop(0,'rgba(255,255,255,'+(1-cp)+')');cg.addColorStop(0.4,'rgba(255,180,80,'+((1-cp)*0.8)+')');cg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(IMPACT.x,IMPACT.y,coreR,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    var R=easeOutCubic(p)*640;ctx.strokeStyle=rgba(TLT,(1-p)*0.9);ctx.lineWidth=11*(1-p)+2;ctx.shadowColor=TEAM;ctx.shadowBlur=30;ctx.beginPath();ctx.arc(IMPACT.x,IMPACT.y,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}
  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+420),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*10:0;
    ctx.save();ctx.translate(W/2+glitch,300);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 250px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,80,0.85)';ctx.fillText('THREE!',-8,0);
    ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText('THREE!',8,0);
    ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=42;ctx.fillText('THREE!',0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=820,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(6,5,12,0)');bg.addColorStop(0.32,'rgba(6,5,12,0.86)');bg.addColorStop(0.7,'rgba(6,5,12,0.86)');bg.addColorStop(1,'rgba(6,5,12,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 60px Arial';ctx.fillStyle='#eef2ff';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText('MATER DEI  61  —  58  SANTA MARGARITA',W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText('4TH  ·  3-POINTER  ·  #3 REYES',W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }
  function drawFlash(t){var f=0;if(t>=T.impact&&t<T.impact+200)f=1-(t-T.impact)/200;if(f>0){ctx.fillStyle='rgba(255,240,220,'+(f*0.7)+')';ctx.fillRect(0,0,W,H);}}

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    var shake=(t>=T.impact&&t<T.impact+500)?(1-(t-T.impact)/500)*18:0;
    var ox=(Math.random()-0.5)*shake,oy=(Math.random()-0.5)*shake;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);
    for(var i=0;i<rainCols.length;i++){var col=rainCols[i];col.y+=col.sp*dt;if(col.y>H+30)col.y=Math.random()*-200;}
    drawBackground(t);
    drawHoop(t);
    if(t>=T.impact&&!firedBurst){firedBurst=true;burst(IMPACT.x,IMPACT.y);}
    updateBall(t,dt);drawBall(t);
    drawShockwave(t);
    stepParticles(dt);drawParticles();
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(4,6,11,'+(1-t/T.fadeIn)+')';ctx.fillRect(-50,-50,W+100,H+100);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(4,6,11,'+fo+')';ctx.fillRect(-50,-50,W+100,H+100);}
    drawFlash(t);
    ctx.restore();
    if(PAUSE!=null&&t>=PAUSE)return;
    if(t<T.end)rafId=requestAnimationFrame(frame);
  }
  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
