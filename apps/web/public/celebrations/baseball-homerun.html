<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · BASEBALL HOME RUN</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · BASEBALL · HOME RUN — white/red-stitch ball · clears the wall · fireworks</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';

  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5);
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:320,impact:760,flightEnd:1820,typeIn:880,hold:3500,end:4600};
  // FULL-WIDTH green outfield wall across the field, grass foreground below.
  var WALLTOP=575, WALLBOT=812, GRASS=846;

  var startMs=0,rafId=0,prevMs=0,firedFw=false;
  var fparts=[],shells=[],stars=[],ball={x:0,y:0,r:32},ballSpin=0,ballTrail=[];
  var FCOLS=['#ff4d4d','#ffd23b','#4dd6ff','#ffffff','#7bff8a','#ff7be6'];

  function initStars(){stars=[];for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*520,r:Math.random()*1.6+0.3});}
  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;firedFw=false;fparts=[];shells=[];ballTrail=[];ballSpin=0;initStars();rafId=requestAnimationFrame(frame);}

  // ── white baseball with red stitches ──────────────────────────
  function drawBall(t){
    if(t>T.flightEnd+60)return;
    var x=ball.x,y=ball.y,r=ball.r;
    // trail
    if(t>=T.flightStart){ctx.globalCompositeOperation='lighter';for(var i=0;i<ballTrail.length;i++){var p=ballTrail[i],a=i/ballTrail.length;ctx.fillStyle='rgba(255,255,255,'+(a*0.28)+')';ctx.beginPath();ctx.arc(p.x,p.y,r*0.4*a+2,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';}
    // sphere (white)
    ctx.save();ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=12;
    var g=ctx.createRadialGradient(x-r*0.3,y-r*0.34,r*0.1,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(0.7,'#f3f4f6');g.addColorStop(1,'#cfd3da');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
    // red stitch seams (two opposing curved arcs) + stitch ticks
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.translate(x,y);ctx.rotate(ballSpin*0.3);
    ctx.strokeStyle='#d8362f';ctx.lineWidth=Math.max(2,r*0.07);
    for(var s=-1;s<=1;s+=2){ctx.beginPath();ctx.ellipse(s*r*0.78,0,r*0.5,r*0.95,0,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
    // specular
    ctx.save();ctx.globalCompositeOperation='lighter';var hx=x-r*0.32,hy=y-r*0.36;var hg=ctx.createRadialGradient(hx,hy,1,hx,hy,r*0.42);hg.addColorStop(0,'rgba(255,255,255,0.7)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,r*0.42,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function updateBall(t,dt){
    var bt=seg(t,T.flightStart,T.flightEnd);
    ball.x=lerp(560,1480,bt);                              // hit from lower-CENTRE, travels up-and-out over the wall
    ball.y=lerp(980,150,bt)-Math.sin(Math.PI*bt)*280;     // towering arc that clears the full-width wall
    ball.r=lerp(34,18,bt);                                 // shrinks as it flies away
    ballSpin+=dt*8;
    if(t>=T.flightStart){ballTrail.push({x:ball.x,y:ball.y});if(ballTrail.length>18)ballTrail.shift();}
  }

  // ── fireworks ─────────────────────────────────────────────────
  function spawnShells(){for(var s=0;s<9;s++){shells.push({x:200+Math.random()*1520,y:120+Math.random()*340,delay:s*0.14+Math.random()*0.12,col:FCOLS[s%FCOLS.length],fired:false});}}
  function explode(x,y,col){for(var i=0;i<80;i++){var a=Math.random()*Math.PI*2,sp=3+Math.random()*9;fparts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1+Math.random()*0.5,col:Math.random()<0.25?'#ffffff':col,r:2+Math.random()*2.5});}}
  function stepFireworks(t,dt){
    if(t>=T.impact){var e=(t-T.impact)/1000;for(var s=0;s<shells.length;s++){var sh=shells[s];if(!sh.fired&&e>=sh.delay){sh.fired=true;explode(sh.x,sh.y,sh.col);}}}
    for(var i=fparts.length-1;i>=0;i--){var p=fparts[i];p.vy+=0.08;p.vx*=0.985;p.vy*=0.985;p.x+=p.vx;p.y+=p.vy;p.life-=dt*0.55;if(p.life<=0)fparts.splice(i,1);}
  }
  function drawFireworks(){ctx.globalCompositeOperation='lighter';for(var i=0;i<fparts.length;i++){var p=fparts[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life,0.2,1),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}

  // ── ballpark background ───────────────────────────────────────
  function drawBackground(t){
    // night sky (above the wall)
    var g=ctx.createLinearGradient(0,0,0,WALLTOP);g.addColorStop(0,'#070f1e');g.addColorStop(1,'#0c2036');ctx.fillStyle=g;ctx.fillRect(0,0,W,WALLTOP);
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<stars.length;i++){var s=stars[i];if(s.y>425)continue;ctx.fillStyle='rgba(220,235,255,0.6)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
    for(var k=0;k<4;k++){var lx=300+k*440,ly=66;var gg=ctx.createRadialGradient(lx,ly,0,lx,ly,150);gg.addColorStop(0,'rgba(230,245,255,0.13)');gg.addColorStop(1,'rgba(230,245,255,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(lx,ly,150,0,Math.PI*2);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
    // distant stands — a SOFT darkening that fades out of the sky (no hard
    // edge), with crowd speckle on top so it reads as a night crowd.
    var cb=ctx.createLinearGradient(0,415,0,WALLTOP);cb.addColorStop(0,'rgba(8,22,38,0)');cb.addColorStop(1,'rgba(6,15,27,0.82)');ctx.fillStyle=cb;ctx.fillRect(0,415,W,WALLTOP-415);
    for(var c=0;c<240;c++){ctx.fillStyle='rgba('+(120+(c*37%120))+','+(130+(c*53%110))+','+(150+(c*29%100))+',0.42)';ctx.fillRect((c*15)%W,470+((c*11)%(WALLTOP-478)),4,4);}
    // ── OUTFIELD WALL — full width green ──
    var wg=ctx.createLinearGradient(0,WALLTOP,0,WALLBOT);wg.addColorStop(0,'#1c7e46');wg.addColorStop(1,'#0f5a30');ctx.fillStyle=wg;ctx.fillRect(0,WALLTOP,W,WALLBOT-WALLTOP);
    ctx.strokeStyle='rgba(6,46,26,0.45)';ctx.lineWidth=2;for(var px=0;px<=W;px+=240){ctx.beginPath();ctx.moveTo(px,WALLTOP);ctx.lineTo(px,WALLBOT);ctx.stroke();}   // fence posts
    ctx.strokeStyle='#ffd23b';ctx.lineWidth=8;ctx.shadowColor='#ffd23b';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,WALLTOP);ctx.lineTo(W,WALLTOP);ctx.stroke();ctx.shadowBlur=0;   // yellow home-run line
    ctx.fillStyle='rgba(255,255,255,0.88)';ctx.font='900 56px Arial';ctx.textAlign='center';
    ctx.fillText('330',300,WALLTOP+128);ctx.fillText('400',960,WALLTOP+128);ctx.fillText('330',1620,WALLTOP+128);
    // warning track (dirt, full width) + grass foreground
    ctx.fillStyle='#7a4a25';ctx.fillRect(0,WALLBOT,W,GRASS-WALLBOT);ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(0,WALLBOT,W,4);
    var fg=ctx.createLinearGradient(0,GRASS,0,H);fg.addColorStop(0,'#1f7a3a');fg.addColorStop(1,'#0e4f25');ctx.fillStyle=fg;ctx.fillRect(0,GRASS,W,H-GRASS);
    ctx.globalCompositeOperation='lighter';for(var m=0;m<8;m++){if(m%2){ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(0,GRASS+m*((H-GRASS)/8),W,(H-GRASS)/8);}}ctx.globalCompositeOperation='source-over';
  }

  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+440),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*9:0;
    ctx.save();ctx.translate(W/2+glitch,300);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 180px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,80,0.85)';ctx.fillText('HOME RUN!',-8,0);
    ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText('HOME RUN!',8,0);
    ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=40;ctx.fillText('HOME RUN!',0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=826,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(4,12,8,0)');bg.addColorStop(0.32,'rgba(4,12,8,0.88)');bg.addColorStop(0.7,'rgba(4,12,8,0.88)');bg.addColorStop(1,'rgba(4,12,8,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 58px Arial';ctx.fillStyle='#eafff0';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText('RIVER CATS  5  —  3  RAILRIDERS',W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText('BOT 6TH  ·  3-RUN HOMER  ·  #24 CRUZ',W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
    drawBackground(t);
    updateBall(t,dt);drawBall(t);
    if(t>=T.impact&&!firedFw){firedFw=true;spawnShells();}
    stepFireworks(t,dt);drawFireworks(t);
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(4,10,18,'+(1-t/T.fadeIn)+')';ctx.fillRect(0,0,W,H);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(4,10,18,'+fo+')';ctx.fillRect(0,0,W,H);}
    if(PAUSE!=null&&t>=PAUSE)return;
    if(t<T.end)rafId=requestAnimationFrame(frame);
  }
  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
