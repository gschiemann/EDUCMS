<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VenueOS · Celebration · HOCKEY GOAL</title>
<style>
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;max-height:100vh;display:block;}
  #ui{position:absolute;left:16px;bottom:14px;z-index:10;display:flex;align-items:center;}
  #ui button{margin-right:8px;padding:9px 14px;border-radius:10px;border:1px solid #2a3550;background:#0d1424;color:#cfe0ff;font-size:13px;font-weight:700;cursor:pointer;}
  #ui .sw{width:30px;height:30px;padding:0;border-radius:50%;}
  #label{position:absolute;right:16px;bottom:16px;z-index:10;color:#44506a;font-size:12px;letter-spacing:.1em;}
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="ui">
    <button id="replay">▶ Replay</button>
    <button class="sw" style="background:#21e6ff" data-c="#21e6ff"></button>
    <button class="sw" style="background:#ff2d55" data-c="#ff2d55"></button>
    <button class="sw" style="background:#22e07a" data-c="#22e07a"></button>
    <button class="sw" style="background:#ffc21a" data-c="#ffc21a"></button>
    <button class="sw" style="background:#a06bff" data-c="#a06bff"></button>
  </div>
  <div id="label">VenueOS · HOCKEY · GOAL — 6x4 red goal · black puck · the lamp is lit</div>

<script>
(function () {
  "use strict";
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1920,H=1080;
  var _q=new URLSearchParams(location.search);
  // ── live game data (2026-06-15) — real teams/score/scorer from ?d ──
  var LIVE=(function(){try{var d=_q.get('d');if(!d)return null;return JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g,'+').replace(/_/g,'/')))));}catch(e){return null;}})();
  function lvScore(fb){if(LIVE&&(LIVE.ha||LIVE.home||LIVE.aa||LIVE.away)){var ha=(LIVE.ha||LIVE.home||'').toString().toUpperCase(),aa=(LIVE.aa||LIVE.away||'').toString().toUpperCase(),hs=(LIVE.hs!=null?LIVE.hs:''),as=(LIVE.as!=null?LIVE.as:'');return ha+'  '+hs+(hs!==''||as!==''?'  —  '+as:'')+'  '+aa;}return fb;}
  function lvSub(fb){if(LIVE){var pl=(LIVE.player&&LIVE.player.name)?((LIVE.player.number?('#'+LIVE.player.number+'  '):'')+LIVE.player.name):'';var s=[pl,(LIVE.context||'')].filter(Boolean).join('  ·  ');return s||fb;}return fb;}
  var PAUSE=_q.has('pause')?parseFloat(_q.get('pause')):null;
  var TEAM=_q.get('team')?'#'+_q.get('team').replace('#',''):'#21e6ff';

  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
  function lighten(c,f){return[Math.min(255,c[0]+(255-c[0])*f)|0,Math.min(255,c[1]+(255-c[1])*f)|0,Math.min(255,c[2]+(255-c[2])*f)|0];}
  var TRGB=hexToRgb(TEAM),TLT=lighten(TRGB,0.5),ICEW=[223,242,252];
  function clamp(v,a,b){return v<a?a:(v>b?b:v);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function easeOutQuad(t){return 1-(1-t)*(1-t);}
  function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}

  var T={fadeIn:450,flightStart:1080,impact:1440,typeIn:1460,hold:3300,end:4300};  // puck rips in fast (≈360ms)
  var ICE=600;                                          // ice surface line
  // NHL goal: 6ft x 4ft = 1.5:1, RED frame, sits on the ice.
  var GOAL={x:1230,y:330,w:420,h:278};                  // 420/278 ≈ 1.51:1
  var IMPACT={x:GOAL.x+GOAL.w*0.55+90,y:GOAL.y+GOAL.h*0.44};   // back-centre of the net pocket
  var LAMP={x:GOAL.x+GOAL.w/2,y:GOAL.y-72};

  var startMs=0,rafId=0,prevMs=0,firedBurst=false;
  var ice=[],spark=[],puckTrail=[],puckSpin=0,puck={x:0,y:0,rx:36,ry:14},frost=[];

  function initFrost(){frost=[];for(var i=0;i<46;i++)frost.push({x:Math.random()*W,y:Math.random()*ICE,r:Math.random()*1.6+0.4});}
  function reset(){cancelAnimationFrame(rafId);TRGB=hexToRgb(TEAM);TLT=lighten(TRGB,0.5);startMs=0;firedBurst=false;ice=[];spark=[];puckTrail=[];puckSpin=0;initFrost();rafId=requestAnimationFrame(frame);}

  // ── black puck (flat disk) ────────────────────────────────────
  function drawPuck(t){
    if(t>T.impact+120)return;
    var x=puck.x,y=puck.y,rx=puck.rx,ry=puck.ry;
    if(t>=T.flightStart){ for(var i=0;i<puckTrail.length;i++){var p=puckTrail[i],a=i/puckTrail.length;ctx.fillStyle='rgba(20,22,28,'+(a*0.4)+')';ctx.beginPath();ctx.ellipse(p.x,p.y,rx*a,ry*a,0,0,Math.PI*2);ctx.fill();} }
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(puckSpin)*0.15);
    ctx.shadowColor=TEAM;ctx.shadowBlur=12;
    // side wall (thickness)
    ctx.fillStyle='#0a0a0d';ctx.beginPath();ctx.ellipse(0,ry*0.5,rx,ry,0,0,Math.PI*2);ctx.fill();
    // top face
    var g=ctx.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,'#3a3a42');g.addColorStop(1,'#101015');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(120,130,145,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,rx*0.7,ry*0.7,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  function updateBall(t,dt){
    var bt=seg(t,T.flightStart,T.impact);
    // LINEAR (constant high speed) — a slap shot doesn't slow down before it
    // smacks the twine. Low, flat trajectory.
    puck.x=lerp(-220,IMPACT.x,bt);
    puck.y=lerp(ICE-56,IMPACT.y,bt)-Math.sin(Math.PI*bt)*42;
    puckSpin+=dt*16;
    if(t>=T.flightStart){puckTrail.push({x:puck.x,y:puck.y});if(puckTrail.length>20)puckTrail.shift();}
  }

  // ── red goal + white net + crease + goal line + lamp ──────────
  // straight line between two [x,y] points
  function L(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  // grid-fill a quad (a=top-left,b=top-right,c=bot-right,d=bot-left) by
  // bilinear interpolation → adjacent quads sharing corners stay connected.
  function meshQuad(a,b,c,d,nu,nv){
    function P(u,v){var tx=a[0]+(b[0]-a[0])*u,ty=a[1]+(b[1]-a[1])*u,bx=d[0]+(c[0]-d[0])*u,by=d[1]+(c[1]-d[1])*u;return [tx+(bx-tx)*v,ty+(by-ty)*v];}
    var i,j,p;
    for(i=0;i<=nu;i++){ctx.beginPath();for(j=0;j<=nv;j++){p=P(i/nu,j/nv);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
    for(j=0;j<=nv;j++){ctx.beginPath();for(i=0;i<=nu;i++){p=P(i/nu,j/nv);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.stroke();}
  }
  // net billow on the make — damped push of the back wall outward, then settle
  function netBulge(t){if(t<T.impact)return 0;var e=t-T.impact;if(e>700)return 0;return Math.exp(-e/150)*Math.sin(e*0.05)*60;}  // hard SMACK, snaps back fast
  // the 8 corners of the goal pocket (front rectangle + back, which recedes
  // up-right at the top and further back along the ice at the bottom).
  function corners(t){
    var x=GOAL.x,y=GOAL.y,w=GOAL.w,h=GOAL.h,bz=netBulge(t);
    var dTopX=80,dTopY=-38,dBotX=134,dBotY=-12;
    return {
      FTL:[x,y],FTR:[x+w,y],FBL:[x,y+h],FBR:[x+w,y+h],
      BTL:[x+dTopX+bz,y+dTopY],BTR:[x+w+dTopX+bz,y+dTopY],
      BBL:[x+dBotX+bz,y+h+dBotY],BBR:[x+w+dBotX+bz,y+h+dBotY]
    };
  }
  function drawGoal(t){
    var reveal=easeOutCubic(seg(t,150,1050));
    ctx.save();ctx.globalAlpha=reveal;ctx.lineCap='round';
    var C=corners(t);
    // NET — one continuous white pocket meshed across all five surfaces.
    ctx.strokeStyle='rgba(236,246,255,0.42)';ctx.lineWidth=1.4;
    meshQuad(C.FTL,C.FTR,C.BTR,C.BTL,16,4);   // top
    meshQuad(C.FBL,C.FBR,C.BBR,C.BBL,16,5);   // floor
    meshQuad(C.FTL,C.BTL,C.BBL,C.FBL,5,9);    // left side
    meshQuad(C.FTR,C.BTR,C.BBR,C.FBR,5,9);    // right side
    meshQuad(C.BTL,C.BTR,C.BBR,C.BBL,16,9);   // back wall
    // back frame pipe (darker red) + top side rails
    ctx.strokeStyle='rgba(176,38,34,0.92)';ctx.lineWidth=5;
    L(C.BTL,C.BTR);L(C.BTR,C.BBR);L(C.BBR,C.BBL);L(C.BBL,C.BTL);
    L(C.FTL,C.BTL);L(C.FTR,C.BTR);L(C.FBL,C.BBL);L(C.FBR,C.BBR);
    // RED front frame (posts + crossbar) — front base open on the ice
    ctx.strokeStyle='#ef3a33';ctx.lineWidth=13;ctx.shadowColor='#ff5148';ctx.shadowBlur=22;
    L(C.FTL,C.FBL);L(C.FTR,C.FBR);L(C.FTL,C.FTR);
    ctx.shadowBlur=0;ctx.restore();
  }
  function drawLamp(t){
    var lit=t>=T.impact;var pulse=lit?(0.5+0.5*Math.sin((t-T.impact)*0.03)):0;
    // post
    ctx.strokeStyle='rgba(120,130,145,0.6)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(LAMP.x,LAMP.y+18);ctx.lineTo(LAMP.x,GOAL.y);ctx.stroke();
    // dome
    var on=lit?(0.55+0.45*pulse):0.12;
    ctx.fillStyle='rgba('+(120+on*135|0)+','+(20+on*20|0)+','+(20+on*15|0)+',1)';
    ctx.shadowColor='#ff2a1f';ctx.shadowBlur=lit?40*(0.5+pulse):6;
    ctx.beginPath();ctx.arc(LAMP.x,LAMP.y,26,Math.PI,0);ctx.lineTo(LAMP.x+26,LAMP.y+10);ctx.lineTo(LAMP.x-26,LAMP.y+10);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    // big red glow when lit
    if(lit){var gg=ctx.createRadialGradient(LAMP.x,LAMP.y,0,LAMP.x,LAMP.y,420);gg.addColorStop(0,'rgba(255,40,30,'+(0.28*(0.5+pulse))+')');gg.addColorStop(1,'rgba(255,40,30,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(LAMP.x,LAMP.y,420,0,Math.PI*2);ctx.fill();}
  }
  // ── ICE SPRAY (white, no fire) ────────────────────────────────
  function burst(x,y){var i;
    for(i=0;i<300;i++){var a=(-Math.PI/2)+(Math.random()-0.5)*2.5,sp=7+Math.random()*26;var col=Math.random()<0.6?'#ffffff':rgba(ICEW,1);ice.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,life:0.7+Math.random()*0.7,r:2+Math.random()*5,col:col});}
    for(i=0;i<40;i++){var a2=(-Math.PI/2)+(Math.random()-0.5)*2.2,sp2=16+Math.random()*26;spark.push({x:x,y:y,vx:Math.cos(a2)*sp2,vy:Math.sin(a2)*sp2,life:1});}
    for(i=0;i<34;i++){var a3=Math.random()*Math.PI*2,sp3=1+Math.random()*5;ice.push({x:x,y:y,vx:Math.cos(a3)*sp3,vy:Math.sin(a3)*sp3-3,life:1+Math.random()*0.6,r:14+Math.random()*22,col:'#ffffff',puff:true});}}
  function stepParticles(dt){var g=0.5,i,p;
    for(i=ice.length-1;i>=0;i--){p=ice[i];if(p.puff){p.vy-=0.05;p.vx*=0.96;p.vy*=0.97;p.r+=18*dt;p.life-=dt*0.8;}else{p.vy+=g;p.vx*=0.99;p.life-=dt*0.85;}p.x+=p.vx;p.y+=p.vy;if(p.life<=0)ice.splice(i,1);}
    for(i=spark.length-1;i>=0;i--){p=spark[i];p.vy+=g*0.7;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.4;if(p.life<=0)spark.splice(i,1);}}
  function drawParticles(){ctx.globalCompositeOperation='lighter';var i,p;
    for(i=0;i<ice.length;i++){p=ice[i];if(!p.puff)continue;var pa=clamp(p.life,0,1)*0.16;var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);gr.addColorStop(0,'rgba(235,248,255,'+pa+')');gr.addColorStop(1,'rgba(200,230,255,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    for(i=0;i<ice.length;i++){p=ice[i];if(p.puff)continue;ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.shadowColor=rgba(ICEW,1);ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life+0.2,0,1.2),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    for(i=0;i<spark.length;i++){p=spark[i];ctx.globalAlpha=clamp(p.life,0,1);ctx.strokeStyle='#ffffff';ctx.shadowColor=rgba(ICEW,1);ctx.shadowBlur=8;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.6,p.y-p.vy*1.6);ctx.stroke();}
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';}

  // ── ice rink background ───────────────────────────────────────
  function drawBackground(t){
    // dark arena above the ice
    var g=ctx.createLinearGradient(0,0,0,ICE);g.addColorStop(0,'#070d15');g.addColorStop(1,'#0e1c2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,ICE);
    // frost sparkle in the air
    ctx.globalCompositeOperation='lighter';for(var i=0;i<frost.length;i++){var f=frost[i];ctx.fillStyle='rgba(210,235,255,0.5)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();}ctx.globalCompositeOperation='source-over';
    // ICE surface
    var wg=ctx.createLinearGradient(0,ICE,0,H);wg.addColorStop(0,'#dcebf6');wg.addColorStop(0.5,'#9fc4dc');wg.addColorStop(1,'#5e88a4');ctx.fillStyle=wg;ctx.fillRect(0,ICE,W,H-ICE);
    // sheen streaks on the ice
    ctx.globalCompositeOperation='lighter';for(var s=0;s<6;s++){var yy=ICE+24+s*((H-ICE)/6);ctx.strokeStyle='rgba(255,255,255,'+(0.05+0.03*Math.sin(t*0.001+s))+')';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();}ctx.globalCompositeOperation='source-over';
    // ── ice markings IN FRONT of the net (NHL: RED goal line + RED-bordered crease) ──
    var baseY=GOAL.y+GOAL.h, gcx=GOAL.x+GOAL.w/2;
    // bold RED goal line across the mouth of the goal
    ctx.strokeStyle='rgba(228,42,38,0.92)';ctx.lineWidth=7;ctx.shadowColor='#ff3a30';ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(GOAL.x-170,baseY);ctx.lineTo(GOAL.x+GOAL.w+170,baseY);ctx.stroke();ctx.shadowBlur=0;
    // crease — light-blue fill with a RED border, opening in front of the mouth toward the shooter
    ctx.beginPath();ctx.ellipse(gcx,baseY,168,54,0,0,Math.PI);
    ctx.fillStyle='rgba(40,120,220,0.24)';ctx.fill();
    ctx.strokeStyle='rgba(228,42,38,0.85)';ctx.lineWidth=4;ctx.stroke();
    // red end-zone faceoff circle + dot, out in front (toward centre ice)
    ctx.strokeStyle='rgba(228,42,38,0.5)';ctx.lineWidth=4;
    ctx.beginPath();ctx.ellipse(560,ICE+205,150,52,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(228,42,38,0.6)';ctx.beginPath();ctx.ellipse(560,ICE+205,26,9,0,0,Math.PI*2);ctx.fill();
  }
  // red goal-light flood over the whole rink (strobe then steady)
  function redFlood(t){
    if(t<T.impact)return;var e=t-T.impact;
    var strobe=e<800?((Math.floor(e/120)%2===0)?0.30:0.06):0.07;
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,30,24,'+strobe+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  }

  function drawType(t){
    if(t<T.typeIn)return;
    var p=seg(t,T.typeIn,T.typeIn+420),s=lerp(1.7,1.0,(1-Math.pow(1-p,3)));
    var glitch=t<T.typeIn+320?(Math.random()-0.5)*10:0;
    ctx.save();ctx.translate(W/2+glitch,300);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 260px Arial Black, Arial, sans-serif';
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,40,40,0.9)';ctx.fillText('GOAL!',-8,0);
    ctx.fillStyle=rgba(TRGB,0.9);ctx.fillText('GOAL!',8,0);
    ctx.fillStyle='#fff';ctx.shadowColor=TEAM;ctx.shadowBlur=42;ctx.fillText('GOAL!',0,0);
    ctx.globalCompositeOperation='source-over';ctx.restore();
    var lp=seg(t,T.typeIn+260,T.typeIn+640);
    if(lp>0){
      ctx.save();ctx.globalAlpha=lp;var bandY=820,bandH=170;
      var bg=ctx.createLinearGradient(0,bandY,0,bandY+bandH);bg.addColorStop(0,'rgba(5,12,20,0)');bg.addColorStop(0.32,'rgba(5,12,20,0.86)');bg.addColorStop(0.7,'rgba(5,12,20,0.86)');bg.addColorStop(1,'rgba(5,12,20,0)');ctx.fillStyle=bg;ctx.fillRect(0,bandY,W,bandH);
      ctx.strokeStyle=rgba(TLT,0.7);ctx.lineWidth=3;ctx.shadowColor=TEAM;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(W/2-380,bandY+34);ctx.lineTo(W/2+380,bandY+34);ctx.stroke();ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.textBaseline='alphabetic';var ty=bandY+96+(1-easeOutCubic(lp))*26;
      ctx.font='800 60px Arial';ctx.fillStyle='#eef6ff';ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=14;ctx.fillText(lvScore('HOME  3  —  2  AWAY'),W/2,ty);
      ctx.font='700 30px Arial';ctx.fillStyle=rgba(TLT,0.95);ctx.shadowBlur=0;ctx.fillText(lvSub('2ND PERIOD  ·  GOAL  ·  #17'),W/2,ty+42);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }

  function frame(ms){
    if(!startMs){startMs=ms;prevMs=ms;}
    var t=ms-startMs,dt=Math.min(0.05,(ms-prevMs)/1000);prevMs=ms;
    var rawT=t; if(PAUSE==null&&t>T.hold)t=T.hold; /* 2026-06-15 play-once: hold hero frame at peak, skip fade-out (matches v2 engine) */
    var shake=(t>=T.impact&&t<T.impact+520)?(1-(t-T.impact)/520)*22:0;
    var ox=(Math.random()-0.5)*shake,oy=(Math.random()-0.5)*shake;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(ox,oy);
    drawBackground(t);
    drawLamp(t);
    drawGoal(t);
    if(t>=T.impact&&!firedBurst){firedBurst=true;burst(IMPACT.x,IMPACT.y);}
    updateBall(t,dt);drawPuck(t);
    stepParticles(dt);drawParticles();
    redFlood(t);
    drawType(t);
    if(t<T.fadeIn){ctx.fillStyle='rgba(4,8,16,'+(1-t/T.fadeIn)+')';ctx.fillRect(-50,-50,W+100,H+100);}
    if(t>T.hold){var fo=seg(t,T.hold,T.end);ctx.fillStyle='rgba(4,8,16,'+fo+')';ctx.fillRect(-50,-50,W+100,H+100);}
    ctx.restore();
    if(PAUSE!=null&&rawT>=PAUSE)return;
    if(PAUSE!=null?rawT<T.end:rawT<T.hold)rafId=requestAnimationFrame(frame);
  }
  document.getElementById('replay').addEventListener('click',reset);
  var sw=document.querySelectorAll('.sw');
  for(var i=0;i<sw.length;i++)sw[i].addEventListener('click',function(e){TEAM=e.currentTarget.getAttribute('data-c');reset();});
  reset();
})();
</script>
</body>
</html>
