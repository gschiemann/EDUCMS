        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/ws-events"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
