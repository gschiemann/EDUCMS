        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/scoreboard-cts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions (workflows pin third-party actions) ----
  # Majors here also break (checkout 4->6 needs a newer runner). Group
  # minor/patch; majors are a manual, reviewed bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
