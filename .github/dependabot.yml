# Dependabot — dependency updates for the pnpm monorepo.
# `npm` ecosystem covers pnpm (Dependabot reads pnpm-lock.yaml).
# One entry per package.json directory + one for GitHub Actions.
#
# ⏸ PRE-LAUNCH PAUSE (2026-07-03): every block sets
# `open-pull-requests-limit: 0`, which PAUSES routine version-update PRs.
# Why: V1 is locked for the live pilot (additive-only), so we do NOT want
# a stream of dependency-bump PRs merging during the pilot — and Dependabot
# cannot regenerate a pnpm *workspace* lockfile, so every grouped bump PR
# failed its Vercel preview build with ERR_PNPM_OUTDATED_LOCKFILE (fast 8s
# fail — cosmetic dashboard red, zero production impact). Pausing stops that
# noise at the source.
#   * SECURITY updates still bypass THIS setting — GitHub documents that
#     "security update pull requests are not subject to this limit and do not
#     count toward it." So the pause itself does not suppress a CVE patch.
#
#     BUT (2026-08-04) do not read that as "security fixes always reach us."
#     The `ignore` blocks below are a SEPARATE suppression, and GitHub marks
#     `ignore` as applying to security updates as well as version updates.
#     Whether an `update-types: ["version-update:semver-major"]` entry blocks a
#     SECURITY update that needs a major bump is genuinely not specified in
#     GitHub's published reference — it is left ambiguous, so treat it as
#     possible, not proven. Nobody should assume either way from this file.
#
#     WHAT ACTUALLY GUARANTEES COVERAGE is not Dependabot at all: the
#     `Production Dependency Audit` job in ci.yml runs
#     `scripts/npm-advisory-audit.cjs` on EVERY push. It enumerates the whole
#     production closure (~800 packages) from pnpm itself, checks every version
#     against npm's bulk advisory API, exits 1 on any HIGH or CRITICAL, and
#     fails CLOSED (exit 2) if enumeration or the advisory lookup breaks rather
#     than green-lighting on an error. That gate is independent of Dependabot's
#     ignore semantics and of the major/minor distinction, so a vulnerable
#     production dependency fails the build whether or not a Dependabot PR was
#     ever opened. It is the control to keep working; Dependabot is convenience
#     on top of it.
#   * TO RE-ENABLE post-launch: set each `open-pull-requests-limit` back to
#     2–3 (the prior values) and take the accumulated bumps as a reviewed
#     batch on a feature branch (regenerate pnpm-lock.yaml locally so the
#     workspace lockfile is in sync before opening the PR).
#
# NOISE POLICY (2026-05-29, retained for when updates resume): minor + patch
# bumps are GROUPED into a single PR per directory; routine MAJOR bumps are
# IGNORED — they break builds (argon2 native compile, eslint 9->10 flat-config,
# prisma 5->7, typescript 5->6, actions/checkout 4->6, helmet 7->8 ...; see
# CLAUDE.md "Deploy Reliability") and must be done DELIBERATELY.
# apps/player is Android/Gradle, not npm — not managed here.
version: 2
updates:
  # ---- Root workspace (Turborepo tooling, shared devDeps) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- Apps ----
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/edge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- Shared packages ----
  - package-ecosystem: "npm"
    directory: "/packages/api-types"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/auth-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/database"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/ws-events"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/packages/scoreboard-cts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions (workflows pin third-party actions) ----
  # Majors here also break (checkout 4->6 needs a newer runner). Group
  # minor/patch; majors are a manual, reviewed bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---- Docker base image (SEC-005, 2026-09-04) ----
  # The runtime Dockerfile now pins node:22-alpine BY DIGEST, because the
  # independent assessment asked for it and because an unpinned tag means the
  # scan result is not reproducible. A digest pin with no update path is its
  # own hazard: it freezes the image at whatever Alpine/Node shipped that day,
  # and the container scan is now BLOCKING, so the first base-image CVE turns
  # master red with no automated way forward.
  #
  # DELIBERATELY NOT PAUSED (limit 1, not 0) unlike every npm block above.
  # The reason those are paused does not apply here: Dependabot cannot
  # regenerate a pnpm WORKSPACE lockfile, so npm bumps failed their preview
  # builds — a base-image bump touches one FROM line and no lockfile at all.
  # One open PR is not the noise stream the pause exists to stop, and it is the
  # cheap path back to green when Alpine patches something.
  #
  # Reviewing one of these: the PR moves the digest in the `ARG NODE_IMAGE`
  # line. Confirm the new digest is a MULTI-ARCH INDEX (the build runs on
  # amd64 in CI and arm64 on a developer Mac — a single-platform digest breaks
  # one of them), and that it is still Node 22.12+ (SEC-013's sanitize-html
  # 2.17.7 loads ESM-only htmlparser2 through require(esm); the Dockerfile
  # asserts this, so a too-old Node fails the build rather than production).
  #
  # 2026-09-08: the pin moved from node:20-alpine to node:22-alpine because
  # Node 20 reached end of life on 2026-04-30. Dependabot only offers patch/
  # minor moves inside the `22-alpine` tag, so it will NOT walk this to Node
  # 24 on its own — that is a deliberate human step, and `node-version:` in
  # ~25 CI workflow steps has to move with it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # Node 21/22/24 is a deliberate, tested migration, not a Dependabot PR.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
