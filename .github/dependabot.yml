        update-types: ["version-update:semver-major"]

  # ---- Shared packages ----
  - package-ecosystem: "npm"
    directory: "/packages/api-types"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
