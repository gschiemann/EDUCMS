        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/apps/edge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
