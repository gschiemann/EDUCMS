name: Deploy Reliability

# Runs on every push to master + every PR. Blocks the bad-build classes
# we hit in production debugging on 2026-04-19:
#   - native deps not compiling on Alpine (argon2/bcrypt)
#   - Prisma schema missing at install time
#   - workspace TS packages not built before Node tries to require them
#   - lockfile drift
#   - TS errors in apps/web that break the Vercel build
# See CLAUDE.md "Build failure modes" appendix for the full story.

on:
  push:
    branches: [master, main]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  pull_request:
    branches: [master, main]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'

permissions:
  contents: read

# Cancel in-progress runs when a newer commit arrives on the same ref.
concurrency:
  group: deploy-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-version-tag-sync:
    # The #1 recurring OTA failure: a developer bumps versionCode /
    # versionName in build.gradle.kts but forgets to push the matching
    # `player-v*` / `manager-v*` git tag. CI then never builds a GitHub
    # Release, every kiosk polling /update-check correctly sees the old
    # tag as "latest", and the whole fleet silently stays on a months-
    # old build — with zero errors anywhere. This job turns that silent
    # failure into a red check that prints the exact `git tag` command.
    name: APK version is tagged
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Player + Manager versionName must have a matching git tag
        run: |
          fail=0
          for entry in "app:player" "manager:manager"; do
            dir="${entry%%:*}"; prefix="${entry##*:}"
            gradle="apps/player/$dir/build.gradle.kts"
            vn=$(grep -oE 'versionName = "[^"]+"' "$gradle" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            vc=$(grep -oE 'versionCode = [0-9]+'   "$gradle" | head -1 | sed -E 's/.*= //')
            IFS=. read -r MA MI PA <<< "$vn"
            want=$(( MA*10000 + MI*100 + PA ))
            if [ "$vc" != "$want" ]; then
              echo "::error file=$gradle::$dir versionCode=$vc but versionName=$vn implies $want — the OTA endpoint derives versionCode as major*10000+minor*100+patch, so they MUST agree."
              fail=1
            fi
            tag="${prefix}-v${vn}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "OK  $dir is v$vn and tag $tag exists"
            else
              echo "::error file=$gradle::$dir is at versionName=$vn but git tag '$tag' does NOT exist. CI only ships an OTA release on a $prefix-v* tag. Run:  git tag $tag && git push origin $tag"
              fail=1
            fi

            # Hardening (the v1.0.66 incident): the checks above work
            # FROM the gradle outward and cannot catch a tag cut on an
            # un-bumped tree — player-v1.0.66 was tagged while the gradle
            # still said 1.0.65, so the APK shipped mis-stamped and every
            # kiosk looped on install. This check works FROM the tags:
            # the newest $prefix-v* tag must point at a commit whose
            # build.gradle.kts versionName equals the tag.
            latest=$(git tag -l "${prefix}-v*" | sort -V | tail -1)
            if [ -n "$latest" ]; then
              tagver="${latest#${prefix}-v}"
              tagvn=$(git show "$latest:$gradle" 2>/dev/null | grep -oE 'versionName = "[^"]+"' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
              if [ "$tagvn" != "$tagver" ]; then
                echo "::error file=$gradle::tag $latest points at a commit whose versionName is '$tagvn', not '$tagver' — a $prefix-v* tag was cut WITHOUT bumping the gradle. The APK ships mis-stamped and kiosks loop on install. Bump the gradle and re-tag (see release-apk.sh / feedback_player_release_tagging.md)."
                fail=1
              else
                echo "OK  newest tag $latest matches its commit gradle ($tagvn)"
              fi
            fi
          done
          exit $fail

  lockfile-check:
    name: pnpm lockfile drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

  api-build:
    name: API + workspace packages build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client (must run BEFORE workspace builds — packages import @prisma/client transitively)
        run: cd packages/database && npx prisma generate
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build
      - name: Build API
        run: pnpm --filter api build

      - name: Run API tests (Jest)
        # continue-on-error RESTORED 2026-05-31. The suite is green LOCALLY
        # (55 suites / 719) and in the Docker/prod build, but 5 suites FAIL
        # TO LOAD on the raw ubuntu runner: argon2's native binding
        # (argon2.node) isn't built by `pnpm install --frozen-lockfile` here
        # (the Dockerfile builds it via apk + node-gyp; local has it cached).
        # Flipping this to blocking off a local-green run was premature — CI
        # caught it immediately. To make it blocking for real: add an argon2
        # rebuild step (or pnpm build-script allowlist) so the binding exists,
        # verify CI green, THEN drop this flag. Tracked: audit §17 G2.
        continue-on-error: true
        run: pnpm --filter api run test

  web-jest:
    name: Web Jest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
      # Same reason as web-build: --ignore-scripts skips postinstall, and the
      # web suite imports @cms/* packages whose `main` points at dist/index.js.
      # Without these built, Jest parses raw .ts and dies on `Unexpected token
      # 'export'`. (The "rebuild api-types before marketing jest" trap.)
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build
      # BLOCKING, deliberately — unlike the API Jest job, which is
      # continue-on-error because a fresh runner cannot rebuild argon2's native
      # binding under --ignore-scripts. The web suite is pure JS/TS with no
      # native deps, so there is no such excuse here.
      #
      # WHY THIS JOB EXISTS: from 2026-07-22 to 2026-08-03, 22 web suites
      # failed to LOAD (next-intl shipping untransformed ESM) and nothing
      # noticed, because no workflow ran web Jest at all — the three that
      # mention `--filter web` all run Playwright, not Jest. A suite nobody
      # runs is not a test, it is a comment. Fixed by
      # apps/web/test-mocks/next-intl.tsx; this job keeps it fixed.
      - name: Web Jest
        # --maxWorkers/heap for the same reason as the API suite's cap in
        # ci.yml (2026-09-08): the private-runner downgrade (4-vCPU/16 GB ->
        # 2-vCPU/7 GB) leaves React Testing Library renders competing for CPU,
        # and `waitFor`/`findBy*` assertions start timing out under contention.
        # This job passed on 085a89e0 and failed on the very next commit with
        # `Unable to find an element with the display value: …` in
        # wall-clock-field.test.tsx — a file untouched for days, which passes
        # locally (22/22). That is a resource symptom, not a product defect.
        # Capped here rather than raising individual test timeouts, because the
        # timeouts are not wrong — the box is smaller.
        run: pnpm --filter web exec jest --ci --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  web-build:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
      # 2026-05-04 — Web build was failing on CI but passing locally.
      # Cause: --ignore-scripts skips the postinstall hook + this job
      # didn't build the workspace TS packages before the Next.js
      # build. Web imports @cms/api-types whose
      # `main` points at dist/index.js — without those built, Next
      # tries to parse raw .ts source at runtime and crashes
      # (`Unexpected token 'export'`). Locally the dist folders
      # already exist from prior dev runs which is why it worked.
      # api-build job at lines 60-64 already runs these three builds;
      # mirror them here.
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build
      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api-production-39a1.up.railway.app/api/v1
        run: pnpm --filter web build
      # Bundle-budget ratchet (efficiency audit 2026-07-20, F3) — the widget
      # world already compiles to ~3.4 MB chunks; this locks today's sizes as
      # the CEILING (down-only, like taurus-safety) so growth reds the build
      # instead of silently landing on player CPUs.
      - name: Bundle budget (ratchet down only)
        run: node apps/web/tools/check-bundle-budget.cjs

      # Player SW invariants: app-shell tier present + BUG #5 version-sort
      # regression cases (migrated from a .test.ts that NO runner executed —
      # apps/web has no unit-test script; this gate actually runs).
      - name: Player SW shell invariants
        run: node apps/web/tools/check-sw-shell.cjs

      # Every registered help article must actually prerender with content —
      # caught one silently rendering as "Article not found" in a green build.
      - name: Help-center prerender integrity
        run: node apps/web/tools/check-help-prerender.cjs

      # Brand palettes must never make chrome unreadable (VisionCore cream
      # incident): the Tailwind-scale takeover serves contrast-guaranteed
      # derivatives; this gate runs the literal incident palette.
      - name: Brand contrast contract
        run: node apps/web/tools/check-brand-contrast.cjs

      # SEC-010: a PRERENDERED route must never receive the enforced,
      # nonce-based script-src — its inline scripts were built without a nonce,
      # so the browser would refuse them and the page would render blank. This
      # reads the build's own prerender-manifest, so it catches a new static
      # page landing inside the enforced prefixes at BUILD time rather than on
      # a customer's screen.
      - name: CSP nonce vs prerendered routes
        run: node apps/web/tools/check-csp-prerender.cjs

  docker-build:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the same image Railway will build
        run: docker build -f Dockerfile -t educms-api:ci .
      - name: Boot smoke test
        run: |
          # NOTE: no --rm so we can still read logs after the container
          # exits. We auto-delete in the cleanup step below.
          docker run -d --name api-smoke -p 18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e DATABASE_URL='postgres://fake:fake@127.0.0.1:5432/fake?schema=public' \
            -e DIRECT_URL='postgres://fake:fake@127.0.0.1:5432/fake?schema=public' \
            -e JWT_SECRET='ci-fake-jwt-secret-please-do-not-use-in-prod-32chars' \
            -e SESSION_SECRET='ci-fake-session-secret-please-do-not-use-in-prod-32chars' \
            -e DEVICE_SECRET_KEY='ci-fake-device-secret-please-do-not-use-in-prod-32chars' \
            -e DEVICE_JWT_SECRET='ci-fake-device-jwt-secret-please-do-not-use-in-prod-32chars' \
            -e SUPABASE_URL='https://fake.supabase.co' \
            -e SUPABASE_SERVICE_ROLE_KEY='fake' \
            -e ALLOWED_ORIGINS='http://localhost:3000' \
            -e SKIP_MIGRATE='true' \
            educms-api:ci
          # Poll up to 60s for "API listening" or container exit.
          for i in $(seq 1 30); do
            STATE=$(docker inspect -f '{{.State.Status}}' api-smoke 2>/dev/null || echo "missing")
            if docker logs api-smoke 2>&1 | grep -q "API listening"; then
              echo "API booted ✓"
              exit_ok=1
              break
            fi
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
              EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' api-smoke 2>/dev/null || echo "?")
              OOM=$(docker inspect -f '{{.State.OOMKilled}}' api-smoke 2>/dev/null || echo "?")
              ERR=$(docker inspect -f '{{.State.Error}}' api-smoke 2>/dev/null || echo "")
              echo "============================================================"
              echo "CONTAINER EXITED  state=$STATE  exit=$EXIT_CODE  oom=$OOM"
              [ -n "$ERR" ] && echo "Docker error: $ERR"
              echo "============================================================"
              echo "STDOUT+STDERR (raw, no grouping):"
              echo "------------------------------------------------------------"
              docker logs api-smoke 2>&1 || echo "(docker logs returned no output)"
              echo "------------------------------------------------------------"
              echo "Image filesystem listing of apps/api/dist:"
              docker run --rm --entrypoint sh educms-api:ci -c 'ls -la apps/api/dist 2>&1 | head -20 || echo "dist dir missing"' || true
              echo "Image filesystem listing of /app:"
              docker run --rm --entrypoint sh educms-api:ci -c 'ls -la /app 2>&1 | head -20 || echo "app dir missing"' || true
              echo "Image node version:"
              docker run --rm --entrypoint node educms-api:ci --version || true
              echo "============================================================"
              exit 1
            fi
            sleep 2
          done
          if [ "${exit_ok:-0}" != "1" ]; then
            echo "✗ API never logged 'API listening' within 60s"
            echo "Container state: $(docker inspect -f '{{.State.Status}}' api-smoke 2>/dev/null || echo missing)"
            echo "STDOUT+STDERR (raw):"
            docker logs api-smoke 2>&1 || echo "(docker logs returned no output)"
            exit 1
          fi
      - name: Healthcheck curl
        run: |
          curl -fsS --max-time 10 http://localhost:18080/api/v1/health || {
            echo "✗ Healthcheck failed"
            echo "::group::Container logs"
            docker logs --tail 200 api-smoke 2>&1 || true
            echo "::endgroup::"
            exit 1
          }
          echo "Healthcheck OK ✓"
      - name: Cleanup container
        if: always()
        run: |
          docker stop api-smoke 2>/dev/null || true
          docker rm api-smoke 2>/dev/null || true
