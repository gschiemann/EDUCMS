name: Deploy Reliability

# THE per-change gate workflow. Runs on every push to master + every PR and
# blocks the bad-build classes we hit in production debugging on 2026-04-19:
#   - native deps not compiling on Alpine (argon2/bcrypt)
#   - Prisma schema missing at install time
#   - workspace TS packages not built before Node tries to require them
#   - lockfile drift
#   - TS errors in apps/web that break the Vercel build
# See CLAUDE.md "Deploy Reliability" for the full story.
#
# ── 2026-10-22: consolidated for the private repo's minute budget ──────────
# Full measurements and the before/after projection:
#   docs/research/2026-10-22-go-private/01-ci-minutes.md
#
# On a private repo every JOB is billed, each rounded UP to a whole minute,
# on a 2-vCPU runner. This workflow now carries what used to be spread over
# ten workflows, with NO gate removed:
#   * API Jest (blocking) — was ci.yml "Build, Lint & Test"; it now runs in
#     "API + workspace packages build", which installed and built the same
#     packages anyway. The old continue-on-error Jest step here is gone.
#   * jsx-a11y + rules-of-hooks ESLint gates and Web Jest — were ci.yml
#     "Accessibility Lint" and the "Web Jest (unit)" job; they now run in
#     "Web typecheck + build".
#   * The static guards (taurus-safety, mobile-perf, tenant isolation,
#     capability registry, integration truth, OTA wiring, signing secrets,
#     poster freshness) + schema-has-migration + APK-version-tag — were nine
#     separate one-minute jobs in eight workflows; now one "Static guards" job.
#   * Emergency path e2e (emergency-path.yml) is called from here, so it sees
#     the same change detection.
#   * Semgrep SAST (new, report-only — replaces what CodeQL default setup did
#     for free on the public repo).
#
# What decides what runs: the `changes` job (scripts/ci-changed-areas.cjs,
# seconds). It fails OPEN. A job it skips reports "skipped", which a REQUIRED
# check accepts — that is why there is no `paths-ignore` on this workflow any
# more: a workflow skipped by paths-ignore never reports its required checks,
# so a docs-only PR could never merge without admin bypass.
#
# Two skips beyond "nothing relevant changed" (`heavy=false`), both with no
# loss of coverage (details in the script header):
#   * DRAFT PRs run only the change detection. Click "Ready for review" and the
#     full set runs (`ready_for_review` is a trigger) before it can merge.
#   * A push to master whose tree is byte-identical to a PR head that already
#     passed this workflow (up to date with master, same jobs green) is not
#     re-run. A direct push, or a merge of a stale/red PR, runs everything.
#
# Runner: `vars.CI_RUNNER` (repo Settings → Secrets and variables → Actions →
# Variables) moves the heavy jobs to another runner label — a self-hosted box
# or a cheaper hosted-runner provider — with no code change. Unset = GitHub's
# ubuntu-latest. See 02-checklist.md.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs when a newer commit arrives on the same ref.
concurrency:
  group: deploy-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.areas.outputs.code }}
      app: ${{ steps.areas.outputs.app }}
      server: ${{ steps.areas.outputs.server }}
      player: ${{ steps.areas.outputs.player }}
      renderer: ${{ steps.areas.outputs.renderer }}
      heavy: ${{ steps.areas.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: deploy-reliability.yml
          # The jobs that must have concluded SUCCESS on the PR head before a
          # master push of the identical tree may skip them (keyed by area).
          TESTED_JOBS: >-
            {"code": ["Static guards", "pnpm lockfile drift", "Semgrep SAST (diff-aware, report-only)"],
             "app": ["API + workspace packages build", "Web typecheck + build"],
             "server": ["Docker build + boot smoke test", "Emergency path / Emergency path (chromium + webkit)"],
             "renderer": "Renderer image build + render smoke test"}
        run: node scripts/ci-changed-areas.cjs

  lockfile-check:
    name: pnpm lockfile drift
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify lockfile matches package.json
        run: pnpm install --frozen-lockfile --lockfile-only

  guards:
    # Every check here is a script that finishes in seconds; one runner, one
    # install. Each check step runs even when an earlier CHECK failed
    # (`!cancelled()` + setup succeeded), so one red guard never hides another.
    # The reasoning for each guard lives in the script it runs.
    name: Static guards
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # schema + poster checks diff against the base; the APK check reads tags
          fetch-tags: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (no scripts — the guards only read files; the schema check needs the prisma CLI)
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build @cms/api-types (capability registry reads it)
        id: build
        run: pnpm --filter @cms/api-types build

      # ── Deploy-safety guards ───────────────────────────────────────────────
      - name: "Schema change ships a migration (2026-09-16 fleet incident)"
        # A schema.prisma change that alters the database MUST ship a migration
        # file: production applies migration files only (railway-start.sh →
        # `prisma migrate deploy`), and `pnpm db:push` hides a missing one on
        # the author's machine. Database-free; see the script header.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-schema-has-migration.cjs
      - name: "APK version is tagged (player + manager versionName has its git tag)"
        # The #1 recurring OTA failure: versionCode/versionName bumped in
        # build.gradle.kts without the matching player-v* / manager-v* tag, so
        # no Release is built and the fleet silently stays on an old build.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          fail=0
          for entry in "app:player" "manager:manager"; do
            dir="${entry%%:*}"; prefix="${entry##*:}"
            gradle="apps/player/$dir/build.gradle.kts"
            vn=$(grep -oE 'versionName = "[^"]+"' "$gradle" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            vc=$(grep -oE 'versionCode = [0-9]+'   "$gradle" | head -1 | sed -E 's/.*= //')
            IFS=. read -r MA MI PA <<< "$vn"
            want=$(( MA*10000 + MI*100 + PA ))
            if [ "$vc" != "$want" ]; then
              echo "::error file=$gradle::$dir versionCode=$vc but versionName=$vn implies $want — the OTA endpoint derives versionCode as major*10000+minor*100+patch, so they MUST agree."
              fail=1
            fi
            tag="${prefix}-v${vn}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "OK  $dir is v$vn and tag $tag exists"
            else
              echo "::error file=$gradle::$dir is at versionName=$vn but git tag '$tag' does NOT exist. CI only ships an OTA release on a $prefix-v* tag. Run:  git tag $tag && git push origin $tag"
              fail=1
            fi
            # Hardening (the v1.0.66 incident): the newest $prefix-v* tag must
            # point at a commit whose build.gradle.kts versionName equals the tag.
            latest=$(git tag -l "${prefix}-v*" | sort -V | tail -1)
            if [ -n "$latest" ]; then
              tagver="${latest#${prefix}-v}"
              tagvn=$(git show "$latest:$gradle" 2>/dev/null | grep -oE 'versionName = "[^"]+"' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
              if [ "$tagvn" != "$tagver" ]; then
                echo "::error file=$gradle::tag $latest points at a commit whose versionName is '$tagvn', not '$tagver' — a $prefix-v* tag was cut WITHOUT bumping the gradle. The APK ships mis-stamped and kiosks loop on install. Bump the gradle and re-tag (see release-apk.sh / feedback_player_release_tagging.md)."
                fail=1
              else
                echo "OK  newest tag $latest matches its commit gradle ($tagvn)"
              fi
            fi
          done
          exit $fail

      # ── Taurus safety (Chromium 83 player/widget surfaces) ────────────────
      - name: "Taurus: Chromium-83 forbidden patterns (flex gap, container queries)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-taurus-safety.cjs
      - name: "Taurus: inset-shorthand CSSOM-serialization landmine"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-inset-serialization.cjs
      - name: "Taurus: every widget <style> routes through sceneCss()"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-scene-css.cjs
      - name: "Taurus: variant registry (duplicate ids, missing renderers)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-variant-registry.cjs
      - name: "Taurus: every signage board is click-editable"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-board-editability.cjs
      - name: "Taurus: widgets never fabricate content they do not have (§19)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-widget-truth.cjs
      - name: "Taurus: widget type can grow on a wall (font ceilings)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-font-ceilings.cjs

      # ── Mobile perf standard + i18n parity ────────────────────────────────
      - name: "Mobile perf: no bg polling / focus storm / mobile-chrome blur"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-mobile-perf.cjs
      - name: "Mobile perf: i18n catalog parity (en/es/zh keys + ICU shapes)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-i18n-parity.cjs

      # ── Tenant isolation (static; the two-tenant role matrix specs run in
      #    the full API Jest suite below) ─────────────────────────────────────
      - name: "Tenant isolation: no new unscoped bare-id access"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/api/tools/check-tenant-isolation.cjs

      # ── Truth gates ───────────────────────────────────────────────────────
      - name: "Capability registry truth (§21)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-capability-registry.cjs
      - name: "Integration truth: media integrations claim only rights they can back"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/web/tools/check-integration-truth.cjs

      # ── Player / signing ──────────────────────────────────────────────────
      - name: "OTA wiring integrity"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash scripts/ota-wiring-check.sh
      - name: "Signing: no new keystore or hardcoded signing password"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-tracked-keystores.cjs

      # ── Gallery posters regenerated for changed boards ────────────────────
      - name: "Poster freshness"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: origin/${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
          else
            BASE="HEAD~1"
          fi
          echo "poster-freshness base ref: $BASE"
          POSTER_CHECK_BASE="$BASE" node apps/web/tools/check-poster-freshness.cjs

  api-build:
    # Was two jobs: this one (build only, with a continue-on-error Jest step
    # that could never fail anything) and ci.yml "Build, Lint & Test" (the
    # BLOCKING Jest run, which installed and built the same packages again).
    name: API + workspace packages build
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (WITH scripts — argon2/bcrypt native bindings, Prisma client)
        # A full install, not --ignore-scripts: the API suite loads argon2's
        # native binding, which --ignore-scripts never builds (that is why the
        # old Jest step in this job had to be continue-on-error). The root
        # postinstall also runs `prisma generate`.
        run: pnpm install --frozen-lockfile
      - name: AI model retirement gate (audit W0-03)
        # Fails if any AI model we ship is past its provider's announced
        # shutdown date; warns 60 days out.
        run: node apps/api/tools/check-model-retirements.cjs
      - name: Gate-script unit tests (scripts/__tests__)
        # SHELL-globbed on purpose: Node 22 treats an explicitly passed
        # directory as a file to execute (2026-09-08), so `node --test dir/`
        # would run nothing and fail as one confusing "test".
        run: node --test scripts/__tests__/*.test.cjs
      - name: Build workspace packages
        run: pnpm --filter @cms/api-types --filter @cms/scoreboard-cts --filter @cms/signage-design build
      - name: Every package can run the tests it ships
        run: node scripts/check-package-tests.cjs
      - name: Run Package Tests
        run: pnpm --filter "./packages/*" test
      - name: API tests (Jest — BLOCKING)
        # BLOCKING since governance review #1 (2026-05-29). --maxWorkers=2 and
        # a 4 GB heap are sized for the 2-vCPU / 7 GB private runner: without
        # them the suite died with "Ineffective mark-compacts near heap limit"
        # (2026-09-08) the first time the repo was private.
        run: pnpm --filter api exec jest --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build API
        run: pnpm --filter api build

  web-build:
    # Was three jobs: this one, "Web Jest (unit)" and ci.yml "Accessibility
    # Lint (jsx-a11y)" — three installs and three package builds of one tree.
    name: Web typecheck + build
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
      # --ignore-scripts skips postinstall, and web imports @cms/* packages
      # whose `main` points at dist/index.js — build them first or Next/Jest
      # parse raw .ts and die on `Unexpected token 'export'`.
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build

      - name: a11y lint (jsx-a11y — NEW errors fail the build)
        # Baseline count in .a11y-baseline; only growth fails, and the baseline
        # may only be RATCHETED DOWN. 2026-07-13 (audit W0-05): this used to be
        # FALSE-GREEN — ESLint crashed (exit 2) and `|| true` + a grep over the
        # crash text printed success. Exit >= 2 now fails before any counting,
        # and exit 1 must come with a real ESLint problem summary.
        run: |
          set -o pipefail
          CODE=0
          pnpm --filter web lint 2>&1 | tee /tmp/lint.txt || CODE=$?
          echo "eslint exit code: $CODE"
          if [ "$CODE" -ge 2 ]; then
            echo "FAIL: ESLint crashed (exit $CODE). That is a configuration error, not a lint result."
            exit "$CODE"
          fi
          if [ "$CODE" -eq 1 ] && ! grep -qE "[0-9]+ problems" /tmp/lint.txt; then
            echo "FAIL: ESLint exited 1 without a problem summary — broken run, not a lint result."
            exit 1
          fi
          ACTUAL=$(grep -cE "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt || true)
          BASELINE=$(cat .a11y-baseline)
          echo "a11y errors — actual=$ACTUAL baseline=$BASELINE"
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "FAIL: a11y error count increased. New violations:"
            grep -E "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt
            echo ""
            echo "Fix the new violations. Do NOT raise .a11y-baseline to get green."
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASELINE" ]; then
            echo "::notice::a11y errors dropped to $ACTUAL (baseline $BASELINE). Ratchet down: echo $ACTUAL > .a11y-baseline"
          fi
          echo "OK: a11y errors did not increase"
      - name: Rules-of-hooks gate (zero tolerance for NEW violations)
        # A conditional hook crashes the page with React error #310 the moment
        # the branch flips (PlaylistCreateWizard, 2026-05-27). The 10 survivors
        # in WidgetRenderer.tsx are held in .hooks-baseline, ratchet-down only.
        run: |
          HOOK_ERRS=$(grep -cE "error[[:space:]]+.*react-hooks/rules-of-hooks" /tmp/lint.txt || true)
          HOOK_BASELINE=$(cat .hooks-baseline)
          echo "react-hooks/rules-of-hooks errors: $HOOK_ERRS (baseline $HOOK_BASELINE)"
          if [ "$HOOK_ERRS" -gt "$HOOK_BASELINE" ]; then
            echo ""
            echo "FAIL: NEW conditional-hook violations detected."
            echo "These crash the page at runtime with React error #310"
            echo "the moment the conditional branch flips."
            echo ""
            grep -B1 -A4 "react-hooks/rules-of-hooks" /tmp/lint.txt
            echo ""
            echo "Fix them. Do NOT raise .hooks-baseline to get green."
            exit 1
          fi
          if [ "$HOOK_ERRS" -lt "$HOOK_BASELINE" ]; then
            echo "::notice::hooks violations dropped to $HOOK_ERRS (baseline $HOOK_BASELINE). Ratchet down: echo $HOOK_ERRS > .hooks-baseline"
          fi
          echo "OK: no new conditional-hook violations"

      - name: Web Jest (BLOCKING)
        # From 2026-07-22 to 2026-08-03, 22 web suites failed to LOAD and
        # nothing noticed because no workflow ran web Jest. --maxWorkers/heap:
        # on the 2-vCPU runner RTL renders compete for CPU and waitFor/findBy
        # time out under contention (2026-09-08) — a resource symptom, not a
        # product defect, so the box is capped rather than the timeouts raised.
        run: pnpm --filter web exec jest --ci --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api-production-39a1.up.railway.app/api/v1
          # Measured 5.23 GB peak RSS on the 7 GB private runner; an explicit
          # ceiling fails legibly instead of taking the runner VM with it.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter web build
      # Bundle-budget ratchet (efficiency audit 2026-07-20, F3): today's sizes
      # are the CEILING, down-only, so growth reds the build.
      - name: Bundle budget (ratchet down only)
        run: node apps/web/tools/check-bundle-budget.cjs
      - name: Player SW shell invariants
        run: node apps/web/tools/check-sw-shell.cjs
      - name: Help-center prerender integrity
        run: node apps/web/tools/check-help-prerender.cjs
      - name: Brand contrast contract
        run: node apps/web/tools/check-brand-contrast.cjs
      # SEC-010: a PRERENDERED route must never receive the enforced,
      # nonce-based script-src (its inline scripts have no nonce → blank page).
      - name: CSP nonce vs prerendered routes
        run: node apps/web/tools/check-csp-prerender.cjs

  docker-build:
    name: Docker build + boot smoke test
    needs: changes
    # `server`: what can change the API image — not a player-only or
    # renderer-only change.
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the same image Railway will build
        run: docker build -f Dockerfile -t educms-api:ci .
      - name: Boot smoke test
        run: |
          # NOTE: no --rm so we can still read logs after the container
          # exits. We auto-delete in the cleanup step below.
          docker run -d --name api-smoke -p 18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e DATABASE_URL='postgres://fake:fake@127.0.0.1:5432/fake?schema=public' \
            -e DIRECT_URL='postgres://fake:fake@127.0.0.1:5432/fake?schema=public' \
            -e JWT_SECRET='ci-fake-jwt-secret-please-do-not-use-in-prod-32chars' \
            -e SESSION_SECRET='ci-fake-session-secret-please-do-not-use-in-prod-32chars' \
            -e DEVICE_SECRET_KEY='ci-fake-device-secret-please-do-not-use-in-prod-32chars' \
            -e DEVICE_JWT_SECRET='ci-fake-device-jwt-secret-please-do-not-use-in-prod-32chars' \
            -e SUPABASE_URL='https://fake.supabase.co' \
            -e SUPABASE_SERVICE_ROLE_KEY='fake' \
            -e ALLOWED_ORIGINS='http://localhost:3000' \
            -e SKIP_MIGRATE='true' \
            educms-api:ci

          # Poll up to 60s for "API listening" or container exit.
          for i in $(seq 1 30); do
            STATE=$(docker inspect -f '{{.State.Status}}' api-smoke 2>/dev/null || echo "missing")
            if docker logs api-smoke 2>&1 | grep -q "API listening"; then
              echo "API booted ✓"
              exit_ok=1
              break
            fi
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
              EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' api-smoke 2>/dev/null || echo "?")
              OOM=$(docker inspect -f '{{.State.OOMKilled}}' api-smoke 2>/dev/null || echo "?")
              ERR=$(docker inspect -f '{{.State.Error}}' api-smoke 2>/dev/null || echo "")
              echo "============================================================"
              echo "CONTAINER EXITED  state=$STATE  exit=$EXIT_CODE  oom=$OOM"
              [ -n "$ERR" ] && echo "Docker error: $ERR"
              echo "============================================================"
              echo "STDOUT+STDERR (raw, no grouping):"
              echo "------------------------------------------------------------"
              docker logs api-smoke 2>&1 || echo "(docker logs returned no output)"
              echo "------------------------------------------------------------"
              echo "Image filesystem listing of apps/api/dist:"
              docker run --rm --entrypoint sh educms-api:ci -c 'ls -la apps/api/dist 2>&1 | head -20 || echo "dist dir missing"' || true
              echo "Image filesystem listing of /app:"
              docker run --rm --entrypoint sh educms-api:ci -c 'ls -la /app 2>&1 | head -20 || echo "app dir missing"' || true
              echo "Image node version:"
              docker run --rm --entrypoint node educms-api:ci --version || true
              echo "============================================================"
              exit 1
            fi
            sleep 2
          done
          if [ "${exit_ok:-0}" != "1" ]; then
            echo "✗ API never logged 'API listening' within 60s"
            echo "Container state: $(docker inspect -f '{{.State.Status}}' api-smoke 2>/dev/null || echo missing)"
            echo "STDOUT+STDERR (raw):"
            docker logs api-smoke 2>&1 || echo "(docker logs returned no output)"
            exit 1
          fi
      - name: Healthcheck curl
        run: |
          curl -fsS --max-time 10 http://localhost:18080/api/v1/health || {
            echo "✗ Healthcheck failed"
            echo "::group::Container logs"
            docker logs --tail 200 api-smoke 2>&1 || true
            echo "::endgroup::"
            exit 1
          }
          echo "Healthcheck OK ✓"
      - name: Cleanup container
        if: always()
        run: |
          docker stop api-smoke 2>/dev/null || true
          docker rm api-smoke 2>/dev/null || true

  renderer-docker:
    # The board renderer (apps/renderer) is its own Railway service. Build the
    # exact image Railway will build and prove it boots, launches Chromium,
    # answers /health, renders a board whose Google font is served from the
    # bundle (and whose external image is blocked), and runs as non-root.
    # 2026-10-22: also runs the renderer's own unit + real-Chromium tests
    # (moved from ci.yml "Build, Lint & Test"), and only when the renderer or
    # its inputs changed.
    name: Renderer image build + render smoke test
    needs: changes
    if: needs.changes.outputs.renderer == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (with scripts, as the renderer tests always ran)
        run: pnpm install --frozen-lockfile
      - name: Renderer tests (unit + real-Chromium integration)
        # RENDERER_REQUIRE_CHROMIUM turns a missing browser into a FAILURE
        # instead of a skip: a suite that silently skips its browser half is
        # green and proves nothing. Uses the Chrome the ubuntu image ships.
        run: pnpm --filter ./apps/renderer test
        env:
          RENDERER_REQUIRE_CHROMIUM: '1'
          CHROME_PATH: /usr/bin/google-chrome
      - name: Build the renderer image Railway will build
        run: docker build -f apps/renderer/Dockerfile -t venueos-renderer:ci .
      - name: Boot, health, render, non-root
        run: |
          docker run -d --name renderer-smoke -p 18081:8080 -e PORT=8080 --memory=2g venueos-renderer:ci
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:18081/health > /tmp/health.json 2>/dev/null; then ok=1; break; fi
            STATE=$(docker inspect -f '{{.State.Status}}' renderer-smoke 2>/dev/null || echo missing)
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "✗ /health never answered 200"
            docker logs renderer-smoke 2>&1 | tail -100
            exit 1
          fi
          echo "health: $(cat /tmp/health.json)"
          node -e '
            const html = `<!doctype html><html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap"></head><body style="margin:0;background:#0d1b2a"><h1 style="margin:80px;color:#fff;font:700 160px Inter">VenueOS renderer</h1><img src="https://example.com/x.png"></body></html>`;
            require("fs").writeFileSync("/tmp/payload.json", JSON.stringify({ html, canvasWidth: 1920, canvasHeight: 1080, viewportScale: 1, settleMs: 500 }));'
          curl -fsS --max-time 90 -X POST -H 'content-type: application/json' --data @/tmp/payload.json http://127.0.0.1:18081/render > /tmp/render.json || {
            echo "✗ render failed"
            docker logs renderer-smoke 2>&1 | tail -100
            exit 1
          }
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/render.json", "utf8"));
            const m = r.metrics;
            const fonts = m.fonts.map((f) => f.family + ":" + f.status).join(",");
            console.log("chromium", r.chromium, "| image", r.imageWidth + "x" + r.imageHeight, Buffer.from(r.image, "base64").length, "bytes | fonts", fonts,
              "| blocked", m.blockedRequests.map((b) => b.reason + " " + b.url).join(", "), "| timings", JSON.stringify(r.timings));
            const fail = (msg) => { console.error("✗ " + msg); process.exit(1); };
            if (r.imageWidth !== 1920) fail("image width " + r.imageWidth);
            if (!m.fonts.some((f) => f.family === "Inter" && f.status === "webfont")) fail("Inter was not drawn from the bundle: " + fonts);
            if (!m.blockedRequests.some((b) => /example\.com/.test(b.url))) fail("the external image was not blocked");
            if (m.text.elements < 1) fail("no text measured");
            console.log("render smoke OK ✓");'
          uid=$(docker exec renderer-smoke id -u)
          if [ "$uid" = "0" ]; then echo "✗ the renderer runs as root"; exit 1; fi
          echo "non-root ✓ (uid $uid)"
      - name: Cleanup container
        if: always()
        run: |
          docker stop renderer-smoke 2>/dev/null || true
          docker rm renderer-smoke 2>/dev/null || true

  emergency-path:
    # The lockdown / all-clear end-to-end path plus the player native-video and
    # offline specs, Chromium + WebKit, BLOCKING. Defined in emergency-path.yml
    # (also runnable on its own from the Actions tab for a drill check).
    # `server`: the specs drive the web player against mocked API routes, so a
    # player-Kotlin-only or renderer-only change cannot move them.
    name: Emergency path
    needs: changes
    if: needs.changes.outputs.server == 'true' && needs.changes.outputs.heavy == 'true'
    uses: ./.github/workflows/emergency-path.yml

  semgrep:
    # SAST — added 2026-10-22 to replace what going private takes away (CodeQL
    # default setup and GitHub secret scanning are free only on PUBLIC repos;
    # gitleaks in ci.yml remains the secret scanner).
    #
    # REPORT-ONLY today: it never fails the run. On a PR (and a master push)
    # it is DIFF-AWARE (`--baseline-commit`): only findings the change
    # INTRODUCES are reported, so the existing backlog never shows up as noise.
    # The full-tree scan runs nightly in container-scan.yml.
    #
    # Switch to BLOCKING for NEW findings: set the repository variable
    # SEMGREP_BLOCKING=true (Settings → Secrets and variables → Actions →
    # Variables). No code change. Findings are in the job summary and the
    # `semgrep-<sha>` SARIF artifact (Code Scanning upload needs GitHub
    # Advanced Security, which a private Pro repo does not have).
    name: Semgrep SAST (diff-aware, report-only)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Semgrep (new findings only)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SEMGREP_BLOCKING: ${{ vars.SEMGREP_BLOCKING }}
        run: sh scripts/ci-semgrep.sh diff
      - name: Keep the SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: ignore
