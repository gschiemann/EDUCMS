# Capability Registry gate — §21 verification-before-claim enforcement.
#
# Fails CI when the capability registry (packages/api-types/src/capability-
# registry.ts) makes a dishonest claim: a VERIFIED/PRODUCTION/HARDWARE_CERTIFIED
# capability with no resolvable evidence, or a customer-facing publicClaim on an
# unbuilt/experimental/deprecated feature. This is the mechanism that makes
# "green CI mean something" and stops the coming-soon-in-a-real-button-costume
# problem across every domain. Consumer of the registry — without it the
# registry would be a dead catalog.
name: Capability Registry
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  capability-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build @cms/api-types
        run: pnpm --filter @cms/api-types build
      - name: Check capability-registry truth (§21)
        run: node scripts/check-capability-registry.cjs
