name: Emergency Path

# Policy: the emergency path is life-safety-critical. Three simultaneous
# P0 bugs (timestamp-units, manifest-shape, missing SOS handler) shipped to
# production and were only found by reading the call graph end-to-end on
# 2026-05-26 — every unit/integration test was green. This workflow exists
# to make sure that class of regression fails CI BEFORE it reaches Railway.
#
# What it runs: apps/web/tests/e2e/emergency-path.spec.ts — 9 self-contained
# Playwright assertions, fully mocked (no API/DB needed), against Chromium
# AND WebKit. Per CLAUDE.md "Cross-browser support — non-negotiable" the
# WebKit run is the canary for engine-specific regressions on the life-
# safety surface (the holiday-bridge canary covers ONLY the holiday
# templates, not the player).
#
# Runtime budget: under 5 minutes per browser. The actual test takes
# <30s; the rest is browser install + Next compile cache cold start.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  emergency-path:
    name: ${{ matrix.browser }} · Emergency path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both engines, in parallel. WebKit is the canary; Chromium is the
      # primary target. A bug that only repros in WebKit is exactly what
      # the holiday-bridge canary was built to catch — same principle here.
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build workspace TypeScript packages — apps/web's `next dev`
      # imports @cms/api-types / @cms/auth-core / @cms/ws-events whose
      # `main` points at `dist/index.js`. The deploy-reliability workflow
      # documents this requirement; same pattern here so the dev server
      # boots clean.
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/auth-core build
          pnpm --filter @cms/ws-events build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build

      # Cache Playwright browser binaries between runs to keep the
      # cold-cache install closer to ~1 min instead of ~4 min.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run emergency-path E2E
        # Invoke playwright directly (not through the pnpm script) so the
        # `--project=<browser>` filter actually reaches Playwright. Going
        # through `pnpm run -- --project X` placed the args after the
        # script's own positional path argument, which Playwright treated
        # as a literal test path and ignored as a flag — running BOTH
        # projects on every matrix runner. The chromium runner has only
        # the chromium binary installed, so webkit failed with
        # "Executable doesn't exist" (and vice-versa).
        run: pnpm --filter web exec playwright test --config playwright.config.ts tests/e2e/emergency-path.spec.ts --project=${{ matrix.browser }}
        env:
          CI: 'true'
          # Force the API base URL onto an unroutable host so any
          # mock that's missed NXDOMAINs instead of silently hitting
          # production. The Playwright config sets this too, but we
          # belt-and-suspender it here in case the env override path
          # changes.
          NEXT_PUBLIC_API_URL: http://api.invalid/api/v1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-path-report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
