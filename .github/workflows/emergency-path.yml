name: Emergency Path

# Policy: the emergency path is life-safety-critical. Three simultaneous
# P0 bugs (timestamp-units, manifest-shape, missing SOS handler) shipped to
# production and were only found by reading the call graph end-to-end on
# 2026-05-26 — every unit/integration test was green. This workflow exists
# to make sure that class of regression fails CI BEFORE it reaches Railway.
#
# What it runs: apps/web/tests/e2e/emergency-path.spec.ts — 9 self-contained
# Playwright assertions, fully mocked (no API/DB needed), against Chromium
# AND WebKit. Per CLAUDE.md "Cross-browser support — non-negotiable" the
# WebKit run is the canary for engine-specific regressions on the life-
# safety surface (the holiday-bridge canary covers ONLY the holiday
# templates, not the player).
#
# Runtime budget: under 5 minutes per browser. The actual test takes
# <30s; the rest is browser install + Next compile cache cold start.

on:
  push:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  pull_request:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # SUPERSEDED master runs are CANCELLED (changed 2026-09-09, operator's call).
  #
  # This deliberately REVERSES the 2026-08-04 decision below. That version keyed
  # the group on the individual SHA for push, so two master commits were never in
  # the same group and nothing could ever cancel — every commit kept its own
  # verdict. The cost, measured on 2026-09-08: five pushes in one hour ran five
  # full suites when only the tip mattered, ~100 of that day's ~200 billed
  # minutes, and GitHub Actions then hit the Free-plan cap and stopped running
  # ANYTHING for hours. A gate that is switched off by billing protects nothing.
  #
  # Operator (2026-09-09, $10 budget): "ya save the money, we got no customers so
  # im not worried that much." The accepted trade: an intermediate commit that is
  # superseded within minutes reads as "never checked" in the history. The TIP of
  # master is always fully checked, which is what actually ships.
  #
  # ⚠️ If you are reading the 2026-08-04 rationale below and reaching for the
  # per-SHA group again: that is the change this comment exists to prevent. Only
  # restore it if per-commit verdicts become worth real money again (paid plan, a
  # customer audit trail, or a compliance requirement) — and say so here.
  #
  # --- superseded 2026-08-04 rationale, kept for context ---
  # cancel-in-progress was deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history). Expressing
  # it as `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` did
  # not work — master runs were still cancelled — so the GROUP was made unique
  # per push instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emergency-path:
    name: ${{ matrix.browser }} · Emergency path
    # 2026-08-18 — PINNED to ubuntu-24.04 (was ubuntu-latest): GitHub's rolling
    # runner-image update (the same one forcing Node-24 action runtimes) wedges
    # Playwright 1.59 WebKit — WPEWebProcess launches then hangs until the job
    # timeout ("cancelled" verdict), while Chromium passes. Mixed-fleet rollout
    # made it intermittent (same commit green 08-17, hung 08-18 with no code
    # change). Unpin only after a Playwright upgrade whose WebKit build passes
    # this job on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both engines, in parallel. WebKit is the canary; Chromium is the
      # primary target. A bug that only repros in WebKit is exactly what
      # the holiday-bridge canary was built to catch — same principle here.
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build workspace TypeScript packages — apps/web's `next dev`
      # imports @cms/api-types (and friends) whose
      # `main` points at `dist/index.js`. The deploy-reliability workflow
      # documents this requirement; same pattern here so the dev server
      # boots clean.
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build

      # Cache Playwright browser binaries between runs to keep the
      # cold-cache install closer to ~1 min instead of ~4 min.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}

      # ── Build the web app BEFORE Playwright (2026-09-05) ─────────────────
      # Playwright now serves a PREBUILT production bundle (`next start`)
      # instead of compiling routes on demand with `next dev`.
      #
      # WHY: the repo went private on 2026-09-04, which moves the
      # GitHub-hosted Linux runner from the public 4-vCPU / 16 GB class to the
      # private 2-vCPU / 7 GB one. From the first push after that flip, every
      # run of this workflow died identically — "○ Compiling /board/[gameId]",
      # then the 180 s warm-up giving up, then
      # "##[error]The runner has received a shutdown signal" — on three
      # consecutive commits AND on a re-run of an unchanged commit, with the
      # first red being a Kotlin-only merge. Reproduced in a container capped
      # to the private-runner spec (--cpus=2 --memory=7g --memory-swap=7g):
      # `next dev` compiling /board drove the cgroup to 6.83 GB and the kernel
      # OOM-killer fired (memory.events oom_kill 1); the same box builds in
      # 69 s at 5.23 GB peak with zero OOM events and then serves at 0.70 GB.
      # The app did not regress — the machine halved.
      #
      # The build is its own STEP on purpose: a build failure must be a
      # legible red step, not an opaque webServer timeout.
      #
      # NEXT_PUBLIC_API_URL is set HERE because Next inlines NEXT_PUBLIC_* at
      # BUILD time. It must match playwright.config.ts exactly, or the
      # unroutable-host tripwire (a missed mock NXDOMAINs instead of hitting
      # production) is silently replaced by the localhost fallback.
      - name: Build the web app (Playwright serves this build)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://api.invalid/api/v1
          # An explicit heap ceiling so an overrun fails as a legible V8
          # "JavaScript heap out of memory" instead of taking the runner VM
          # with it. 4096 was measured to complete with 5.23 GB peak RSS and
          # no cgroup pressure events on the 7 GB runner class.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run emergency-path E2E
        # Invoke playwright directly (not through the pnpm script) so the
        # `--project=<browser>` filter actually reaches Playwright. Going
        # through `pnpm run -- --project X` placed the args after the
        # script's own positional path argument, which Playwright treated
        # as a literal test path and ignored as a flag — running BOTH
        # projects on every matrix runner. The chromium runner has only
        # the chromium binary installed, so webkit failed with
        # "Executable doesn't exist" (and vice-versa).
        run: pnpm --filter web exec playwright test --config playwright.config.ts tests/e2e/emergency-path.spec.ts --project=${{ matrix.browser }}
        env:
          CI: 'true'
          # Force the API base URL onto an unroutable host so any
          # mock that's missed NXDOMAINs instead of silently hitting
          # production. The Playwright config sets this too, but we
          # belt-and-suspender it here in case the env override path
          # changes. It MUST equal the value the build step used above.
          NEXT_PUBLIC_API_URL: http://api.invalid/api/v1
          # Serve the build made above; never compile inside the test run.
          # tests/e2e-webserver.cjs fails loudly if .next/BUILD_ID is absent,
          # so a dropped build step is named rather than silently re-compiled
          # into the OOM this change exists to end.
          E2E_PREBUILT: '1'
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-path-report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
