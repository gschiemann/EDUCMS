name: Keep API warm

# Pings the Railway API /health endpoint every 5 minutes so the
# Postgres pool + Node process stay warm between requests.
# Free GitHub Actions cron — replaces the Vercel cron (Hobby plan
# only allows daily crons).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Curl /health
        run: |
          curl -fsS --max-time 15 https://api-production-39a1.up.railway.app/api/v1/health \
            -H 'User-Agent: educms-keepwarm-cron' \
            -o /tmp/h.json && cat /tmp/h.json | head -c 400 || {
            echo "Health endpoint did not respond cleanly"
            exit 1
          }
