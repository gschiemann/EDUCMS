name: Keep API warm

# Keep-warm + EXTERNAL health sweep, every 5 minutes.
#
# Two jobs in one workflow (2026-08-05):
#   1. Warmth — pinging /health keeps the Postgres pool + Node process warm
#      between requests (the original purpose).
#   2. Outside-in monitoring — the in-app PlatformHealthMonitorService
#      (apps/api/src/health/platform-health-monitor.service.ts) emails
#      PLATFORM_ALERT_EMAILS when a DEPENDENCY degrades, but a dead process
#      cannot report itself. This workflow is the layer that catches
#      "the API is entirely down": it reads the liveness BODY (liveness is
#      always HTTP 200 by design — a degraded DB only shows in the JSON),
#      and requires /ready + /emergency-path to return 200.
#
# On failure GitHub emails the workflow's author (default scheduled-workflow
# failure notification). Each check retries once after 30s so a transient
# blip doesn't page.
#
# Free GitHub Actions cron — replaces the Vercel cron (Hobby plan only
# allows daily crons).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Health sweep (liveness body + readiness + emergency path)
        run: |
          BASE=https://api-production-39a1.up.railway.app/api/v1/health

          # check <url> [required-body-substring]
          # Passes when curl gets a 2xx AND (if given) the body contains the
          # substring. One retry after 30s — transient blips must not page.
          check() {
            local url="$1" want="${2:-}" body=""
            for attempt in 1 2; do
              if body=$(curl -fsS --max-time 15 "$url" -H 'User-Agent: educms-keepwarm-cron'); then
                if [ -z "$want" ] || printf '%s' "$body" | grep -qF "$want"; then
                  echo "OK  $url"
                  return 0
                fi
                echo "::warning::$url responded 2xx but body check '$want' failed: $(printf '%s' "$body" | head -c 300)"
              else
                echo "::warning::$url unreachable or non-2xx (attempt $attempt)"
              fi
              [ "$attempt" = 1 ] && sleep 30
            done
            echo "::error::HEALTH SWEEP FAILED — $url"
            printf '%s' "$body" | head -c 400
            return 1
          }

          rc=0
          # Liveness is ALWAYS 200 — the truth is in the body. "db":"ok" is
          # the exact substring the endpoint emits when Postgres answered.
          check "$BASE" '"db":"ok"' || rc=1
          check "$BASE/ready" || rc=1
          check "$BASE/emergency-path" || rc=1
          exit $rc
