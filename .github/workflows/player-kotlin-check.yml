name: Player Kotlin Check

# ============================================================
# WHY THIS WORKFLOW EXISTS (SEC-002 re-audit, 2026-09-04)
# ============================================================
#
# `android-player-apk.yml` runs `testDebugUnitTest` + `lintDebug` before it
# assembles anything — and that is real. But it only triggers on a RELEASE TAG
# or `workflow_dispatch` (deliberately: it is a ~10-25 min artifact builder and
# running it on every master push burned most of the Actions budget for zero
# signal). The consequence is that a Kotlin change lands on master, sits there
# for days, and the FIRST time a compiler or a unit test sees it is the moment
# someone cuts a release tag — with a keystore already materialised in the job.
#
# Nothing else covered the gap. `Taurus Safety` is green on every push, which
# reads like Android coverage and is not: it runs three dependency-free Node
# scanners over CSS/source patterns (`check-taurus-safety.cjs`,
# `check-inset-serialization.cjs`, `check-scene-css.cjs`) and never invokes
# Gradle, never compiles Kotlin, never executes a test. Verified 2026-09-04.
#
# So this job runs the SAME correctness gate the release path runs, on the
# change that introduces it. No signing, no assemble, no APK, no publish — it
# cannot produce an artifact and does not want to.
#
# ── Why a separate file rather than another trigger on the release workflow ──
# That workflow's own header records the trap: GitHub applies a `paths:` filter
# to EVERY push under the same `push:` key, tag pushes included, and a tag has
# no branch diff — so adding `paths:` there would silently stop release tags
# from building at all. Keeping the path-filtered branch/PR trigger in its own
# file makes that impossible.

on:
  push:
    branches: [master]
    paths:
      - 'apps/player/**'
      - 'scripts/check-player-test-execution.cjs'
      - '.github/workflows/player-kotlin-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/player/**'
      - 'scripts/check-player-test-execution.cjs'
      - '.github/workflows/player-kotlin-check.yml'
  workflow_dispatch:

concurrency:
  # Same shape as every other workflow here: a superseded PR run is noise, but
  # each master commit keeps its own verdict (a cancelled run reads as "never
  # checked"). Making the group unique per push is what guarantees that.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kotlin-check:
    name: Unit tests + lint (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SUPPLY-02: pinned to full commit SHAs, same as the release workflow.
      # This job holds no secrets, but the pins cost nothing and keep one
      # convention across every workflow that touches the player.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # For the dependency-free execution guard below. No pnpm install needed.
      - name: Set up Node (for the test-execution guard)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Same key as the release workflow on purpose — the two share a warm
          # cache, so whichever runs first pays the cold cost.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/player/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/player/**/*.gradle*', 'apps/player/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Gradle (bootstrap — wrapper jar isn't committed)
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f apps/player/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f apps/player/gradlew ]; then
            # Subshell so 'cd' doesn't leak into the chmod below.
            ( cd apps/player && gradle wrapper --gradle-version 8.7 )
          fi
          chmod +x apps/player/gradlew

      # The gate itself. Identical invocation to the release workflow's, so a
      # change that goes green here cannot surprise the tag. `lintDebug` is
      # blocking; pre-existing findings live in the two lint-baseline.xml files
      # and anything NEW fails.
      - name: Unit tests + lint
        id: check
        run: |
          cd apps/player
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug 2>&1 | tee gradle-check.log
          status=${PIPESTATUS[0]}
          exit $status

      # Gradle exits 0 whether it ran a thousand tests or none. This reads the
      # JUnit XML and fails if the SEC-002 bridge-boundary classes did not
      # actually execute — including the case where an `Assume` skipped a whole
      # source-guard class, which every summary in the pipeline reports as a
      # pass. Same guard the release workflow runs.
      - name: Prove the gating tests actually executed
        id: testproof
        run: node scripts/check-player-test-execution.cjs

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Player Kotlin check"
            echo ""
            if [ "${{ steps.check.outcome }}" = "success" ] && [ "${{ steps.testproof.outcome }}" = "success" ]; then
              echo "\`testDebugUnitTest\` + \`lintDebug\` passed, and the SEC-002 bridge-boundary"
              echo "tests are confirmed to have executed (not skipped)."
            else
              echo "FAILED — no APK would be built from this tree."
              echo ""
              echo '```'
              tail -n 200 apps/player/gradle-check.log 2>/dev/null || echo "(no gradle-check.log produced)"
              echo '```'
            fi
            echo ""
            echo "⚠️ This is a unit-test claim only. It proves nothing about OEM WebViews,"
            echo "Chromium-83/87 panels, or any physical display — see"
            echo "\`apps/player/HARDWARE-QUALIFICATION.md\`."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload test + lint reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-kotlin-check-reports
          path: |
            apps/player/gradle-check.log
            apps/player/*/build/reports/tests/testDebugUnitTest/**
            apps/player/*/build/test-results/testDebugUnitTest/**
            apps/player/*/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
