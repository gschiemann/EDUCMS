# Signing-secret guard.
#
# This repo is PUBLIC. It already ships one committed Android signing
# keystore (apps/player/app/debug.keystore) that signs every Player and
# Manager APK installed on K-12 kiosks — a known, dated exception that is
# being retired via apps/player/RELEASE_SIGNING.md (retiring it forces a
# fleet-wide manual reinstall, so it is scheduled work, not a quick fix).
#
# This gate exists so a SECOND key can never be committed while the known
# one is being retired. It runs on push AND pull_request — the Android
# APK workflow does not run on PRs, so a PR adding a keystore would
# otherwise sail straight through review.
#
# Deliberately its own workflow: it is a pure `git ls-files` + text scan,
# needs no JDK, no Android SDK and no pnpm install, and finishes in
# seconds. Bolting it onto the 25-minute APK build would make a cheap,
# always-relevant check depend on an expensive, rarely-relevant one.
name: Signing Secrets

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  signing-secrets:
    name: No new keystore or hardcoded signing password
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Dependency-free (node stdlib + git only) — no install step needed.
      - name: Check for tracked keystores / hardcoded signing passwords
        run: node scripts/check-tracked-keystores.cjs
