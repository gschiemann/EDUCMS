name: Cross-Browser

# Policy: the dashboard + holiday templates must work on every Mac and
# Windows browser the customer might use (Safari/WebKit, Chrome/Chromium,
# Firefox, Edge). Local dev was Chrome-only and missed a Safari-fatal
# regex bug for months — this workflow is the canary that prevents that
# class of regression.
#
# Coverage (all WebKit, the historical blind spot; Chromium was always
# green so the WebKit canary is the high-leverage check):
#   - webkit-holiday-bridge   18 static holiday HTML templates (iframe
#                             postMessage bridge protocol) + the sports
#                             celebration HTML pack (canvas-animation
#                             parse + paint canary).
#   - webkit-widget-render    the React widget surface — the themed
#                             school packs, sports scorebug, restaurant /
#                             retail / fitness / bar verticals, and
#                             AnimatedWelcome — mounted on the real
#                             /player route, in the [chromium, webkit]
#                             matrix. Closes the P1-12 gap (2026-05-28
#                             audit): ~170 React widgets had ZERO WebKit
#                             render check.
# Add chromium / firefox passes here as we surface other engine-specific
# fragility (don't add speculatively — keep CI under 2 min/browser).

on:
  # 2026-08-04 — moved OFF every-push.
  # The widget-render leg is now covered by ci.yml's E2E job, which since
  # this date runs a chromium+webkit MATRIX. What is unique here is the
  # .cjs bridge-protocol suite, and that guards board files that change
  # rarely. Nightly + PR + on demand gives the same protection at a
  # fraction of the cost. Emergency Path still runs on EVERY push — the
  # life-safety gate is deliberately not on this diet.
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC nightly
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  webkit-holiday-bridge:
    name: WebKit · Holiday bridge + sports celebration pack
    runs-on: ubuntu-latest
    # 2026-05-12 — the WebKit install on a cold runner (`apt-get
    # update && apt-get install` for ~160 packages of WebKit system
    # deps) takes 3-7 min ON ITS OWN. The actual protocol test takes
    # under 2 min. Cap at 15 to absorb the longest cold-cache install
    # without masking real test regressions (real test failures
    # surface inside the protocol script in seconds, not minutes).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # python3 is preinstalled on ubuntu-latest; the test uses
      # `python3 -m http.server` to serve apps/web/public statically
      # so the holiday HTMLs load same-origin (postMessage origin
      # checks need a real http:// scheme, not file://).

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries between runs. Saves
      # ~3-5 min on cache hit. Key includes the playwright version
      # from package.json so a Playwright bump auto-invalidates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright WebKit (with system deps)
        # Only the WebKit browser binary + its system dependencies.
        # --with-deps runs apt-get for the C library deps WebKit
        # needs at runtime (libgtk, libwebp, libavif, etc.) — these
        # are NOT in the cache (system packages) so they reinstall
        # every run. Browser binaries themselves ARE cached above.
        run: pnpm --filter web exec playwright install --with-deps webkit

      - name: Run holiday-bridge cross-browser test
        run: pnpm --filter web run test:cross-browser

      # The sports celebration pack reuses the SAME already-installed
      # WebKit + python http.server harness — near-zero added CI cost.
      # Guards the canvas-animation HTML cue files (touchdown, three,
      # home-run, goal, kill, …) against the 2026-05-09 regex/minified-JS
      # SyntaxError class that WebKit rejects but V8 tolerates.
      - name: Run sports celebration WebKit canary
        run: pnpm --filter web run test:celebrations

      # Kiosk edit-shim — entity-decode + XSS-safety. Same WebKit + python
      # http.server harness. Guards the 2026-06-04 fix where the server's
      # XSS sanitizer over-encoded kiosk text overrides ("Mix & Match" →
      # "Mix &amp; Match") AND asserts the decode stays injection-proof.
      - name: Run kiosk edit-shim WebKit canary
        run: pnpm --filter web run test:kiosk-shim

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-report
          path: |
            apps/web/tests/cross-browser/report.json
            apps/web/tests/cross-browser/celebrations-report.json
          if-no-files-found: ignore

  webkit-widget-render:
    name: WebKit + Chromium · React widget render smoke
    runs-on: ubuntu-latest
    # Boots `next dev` (first-compile of the /player route ~30-60s) then
    # runs the widget grid in BOTH chromium and webkit. Cap generous to
    # absorb the cold WebKit-deps install + first Next compile; real test
    # failures surface in seconds inside the spec.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the workspace TS packages BEFORE `next dev` boots. The
      # /player route imports CtsBridge → @cms/scoreboard-cts (and the app
      # imports @cms/api-types / auth-core / ws-events), whose package.json
      # `main` points at dist/index.js. Without this build, `next dev`
      # fails to compile the player route ("Module not found / Unexpected
      # token export") and the spec stalls before the first manifest fetch.
      # Same requirement the deploy-reliability `web-build` job documents.
      - name: Generate Prisma client (auth-core imports @prisma/client transitively)
        run: pnpm --filter @cms/database run db:generate
      - name: Build workspace packages
        run: |
          pnpm --filter @cms/api-types build
          pnpm --filter @cms/auth-core build
          pnpm --filter @cms/ws-events build
          pnpm --filter @cms/scoreboard-cts build
          pnpm --filter @cms/signage-design build

      - name: Cache Playwright browsers
        id: playwright-cache-widget
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on chromium+webkit so this cache is distinct from the
          # holiday-bridge WebKit-only cache above.
          key: ${{ runner.os }}-playwright-cw-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium + WebKit (with system deps)
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      # The widget-render spec mocks EVERY API call (fake host api.invalid
      # via playwright.config.ts webServer env) and boots `next dev` itself
      # through the config's `webServer` block — no API server needed.
      - name: Run React widget render smoke (chromium + webkit)
        run: pnpm --filter web run test:e2e:widget-render

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: widget-render-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
