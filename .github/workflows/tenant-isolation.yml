# Tenant-isolation static gate (audit TEN-001 / §16).
#
# Fails CI when a NEW unscoped bare-id Prisma lookup lands on a tenant-owned
# model — `prisma.client.<model>.findUnique/update/delete({ where: { id } })`
# with no tenantId constraint. That pattern lets a tenant-A user pass a
# tenant-B object id and read/mutate another tenant's data unless ownership is
# separately asserted; this gate makes the whole surface visible and prevents
# regressions while the deny-by-default typed-tenant-repository migration
# (TEN-001 full) burns the baseline down.
#
# Existing sites are captured in apps/api/tools/tenant-isolation-baseline.json
# and the baseline ratchets DOWN only. Uses the TypeScript compiler API, so it
# needs deps installed (--ignore-scripts is enough — no native builds needed),
# same lesson as the taurus-safety inset guard.
name: Tenant Isolation
on:
  push:
    branches: [master]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    # No paths-ignore here (2026-11-01, Foundry Standard Phase 1): this workflow
    # hosts a check the ruleset REQUIRES ("Two-tenant × role isolation matrix"),
    # and a docs-only PR skipped by a trigger-level path filter never reports it
    # — "pending" for ever, so it could never merge (seen on PRs #196 and #198).
    # The `changes` job classifies the PR instead and the jobs below SKIP on
    # docs-only changes: a skipped job satisfies a required check, a missing one
    # blocks. `push` keeps its paths-ignore — master needs no run for a
    # docs-only commit.
  # Merge queue (2026-11-01): a queued pull request is checked on a temporary
  # merge-group commit, not on the PR, and a workflow with no `merge_group`
  # trigger never reports there — the queue could not merge anything. The
  # `changes` job classifies a merge group exactly as it classifies a PR. The
  # concurrency group below is keyed on github.sha for anything but a pull
  # request, which is unique per merge group, so queue runs never cancel each
  # other.
  merge_group:
    types: [checks_requested]

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Least privilege (CodeQL actions/missing-workflow-permissions, 2026-10-05):
# these jobs only read the repository.
permissions:
  contents: read

jobs:
  changes:
    name: What changed (docs-only PRs skip the isolation checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # Only a pull request or a merge group has a diff to classify. Every other
      # event (push, schedule, dispatch) needs no checkout: its answer is "code".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request -> the PR's base; merge_group -> the group's base (the head
          # of master, or of the entry ahead of it in the queue). Empty otherwise.
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          # merge_group -> the group's head; otherwise GITHUB_SHA (for a pull request,
          # the test merge commit — what the checkout above has as HEAD).
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -eu
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }
          case "$EVENT_NAME" in
            pull_request|merge_group) ;;
            *) emit true "$EVENT_NAME is not a pull request or a merge group: the gated jobs always run"; exit 0 ;;
          esac
          # From here on a doubt is a code change, never a skip: a classifier that
          # stands down on an error is how a green check ends up meaning nothing.
          # --no-renames lists BOTH ends of a rename, so code moved into docs/ still
          # shows its old path.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || ! files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA"); then
            emit true "::warning::cannot diff '$BASE_SHA...$HEAD_SHA': treated as a code change, the gated jobs run"
            exit 0
          fi
          if [ -z "$files" ]; then
            emit true "no changed files found, so nothing can be proven docs-only: the gated jobs run"
            exit 0
          fi
          # The same set as the push trigger's paths-ignore above. Counted with
          # grep -c (not `grep -q`) so an early-closing pipe can never flip the answer.
          code_files=$(printf '%s\n' "$files" | grep -vcE '^(docs/|\.claude/|scratch/|LICENSE$|[^/]+\.md$)' || true)
          if [ "${code_files:-0}" -gt 0 ]; then
            emit true "code changed: the gated jobs run"
          else
            emit false "docs-only: the gated jobs are skipped and report as such"
          fi

  tenant-isolation:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.code == 'true' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check tenant-isolation (no new unscoped bare-id access)
        run: node apps/api/tools/check-tenant-isolation.cjs

  # SEC-009 (2026-09-04). The static gate above proves "no NEW unscoped query".
  # It cannot prove that tenant A's actor is actually unable to reach tenant B's
  # object — that was the independent audit's assurance gap. This job runs the
  # two-tenant × every-role matrix, which drives real controllers against a
  # Prisma double that EVALUATES the where clause, so a missing tenant predicate
  # genuinely returns the foreign row and fails the assertion.
  #
  # It also fails when someone adds a tenant-owned CRUD controller without a row
  # in the matrix (or a dated reason), which is what keeps the table honest.
  #
  # Separate job because it needs a full install + the workspace package builds
  # (the controllers import @cms/* by package name), while the static gate runs
  # happily on --ignore-scripts.
  two-tenant-matrix:
    name: Two-tenant × role isolation matrix
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.outputs.code == 'true' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages (controllers import @cms/* by name)
        run: pnpm --filter @cms/api-types --filter @cms/scoreboard-cts --filter @cms/signage-design build
      - name: Two-tenant role matrix
        run: pnpm --filter api exec jest src/tenant-isolation --ci
