name: CI & Security

# 2026-10-22 — this workflow is now ONLY the secret-leak scan (go-private CI
# budget, docs/research/2026-10-22-go-private/01-ci-minutes.md). Where its
# other jobs went — every one still runs:
#   Build, Lint & Test (API Jest, gate-script + package tests) → Deploy
#       Reliability → "API + workspace packages build"
#   Renderer tests → Deploy Reliability → "Renderer image build + render smoke"
#   Accessibility Lint (jsx-a11y + rules-of-hooks) → Deploy Reliability →
#       "Web typecheck + build"
#   Production Dependency Audit + Container Security Scanning (Trivy, SBOM) →
#       container-scan.yml (nightly + any change to what goes into the image)
#   E2E (full Playwright, sharded) → e2e-full.yml (scheduled, `full-e2e`
#       label, or on demand)
#
# gitleaks runs on EVERY push and PR — including docs-only ones (secrets get
# pasted into docs too), which is why there is no paths-ignore here. Once the
# repo is private, GitHub's own secret scanning + push protection are gone, so
# this job is the secret scanner. It is free for a personal-account repo (a
# GITLEAKS_LICENSE is only required for repos owned by an organization).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  # Superseded runs are cancelled (operator's call, 2026-09-09): the tip of the
  # ref is always fully checked, which is what ships.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Leak Scan (gitleaks)
    # Operational gap O2 (2026-05-25): no automated secret-leak gate
    # — a future agent commit could leak a token (Stripe, Supabase
    # service-role, Anthropic API key, Twilio, etc.) and we'd find
    # out from a billing alert hours/days later. gitleaks scans the
    # diff on PRs and full history on master push. Sub-30s runtime
    # against this repo size; fails the job on any HIGH-confidence
    # finding so a tagged secret can't merge without explicit override.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs the full history on master push so it can
          # scan everything that's been added since the last
          # known-clean commit. On PRs it scans the diff only — fast
          # by default.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action looks for GITHUB_TOKEN by default; we
          # pass the workflow's auto-issued token (read-only above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT defaults to true; that's
          # fine — failures upload a SARIF artifact for triage.
