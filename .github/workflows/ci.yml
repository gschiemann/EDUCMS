name: CI & Security

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (API tests import @cms/* by package name)
        # The API jest suite imports @cms/api-types, @cms/auth-core, etc. by
        # package name → resolves to each package's `main` (dist/). Those MUST
        # be built before jest runs, or every importing spec dies with
        # "Cannot find module '@cms/api-types'". This build-order gap was masked
        # for ages by the API test step's `continue-on-error: true`; making the
        # gate blocking (2026-05-29) surfaced it. Mirrors `pnpm preflight`.
        run: pnpm --filter @cms/api-types --filter @cms/auth-core --filter @cms/ws-events --filter @cms/scoreboard-cts build

      - name: Run Tests
        # BLOCKING (governance review #1, 2026-05-29). Previously gated with
        # `continue-on-error: true`, which made the API jest suite decorative —
        # tests ran but a red suite never blocked a merge. The suite is
        # stable-green (49 suites / 612 tests, verified across 3 consecutive
        # full runs) so the gate is now real: a failing API test fails CI and
        # blocks merge to master.
        run: pnpm --filter api run test

      - name: Build Application
        run: pnpm run build

  accessibility:
    name: Accessibility Lint (jsx-a11y)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run when frontend or shared packages change.
    # Remove this filter if the monorepo CI needs full-run guarantees.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run a11y lint (jsx-a11y — NEW errors fail the build)
        # We keep a baseline count of pre-existing jsx-a11y errors committed
        # at the repo root (.a11y-baseline) and only fail CI when the count
        # grows. Lets us land new code without being blocked by a backlog
        # of 20+ form-label issues that need a dedicated a11y sprint; also
        # makes any NEW a11y regression a hard CI stop.
        run: |
          pnpm --filter web lint 2>&1 | tee /tmp/lint.txt || true
          # Count lines that have BOTH 'error' and 'jsx-a11y/' — warnings
          # are ignored.
          ACTUAL=$(grep -E "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt | wc -l | tr -d ' ')
          BASELINE=$(cat .a11y-baseline 2>/dev/null || echo 0)
          echo "a11y errors — actual=$ACTUAL baseline=$BASELINE"
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "FAIL: a11y error count increased. New violations:"
            grep -E "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt
            echo ""
            echo "Fix the new ones OR raise the baseline in .a11y-baseline if intentional."
            exit 1
          fi
          echo "OK: a11y errors did not increase"

      - name: Rules-of-hooks gate (zero tolerance)
        # 2026-05-27 — operator: "wtf dont let that happen again"
        # PlaylistCreateWizard.tsx shipped 3 useCallback hooks BELOW an
        # `if (!open) return null;` guard. Hook count flipped between
        # open=false (35 hooks) and open=true (38 hooks), producing
        # React error #310 the moment the operator clicked New Playlist.
        # ESLint's `react-hooks/rules-of-hooks` rule (already active via
        # eslint-config-next/core-web-vitals) catches this exact pattern
        # — verified on a minimal repro:
        #   error  React Hook "useCallback" is called conditionally. ...
        #          Did you accidentally call a React Hook after an early
        #          return?
        # The lint already ran above (writing /tmp/lint.txt); we just
        # weren't checking the output for hook-rule errors. Adding that
        # check here. Zero tolerance — these are ALWAYS real bugs that
        # crash the page at runtime, never style preferences.
        run: |
          HOOK_ERRS=$(grep -E "error[[:space:]]+.*react-hooks/rules-of-hooks" /tmp/lint.txt | wc -l | tr -d ' ')
          echo "react-hooks/rules-of-hooks errors: $HOOK_ERRS"
          if [ "$HOOK_ERRS" -gt 0 ]; then
            echo ""
            echo "FAIL: conditional-hook violations detected."
            echo "These crash the page at runtime with React error #310"
            echo "the moment the conditional branch flips."
            echo ""
            grep -B1 -A4 "react-hooks/rules-of-hooks" /tmp/lint.txt
            exit 1
          fi
          echo "OK: zero conditional-hook violations"

  secret-scan:
    name: Secret Leak Scan (gitleaks)
    # Operational gap O2 (2026-05-25): no automated secret-leak gate
    # — a future agent commit could leak a token (Stripe, Supabase
    # service-role, Anthropic API key, Twilio, etc.) and we'd find
    # out from a billing alert hours/days later. gitleaks scans the
    # diff on PRs and full history on master push. Sub-30s runtime
    # against this repo size; fails the job on any HIGH-confidence
    # finding so a tagged secret can't merge without explicit override.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history on master push so it can
          # scan everything that's been added since the last
          # known-clean commit. On PRs it scans the diff only — fast
          # by default.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action looks for GITHUB_TOKEN by default; we
          # pass the workflow's auto-issued token (read-only above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT defaults to true; that's
          # fine — failures upload a SARIF artifact for triage.

  security-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use the host Docker daemon so the retry pre-pull below populates the
          # SAME cache the build reads from (the default docker-container driver
          # keeps an isolated cache, so a daemon pre-pull wouldn't help it).
          driver: docker

      # The "Container Security Scanning failed in ~26s" flake was the anonymous
      # Docker Hub pull of node:20-alpine timing out / hitting the rate limit
      # before the build even started. Pre-pull the base image with retry +
      # backoff so the build below reads it from the local cache instead of
      # racing Docker Hub. Non-fatal — if every retry fails the build step still
      # runs (and would surface the real error).
      - name: Pre-pull base image with retry (Docker Hub flake hardening)
        run: |
          for i in 1 2 3 4 5; do
            docker pull node:20-alpine && break
            echo "::warning::node:20-alpine pull attempt $i failed; retrying in $((i*8))s"
            sleep $((i*8))
          done

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: edu-cms:latest

      - name: Run Trivy Vulnerability Scanner
        # Supply-chain: pinned from the unstable, force-moveable `@master`
        # ref to the immutable commit SHA of the latest verified Trivy Action
        # release, v0.36.0 (2026-04-22). A pinned SHA can't be swapped under
        # us between runs the way `@master` (or even a tag) can.
        #
        # STILL non-blocking (continue-on-error) on purpose: this job builds
        # the production container and scans it for CRITICAL/HIGH CVEs, but
        # the current CVE backlog has not been confirmed clean (the scan needs
        # a Docker daemon, which wasn't available to verify locally). Flipping
        # this to blocking before triaging the backlog would red master on the
        # next OS/library CVE disclosure. Make it blocking (drop
        # continue-on-error) once the CRITICAL/HIGH backlog is confirmed empty
        # in a real CI run.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: 'edu-cms:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  e2e:
    name: E2E Tests (Playwright / Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run only on pull requests to keep free-tier minutes low
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_ADMIN_TOKEN: ${{ secrets.PLAYWRIGHT_ADMIN_TOKEN }}
          PLAYWRIGHT_TENANT_ID: ${{ secrets.PLAYWRIGHT_TENANT_ID }}

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
