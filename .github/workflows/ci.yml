name: CI & Security

on:
  push:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  pull_request:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # SUPERSEDED master runs are CANCELLED (changed 2026-09-09, operator's call).
  #
  # This deliberately REVERSES the 2026-08-04 decision below. That version keyed
  # the group on the individual SHA for push, so two master commits were never in
  # the same group and nothing could ever cancel — every commit kept its own
  # verdict. The cost, measured on 2026-09-08: five pushes in one hour ran five
  # full suites when only the tip mattered, ~100 of that day's ~200 billed
  # minutes, and GitHub Actions then hit the Free-plan cap and stopped running
  # ANYTHING for hours. A gate that is switched off by billing protects nothing.
  #
  # Operator (2026-09-09, $10 budget): "ya save the money, we got no customers so
  # im not worried that much." The accepted trade: an intermediate commit that is
  # superseded within minutes reads as "never checked" in the history. The TIP of
  # master is always fully checked, which is what actually ships.
  #
  # ⚠️ If you are reading the 2026-08-04 rationale below and reaching for the
  # per-SHA group again: that is the change this comment exists to prevent. Only
  # restore it if per-commit verdicts become worth real money again (paid plan, a
  # customer audit trail, or a compliance requirement) — and say so here.
  #
  # --- superseded 2026-08-04 rationale, kept for context ---
  # cancel-in-progress was deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history). Expressing
  # it as `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` did
  # not work — master runs were still cancelled — so the GROUP was made unique
  # per push instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: AI model retirement gate (audit W0-03)
        # Fails if any AI model we ship is past its provider's announced
        # shutdown date; warns 60 days out. This is how we avoid re-living
        # 2026-07: three catalog/image models were ALREADY provider-dead
        # (404 on every call) and green CI never said a word.
        run: node apps/api/tools/check-model-retirements.cjs

      # The release + supply-chain gates under scripts/ carry their own tests
      # (hardware-qualification matrix parser, advisory-gate prerelease
      # handling) that no job ran until 2026-09-03 — a gate with untested
      # logic is exactly how the multer 1.4.5-lts.2 blind spot shipped.
      - name: Gate-script unit tests (scripts/__tests__)
        # The paths are SHELL-globbed, not handed to Node as a directory, and
        # that is load-bearing on Node 22 (2026-09-08 migration). Node 20's
        # test runner recursed into a directory argument; Node 22 treats an
        # explicitly-passed path as a FILE TO EXECUTE, so
        # `node --test scripts/__tests__/` fails with
        # `Cannot find module '.../scripts/__tests__'` — and it fails as ONE
        # failing "test", which reads like a broken assertion rather than a
        # runner problem. Worse, the 33 real tests never run at all: a green-
        # looking gate that has stopped checking anything is exactly the
        # false-green this repo keeps ending up with.
        # Verified 33/33 pass under BOTH Node 20 and Node 22 in this form.
        run: node --test scripts/__tests__/*.test.cjs

      - name: Build workspace packages (API tests import @cms/* by package name)
        # The API jest suite imports @cms/api-types etc. by
        # package name → resolves to each package's `main` (dist/). Those MUST
        # be built before jest runs, or every importing spec dies with
        # "Cannot find module '@cms/api-types'". This build-order gap was masked
        # for ages by the API test step's `continue-on-error: true`; making the
        # gate blocking (2026-05-29) surfaced it. Mirrors `pnpm preflight`.
        run: pnpm --filter @cms/api-types --filter @cms/scoreboard-cts --filter @cms/signage-design build

      - name: Every package can run the tests it ships
        # 2026-09-15 — `packages/api-types` carried three spec files and 36
        # assertions that had NEVER executed: it declared only a `build`
        # script, so `turbo run test` skipped it, and the step below only
        # ever ran the API. Its two siblings DID declare a `test` script and
        # were equally unrun for the same reason — nothing invoked it. 450
        # assertions that looked like coverage and were not.
        #
        # This guard fails when a package ships specs with no way to run
        # them (or a runner with no specs). The step after it does the
        # running, so the two together close both halves.
        run: node scripts/check-package-tests.cjs

      - name: Run Package Tests
        # Recursive by PATH, not a hand-kept list of package names — a new
        # package under packages/ is picked up the day it lands, and the
        # guard above catches one that forgot its `test` script.
        run: pnpm --filter "./packages/*" test

      - name: Renderer tests (apps/renderer — unit + real-Chromium integration)
        # By PATH, like the packages step above: `pnpm --filter <path> test`
        # fails outright if the package ever loses its `test` script. The
        # integration half (renders, the no-network proof, 413/429/504/503)
        # drives the Google Chrome the ubuntu runner image already ships — no
        # browser download. RENDERER_REQUIRE_CHROMIUM turns a missing browser
        # into a FAILURE instead of a skip: a suite that silently skips its
        # browser half is green and proves nothing.
        run: pnpm --filter ./apps/renderer test
        env:
          RENDERER_REQUIRE_CHROMIUM: '1'
          CHROME_PATH: /usr/bin/google-chrome

      - name: Run Tests
        # BLOCKING (governance review #1, 2026-05-29). Previously gated with
        # `continue-on-error: true`, which made the API jest suite decorative —
        # tests ran but a red suite never blocked a merge. The suite is
        # stable-green (49 suites / 612 tests, verified across 3 consecutive
        # full runs) so the gate is now real: a failing API test fails CI and
        # blocks merge to master.
        # --maxWorkers is passed here rather than set in jest.config so LOCAL
        # runs keep using every core; this cap exists for the 2-vCPU runner only.
        run: pnpm --filter api exec jest --maxWorkers=2
        env:
          # 2026-09-08 — this job started dying with
          # `FATAL ERROR: Ineffective mark-compacts near heap limit` (exit 134).
          # Not a test defect: taking the repo PRIVATE moved Actions from the
          # public 4-vCPU/16 GB runner class to the private 2-vCPU/7 GB one, and
          # the API suite has since grown past what the smaller box gives a
          # default-heap Node (249 -> 258 suites, 4195 -> 4458 tests in one day).
          # The same downgrade OOM-killed the e2e jobs; see
          # apps/web/tests/e2e-webserver.cjs for that half of the fix.
          #
          # Cap the heap explicitly so an overrun fails with a legible message
          # instead of SIGABRT, and cap workers so N jest children cannot each
          # claim that heap on a 2-core box. Raise deliberately if the suite
          # keeps growing — do not let this silently drift back to the default.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Application
        run: pnpm run build

  accessibility:
    name: Accessibility Lint (jsx-a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Only run when frontend or shared packages change.
    # Remove this filter if the monorepo CI needs full-run guarantees.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run a11y lint (jsx-a11y — NEW errors fail the build)
        # We keep a baseline count of pre-existing jsx-a11y errors committed
        # at the repo root (.a11y-baseline) and only fail CI when the count
        # grows. Lets us land new code without being blocked by a backlog
        # that needs a dedicated a11y sprint; also makes any NEW a11y
        # regression a hard CI stop.
        #
        # 2026-07-13 (audit W0-05): this step used to be FALSE-GREEN. ESLint
        # was crashing (exit 2 — "could not find plugin jsx-a11y", from a
        # scopeless rules object hitting .cjs files) and `|| true` + a grep
        # over the crash text printed success anyway. Rules now: pipeline
        # exit status is preserved; exit >= 2 (config crash) fails CI before
        # any counting; exit 1 must come with a real ESLint problem summary;
        # the baseline may only be RATCHETED DOWN — raising it is not an
        # accepted fix for a red build.
        run: |
          set -o pipefail
          CODE=0
          pnpm --filter web lint 2>&1 | tee /tmp/lint.txt || CODE=$?
          echo "eslint exit code: $CODE"
          if [ "$CODE" -ge 2 ]; then
            echo "FAIL: ESLint crashed (exit $CODE). That is a configuration error, not a lint result."
            exit "$CODE"
          fi
          if [ "$CODE" -eq 1 ] && ! grep -qE "[0-9]+ problems" /tmp/lint.txt; then
            echo "FAIL: ESLint exited 1 without a problem summary — broken run, not a lint result."
            exit 1
          fi
          # Count lines that have BOTH 'error' and 'jsx-a11y/' — warnings
          # are ignored.
          ACTUAL=$(grep -cE "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt || true)
          BASELINE=$(cat .a11y-baseline)
          echo "a11y errors — actual=$ACTUAL baseline=$BASELINE"
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "FAIL: a11y error count increased. New violations:"
            grep -E "error[[:space:]]+.*jsx-a11y/" /tmp/lint.txt
            echo ""
            echo "Fix the new violations. Do NOT raise .a11y-baseline to get green."
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASELINE" ]; then
            echo "::notice::a11y errors dropped to $ACTUAL (baseline $BASELINE). Ratchet down: echo $ACTUAL > .a11y-baseline"
          fi
          echo "OK: a11y errors did not increase"

      - name: Rules-of-hooks gate (zero tolerance)
        # 2026-05-27 — operator: "wtf dont let that happen again"
        # PlaylistCreateWizard.tsx shipped 3 useCallback hooks BELOW an
        # `if (!open) return null;` guard. Hook count flipped between
        # open=false (35 hooks) and open=true (38 hooks), producing
        # React error #310 the moment the operator clicked New Playlist.
        # ESLint's `react-hooks/rules-of-hooks` rule (already active via
        # eslint-config-next/core-web-vitals) catches this exact pattern
        # — verified on a minimal repro:
        #   error  React Hook "useCallback" is called conditionally. ...
        #          Did you accidentally call a React Hook after an early
        #          return?
        # The lint already ran above (writing /tmp/lint.txt); we just
        # weren't checking the output for hook-rule errors. Adding that
        # check here. Zero tolerance — these are ALWAYS real bugs that
        # crash the page at runtime, never style preferences.
        #
        # 2026-07-13 (audit W0-05): while ESLint was crashing (see step
        # above) this grep ran over the crash message, found 0 matches, and
        # printed success — during which 14 violations shipped unseen. 4 are
        # fixed; the 10 survivors all live in WidgetRenderer.tsx's giant
        # per-widget-case component (stable per mount, but still #310
        # landmines if a mounted widget's type/config branch flips). They're
        # held in .hooks-baseline and may only be RATCHETED DOWN as
        # WidgetRenderer cases get extracted into real components. Zero
        # tolerance still applies to every NEW violation anywhere.
        run: |
          HOOK_ERRS=$(grep -cE "error[[:space:]]+.*react-hooks/rules-of-hooks" /tmp/lint.txt || true)
          HOOK_BASELINE=$(cat .hooks-baseline)
          echo "react-hooks/rules-of-hooks errors: $HOOK_ERRS (baseline $HOOK_BASELINE)"
          if [ "$HOOK_ERRS" -gt "$HOOK_BASELINE" ]; then
            echo ""
            echo "FAIL: NEW conditional-hook violations detected."
            echo "These crash the page at runtime with React error #310"
            echo "the moment the conditional branch flips."
            echo ""
            grep -B1 -A4 "react-hooks/rules-of-hooks" /tmp/lint.txt
            echo ""
            echo "Fix them. Do NOT raise .hooks-baseline to get green."
            exit 1
          fi
          if [ "$HOOK_ERRS" -lt "$HOOK_BASELINE" ]; then
            echo "::notice::hooks violations dropped to $HOOK_ERRS (baseline $HOOK_BASELINE). Ratchet down: echo $HOOK_ERRS > .hooks-baseline"
          fi
          echo "OK: no new conditional-hook violations"

  dependency-audit:
    name: Production Dependency Audit
    # Prod-graph advisory gate (2026-07-10): fails on any HIGH/CRITICAL
    # advisory in the production dependency graph. Moderates/lows are
    # reported but do not fail the gate; fix floors live in the root
    # package.json `pnpm.overrides` block.
    #
    # 2026-07-16: `pnpm audit` broke — npm retired the legacy audit endpoint
    # it calls (HTTP 410 "use the bulk advisory endpoint"); pnpm 9 AND 10 both
    # still hit the dead endpoint, so no version bump fixes it. Replaced with
    # scripts/npm-advisory-audit.cjs, which enumerates the prod closure via
    # `pnpm ls --prod` and queries npm's bulk advisory endpoint directly —
    # SAME contract (prod graph, HIGH/CRITICAL = red), zero new deps. It needs
    # node_modules (hence the install step this job previously skipped); the
    # job still runs in parallel, off the build-and-test critical path.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies (needed for prod-graph enumeration)
        # --ignore-scripts: we only need the resolved tree for `pnpm ls`, not
        # built native modules (argon2/bcrypt) — skipping their node-gyp build
        # keeps this parallel job fast.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies (fail on HIGH/CRITICAL)
        run: node scripts/npm-advisory-audit.cjs

      # extract-zip (GHSA-jmr9-qjv8-65gv) has NO fixed version — the advisory
      # covers every release ever published — so it can never be resolved with
      # a `pnpm.overrides` floor. It was carried as a proven waiver until
      # 2026-09-08, when the Node-22 base image let puppeteer-core go to 25.x
      # and @puppeteer/browsers 3.x dropped it from the prod graph entirely.
      #
      # The step above ALREADY catches a regression (it would arrive as an
      # unwaived HIGH). This one exists so the failure names the cause — a
      # puppeteer-core downgrade — rather than only the advisory id.
      - name: extract-zip stays out of the production graph
        run: node scripts/check-extract-zip-unreachable.cjs

  secret-scan:
    name: Secret Leak Scan (gitleaks)
    # Operational gap O2 (2026-05-25): no automated secret-leak gate
    # — a future agent commit could leak a token (Stripe, Supabase
    # service-role, Anthropic API key, Twilio, etc.) and we'd find
    # out from a billing alert hours/days later. gitleaks scans the
    # diff on PRs and full history on master push. Sub-30s runtime
    # against this repo size; fails the job on any HIGH-confidence
    # finding so a tagged secret can't merge without explicit override.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history on master push so it can
          # scan everything that's been added since the last
          # known-clean commit. On PRs it scans the diff only — fast
          # by default.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action looks for GITHUB_TOKEN by default; we
          # pass the workflow's auto-issued token (read-only above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT defaults to true; that's
          # fine — failures upload a SARIF artifact for triage.

  security-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use the host Docker daemon so the retry pre-pull below populates the
          # SAME cache the build reads from (the default docker-container driver
          # keeps an isolated cache, so a daemon pre-pull wouldn't help it).
          driver: docker

      # The "Container Security Scanning failed in ~26s" flake was the anonymous
      # Docker Hub pull of the base image timing out / hitting the rate limit
      # before the build even started. Pre-pull the base image with retry +
      # backoff so the build below reads it from the local cache instead of
      # racing Docker Hub. Non-fatal — if every retry fails the build step still
      # runs (and would surface the real error).
      #
      # Keep this TAG in step with the `ARG NODE_IMAGE` digest in Dockerfile
      # (node:22-alpine since 2026-09-08 — Node 20 went EOL 2026-04-30). A
      # mismatch is not a failure, only a wasted warm-up: the build still pulls
      # the digest it is pinned to.
      - name: Pre-pull base image with retry (Docker Hub flake hardening)
        run: |
          for i in 1 2 3 4 5; do
            docker pull node:22-alpine && break
            echo "::warning::node:22-alpine pull attempt $i failed; retrying in $((i*8))s"
            sleep $((i*8))
          done

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: edu-cms:latest

      - name: Run Trivy Vulnerability Scanner
        # ── SEC-005 (2026-09-04): THIS GATE IS NOW BLOCKING. ─────────────────
        #
        # It ran with `continue-on-error: true` from the day it was added, so
        # the workflow was green while the image it scanned was red. The
        # independent assessment named that exactly: "green CI masks 52
        # high/critical runtime-image vulnerabilities" — a security gate that
        # reports a false green is worse than no gate, because it is trusted.
        #
        # The 2026-08-04 note that used to live here laid out the correct
        # order and said "do not skip step 2". It was followed:
        #
        #   (1) prisma -> dependencies                          [done earlier]
        #   (2) give docker-build a real postgres and drop SKIP_MIGRATE
        #       — done DIFFERENTLY and more strongly: the Dockerfile now
        #       ASSERTS at build time that the Prisma CLI, the schema, the
        #       migrations directory, the generated client and the API
        #       entrypoint are all present in the final image, so the path a
        #       prune breaks fails the BUILD rather than the 3am deploy. The
        #       image was additionally booted locally against a disposable
        #       Postgres: `prisma migrate deploy` applied the migrations and
        #       /api/v1/health answered 200 with db:"ok".
        #   (3) prune devDependencies from the runner  [done — the runner is
        #       now assembled from a dedicated `proddeps` stage that only ever
        #       ran `pnpm install --prod`, plus dist/]
        #   (4) re-measure  [done — a real local scan of the pre-fix image
        #       reproduced CI's number exactly, 52 (HIGH 50 / CRITICAL 2), and
        #       the rebuilt image scans clean]
        #   (5) drop continue-on-error  [this commit]
        #
        # Where the 52 actually were, which is what made the fix structural
        # rather than 52 package bumps:
        #     48  corepack's cached pnpm in the RUNNER (tar, minimatch,
        #         brace-expansion, cross-spawn, glob, ip-address, pnpm)
        #      2  the npm bundled in node:22-alpine (pacote, sigstore)
        #      2  devDependencies the runner copied from the builder
        # None of them were Chromium, ffmpeg, or application code.
        #
        # WHEN THIS GOES RED ON A NEW CVE: fix it or waive it deliberately in
        # .trivyignore.yaml, which requires a written justification and a
        # mandatory expiry date. Do NOT restore `continue-on-error` — that is
        # the exact failure this remediation exists to end.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'edu-cms:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          # Dated, per-path, expiring waivers. Currently empty on purpose.
          trivyignores: '.trivyignore.yaml'
        env:
          # The vulnerability DB comes from a public registry that rate-limits
          # anonymous pulls; without these the step fails as a DB-download
          # error, which reads like a scan failure and is the fastest route
          # back to someone re-adding continue-on-error.
          TRIVY_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'public.ecr.aws/aquasecurity/trivy-java-db:1'

      - name: Fail loudly if the runtime image regains a package manager
        # A cheap, direct assertion of the SEC-005 invariant, independent of
        # the CVE database: 48 of the original 52 findings existed because the
        # runner shipped pnpm and npm. The Dockerfile asserts this too; having
        # it in CI as well means a future Dockerfile edit that re-adds a
        # package manager is named in the workflow log, not just in a build
        # error somebody scrolls past.
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh edu-cms:latest -c 'for pm in pnpm npm npx yarn; do command -v $pm; done' 2>/dev/null | grep -q .; then
            echo "::error::A package manager is back in the production image. See SEC-005 in the Dockerfile header."
            exit 1
          fi
          echo "Runtime image carries no package manager."

  e2e:
    # 2026-08-04 — MATRIX, not a chromium pin.
    #
    # First attempt at fixing the 49-minute timeout pinned this job to
    # chromium. That was wrong: only 2 of the 13 specs (emergency-path,
    # widget-render) have a dedicated WebKit workflow, so pinning silently
    # dropped WebKit for the other 11 — including holiday-hotzone and
    # external-html-clickedit, the two specs that exist BECAUSE of the
    # 2026-05-09 Safari bug that shipped broken for two months. CLAUDE.md
    # calls WebKit coverage non-negotiable and it is right.
    #
    # The real problem was never the browser count, it was doing both
    # SERIALLY in one job (playwright.config sets workers:1 in CI). Splitting
    # into a matrix runs them concurrently: same coverage, ~half the wall
    # clock, and a WebKit-only failure is now legible instead of buried.
    name: E2E Tests (Playwright / ${{ matrix.browser }})
    # 2026-08-18 — PINNED to ubuntu-24.04 (was ubuntu-latest): GitHub's rolling
    # runner-image update (the same one forcing Node-24 action runtimes) wedges
    # Playwright 1.59 WebKit — WPEWebProcess launches then hangs until the job
    # timeout ("cancelled" verdict), while Chromium passes. Mixed-fleet rollout
    # made it intermittent (same commit green 08-17, hung 08-18 with no code
    # change). Unpin only after a Playwright upgrade whose WebKit build passes
    # this job on ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    # 2026-08-04 — this job had NO timeout. `pnpm test:e2e` runs `playwright
    # test` with no --project, so despite the job's name it executed BOTH
    # chromium AND webkit (92 tests). It ran ~49 minutes and was then killed
    # by the runner with NO failing step recorded — an opaque red that costs
    # more to diagnose than the tests are worth. An explicit cap makes a hang
    # fail legibly instead of mysteriously.
    timeout-minutes: 30
    permissions:
      contents: read
    # 2026-07-13 (audit W0-06): this job used to be PR-only — and this repo
    # ships by direct push to master, so the gate NEVER ran; nobody noticed
    # that collection was broken ("Total: 0 tests in 0 files"). It now runs
    # on every push AND PR (repo is public — Actions minutes are free), on
    # an ephemeral Postgres so no test can ever touch production data.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: educms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/educms_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/educms_e2e
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (${{ matrix.browser }})
        run: pnpm exec playwright install ${{ matrix.browser }} --with-deps

      - name: Build workspace packages (the API dev server imports @cms/* by package name)
        # Same reason as build-and-test: each job is a fresh runner, and
        # `nest start --watch` can't compile until @cms/* dist/ exists —
        # without this the webServer boot dies on TS2307 "Cannot find
        # module '@cms/api-types'" and Playwright times out (CLAUDE.md
        # deploy-reliability failure mode #3, e2e-job edition).
        run: pnpm --filter @cms/api-types --filter @cms/scoreboard-cts --filter @cms/signage-design build

      - name: Gate — Playwright collection must be real (audit W0-06)
        # A broken collection (config crash, stray Jest files, mass skip)
        # used to report "Total: 0 tests" while the job stayed green. The
        # floor is 30 discovered tests; lower it ONLY with a written reason
        # in the commit that lowers it.
        run: |
          set -o pipefail
          pnpm exec playwright test --list 2>&1 | tee /tmp/pw-list.txt
          COUNT=$(grep -oE "Total: [0-9]+ tests" /tmp/pw-list.txt | grep -oE "[0-9]+" || echo 0)
          echo "Discovered tests: $COUNT (floor: 30)"
          if [ "$COUNT" -lt 30 ]; then
            echo "FAIL: Playwright discovered $COUNT tests — below the floor of 30."
            echo "Collection is broken or tests were deleted without replacing coverage."
            exit 1
          fi

      - name: Apply Prisma schema to ephemeral Postgres
        run: pnpm db:push

      # ── Build the web app BEFORE Playwright (2026-09-05) ─────────────────
      # Playwright now serves a PREBUILT production bundle (`next start`)
      # instead of compiling routes on demand with `next dev`.
      #
      # WHY: the repo went private on 2026-09-04, which moves the
      # GitHub-hosted Linux runner from the public 4-vCPU / 16 GB class to the
      # private 2-vCPU / 7 GB one. From the first push after that flip, BOTH
      # matrix legs of this job died identically — "○ Compiling
      # /board/[gameId]", the 180 s global-setup warm giving up, then
      # "##[error]The runner has received a shutdown signal" with no test ever
      # reported — on three consecutive commits AND on a re-run of an
      # unchanged commit whose only change was Kotlin. Reproduced in a
      # container capped to the private-runner spec (--cpus=2 --memory=7g
      # --memory-swap=7g): `next dev` compiling /board drove the cgroup to
      # 6.83 GB and the kernel OOM-killer fired (memory.events oom_kill 1),
      # while the same box builds in 69 s at 5.23 GB peak with zero OOM events
      # and then serves at 0.70 GB. Nothing regressed in the app; the machine
      # halved. Every workflow that does NOT run `next dev` stayed green
      # throughout, including this workflow's own `Build Application` job.
      #
      # The build is its own STEP on purpose: a build failure must be a
      # legible red step, not an opaque webServer timeout.
      #
      # NEXT_PUBLIC_API_URL is set HERE because Next inlines NEXT_PUBLIC_* at
      # BUILD time. It must match playwright.config.ts exactly, or the
      # unroutable-host tripwire (a missed mock NXDOMAINs instead of hitting
      # production) is silently replaced by the localhost fallback.
      - name: Build the web app (Playwright serves this build)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://api.invalid/api/v1
          # An explicit heap ceiling so an overrun fails as a legible V8
          # "JavaScript heap out of memory" instead of taking the runner VM
          # with it. 4096 was measured to complete with 5.23 GB peak RSS and
          # no cgroup pressure events on the 7 GB runner class.
          NODE_OPTIONS: --max-old-space-size=4096

      # Pinned to chromium, matching this job's NAME. webkit coverage is not
      # lost — it is owned by dedicated workflows that run the same specs with
      # browser-specific setup: cross-browser.yml (widget-render + holiday
      # bridge, chromium AND webkit) and emergency-path.yml (chromium AND
      # webkit). Running every spec on webkit here as well was a third
      # redundant pass and roughly doubled the runtime of the job that then
      # timed out.
      - name: Run E2E Tests
        run: pnpm --filter web exec playwright test --config playwright.config.ts --project=${{ matrix.browser }}
        env:
          CI: true
          PLAYWRIGHT_ADMIN_TOKEN: ${{ secrets.PLAYWRIGHT_ADMIN_TOKEN }}
          PLAYWRIGHT_TENANT_ID: ${{ secrets.PLAYWRIGHT_TENANT_ID }}
          # Must equal the value the build step above used — see the note there.
          NEXT_PUBLIC_API_URL: http://api.invalid/api/v1
          # Serve the build made above; never compile inside the test run.
          # tests/e2e-webserver.cjs fails loudly if .next/BUILD_ID is absent,
          # so a dropped build step is named rather than silently re-compiled
          # into the OOM this change exists to end.
          E2E_PREBUILT: '1'
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
