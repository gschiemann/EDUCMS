name: Prod Smoke

# Hits https://venue-os.app with a real Playwright browser,
# logs in as the seed admin, walks every tenant + opens 12 templates
# in the builder. Fails CI on regressions like:
#   - login flow broken (form / API contract drift)
#   - a tenant slug stops resolving (route / RBAC change)
#   - templates gallery returns no tiles (API or render regression)
#   - builder canvas doesn't mount (Tailwind, layout, route change)
#
# Three triggers, each catches a different failure window:
#   - on push to master:   catches "I just shipped a regression"
#   - on PR (manual flag): opt-in via PR label `run-prod-smoke`
#   - nightly 06:00 UTC:   catches drift between deploys (Railway env
#                           change, Supabase row drift, CDN cache state)
#
# Test account comes from the PROD_SMOKE_EMAIL / PROD_SMOKE_PASSWORD repo
# SECRETS (SEC-004, 2026-09-04: the literal credential was published in this
# public repo and was live in production until it was rotated). It is a
# CONTRIBUTOR on Springfield Elementary only, so we never
# touch real customer data on Chardon HS, AGC, etc.

on:
  push:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 23:00 PT = midnight ET — fires while the customer's
    # building is empty so a transient red doesn't sit visible all day.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # SUPERSEDED master runs are CANCELLED (changed 2026-09-09, operator's call).
  #
  # This deliberately REVERSES the 2026-08-04 decision below. That version keyed
  # the group on the individual SHA for push, so two master commits were never in
  # the same group and nothing could ever cancel — every commit kept its own
  # verdict. The cost, measured on 2026-09-08: five pushes in one hour ran five
  # full suites when only the tip mattered, ~100 of that day's ~200 billed
  # minutes, and GitHub Actions then hit the Free-plan cap and stopped running
  # ANYTHING for hours. A gate that is switched off by billing protects nothing.
  #
  # Operator (2026-09-09, $10 budget): "ya save the money, we got no customers so
  # im not worried that much." The accepted trade: an intermediate commit that is
  # superseded within minutes reads as "never checked" in the history. The TIP of
  # master is always fully checked, which is what actually ships.
  #
  # ⚠️ If you are reading the 2026-08-04 rationale below and reaching for the
  # per-SHA group again: that is the change this comment exists to prevent. Only
  # restore it if per-commit verdicts become worth real money again (paid plan, a
  # customer audit trail, or a compliance requirement) — and say so here.
  #
  # --- superseded 2026-08-04 rationale, kept for context ---
  # cancel-in-progress was deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history). Expressing
  # it as `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` did
  # not work — master runs were still cancelled — so the GROUP was made unique
  # per push instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod-smoke:
    name: Prod smoke (Chromium)
    runs-on: ubuntu-latest
    # 2026-05-11 — bumped 8 → 12 min after the login retry budget
    # extended to 5 attempts × up to 90 s backoffs. Worst-case the
    # Supabase pgbouncer is degraded enough that we burn ~4 min in
    # login retries; we still want headroom for the rest of the
    # smoke (tenant + template walk) without false timeouts.
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Chromium only — same engine as Chrome, the dominant customer
        # browser. holiday-bridge.cjs already covers WebKit; this guards
        # the broader app flow.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Wait for THIS commit to be deployed (only if it deploys at all)
        # WHY (2026-09-08): this job runs on `push` and immediately hit the live
        # site — but Railway still has to BUILD, which takes minutes. So it was
        # smoke-testing the PREVIOUS deployment and recording the verdict against
        # the NEW commit.
        #
        # FIRST ATTEMPT WAS WRONG, TWICE (fixed 2026-09-09, caught on 1a993529):
        #   1. It waited for GITHUB_SHA to appear at /health unconditionally. But
        #      Railway only redeploys when a commit touches its `watchPatterns`
        #      (railway.json). A workflow- or docs-only commit NEVER deploys, so
        #      the gate waited for something that could not happen.
        #   2. Its 15-minute ceiling was LONGER than this job's own
        #      `timeout-minutes`, so the job was killed before the gate could
        #      report anything — and GitHub records a timeout as "cancelled",
        #      which is neither a pass nor a failure. The commit got NO verdict.
        #
        # Now: if the live commit differs, ask GitHub which files changed between
        # it and us. If none of them are paths Railway deploys, the running build
        # is functionally current — proceed and say so. Only wait when this push
        # really does produce a new deployment, and cap that wait well under the
        # job timeout so a miss FAILS loudly instead of being killed silently.
        #
        # KNOWN LIMIT, stated rather than hidden: this only waits on the RAILWAY
        # API (the one surface that reports its commit at /health). apps/web is
        # deployed by VERCEL and is not in Railway's watchPatterns, so a web-only
        # push skips the wait and may smoke a Vercel build that is a minute or two
        # stale. Nothing here detects that; if a flaky web-only smoke ever traces
        # back to it, the fix is a commit-reporting endpoint on the web origin, not
        # a blind sleep.
        if: github.event_name == 'push'
        env:
          API: https://api-production-39a1.up.railway.app/api/v1/health
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          live=$(curl -sf --max-time 10 "$API" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "already live — smoking the right build"; exit 0
          fi
          echo "live=${live:0:12} pushed=${GITHUB_SHA:0:12} — does this push deploy?"
          files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${live}...${GITHUB_SHA}" \
                    --jq '.files[].filename' 2>/dev/null || echo "__UNKNOWN__")
          if [ "$files" = "__UNKNOWN__" ]; then
            echo "::warning::could not diff against the live commit; waiting to be safe"
            deploys=1
          else
            deploys=$(printf '%s\n' "$files" | grep -cE '^(apps/api/|packages/(database|api-types|scoreboard-cts|signage-design)/|Dockerfile|railway\.json|scripts/railway-start\.sh|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)' || true)   # grep -c exits 1 on a zero count; the step runs under bash -e
          fi
          if [ "${deploys:-0}" -eq 0 ]; then
            echo "no Railway watchPattern touched — this commit never deploys."
            echo "The live build is functionally current; smoking it deliberately."
            exit 0
          fi
          echo "$deploys deploy-affecting file(s) — waiting for the new build"
          for i in $(seq 1 20); do    # 20 x 15s = 5 min, well under timeout-minutes
            live=$(curl -sf --max-time 10 "$API" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "deployed after $((i*15))s — smoking the right build"; exit 0
            fi
            echo "  live=${live:0:12} (${i}/20)"
            sleep 15
          done
          # 2026-09-14 — Railway SKIPPED a push that touched only scripts/ops-sweep.mjs
          # (its watchPatterns list scripts/** but the image only ships
          # scripts/railway-start.sh), so this gate waited five minutes for a build
          # that was never coming and then failed a healthy site — which fired the
          # on-call responder. Last check before failing: does the diff between the
          # LIVE commit and this push change anything that goes into the API image?
          # If not, the live API is byte-identical for this commit's purposes — smoke
          # it, say so loudly, and let the verdict stand for this commit.
          live=$(curl -sf --max-time 10 "$API" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${live}...${GITHUB_SHA}" --jq '.files[].filename' 2>/dev/null \
            | grep -cE '^(apps/api/|packages/(database|api-types|scoreboard-cts|signage-design)/|Dockerfile|railway\.json|scripts/railway-start\.sh|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)' || true)
          if [ -n "$live" ] && [ "${artifact:-1}" -eq 0 ]; then
            echo "::warning::Railway did not deploy $GITHUB_SHA within 5 minutes, but nothing in this push changes the API image (diff vs live ${live:0:12} is outside apps/api, packages/*, Dockerfile, railway.json, the lockfile). Smoking the live build as this commit's API."
            exit 0
          fi
          echo "::error::$GITHUB_SHA never became live within 5 minutes and the push changes the API image."
          echo "Smoking a different build is worse than not smoking, so this fails."
          exit 1

      - name: Run prod smoke
        # Test account credentials live in the workflow as plain values
        # — the account is a SEED test user (Springfield Elementary
        # tenant, isolated from all customer data) and the password is
        # already in packages/database/prisma/seed.ts as a public
        # constant. Not a secret. Override via repo Vars/Secrets if
        # the seed account is ever rotated.
        env:
          PROD_SMOKE_BASE: https://venue-os.app
          PROD_SMOKE_API: https://api-production-39a1.up.railway.app/api/v1
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm --filter web run test:prod-smoke

      - name: Upload screenshots + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts
          path: |
            apps/web/tests/cross-browser/prod-smoke-shots/
            apps/web/tests/cross-browser/prod-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  # WebKit (Safari engine) dashboard-navigation canary. Runs PARALLEL to the
  # Chromium prod-smoke. Catches the class that burned days on 2026-06-08: a
  # WebKit-only React crash ("TypeError: null is not an object (… parentNode
  # .removeChild)") from BrandStyleInjector detaching React-managed <head>
  # favicon links → "every menu click needs two clicks / it just reloads" in
  # Safari, invisible to Chrome-only CI + local dev (fixed in ddb64dab). This is
  # the standing WebKit-INTERACTIVITY guard CLAUDE.md's cross-browser section
  # calls for — the existing WebKit jobs only check static templates + the
  # /player render, never the authed dashboard's client-side navigation.
  webkit-nav:
    name: WebKit dashboard nav (favicon-crash canary)
    # 2026-08-18 — PINNED to ubuntu-24.04 (was ubuntu-latest): GitHub's rolling
    # runner-image update (the same one forcing Node-24 action runtimes) wedges
    # Playwright 1.59 WebKit — WPEWebProcess launches then hangs until the job
    # timeout ("cancelled" verdict), while Chromium passes. Mixed-fleet rollout
    # made it intermittent (same commit green 08-17, hung 08-18 with no code
    # change). Unpin only after a Playwright upgrade whose WebKit build passes
    # this job on ubuntu-latest.
    runs-on: ubuntu-24.04
    # WebKit cold-install of ~160 system deps is the slow part (3-7 min); the
    # nav smoke itself runs in well under a minute. Cap at 15 to absorb it.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright WebKit (with system deps)
        run: pnpm --filter web exec playwright install --with-deps webkit

      - name: Run WebKit dashboard-nav smoke
        # Seed SUPER_ADMIN (public, Springfield-Elementary-isolated) — same as
        # prod-smoke. FAILS on any React removeChild/parentNode crash or a
        # sidebar click that full-reloads instead of client-side navigating.
        env:
          WEBKIT_NAV_BASE: https://venue-os.app
          WEBKIT_NAV_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          WEBKIT_NAV_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm --filter web run test:webkit-nav
