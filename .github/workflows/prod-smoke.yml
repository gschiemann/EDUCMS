name: Prod Smoke

# Hits https://venue-os.app with a real Playwright browser,
# logs in as the seed admin, walks every tenant + opens 12 templates
# in the builder. Fails CI on regressions like:
#   - login flow broken (form / API contract drift)
#   - a tenant slug stops resolving (route / RBAC change)
#   - templates gallery returns no tiles (API or render regression)
#   - builder canvas doesn't mount (Tailwind, layout, route change)
#
# Three triggers, each catches a different failure window:
#   - on push to master:   catches "I just shipped a regression"
#   - on PR (manual flag): opt-in via PR label `run-prod-smoke`
#   - nightly 06:00 UTC:   catches drift between deploys (Railway env
#                           change, Supabase row drift, CDN cache state)
#
# Test account comes from the PROD_SMOKE_EMAIL / PROD_SMOKE_PASSWORD repo
# SECRETS (SEC-004, 2026-09-04: the literal credential was published in this
# public repo and was live in production until it was rotated). It is a
# CONTRIBUTOR on Springfield Elementary only, so we never
# touch real customer data on Chardon HS, AGC, etc.

on:
  push:
    branches: [ master ]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 23:00 PT = midnight ET — fires while the customer's
    # building is empty so a transient red doesn't sit visible all day.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  prod-smoke:
    name: Prod smoke (Chromium)
    runs-on: ubuntu-latest
    # 2026-05-11 — bumped 8 → 12 min after the login retry budget
    # extended to 5 attempts × up to 90 s backoffs. Worst-case the
    # Supabase pgbouncer is degraded enough that we burn ~4 min in
    # login retries; we still want headroom for the rest of the
    # smoke (tenant + template walk) without false timeouts.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Chromium only — same engine as Chrome, the dominant customer
        # browser. holiday-bridge.cjs already covers WebKit; this guards
        # the broader app flow.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Wait for THIS commit to actually be deployed
        # WHY (2026-09-08): this job runs on `push` and immediately hit the live
        # site — but Railway still had to BUILD the image, which takes minutes.
        # So prod-smoke was testing the PREVIOUS deployment and reporting the
        # result against the NEW commit. Green here did not mean "this commit is
        # good in production"; it meant "the commit before it still works".
        # That is the false-assurance shape the repo's CI rules exist to kill.
        #
        # On a push we now WAIT until /health reports our own SHA. On a schedule
        # or manual run there is no commit to wait for, so we skip the gate and
        # smoke whatever is live (which is exactly what the nightly run is for).
        if: github.event_name == 'push'
        env:
          API: https://api-production-39a1.up.railway.app/api/v1/health
        run: |
          echo "waiting for $GITHUB_SHA to be live at $API"
          for i in $(seq 1 60); do
            live=$(curl -sf --max-time 10 "$API" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "deployed after $((i*15))s — smoking the right build"; exit 0
            fi
            echo "  live=${live:0:12} want=${GITHUB_SHA:0:12} (${i}/60)"
            sleep 15
          done
          echo "::error::$GITHUB_SHA never became live within 15 minutes."
          echo "The smoke test below would have tested a DIFFERENT build, so this"
          echo "job fails rather than reporting a green that means nothing."
          exit 1

      - name: Run prod smoke
        # Test account credentials live in the workflow as plain values
        # — the account is a SEED test user (Springfield Elementary
        # tenant, isolated from all customer data) and the password is
        # already in packages/database/prisma/seed.ts as a public
        # constant. Not a secret. Override via repo Vars/Secrets if
        # the seed account is ever rotated.
        env:
          PROD_SMOKE_BASE: https://venue-os.app
          PROD_SMOKE_API: https://api-production-39a1.up.railway.app/api/v1
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm --filter web run test:prod-smoke

      - name: Upload screenshots + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts
          path: |
            apps/web/tests/cross-browser/prod-smoke-shots/
            apps/web/tests/cross-browser/prod-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  # WebKit (Safari engine) dashboard-navigation canary. Runs PARALLEL to the
  # Chromium prod-smoke. Catches the class that burned days on 2026-06-08: a
  # WebKit-only React crash ("TypeError: null is not an object (… parentNode
  # .removeChild)") from BrandStyleInjector detaching React-managed <head>
  # favicon links → "every menu click needs two clicks / it just reloads" in
  # Safari, invisible to Chrome-only CI + local dev (fixed in ddb64dab). This is
  # the standing WebKit-INTERACTIVITY guard CLAUDE.md's cross-browser section
  # calls for — the existing WebKit jobs only check static templates + the
  # /player render, never the authed dashboard's client-side navigation.
  webkit-nav:
    name: WebKit dashboard nav (favicon-crash canary)
    # 2026-08-18 — PINNED to ubuntu-24.04 (was ubuntu-latest): GitHub's rolling
    # runner-image update (the same one forcing Node-24 action runtimes) wedges
    # Playwright 1.59 WebKit — WPEWebProcess launches then hangs until the job
    # timeout ("cancelled" verdict), while Chromium passes. Mixed-fleet rollout
    # made it intermittent (same commit green 08-17, hung 08-18 with no code
    # change). Unpin only after a Playwright upgrade whose WebKit build passes
    # this job on ubuntu-latest.
    runs-on: ubuntu-24.04
    # WebKit cold-install of ~160 system deps is the slow part (3-7 min); the
    # nav smoke itself runs in well under a minute. Cap at 15 to absorb it.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright WebKit (with system deps)
        run: pnpm --filter web exec playwright install --with-deps webkit

      - name: Run WebKit dashboard-nav smoke
        # Seed SUPER_ADMIN (public, Springfield-Elementary-isolated) — same as
        # prod-smoke. FAILS on any React removeChild/parentNode crash or a
        # sidebar click that full-reloads instead of client-side navigating.
        env:
          WEBKIT_NAV_BASE: https://venue-os.app
          WEBKIT_NAV_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          WEBKIT_NAV_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm --filter web run test:webkit-nav
