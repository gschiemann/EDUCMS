name: Prod Smoke

# Hits https://venue-os.app with a real Playwright browser,
# logs in as the seed admin, walks every tenant + opens 12 templates
# in the builder. Fails CI on regressions like:
#   - login flow broken (form / API contract drift)
#   - a tenant slug stops resolving (route / RBAC change)
#   - templates gallery returns no tiles (API or render regression)
#   - builder canvas doesn't mount (Tailwind, layout, route change)
#
# Three triggers, each catches a different failure window:
#   - on push to master:   catches "I just shipped a regression"
#   - on PR (manual flag): opt-in via PR label `run-prod-smoke`
#   - nightly 06:00 UTC:   catches drift between deploys (Railway env
#                           change, Supabase row drift, CDN cache state)
#
# Test account is the seed SUPER_ADMIN (admin@springfield.edu /
# admin123) which only operates on Springfield Elementary, so we never
# touch real customer data on Chardon HS, AGC, etc.

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 23:00 PT = midnight ET — fires while the customer's
    # building is empty so a transient red doesn't sit visible all day.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prod-smoke:
    name: Prod smoke (Chromium)
    runs-on: ubuntu-latest
    # 2026-05-11 — bumped 8 → 12 min after the login retry budget
    # extended to 5 attempts × up to 90 s backoffs. Worst-case the
    # Supabase pgbouncer is degraded enough that we burn ~4 min in
    # login retries; we still want headroom for the rest of the
    # smoke (tenant + template walk) without false timeouts.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # Chromium only — same engine as Chrome, the dominant customer
        # browser. holiday-bridge.cjs already covers WebKit; this guards
        # the broader app flow.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run prod smoke
        # Test account credentials live in the workflow as plain values
        # — the account is a SEED test user (Springfield Elementary
        # tenant, isolated from all customer data) and the password is
        # already in packages/database/prisma/seed.ts as a public
        # constant. Not a secret. Override via repo Vars/Secrets if
        # the seed account is ever rotated.
        env:
          PROD_SMOKE_BASE: https://venue-os.app
          PROD_SMOKE_API: https://api-production-39a1.up.railway.app/api/v1
          PROD_SMOKE_EMAIL: admin@springfield.edu
          PROD_SMOKE_PASSWORD: admin123
        run: pnpm --filter web run test:prod-smoke

      - name: Upload screenshots + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-artifacts
          path: |
            apps/web/tests/cross-browser/prod-smoke-shots/
            apps/web/tests/cross-browser/prod-smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  # WebKit (Safari engine) dashboard-navigation canary. Runs PARALLEL to the
  # Chromium prod-smoke. Catches the class that burned days on 2026-06-08: a
  # WebKit-only React crash ("TypeError: null is not an object (… parentNode
  # .removeChild)") from BrandStyleInjector detaching React-managed <head>
  # favicon links → "every menu click needs two clicks / it just reloads" in
  # Safari, invisible to Chrome-only CI + local dev (fixed in ddb64dab). This is
  # the standing WebKit-INTERACTIVITY guard CLAUDE.md's cross-browser section
  # calls for — the existing WebKit jobs only check static templates + the
  # /player render, never the authed dashboard's client-side navigation.
  webkit-nav:
    name: WebKit dashboard nav (favicon-crash canary)
    runs-on: ubuntu-latest
    # WebKit cold-install of ~160 system deps is the slow part (3-7 min); the
    # nav smoke itself runs in well under a minute. Cap at 15 to absorb it.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright WebKit (with system deps)
        run: pnpm --filter web exec playwright install --with-deps webkit

      - name: Run WebKit dashboard-nav smoke
        # Seed SUPER_ADMIN (public, Springfield-Elementary-isolated) — same as
        # prod-smoke. FAILS on any React removeChild/parentNode crash or a
        # sidebar click that full-reloads instead of client-side navigating.
        env:
          WEBKIT_NAV_BASE: https://venue-os.app
          WEBKIT_NAV_EMAIL: admin@springfield.edu
          WEBKIT_NAV_PASSWORD: admin123
        run: pnpm --filter web run test:webkit-nav
