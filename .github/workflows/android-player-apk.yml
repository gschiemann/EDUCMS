name: Android Player APK

# Builds the kiosk APK on a RELEASE TAG (player-v* / manager-v*) or on
# demand. Uploads as a downloadable artifact named 'edu-cms-player-apk'
# so non-developers can grab a fresh build straight from the GitHub UI:
# Actions → latest run → Artifacts → download.
#
# Manual trigger via workflow_dispatch lets you build whenever without
# pushing.

on:
  # IMPORTANT: do NOT mix `paths:` with `tags:` under a single push key.
  # GitHub treats the paths filter as applying to EVERY push including
  # tag pushes; tags don't have a branch diff so the paths check blocks
  # the tag event silently. Remove paths so tag pushes always build.
  # With the gradle cache + sdk cache the cost of extra runs is minimal.
  # 2026-08-04 — NO LONGER builds on every push to master.
  # This job is a RELEASE ARTIFACT builder (Gradle + Android SDK + two APKs,
  # ~10-25 min a run), not a correctness check — nothing it produces gates a
  # web/API deploy. Building it on every master push burned the majority of
  # the Actions budget for zero signal on the pushes that never ship an APK.
  # It still runs on the release tags (which is when an APK actually matters)
  # and on demand. To check a Kotlin change without tagging, use
  # `gh workflow run android-player-apk.yml --ref <branch>`.
  push:
    tags:
      # Player release tag (existing) — produces edu-cms-player-v*.apk
      # release attachment.
      - 'player-v*'
      # Manager release tag (Phase 1+) — produces edu-cms-manager-v*.apk
      # release attachment via the parallel `softprops/action-gh-release`
      # step further down. Both APKs are built on every run regardless;
      # only the matching tag triggers the corresponding release attach.
      - 'manager-v*'
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      playerBaseUrl:
        description: 'Override the player base URL (e.g. for a staging build)'
        required: false
        default: ''

# ── SUPPLY-02 (2026-08-04): every `uses:` here is pinned to a full commit SHA.
#
# This is the ONE job that materializes the production Android signing key: it
# decodes RELEASE_KEYSTORE_BASE64 to disk and puts RELEASE_STORE_PASSWORD /
# RELEASE_KEY_PASSWORD / RELEASE_KEY_ALIAS into the build step's environment.
# Every action running in that job can read both.
#
# A tag like `@v4` is MUTABLE — the owner (or anyone who compromises them) can
# repoint it at new code, and the next run executes it with no diff for us to
# review. For a normal CI job that is an accepted risk. Here the prize is the
# key that signs the APK for a fleet of school displays, and Android will
# install an update signed by that key without question. So this job does not
# get to run code we have not pinned.
#
# The SHAs below are exactly what those tags resolved to when pinned, so this
# changed NO behaviour — it only removed the ability to change it silently.
#
# Updating one: resolve the tag yourself and read the diff first, e.g.
#   gh api repos/actions/checkout/git/ref/tags/v4 -q .object.sha
# Keep the trailing `# v4` comment — it is the only human-readable record of
# which version a SHA corresponds to. Dependabot understands this format and
# will still offer bumps (see .github/dependabot.yml).

permissions:
  contents: write   # softprops/action-gh-release needs write to create Releases

concurrency:
  group: android-player-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (release-signed when secrets are present)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # For the artifact guards below. They are dependency-free plain
      # Node (no pnpm install), so this is the only setup they need.
      - name: Set up Node (for the release guards)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # ⚠️ `packages:` IS LOAD-BEARING (2026-09-19). With no input this action
      # installs its DEFAULT set, `tools platform-tools`. Google removed the
      # legacy `tools` package; once the runner image moved to cmdline-tools 16,
      # `sdkmanager tools` began exiting 1 ("Failed to find package 'tools'") and
      # this job died HERE, before gradle ever started.
      #
      # Nobody noticed, because this workflow only runs on release tags: the last
      # green run was player-v1.1.17 on 2026-09-03, and the break was found on
      # 2026-09-19 by a manual dispatch. For that whole window NO APK COULD BE
      # BUILT — an emergency player hotfix would have failed at its first step.
      #
      # `tools` was never needed: AGP uses cmdline-tools + platform-tools and
      # fetches platforms;android-34 / build-tools on demand (licences are
      # accepted by this action). The SHA pin is unchanged on purpose — this is
      # the job that holds the signing key (SUPPLY-02 above).
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/player/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/player/**/*.gradle*', 'apps/player/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Gradle (bootstrap — wrapper jar isn't committed)
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f apps/player/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f apps/player/gradlew ]; then
            echo "Bootstrapping Gradle wrapper for the player project…"
            # Subshell so 'cd' doesn't leak into the next chmod, which would
            # then resolve apps/player/gradlew relative to the new CWD.
            ( cd apps/player && gradle wrapper --gradle-version 8.7 )
          fi
          ls -la apps/player/gradlew apps/player/gradle/wrapper/gradle-wrapper.jar
          chmod +x apps/player/gradlew

      # Materialize the release keystore from the repo secret. The private key
      # never exists in the repo — only as RELEASE_KEYSTORE_BASE64, which is
      # write-only in GitHub (it cannot be read back, so this is NOT a backup;
      # the owner's copies are the backup — see apps/player/RELEASE_SIGNING.md).
      #
      # If the secret is absent the file is simply not created, hasReleaseSigning
      # stays false, and the build falls back to assembleDebug below. That keeps
      # a fork or a secretless environment building instead of hard-failing.
      - name: Materialize release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 not set — falling back to a DEBUG build."
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/venueos-release.jks"
          # Sanity-check the decode: a PKCS12/JKS store starts with 0x30 0x82.
          head -c 2 "$RUNNER_TEMP/venueos-release.jks" | xxd -p | grep -q '^3082' || {
            echo "::error::Decoded keystore is not a valid key store — check RELEASE_KEYSTORE_BASE64."
            exit 1
          }
          echo "available=true" >> $GITHUB_OUTPUT
          echo "Keystore materialized ($(stat -c%s "$RUNNER_TEMP/venueos-release.jks") bytes)."

      # ─── HARDWARE QUALIFICATION GATE (2026-09-02, P0-4) ───────────────
      # RELEASE PATH ONLY. On a `player-v*` / `manager-v*` tag this runs
      # BEFORE any assemble, so an unqualified version never produces —
      # let alone publishes — an APK. Debug/CI builds (workflow_dispatch,
      # branch runs) skip it entirely and are unaffected.
      #
      # Why: headless Chromium is not a display. It does not reproduce OEM
      # certificate stores, OEM DNS/network stacks, memory pressure, broken
      # WebView providers, remote-key-only firmware, or storage corruption.
      # Two units bricked at install (2026-08-30) and an Android-9 Goodview
      # LCD sat on "Connecting…" — with every workflow green. Green CI has
      # never been a fleet claim, and this step is what stops it being
      # restated as one.
      #
      # The gate reads apps/player/HARDWARE-QUALIFICATION.md and fails
      # unless every REQUIRED hardware class has PASS (with a date and
      # initials), a justified NA, or a logged OVERRIDE for every check.
      # Dependency-free plain Node — the setup-node step above is all it
      # needs.
      #
      # There is NO escape hatch in CI. A genuine hotfix records the
      # override at tag time via
      # `scripts/release-apk.sh <app> <x.y.z> --unqualified-override`,
      # which writes an OVERRIDE row into the matrix that this step then
      # reads. That keeps every wave-through visible in git history
      # instead of hidden in a workflow input.
      - name: Hardware qualification gate (release tags only)
        if: startsWith(github.ref, 'refs/tags/player-v') || startsWith(github.ref, 'refs/tags/manager-v')
        run: |
          node scripts/check-hardware-qual.cjs --tag "${GITHUB_REF_NAME}" || {
            {
              echo "### Hardware qualification FAILED — no APK was built"
              echo ""
              echo "\`${GITHUB_REF_NAME}\` has not been qualified on the required hardware classes."
              echo "Run \`docs/player/HARDWARE-QUAL-CHECKLIST.md\` on the physical units and record"
              echo "the results in \`apps/player/HARDWARE-QUALIFICATION.md\`."
              echo ""
              echo '```'
              node scripts/check-hardware-qual.cjs --tag "${GITHUB_REF_NAME}" 2>&1 || true
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      # ─── CORRECTNESS GATE (2026-08-30, W2-5) ──────────────────────────
      # Runs BEFORE the assemble below, in the SAME job, so a red unit test
      # or a new lint error means NO artifact is produced or attached to a
      # release. That ordering is the whole point: this workflow is how an
      # APK reaches a fleet of school displays, and until now nothing on
      # that path executed a single Kotlin test.
      #
      # `lintDebug` is blocking. The pre-existing findings that predate this
      # gate are recorded in app/lint-baseline.xml + manager/lint-baseline.xml
      # (see the `lint {}` block in each module's build.gradle.kts for why
      # the one pre-existing ERROR — Api34UpdateOwnership's
      # ENFORCE_UPDATE_OWNERSHIP, a permission a non-privileged app cannot
      # hold — is baselined rather than "fixed"). Anything NEW fails here.
      #
      # No new caching needed: the "Cache Gradle" step above already covers
      # this, and running before the assemble warms it for that step too.
      - name: Unit tests + lint (gates the APK)
        id: check
        run: |
          cd apps/player
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug 2>&1 | tee gradle-check.log
          status=${PIPESTATUS[0]}
          exit $status

      # ─── PROOF THE TESTS RAN (SEC-002 re-audit, 2026-09-04) ───────────
      # `testDebugUnitTest` exits 0 when it runs a thousand tests AND when it
      # runs none. A filter that matches nothing, a module dropped from
      # settings.gradle.kts, or a JUnit `Assume` skipping a whole source-guard
      # class because it cannot find the files it reads — all green, all
      # silent. Two of the SEC-002 classes are exactly that Assume shape, and
      # they are the only automated evidence that the legacy every-frame
      # bridge is default-deny.
      #
      # So the step above proves the tests PASSED, and this one proves they
      # EXECUTED. It reads the JUnit XML Gradle actually wrote. Blocking, and
      # before the assemble, for the same reason the check itself is.
      #
      # ⚠️ Still only a unit-test claim. It says nothing about OEM WebViews or
      # any physical display — that is the hardware-qualification gate above,
      # and the two must never be read as the same evidence.
      - name: Prove the gating tests actually executed
        id: testproof
        run: node scripts/check-player-test-execution.cjs

      # Scoped to THIS step's failure so it doesn't also fire (with a stale
      # log) when the assemble below is what broke — that has its own dump.
      - name: Dump test/lint failures
        if: failure() && (steps.check.outcome == 'failure' || steps.testproof.outcome == 'failure')
        run: |
          echo "### Player unit tests / lint FAILED — no APK was built" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 apps/player/gradle-check.log >> $GITHUB_STEP_SUMMARY || echo "(no gradle-check.log produced)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test + lint reports on failure
        if: failure() && (steps.check.outcome == 'failure' || steps.testproof.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-check-reports
          path: |
            apps/player/gradle-check.log
            apps/player/*/build/reports/tests/testDebugUnitTest/**
            apps/player/*/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Build APK
        env:
          PLAYER_BASE_URL: ${{ github.event.inputs.playerBaseUrl != '' && github.event.inputs.playerBaseUrl || 'https://venue-os.app/player' }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/venueos-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HAVE_KEYSTORE: ${{ steps.keystore.outputs.available }}
        run: |
          cd apps/player
          # Tee full build output so failures leave a readable artifact for
          # debugging without needing `gh auth` just to read CI logs.
          set -o pipefail
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          echo "Gradle task: $TASK"
          echo "task=$TASK" >> $GITHUB_ENV
          # The locate/rename/guard steps below read this to pick the output dir.
          if [ "$TASK" = "assembleRelease" ]; then
            echo "VARIANT=release" >> $GITHUB_ENV
          else
            echo "VARIANT=debug" >> $GITHUB_ENV
          fi
          ./gradlew --no-daemon --stacktrace "$TASK" -PplayerBaseUrl="$PLAYER_BASE_URL" 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Dump gradle log tail on failure
        if: failure()
        run: |
          echo "### Gradle build failed — last 200 lines of output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 apps/player/gradle-build.log >> $GITHUB_STEP_SUMMARY || echo "(no gradle-build.log produced)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # ALSO push errors as workflow-command annotations so the
          # public check-runs API surfaces them — that way `curl` can
          # read the Kotlin compile error without a GitHub token.
          # GitHub caps annotations at 10 per step, so we must be
          # surgical: pick the MOST useful Kotlin/Gradle error lines
          # with grep, not a dumb tail slice.
          if [ -f apps/player/gradle-build.log ]; then
            # Strip ANSI escapes before grepping.
            sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' apps/player/gradle-build.log \
              > /tmp/gradle-build.clean.log
            # 1. Kotlin compile errors:   "e: file:///... .kt:LINE:COL <msg>"
            # 2. Plain "error:" prefixed lines (AGP, lint)
            # 3. Gradle FAILURE block lines
            # 4. "What went wrong" + following Compilation error
            # 5. Task :...FAILED (the one that failed)
            {
              grep -E '^e: ' /tmp/gradle-build.clean.log | head -n 5
              grep -E '^error: ' /tmp/gradle-build.clean.log | head -n 2
              grep -E '^FAILURE:' /tmp/gradle-build.clean.log | head -n 1
              grep -E '^\* What went wrong:' /tmp/gradle-build.clean.log | head -n 1
              grep -E 'Task .+ FAILED$' /tmp/gradle-build.clean.log | head -n 1
              # Line after "What went wrong:" is the actual failure reason
              grep -A 1 -E '^\* What went wrong:' /tmp/gradle-build.clean.log | tail -n 1 | head -n 1
            } | awk '!seen[$0]++' | head -n 10 | while IFS= read -r L; do
              [ -z "$L" ] && continue
              clean=$(printf '%s' "$L" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::APK: $clean"
            done
          fi

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-build-log
          path: apps/player/gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Locate + version-rename APK
        id: locate
        run: |
          # PREFER the universal APK (all ABIs in one — installs on
          # arm64-v8a, armeabi-v7a, x86_64). Without this, alphabetical
          # `head -1` picks app-arm64-v8a-debug.apk, which fails to
          # install on older armeabi-v7a hardware (Rockchip RK3288 etc.)
          # with INSTALL_FAILED_NO_MATCHING_ABIS. Operator (2026-04-29):
          # "having issues installing our apk on other screens".
          # `! -name '*unsigned*'`: an -unsigned release output means the
          # signing config did not engage — treat it as "no APK" so the
          # hard failure below fires instead of publishing an
          # uninstallable artifact (RELEASE_SIGNING.md step 4c).
          APK=$(find apps/player/app/build/outputs/apk/${VARIANT} -name '*universal*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            # Fallback to arm64 only if universal wasn't produced (would
            # be a build config regression — `isUniversalApk = true` in
            # app/build.gradle.kts should always produce the universal
            # variant).
            APK=$(find apps/player/app/build/outputs/apk/${VARIANT} -name '*arm64*.apk' ! -name '*unsigned*' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No signed APK was produced (universal/arm64 missing, or only an -unsigned artifact exists — check the RELEASE_* secrets)"
            exit 1
          fi
          # Extract versionName from build.gradle.kts so operators can
          # tell at a glance which build they downloaded — bare
          # "app-debug.apk" told them nothing. If a tag triggered this
          # run, use the tag instead so the filename matches the
          # GitHub Release tag.
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' apps/player/app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == player-v* ]]; then
            VERSION="${TAG#player-v}"
          elif [ -n "$VN" ]; then
            VERSION="$VN-${GITHUB_SHA:0:7}"
          else
            VERSION="${GITHUB_SHA:0:7}"
          fi
          NEW_NAME="edu-cms-player-v${VERSION}.apk"
          NEW_PATH="apps/player/app/build/outputs/apk/${VARIANT}/${NEW_NAME}"
          mv "$APK" "$NEW_PATH"
          echo "apk=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          ls -la "$NEW_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edu-cms-player-apk
          path: ${{ steps.locate.outputs.apk }}
          retention-days: 30
          if-no-files-found: error

      # ─── Manager APK (Phase 1 of multi-APK architecture) ───
      # Built by the same `assembleDebug` Gradle invocation above
      # (settings.gradle.kts has `include(":manager")`). Locate, rename
      # for clarity, upload as a separate artifact. See
      # docs/MANAGER_ARCHITECTURE.md + docs/MANAGER_PROVISIONING.md.
      - name: Locate + version-rename Manager APK
        id: locate-manager
        # Manager is the OTA backbone; missing output is a hard failure.
        # Player-only artifacts are not acceptable for OTA validation.
        run: |
          # Prefer universal Manager APK — same ABI-coverage rationale
          # as Player's locate step above. Manager's self-update path
          # downloads this APK; armeabi-v7a screens need the universal
          # variant or self-update fails on them too.
          MGR_APK=$(find apps/player/manager/build/outputs/apk/${VARIANT} -name '*universal*.apk' ! -name '*unsigned*' 2>/dev/null | head -1 || true)
          if [ -z "$MGR_APK" ]; then
            MGR_APK=$(find apps/player/manager/build/outputs/apk/${VARIANT} -name '*arm64*.apk' ! -name '*unsigned*' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$MGR_APK" ]; then
            echo "::error::Signed Manager APK not found (missing, or only an -unsigned artifact — check the RELEASE_* secrets). Manager is required for OTA validation."
            exit 1
          fi
          MVN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' apps/player/manager/build.gradle.kts | head -1)
          MTAG="${GITHUB_REF_NAME}"
          if [[ "$MTAG" == manager-v* ]]; then
            MVERSION="${MTAG#manager-v}"
          elif [ -n "$MVN" ]; then
            MVERSION="$MVN-${GITHUB_SHA:0:7}"
          else
            MVERSION="${GITHUB_SHA:0:7}"
          fi
          MGR_NEW="edu-cms-manager-v${MVERSION}.apk"
          MGR_NEW_PATH="apps/player/manager/build/outputs/apk/${VARIANT}/${MGR_NEW}"
          mv "$MGR_APK" "$MGR_NEW_PATH"
          echo "apk=$MGR_NEW_PATH" >> $GITHUB_OUTPUT
          echo "version=$MVERSION" >> $GITHUB_OUTPUT
          ls -la "$MGR_NEW_PATH"

      - name: Upload Manager APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edu-cms-manager-apk
          path: ${{ steps.locate-manager.outputs.apk }}
          retention-days: 30
          if-no-files-found: error

      # ─── RELEASE GUARD ────────────────────────────────────────────
      # Inspects the APKs we are ACTUALLY about to publish (reads the
      # binary AndroidManifest.xml straight out of the zip) and fails if
      # `android:debuggable="true"`. Must run BEFORE the two "Attach …
      # to GitHub Release" steps below — that is the publish boundary.
      #
      # Report-only on ordinary pushes: every build prints the debuggable
      # status of its artifacts, so the state is never a surprise.
      - name: Report — is the built APK debuggable? (non-blocking)
        run: |
          node scripts/check-apk-debuggable.cjs --warn-only \
            "${{ steps.locate.outputs.apk }}" \
            "${{ steps.locate-manager.outputs.apk }}"

      # Blocking on the PUBLISH path only (a release tag).
      #
      # CUTOVER COMPLETE (2026-08-03): the release keystore now exists as repo
      # secrets, the build above runs `assembleRelease` whenever they are
      # present, and the `ALLOW_DEBUGGABLE_RELEASE` escape has been DELETED.
      # A debuggable published artifact is now a hard failure, which is the
      # whole point — `android:debuggable="true"` on a shipped kiosk APK let
      # anyone with ADB read the device token out of app-private storage
      # (finding PLAYER-SIGN-02).
      #
      # Do NOT re-add an escape hatch here. If this step fails, the correct
      # response is to fix the build, never to wave the artifact through.
      - name: Guard — published APK must not be debuggable
        if: startsWith(github.ref, 'refs/tags/player-v') || startsWith(github.ref, 'refs/tags/manager-v')
        run: |
          node scripts/check-apk-debuggable.cjs \
            "${{ steps.locate.outputs.apk }}" \
            "${{ steps.locate-manager.outputs.apk }}"

      # On tag push (player-v*) attach the APK to a GitHub Release so
      # /api/v1/player/apk/latest can resolve it without any Railway env
      # config. The controller auto-picks arm64-v8a first, falls back to
      # universal, then armeabi-v7a — so naming here just needs to match.
      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/player-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.locate.outputs.apk }}
          tag_name: ${{ github.ref_name }}
          name: Player ${{ github.ref_name }}
          body: |
            EduCMS Player kiosk APK.

            Sideload onto any Android 7+ device or Nova Taurus controller.
            See `docs/PLAYER_APK_NOVA_TAURUS.md` for the ViPlex Express
            walkthrough.

            Dashboard hotlink: `/api/v1/player/apk/latest` resolves to
            this asset automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On Manager tag push (manager-v*) attach the Manager APK to a
      # GitHub Release. Separate tag namespace from Player so the two
      # APKs version independently.
      - name: Attach Manager APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/manager-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.locate-manager.outputs.apk }}
          tag_name: ${{ github.ref_name }}
          name: Manager ${{ github.ref_name }}
          body: |
            EduCMS Manager APK — companion to Player.

            ADB-provision on a freshly-reset kiosk:
              adb shell dpm set-device-owner com.educms.manager/.AdminReceiver

            Once provisioned, OTA installs of the Player APK land
            silently (no system "Install" prompt). See
            `docs/MANAGER_PROVISIONING.md` for the full runbook.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── PUBLISH TO OBJECT STORAGE (efficiency audit P0-5, 2026-09-02) ───
      #
      # The GitHub Release above stays the SOURCE OF TRUTH for the version
      # catalogue — the API still discovers "what is the latest player-v*"
      # from it, still hashes the authenticated release asset, and still
      # applies every rollout gate to it. This step only puts a DELIVERY COPY
      # of the same bytes where Railway does not have to pay to serve them:
      # until now every kiosk's ~2 MB download was piped through the API
      # container that also owns emergency delivery.
      #
      # Runs AFTER the release attach so the two can never disagree about
      # which artifact a version is, and after both publish guards
      # (debuggable + unsigned) so an artifact we refused to release is never
      # mirrored either.
      #
      # Immutable + private: the script never overwrites an existing version
      # (a rebuild of a published version is a hard failure, not a silent
      # replacement) and refuses to write to a public bucket. The API mints
      # short-lived signed URLs — apps/api/src/player-ota/apk-storage.ts.
      #
      # NON-BLOCKING BY DESIGN. A storage outage or an unset secret must not
      # fail a release: the API's fallback for "no object" is the byte proxy
      # that has always served the fleet, so the worst case is the release
      # ships and keeps costing Railway egress until someone re-runs
      # `node scripts/upload-apks-to-storage.mjs --from-releases`. Failing
      # the job here would instead leave a TAGGED release with no APK
      # anywhere, which is strictly worse.
      - name: Publish APK to object storage (immutable, private bucket)
        if: startsWith(github.ref, 'refs/tags/player-v') || startsWith(github.ref, 'refs/tags/manager-v')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets are not set — skipping the storage publish. The release still ships; the fleet downloads it through the API byte proxy (Railway pays the egress). Set both secrets, then backfill with: node scripts/upload-apks-to-storage.mjs --from-releases"
            exit 0
          fi
          # Publish whichever APK this tag released. Both are built every run,
          # but only the tagged one was attached to a Release — mirroring the
          # other would put an artifact in the bucket that no Release
          # references, and the API resolves objects by released versionCode.
          if [[ "${GITHUB_REF_NAME}" == player-v* ]]; then
            node scripts/upload-apks-to-storage.mjs --file "${{ steps.locate.outputs.apk }}" --kind player
          else
            node scripts/upload-apks-to-storage.mjs --file "${{ steps.locate-manager.outputs.apk }}" --kind manager
          fi

      - name: Note the storage publish in the summary
        if: startsWith(github.ref, 'refs/tags/player-v') || startsWith(github.ref, 'refs/tags/manager-v')
        run: |
          echo "### APK delivery" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The GitHub Release above is the version catalogue. A delivery copy is published to the private \`apks\` storage bucket, and \`/api/v1/player/apk/v/<versionCode>\` 302s to a signed URL for it once the digest matches — watch the flip with \`grep 'apk-delivery' \` in the Railway logs (\`served=redirect\` vs \`served=proxy\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If the publish step warned or failed, the fleet is unaffected (it falls back to the API byte proxy). Re-run it with \`node scripts/upload-apks-to-storage.mjs --from-releases\`." >> $GITHUB_STEP_SUMMARY

      - name: Build summary
        run: |
          echo "### EduCMS Player APK built ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section above (\`edu-cms-player-apk\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Player base URL:** \`${PLAYER_BASE_URL:-https://venue-os.app/player}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Side-load on Android: Settings → Apps → Special access → Install unknown apps → enable for your file manager → tap the .apk." >> $GITHUB_STEP_SUMMARY
        env:
          PLAYER_BASE_URL: ${{ github.event.inputs.playerBaseUrl != '' && github.event.inputs.playerBaseUrl || 'https://venue-os.app/player' }}
