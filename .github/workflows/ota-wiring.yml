# OTA wiring integrity gate.
#
# Catches every regression class that's repeatedly broken silent OTA on
# operator kiosks — without an emulator, without an APK build, without
# requiring the operator to sideload anything to verify. Runs in <5
# seconds on every push + PR. Red CI = OTA is BROKEN.
#
# What this gate catches (see scripts/ota-wiring-check.sh for the
# full list):
#   - UPDATE_PACKAGES_WITHOUT_USER_ACTION stripped from a manifest
#   - setRequireUserAction(USER_ACTION_NOT_REQUIRED) not called
#   - Api31SilentInstall / Api34UpdateOwnership missing or not
#     @RequiresApi-isolated (Android 11 VerifyError trap)
#   - setAppPackageName not pinned to our own package
#   - Web player OTA-banner dedup not persisting to localStorage
#   - Player's OTA worker bailing out when Manager is installed
#
# When this gate fails: read the failure line, find the matching bug
# class number in scripts/ota-wiring-check.sh, fix it, push again.

name: OTA Wiring Integrity

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: OTA wiring check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run OTA wiring integrity script
        run: bash scripts/ota-wiring-check.sh
