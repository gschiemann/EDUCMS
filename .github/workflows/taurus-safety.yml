# Taurus-safety regression guard.
#
# NovaStar Taurus LED controllers run Chromium 83. Modern flex `gap` and
# CSS container queries (cqh/cqw/cqi/cqmin/cqb) are silently broken there
# and have repeatedly slipped into player-shipped widgets (see CLAUDE.md
# rule #10 + the 2026-05-23 Lane-5 audit). This workflow fails on any NEW
# instance in player/widget paths — existing instances are tracked in
# `apps/web/tools/taurus-safety-baseline.json` and the baseline only
# ratchets DOWN.
name: Taurus Safety
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  taurus-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      # The regex scanner (check-taurus-safety.cjs) is dependency-free, but the
      # inset-serialization AST guard below uses the TypeScript compiler API
      # (a repo devDependency). Install it — `--ignore-scripts` skips native
      # builds we don't need (typescript is pure JS), keeping this fast.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Chromium-83 forbidden patterns (flex gap, container queries)
        run: node apps/web/tools/check-taurus-safety.cjs

      # Launch-readiness S20: the inset-serialization AST guard detects the
      # grep-INVISIBLE Taurus landmine (a React style object with all four
      # physical sides that the browser CSSOM re-serializes to the `inset`
      # shorthand, which Chromium-83 drops → widget renders 0x0). It existed
      # (apps/web/tools/check-inset-serialization.cjs, CLAUDE.md rule #10,
      # 2026-07-03) but ran in NO workflow — so the only detector for that
      # landmine class was manual-run-only. Wire it in as a hard gate.
      - name: Check inset-shorthand CSSOM-serialization landmine (player/widget styles)
        run: node apps/web/tools/check-inset-serialization.cjs

      # 2026-08-09: the cascade-layers flattener (our Chromium-95 hotfix) boosts
      # Tailwind preflight to `:not(#\#):not(#\#){padding:0;margin:0}` = (2,0,0),
      # which outranks the UNLAYERED CSS every scene widget injects in its own
      # <style> tag — zeroing every padding/margin and resetting heading sizes
      # across the board. That is how the flagship Animated Rainbow rendered its
      # 110px title at 16px with the teacher photo box collapsed to 2px.
      # `sceneCss()` fixes it, but only for widgets that actually call it, and a
      # widget that injects raw CSS still type-checks, still renders, and only
      # looks subtly wrong on a screen in a school. Hard-gate it.
      - name: Check every widget <style> routes through sceneCss()
        run: node apps/web/tools/check-scene-css.cjs
