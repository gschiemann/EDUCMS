# Taurus-safety regression guard.
#
# NovaStar Taurus LED controllers run Chromium 83. Modern flex `gap` and
# CSS container queries (cqh/cqw/cqi/cqmin/cqb) are silently broken there
# and have repeatedly slipped into player-shipped widgets (see CLAUDE.md
# rule #10 + the 2026-05-23 Lane-5 audit). This workflow fails on any NEW
# instance in player/widget paths — existing instances are tracked in
# `apps/web/tools/taurus-safety-baseline.json` and the baseline only
# ratchets DOWN.
name: Taurus Safety
on:
  push:
    branches: [master]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    # Skip ONLY when a push touches nothing but non-shipping docs (added
    # 2026-09-08, after GitHub Actions hit the Free-plan minute cap and every
    # workflow began failing with "the job was not started because ... spending
    # limit"). Measured that day: ~45-50 BILLED job-minutes per push against a
    # 2,000/month budget — about 40 pushes a month — while much of the churn
    # was documentation.
    #
    # paths-ignore is the SAFE shape: a run is skipped only if EVERY changed
    # file matches. Touch one line of code and the full suite runs exactly as
    # before, so this removes waste, never coverage.
    #
    # Deliberately NOT ignored: apps/web/src/content/help/**.md — that markdown
    # SHIPS in the Next build, so changing it changes the product. '*.md' below
    # matches root-level files only (GitHub globs do not cross '/').
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - 'scratch/**'
      - 'LICENSE'

concurrency:
  # 2026-08-04 — every workflow now declares one. Without it, pushing three
  # commits in a minute leaves three full runs racing on the same ref.
  # cancel-in-progress is deliberately PULL-REQUEST ONLY: a superseded PR run
  # is noise, but every commit that lands on master must keep its own verdict
  # (a cancelled master run reads as "never checked" in the history).
  # Keyed on the REF for pull_request (so a superseded PR run is cancelled) and
  # on the individual SHA for push (so every commit that lands on master keeps
  # its own run to completion). 2026-08-04: the first attempt expressed this as
  # `cancel-in-progress: ${{ github.event_name == 'pull_request' }}`, and master
  # runs were still being cancelled — a cancelled run reads as "never checked"
  # in the history, which is the opposite of the intent. Making the GROUP unique
  # per push cannot be got wrong: two master commits are never in the same group,
  # so there is nothing to cancel.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  taurus-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # The regex scanner (check-taurus-safety.cjs) is dependency-free, but the
      # inset-serialization AST guard below uses the TypeScript compiler API
      # (a repo devDependency). Install it — `--ignore-scripts` skips native
      # builds we don't need (typescript is pure JS), keeping this fast.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Chromium-83 forbidden patterns (flex gap, container queries)
        run: node apps/web/tools/check-taurus-safety.cjs

      # Launch-readiness S20: the inset-serialization AST guard detects the
      # grep-INVISIBLE Taurus landmine (a React style object with all four
      # physical sides that the browser CSSOM re-serializes to the `inset`
      # shorthand, which Chromium-83 drops → widget renders 0x0). It existed
      # (apps/web/tools/check-inset-serialization.cjs, CLAUDE.md rule #10,
      # 2026-07-03) but ran in NO workflow — so the only detector for that
      # landmine class was manual-run-only. Wire it in as a hard gate.
      - name: Check inset-shorthand CSSOM-serialization landmine (player/widget styles)
        run: node apps/web/tools/check-inset-serialization.cjs

      # 2026-08-09: the cascade-layers flattener (our Chromium-95 hotfix) boosts
      # Tailwind preflight to `:not(#\#):not(#\#){padding:0;margin:0}` = (2,0,0),
      # which outranks the UNLAYERED CSS every scene widget injects in its own
      # <style> tag — zeroing every padding/margin and resetting heading sizes
      # across the board. That is how the flagship Animated Rainbow rendered its
      # 110px title at 16px with the teacher photo box collapsed to 2px.
      # `sceneCss()` fixes it, but only for widgets that actually call it, and a
      # widget that injects raw CSS still type-checks, still renders, and only
      # looks subtly wrong on a screen in a school. Hard-gate it.
      - name: Check every widget <style> routes through sceneCss()
        run: node apps/web/tools/check-scene-css.cjs

      # 2026-09-11 — TWO GATES THAT GUARD WHAT IS ON GLASS, added after an audit
      # wave found both failure modes live and unguarded.
      #
      # 1. A lost or renamed variant id used to render a DIFFERENT widget with no
      #    signal at all — an operator picks A, a school sees B. There was no
      #    guard whatsoever against duplicate variant ids either, and one real
      #    collision exists today (`retail-loyalty-qr`), baselined rather than
      #    silently renamed because which registration wins decides what is on a
      #    live screen. The check EXECUTES the registry rather than grepping it,
      #    because most ids are computed, not literals.
      - name: Check variant registry (duplicate ids, missing renderers)
        run: node apps/web/tools/check-variant-registry.cjs

      # 2. "None of the templates are even editable" was this product's loudest
      #    complaint ever, and the sweep documented to prevent it covered 191 of
      #    250 boards and ran in NO CI. Worse, it only greps for a `src` string:
      #    with kiosk/_edit-shim.js DELETED the old sweep still reported all 19
      #    kiosk boards healthy while every one of them was dead. This resolves
      #    the reference on disk and discovers directories instead of naming
      #    them. All 250 pass today, so the baseline is empty — a floor, not a
      #    list of debt.
      - name: Check every signage board is click-editable
        run: node apps/web/tools/check-board-editability.cjs

      # 3. §19 WIDGET TRUTH (2026-09-11). The operator added his first widget —
      #    FITNESS_AD_BANNER on a gym tenant — and the canvas showed a finished
      #    ad ("YOUR GYM · New Member Special · 50% off first month") that he
      #    could not edit a word of, because none of it was his: it was
      #    DEMO_CREATIVES, rendered precisely BECAUSE he had no creatives. The
      #    widget lied about its own state. §19 has been a written standard
      #    since 2026-05-26 with no gate; check-board-editability.cjs guards the
      #    HTML boards and says in its own header that per-widget field coverage
      #    is not its job. This is that job, for the React widget pack: it fails
      #    on a NEW fabricated fallback, and on a config key a widget renders
      #    that PropertiesPanel exposes no editor for. Ratcheted — the baseline
      #    is deliberately non-empty and every entry carries a dated reason.
      - name: Check widgets never fabricate content they do not have (§19)
        run: node apps/web/tools/check-widget-truth.cjs
