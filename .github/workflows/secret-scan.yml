name: Secret Scan

# The gitleaks job, moved out of ci.yml on 2026-11-16 so it has no path filter.
# ci.yml skips docs-only pushes to master at the trigger (paths-ignore) and its
# jobs skip docs-only pull requests; both are right for builds and tests, but a
# credential pasted into a markdown file is exactly what this scan exists to
# catch. This workflow therefore runs on EVERY pull request to master and EVERY
# push to master, whatever files changed. The job name is unchanged.
#
# Operational gap O2 (2026-05-25): no automated secret-leak gate — a future
# agent commit could leak a token (Stripe, Supabase service-role, Anthropic API
# key, Twilio, etc.) and we'd find out from a billing alert hours/days later.
# gitleaks scans the PR's commits on a pull request and the pushed commits on a
# master push. Sub-30s runtime against this repo size; fails the job on any
# finding so a tagged secret can't merge without an explicit, fingerprinted
# entry in .gitleaksignore. Rules: .gitleaks.toml (defaults + repo rules).
#
# Never on a merge group: the pinned gitleaks-action (v2, ff98106e…) supports
# only push / pull_request / workflow_dispatch / schedule and exits 1 on any
# other event ("ERROR: The [merge_group] event is not yet supported" — its
# dist/index.js at that commit). Nothing is lost: the queued commits are the
# PR's own, already scanned when the pull_request run diffed them.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Leak Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans commit ranges, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action looks for GITHUB_TOKEN by default; we pass the
          # workflow's auto-issued token (read-only above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT defaults to true; that's fine —
          # failures upload a SARIF artifact for triage.
